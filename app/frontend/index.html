<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Librarian — Wiki Graph</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { width: 100%; height: 100%; background: var(--bg, #0f0f0f); color: var(--text, #e0e0e0); font-family: system-ui, sans-serif; }
      html[data-theme="light"], html[data-theme="light"] body, html[data-theme="light"] #root { background: var(--bg, #f7f6f2); color: var(--text, #1f1f1f); }
    </style>
    <script>
      // Before first paint, so a light page never flashes dark. utils/theme.ts takes over from here.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("librarian.theme"); } catch (e) {}
        var light = saved ? saved === "light" : !!window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
