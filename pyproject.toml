[project]
name = "librarian"
version = "0.1.0"
description = "Personal agent design reference — compiled wiki, MCP server, Claude Code skills"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "fastmcp>=4.1.7",
    "duckdb>=2.0.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "httpx>=0.27.0",
    "structlog>=26.1.0",
    "python-dotenv>=1.2.4",
    "rich>=13.0.0",
    "beautifulsoup4>=4.15.0",
    "python-frontmatter>=1.3.0",
    "sqlalchemy>=2",
    "alembic>=1.20.1",
    "psycopg[binary]>=3",
    # Login: the OAuth code flow with Google and GitHub (librarian.accounts.oauth).
    "authlib>=1.3",
    "zstandard>=0.23",
]

[project.scripts]
librarian = "librarian.cli:main"
codemap = "librarian.tools.codemap.__main__:main"
presenter = "librarian.tools.presenter.__main__:main"
cartographer = "librarian.tools.cartographer.__main__:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.162.4",
    "uvicorn[standard]>=0.54.0",
    "sentence-transformers>=6.2.0",
    "watchfiles>=1.3.0",
    "websockets>=17.4",
    # GET /metrics (src/librarian/api/prom.py); multiprocess mode with --workers N.
    "prometheus-client>=0.23.1",
    # Ceiling, not a preference: umap-learn -> numba caps at numpy<2.5 (numba 0.66.0,
    # the latest, still does). Nothing here needs 2.5 — scikit-learn asks >=1.24.1 and
    # sentence-transformers >=1.20 — so the >=2.5.1 that arrived via a Dependabot group
    # bump only bought an import error on /api/layout/umap. Raise this when numba ships
    # numpy 2.5 support; Dependabot must not lift it unilaterally.
    "numpy>=2.4,<2.5",
    "scikit-learn>=1.9.1",
    # librarian/wiki/graph.py (librarian wiki graph): Louvain clusters. Was only in `viz`.
    "networkx>=3.7",
    "ollama>=0.6.3",
    # /api/layout/umap (src/librarian/api/umap_layout.py). Was only in `viz`, so an
    # `--extra api` install served 503 and the graph fell back to the dagre layout.
    "umap-learn>=0.6.0",
    "numba>=0.68.1",
    "llvmlite>=0.50.0",
]
# Unattended jobs: `librarian jobs run <name>` drives the skills through the Agent SDK.
jobs = [
    "claude-agent-sdk>=0.2.180",
]
codemap = [
    "tree-sitter>=0.26.1",
    "tree-sitter-python>=0.23.0",
    "fastapi>=0.162.4",
    "uvicorn[standard]>=0.54.0",
]
presenter = [
    # renderer.py imports both directly; lxml is python-pptx's own dependency but
    # is named here because the import is first-party, not incidental.
    "python-pptx>=1.0.2",
    "lxml>=6.1.3",
    # providers.py, only on the image_provider="replicate" path.
    "replicate>=1.0.0",
    # viz_classifier.py reads viz_prompt_library.yaml. Was importable only by
    # accident, via a transitive PyYAML — nothing here had declared it.
    "pyyaml>=6.0.2",
]
# Traces (OTLP, e.g. Langfuse Cloud) and Sentry; both inert until their env vars are set
# (src/librarian/observability.py).
observability = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "sentry-sdk[fastapi]>=2.74.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The React app (app/) is built by Vite inside the Dockerfile, not shipped in the wheel.
packages = ["src/librarian"]

[tool.uv]
package = true

# Was [tool.uv] dev-dependencies, deprecated by uv and warned on every invocation.
# Installed by default by bare `uv run`. This is the ONLY dev definition — the old
# [project.optional-dependencies] dev extra was removed 2026-07-31; nothing referenced it.
# CI does pass --group: the shared workflow (ai-project-template's python-ci.yml) runs
# `uv sync --group dev`, which installs this group and NO extras. Anything tests/ imports
# must therefore be listed here, not only under [project.optional-dependencies].
[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-watch>=4.2.0",
    "httpx>=0.27.0",
    "playwright>=1.65.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter>=0.26.1",
    # tests/api import fastapi.testclient. Also in the
    # `api` extra, but extras are not installed by `uv sync --group dev`.
    "fastapi>=0.162.4",
    # tests/api/test_metrics_endpoint.py; also in the `api` extra (CI installs no extras).
    "prometheus-client>=0.23.1",
    # librarian/wiki/graph.py (tests/core/test_wiki_graph.py, and /wiki-graph via bare `uv run`).
    # Also in the `api` extra; same reason as fastapi above.
    "networkx>=3.7",
    "scikit-learn>=1.9.1",
    "import-linter>=2.0",
    "pyright>=1.1.380",
    # tests/api/test_observability.py; also in the `observability` extra (CI installs no extras).
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "sentry-sdk[fastapi]>=2.74.0",
]

[tool.ruff]
src = ["src", "."]
line-length = 100
target-version = "py312"
# Course labs are learner material, kept as their authors wrote them; library lint rules don't apply.
extend-exclude = ["data/courses"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ANN", "B", "C4", "SIM", "RUF"]
# E501: ruff-format owns line length; RUF001-003: typographic unicode in prose;
# N803/N806: ML naming conventions (X, y, X_train)
ignore = ["E501", "RUF001", "RUF002", "RUF003", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before app modules import (they read env at import time)
"src/librarian/api/main.py" = ["E402"]
# Ported whole from the course repo's deck builder; annotating it adds nothing yet.
"src/librarian/tools/slides/*" = ["ANN"]
"tests/slides/*" = ["ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `evals/` is a top-level package; it was importable only because the editable install of the old
# top-level `tools` package put the repo root on sys.path.
pythonpath = ["."]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__"]
# Diagnostics suppressed (file still analysed for others' imports): python-pptx's stubs type
# placeholders and fills as base classes with no `text`/`text_frame`/`_solidFill`, and lxml
# ships no `etree` stub, so renderer.py's 11 errors are all stub gaps, not logic. Remove this
# when the renderer moves to typed wrappers.
ignore = ["src/librarian/tools/presenter/renderer.py"]

[tool.importlinter]
root_packages = ["librarian"]
include_external_packages = false

# The core (courses, retrieval, wiki, ingest) sits below every entry point and tool (librarian.tools).
[[tool.importlinter.contracts]]
name = "The core does not import its callers"
type = "forbidden"
source_modules = [
    "librarian.courses",
    "librarian.retrieval",
    "librarian.wiki",
    "librarian.ingest",
    "librarian.accounts",
    "librarian.feedback",
    "librarian.ops",
    "librarian.db",
]
forbidden_modules = [
    "librarian.api",
    "librarian.mcp",
    "librarian.tools",
    "librarian.release",
]

[[tool.importlinter.contracts]]
name = "librarian.api and librarian.mcp are independent"
type = "independence"
modules = ["librarian.api", "librarian.mcp"]

# Dependencies run downwards: entry points (api, mcp; independent of each other, see above) ->
# agent (tool registry and chat loop, imported only by api and mcp) -> tools (librarian.tools: slides, presenter, codemap, cartographer) -> courses -> retrieval -> wiki -> ingest -> ops -> feedback (reader feedback rows) -> accounts (users and API keys) -> db (user-state tables; imports none of them). retrieval (the
# index, ranking and the public search API) reads wiki pages through librarian.wiki.common, so it
# sits above wiki. Two known upward edges are recorded here instead of hidden: wiki.gaps'
# course-gap report imports courses.catalog/curriculum inside a function (the gap list needs the
# catalog), and wiki.relinker uses retrieval.embeddings for its suggestions (embeddings is the
# shared model loader and cache, which imports none of the wiki). config/log_config are leaves any
# layer may use.
[[tool.importlinter.contracts]]
name = "librarian sub-packages are layered"
type = "layers"
layers = [
    "librarian.api | librarian.mcp",
    "librarian.agent",
    "librarian.tools",
    "librarian.release",
    "librarian.metrics",
    "librarian.courses",
    "librarian.retrieval",
    "librarian.wiki",
    "librarian.ingest",
    "librarian.ops",
    "librarian.feedback",
    "librarian.accounts",
    "librarian.db",
]
ignore_imports = [
    "librarian.wiki.gaps -> librarian.courses.catalog",
    "librarian.wiki.gaps -> librarian.courses.curriculum",
    "librarian.wiki.relinker -> librarian.retrieval.embeddings",
]
