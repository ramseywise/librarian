[project]
name = "librarian"
version = "0.1.0"
description = "Personal agent design reference — compiled wiki, MCP server, Claude Code skills"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.117.0",
    "google-genai>=2.12.1",
    "fastmcp>=3.4.4",
    "duckdb>=1.5.4",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "httpx>=0.27.0",
    "structlog>=26.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "beautifulsoup4>=4.15.0",
    "python-frontmatter>=1.3.0",
]

[project.scripts]
cartographer = "tools.cartographer.__main__:main"
codemap = "tools.codemap.__main__:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.15.22",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "playwright>=1.61.0",
]
viz = [
    "streamlit>=1.59.2",
    "st-cytoscape>=0.0.3",
    "networkx>=3.3",
    "python-frontmatter>=1.3.0",
]
api = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "sentence-transformers>=5.6.0",
    "umap-learn>=0.5.6",
    "watchfiles>=1.2.0",
    "websockets>=16.1",
    "numpy>=2.5.1",
    "scikit-learn>=1.9.0",
    "ollama>=0.6.2",
]
codemap = [
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.23.0",
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.uv]
package = true
dev-dependencies = [
    "ruff>=0.15.22",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-watch>=4.2.0",
    "httpx>=0.27.0",
    "playwright>=1.61.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ANN", "B", "C4", "SIM", "RUF"]
# E501: ruff-format owns line length; RUF001-003: typographic unicode in prose;
# N803/N806: ML naming conventions (X, y, X_train)
ignore = ["E501", "RUF001", "RUF002", "RUF003", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before app modules import (they read env at import time)
"app/backend/main.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
