# Caddy terminates TLS on 80/443 and proxies to the API; the API publishes no host port.
#   docker compose up -d --build     https://$LIBRARIAN_DOMAIN (default https://localhost)
# Single-user local flow, no TLS: `make app` adds docker-compose.local.yml (API on 127.0.0.1:8000).
#   make app-build    (the private mountpoints must exist first: mkdir -p data/wiki/private data/courses/private)
#
# LIBRARIAN_API_TOKEN is required: the container binds 0.0.0.0 and the API refuses to start
# without a token (add `--insecure` to the command to override). Set it, ANTHROPIC_API_KEY and
# POSTGRES_PASSWORD (URL-safe characters; the default is for a laptop) in .env. For UI development use `make ui` (Vite on :5173) against `make api`.
services:
  # One-shot: creates the two private mountpoints on the host. Docker cannot create a tmpfs
  # mountpoint inside the read-only ./data mount below, and a clean clone has neither directory.
  prepare:
    image: librarian:local
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    entrypoint: ["mkdir", "-p", "/app/data/wiki/private", "/app/data/courses/private", "/app/content/slides"]
    command: []
    volumes:
      - ./data:/app/data
      - ./content:/app/content
    restart: "no"

  # TLS and HSTS (docker/Caddyfile). LIBRARIAN_DOMAIN unset = localhost with Caddy's internal CA.
  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      librarian:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - LIBRARIAN_DOMAIN=${LIBRARIAN_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  librarian:
    image: librarian:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      prepare:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    env_file:
      - path: .env
        required: false
    environment:
      - SERVE_COURSE_SOURCES=false
      # Also taken from the shell, so `LIBRARIAN_API_TOKEN=... docker compose up` works without .env.
      - LIBRARIAN_API_TOKEN
      # Prebuilt decks shipped by `make deploy-content` (content/slides/); the API never builds them.
      - LIBRARIAN_CONTENT_DIR=/app/content
      # User state (attempts, chat spend). POSTGRES_PASSWORD comes from .env or the shell.
      - DATABASE_URL=postgresql://librarian:${POSTGRES_PASSWORD:-librarian-dev}@postgres:5432/librarian
    volumes:
      # Content, read-only.
      - ./data:/app/data:ro
      - ./content:/app/content:ro
      # Writable state: indexes, caches, logs, flashcard results.
      - librarian-var:/app/var
    tmpfs:
      # Private content stays on the host: these empty mounts hide it from the container.
      # Docker cannot create their mountpoints inside the read-only ./data mount, so both
      # directories must exist on the host first (make app does that).
      - /app/data/wiki/private
      - /app/data/courses/private
    restart: unless-stopped

  # User state. Not published on the host: only the librarian service reaches it.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: librarian
      POSTGRES_DB: librarian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-librarian-dev}
    volumes:
      - librarian-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librarian -d librarian"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  librarian-var:
  librarian-pgdata:
  caddy-data:
  caddy-config:
