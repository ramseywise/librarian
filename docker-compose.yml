# One service, one port: the API serves the built web UI too. http://localhost:8000
#
#   docker compose up --build
#
# Set LIBRARIAN_API_TOKEN (and ANTHROPIC_API_KEY) in .env before exposing the port beyond
# this machine. For UI development use `make ui` (Vite on :5173) against `make api`.
services:
  librarian:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${LIBRARIAN_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - SERVE_COURSE_SOURCES=false
    volumes:
      # Content, read-only.
      - ./data:/app/data:ro
      # Writable state: indexes, caches, logs, flashcard results.
      - librarian-var:/app/var
    tmpfs:
      # Private content stays on the host: these empty mounts hide it from the container.
      - /app/data/wiki/private
      - /app/data/courses/private
    restart: unless-stopped

volumes:
  librarian-var:
