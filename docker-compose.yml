# Caddy terminates TLS on 80/443 and proxies to the API; the API publishes no host port.
#   docker compose up -d --build     https://$LIBRARIAN_DOMAIN (default https://localhost)
# Single-user local flow, no TLS: `make app` adds docker-compose.local.yml (API on 127.0.0.1:8000).
#   make app-build    (the private mountpoints must exist first: mkdir -p data/wiki/private data/courses/private)
#
# Sign-in (LIBRARIAN_API_TOKEN or a login method: Google, GitHub or email, see .env.example) is
# required: the container binds 0.0.0.0 and the API refuses to start open (add `--insecure` to
# the command to override). Set it, LIBRARIAN_SESSION_SECRET for a login method, ANTHROPIC_API_KEY and
# POSTGRES_PASSWORD (URL-safe characters; the default is for a laptop) in .env. For UI development use `make ui` (Vite on :5173) against `make api`.
# Image: LIBRARIAN_IMAGE (default librarian:local, built here). A host sets a registry tag and runs
# `./librarian upgrade <tag>`, which pulls and never builds (`up --no-build`).
services:
  # One-shot: creates the two private mountpoints on the host. Docker cannot create a tmpfs
  # mountpoint inside the read-only ./data mount below, and a clean clone has neither directory.
  prepare:
    image: ${LIBRARIAN_IMAGE:-librarian:local}
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    entrypoint: ["mkdir", "-p", "/app/data/wiki/private", "/app/data/courses/private", "/app/content/slides"]
    command: []
    volumes:
      - ./data:/app/data
      - ./content:/app/content
    restart: "no"

  # TLS and HSTS (docker/Caddyfile). LIBRARIAN_DOMAIN unset = localhost with Caddy's internal CA.
  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      librarian:
        condition: service_healthy
    ports:
      # Host ports, overridable so a second stack (tests/e2e/run_compose.sh) can run beside this one.
      - "${LIBRARIAN_HTTP_PORT:-80}:80"
      - "${LIBRARIAN_HTTPS_PORT:-443}:443"
    environment:
      - LIBRARIAN_DOMAIN=${LIBRARIAN_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  # One-shot indexer: builds var/index/<id>.duckdb and points `current` at it before the API
  # starts (a corpus already built is reused, so a restart is quick). After a content change:
  #   docker compose run --rm indexer       every API process picks up the new build within ~5 s.
  # Same mounts as the API, private masks included, so the index never holds a private page.
  indexer:
    image: ${LIBRARIAN_IMAGE:-librarian:local}
    depends_on:
      prepare:
        condition: service_completed_successfully
    command: ["librarian", "index", "build"]
    volumes:
      - ./data:/app/data:ro
      - librarian-var:/app/var
    tmpfs:
      - /app/data/wiki/private
      - /app/data/courses/private
    restart: "no"

  librarian:
    image: ${LIBRARIAN_IMAGE:-librarian:local}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      prepare:
        condition: service_completed_successfully
      indexer:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    env_file:
      - path: .env
        required: false
    environment:
      - SERVE_COURSE_SOURCES=false
      # Also taken from the shell, so `LIBRARIAN_API_TOKEN=... docker compose up` works without .env.
      - LIBRARIAN_API_TOKEN
      # Prebuilt decks shipped by `make deploy-content` (content/slides/); the API never builds them.
      - LIBRARIAN_CONTENT_DIR=/app/content
      # User state (attempts, chat spend). POSTGRES_PASSWORD comes from .env or the shell.
      - DATABASE_URL=postgresql://librarian:${POSTGRES_PASSWORD:-librarian-dev}@postgres:5432/librarian
      # The indexer service builds the index; the API only opens it.
      - LIBRARIAN_INDEX_AUTOBUILD=0
      # uvicorn workers per container. State is in Postgres and the index file, so 2+ is safe.
      - LIBRARIAN_API_WORKERS=${LIBRARIAN_API_WORKERS:-2}
      # Sign-in: OAuth callbacks and email links are built from this; cookies are Secure on https.
      - LIBRARIAN_PUBLIC_URL=${LIBRARIAN_PUBLIC_URL:-https://${LIBRARIAN_DOMAIN:-localhost}}
      # Only Caddy reaches the API (no host port), so its X-Forwarded-For is the client address.
      - LIBRARIAN_FORWARDED_ALLOW_IPS=*
    volumes:
      # Content, read-only.
      - ./data:/app/data:ro
      - ./content:/app/content:ro
      # Writable state: indexes, caches, logs, flashcard results.
      - librarian-var:/app/var
    tmpfs:
      # Private content stays on the host: these empty mounts hide it from the container.
      # Docker cannot create their mountpoints inside the read-only ./data mount, so both
      # directories must exist on the host first (make app does that).
      - /app/data/wiki/private
      - /app/data/courses/private
    restart: unless-stopped

  # Nightly encrypted backup of the database to the bucket (`librarian ops schedule`, at
  # LIBRARIAN_BACKUP_AT UTC). A loop in a container instead of a host timer: it ships with the
  # compose file, needs no host setup, behaves the same on a laptop drill and on the host, and
  # restart: unless-stopped brings it back after a reboot. A failed run emails the owner.
  # Off unless the profile is on: `./librarian start` enables it when LIBRARIAN_BACKUP_URL is set.
  # `./librarian backup|restore|upgrade` run one-off commands in this service.
  backup:
    image: ${LIBRARIAN_IMAGE:-librarian:local}
    profiles: ["backup"]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["librarian", "ops", "schedule"]
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql://librarian:${POSTGRES_PASSWORD:-librarian-dev}@postgres:5432/librarian
    restart: unless-stopped

  # User state. Not published on the host: only the librarian service reaches it.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: librarian
      POSTGRES_DB: librarian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-librarian-dev}
    volumes:
      - librarian-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librarian -d librarian"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  librarian-var:
  librarian-pgdata:
  caddy-data:
  caddy-config:
