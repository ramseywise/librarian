repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=10000"]
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--allow-multiple-documents"]  # k8s manifests in course labs
      - id: check-toml
      - id: check-json
      - id: check-ast
      - id: detect-private-key
      # Disabled: solo project, committing directly to main is fine
      # - id: no-commit-to-branch
      #   args: ["--branch", "main"]
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: ["--fix"]
        exclude: ^(notebooks|data/courses)/
      - id: ruff-format
        exclude: ^(notebooks|data/courses)/

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
        name: detect secrets (gitleaks)

  - repo: local
    hooks:
      - id: eslint-ui
        name: eslint (apps/web)
        language: system
        entry: bash -c 'cd apps/web && npm run lint'
        files: ^apps/web/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

      - id: private-not-tracked
        name: no tracked file under a private/ tree
        language: system
        entry: uv run librarian wiki check --tracked-only
        always_run: true
        pass_filenames: false

      - id: wiki-frontmatter-yaml
        name: wiki frontmatter parses as YAML
        language: system
        entry: uv run pytest tests/hooks/test_wiki_frontmatter_yaml.py -q
        files: ^data/wiki/.*\.md$
        pass_filenames: false

      - id: no-hardcoded-paths
        name: no hardcoded /Users/ paths
        language: pygrep
        entry: "/Users/"
        files: ^(apps|src|tools)/
        types: [python]

      - id: no-pkl-staged
        name: no model .pkl files staged
        language: fail
        entry: ".pkl model files must not be committed — add to .gitignore"
        files: \.pkl$

      - id: no-dotenv-staged
        name: .env not staged
        language: fail
        entry: ".env file must not be committed"
        files: ^\.env$
