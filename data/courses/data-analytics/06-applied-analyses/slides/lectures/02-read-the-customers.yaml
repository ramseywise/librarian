parts:
  - title: Cohorts and retention
    divider: false
    summary: The triangle · Rate and mix · Channel value · The sBG curve
    notes: Fernhill's repeat buying has fallen. We read it by cohort, split the fall into rate and mix, price each channel and project the curve.
    slides:
      - layout: statement
        beat: problem
        section: The question and the data
        title: Why did repeat buying fall?
        recall: What is the question in the retention chapter, and what makes it hard?
        answer: "Fernhill's 90-day repeat rate fell after email reminders were cut and paid social grew. We must say how much is behaviour, how much is mix, and what each channel is worth, before the data is old enough to say."
        kicker: The problem
        statement: "Repeat buying fell. Was it the customers, or the customers we chose to buy?"
        attribution: Fernhill, 2024 to 2025
        takeaway: A fall in an aggregate has two possible causes, and the cure for each is different.
        source: notes/03-cohort-and-retention.md
        notes: >-
          The finance question is whether the move to paid social paid for itself, and what to do about the fall. We use the
          order log of 26,342 customers and 63,958 orders.

      - layout: bullets
        beat: fundamentals
        section: The question and the data
        title: One order log, three questions
        recall: How big is the data and what does the chapter ask of it?
        answer: "26,342 customers, 63,958 orders and £3,364,669 of revenue. It asks how retention varies by age and cohort, how much of the fall is rate and how much mix, and what a customer is worth by channel."
        bullets:
          - "**26,342** customers, **63,958** orders, **£3,364,669** revenue"
          - "Cohort: the quarter of a customer's first order"
          - "Age: periods since that first order"
          - "Rate or mix? Which channel pays back?"
          - "How good is the 24-month figure we cannot yet see?"
        takeaway: Start from one order log and a clear question, and every table after is a view of it.
        source: notes/03-cohort-and-retention.md
        notes: >-
          The synthetic Fernhill data comes with a known generator, so claims can be checked against truth where the note says so.

      - layout: image
        beat: fundamentals
        section: The retention triangle
        title: Read a retention triangle along both diagonals
        kicker: Retention by cohort and age
        recall: What does the retention triangle show, and where do you look for a period effect?
        answer: "Rows are cohorts, columns are age (period minus cohort). Age-1 retention was about 15% up to 2024Q4, then about 8.4% for 2025Q1 and Q2. A shock in one calendar quarter runs along a diagonal."
        image: ../../assets/sources/images/applied-cohort-heatmap.png
        caption: "Share of each cohort ordering at each age, upper triangle only."
        bullets:
          - "Age-1: about **15%** to 2024Q4, then **8.4%**"
          - "2025Q3 recovers a little, to **9.1%**"
          - "Age = period − cohort"
          - "Mask cohorts too young to have reached the age"
        takeaway: A new low at the same calendar quarter across cohorts is a period effect, not a cohort one.
        source: notes/03-cohort-and-retention.md
        notes: >-
          The step down happens at the same calendar time for every cohort that is old enough, so it is a period effect. Cohorts
          after the cut also start lower, so some is a cohort effect. We need to separate them.

      - layout: compare
        beat: fundamentals
        level: core
        section: The retention triangle
        title: A 2% monthly loss is 21.5% a year, not 24%
        recall: Why does 2% a month not make 24% a year?
        answer: "Losses compound on what is left, so 2% a month leaves 0.98 to the 12th power, a loss of 21.5% a year, not 24%."
        emphasis: right
        left:
          title: Simple sum
          bullets: ["2% × 12 = **24%**", "Ignores that the base shrinks"]
        right:
          title: Compounded
          bullets: ["0.98 to the power 12", "A loss of **21.5%**"]
        takeaway: Convert rates across periods by compounding, never by multiplying.
        source: notes/03-cohort-and-retention.md
        notes: >-
          The same care applies to a quarterly rate quoted as monthly. Compare like with like before comparing cohorts.

      - layout: statement
        beat: problem
        section: Separate rates from mix
        title: An aggregate moves for two reasons
        recall: Why must a change in an aggregate be split before it is explained?
        answer: "The rate within each group can change, or the share of each group can change. The two have different owners and different fixes."
        kicker: Rate and mix
        statement: "The share of paid social among new customers went from 27.5% to 53.8%. Its customers return less."
        attribution: Fernhill new customers, 2024 to 2025
        takeaway: Say which part is behaviour and which is who we acquired, because only one is a retention problem.
        source: notes/03-cohort-and-retention.md
        notes: >-
          Paid social had the largest rise. Email fell from 18.5% to 4.7% of new customers because it was cut.

      - layout: table
        beat: fundamentals
        section: Separate rates from mix
        title: Mix shifted to paid social while every rate fell
        recall: How did channel share and the 90-day repeat rate move between 2024 and 2025?
        answer: "Paid social share 27.5 to 53.8%, repeat 18.5 to 13.6%. Organic 39.0 to 30.6%, 33.3 to 27.3%. Email 18.5 to 4.7%, 45.1 to 38.6%. Referral 15.0 to 10.9%, 33.6 to 24.8%."
        header: [Channel, Share 2024, Share 2025, Repeat 2024, Repeat 2025]
        widths: [2.4, 1.8, 1.8, 1.8, 1.8]
        rows:
          - [Paid social, 27.5%, 53.8%, 18.5%, 13.6%]
          - [Organic, 39.0%, 30.6%, 33.3%, 27.3%]
          - [Email, 18.5%, 4.7%, 45.1%, 38.6%]
          - [Referral, 15.0%, 10.9%, 33.6%, 24.8%]
        highlight: [0]
        takeaway: The biggest channel by growth is the one that repeats least, and every channel got worse.
        source: notes/03-cohort-and-retention.md
        notes: >-
          Repeat means a second order within 90 days. Every channel's rate fell, which is the behaviour part, and the base moved to the
          channel with the lowest rate, which is the mix part.

      - layout: cards
        beat: fundamentals
        level: core
        section: Separate rates from mix
        title: 11.4 points split into rate and mix
        recall: How do the 11.4 points split, and what do you report?
        answer: "The overall 90-day repeat rate fell from 31.6% to 20.2%. Rates account for -6.2 points and mix for -5.2. In the reverse order it is -5.8 and -5.6, so report about half and half."
        cards:
          - {title: "Total", accent: "1E3A5F", body: "31.6% to 20.2%, a fall of **11.4** points"}
          - {title: "Rates", accent: "D4621A", body: "**−6.2** points: each channel got worse"}
          - {title: "Mix", accent: "0F7490", body: "**−5.2** points: more paid social"}
        takeaway: Report about half and half, because the split depends on the order you take it in.
        source: notes/03-cohort-and-retention.md
        notes: >-
          The two orders of decomposition are in the note: rates first gives -6.2 and -5.2, mix first gives -5.8 and -5.6. The
          fall is shared, and only the retention half can be reached by retention work.

      - layout: compare
        beat: fundamentals
        level: deep
        section: Separate rates from mix
        title: The order of the decomposition changes the split
        recall: What are the rate and mix effects in each order?
        answer: "Rate effect first: rates -6.2, mix -5.2. Mix effect first: mix -5.6, rates -5.8. Each sums to -11.4."
        emphasis: left
        left:
          title: Rates, then mix
          bullets: ["Rates **−6.2**", "Mix **−5.2**"]
        right:
          title: Mix, then rates
          bullets: ["Mix **−5.6**", "Rates **−5.8**"]
        takeaway: Quote the sensitivity to order alongside the split.
        source: notes/03-cohort-and-retention.md
        notes: >-
          There is an interaction term, and the order decides which side takes it. Reporting both orders is honest and cheap.

      - layout: image
        beat: practice
        section: What is a customer worth by channel?
        title: Email customers are worth over twice paid social's
        kicker: Cumulative margin per customer by channel
        recall: What is a customer worth by channel over 12 months?
        answer: "Email is over £200, organic and referral about £140, paid social about £84. The first order rose from £56 to £62."
        image: ../../assets/sources/images/applied-cohort-ltv-channel.png
        caption: "Cumulative revenue per customer by months since first order."
        bullets:
          - "Email: over **£200** at 12 months"
          - "Organic and referral: about **£140**"
          - "Paid social: about **£84**"
          - "First order: **£56** to **£62**"
        takeaway: The lines only separate later, so judge a channel on months, not on the first order.
        source: notes/03-cohort-and-retention.md
        notes: >-
          The lines overlap early because first orders are similar. Judging a channel on its first order or its 30-day return would
          miss the gap.

      - layout: table
        beat: practice
        section: What is a customer worth by channel?
        title: Paid social returns about its cost, no more
        recall: What are the 24-month margin and LTV to CAC by channel, and what is assumed?
        answer: "With a 35% margin and CACs of £32, £6, £9 and £14: 24-month margin £32.68 (paid social), £62.68, £98.52 and £61.48. LTV to CAC is 1.02, 10.45, 10.95 and 4.39. Margin and CAC are assumptions."
        header: [Channel, Customers, CAC, 24-month margin, LTV to CAC]
        widths: [2.4, 1.8, 1.6, 2.4, 1.8]
        rows:
          - [Paid social, "2,100", £32, £32.68, "1.02"]
          - [Organic, "3,155", £6, £62.68, "10.45"]
          - [Email, "1,434", £9, £98.52, "10.95"]
          - [Referral, "1,251", £14, £61.48, "4.39"]
        highlight: [0]
        takeaway: Margin and acquisition cost decide the ratio, so state them and show the sensitivity.
        source: notes/03-cohort-and-retention.md
        notes: >-
          The margin of 35% and the CACs are assumptions. If paid social costs £15 a customer its ratio is about 2.2, which is why the
          recommendation asks for the real number first.

      - layout: statement
        beat: problem
        section: Project the curve, because you cannot wait 24 months
        title: Nobody has 24 months of data on a new cohort
        recall: Why is the choice of curve a decision, not a detail?
        answer: "A curve fitted on the early months must extrapolate. A good fit in the calibration window says little about the extrapolation."
        kicker: Extrapolation
        statement: "A good fit in the window says little about what happens beyond it."
        attribution: Fader and Hardie, 2007
        takeaway: Choose a model whose shape you can defend, and test it on held-back months.
        source: notes/03-cohort-and-retention.md
        notes: >-
          The question is what a paid social customer will be worth at 24 months, using only six months of their history.

      - layout: compare
        beat: fundamentals
        level: core
        section: Project the curve, because you cannot wait 24 months
        title: Curves that fit early months miss the year-12 rate
        recall: How far do linear, exponential and quadratic curves miss the year-12 survival rate?
        answer: "A linear curve falls short by 81% and an exponential by 30%, while a quadratic overshoots by 92%. These are the Fader and Hardie 2007 comparisons."
        emphasis: right
        left:
          title: Common shapes
          bullets: ["Linear: **81%** short", "Exponential: **30%** short", "Quadratic: **92%** over"]
        right:
          title: Why
          bullets: ["Customers differ", "The fast leavers go first", "Retention of the rest rises"]
        takeaway: A curve that ignores the mix of customers cannot get the shape right.
        source: notes/03-cohort-and-retention.md
        notes: >-
          Fader and Hardie call this the ruse of heterogeneity: pooled retention rises with age even though no customer changes.

      - layout: flow
        beat: fundamentals
        level: core
        section: Project the curve, because you cannot wait 24 months
        title: The sBG model builds the curve from customer differences
        recall: How does the shifted beta geometric model get its shape?
        answer: "Each customer has a constant chance of leaving, that chance varies across customers following a beta distribution, so the fast leavers go first and the pooled retention rate rises."
        steps:
          - {label: One customer, sub: "a constant chance of leaving", accent: "94A3B8"}
          - {label: Customers differ, sub: "the chance follows a beta", accent: "1E3A5F"}
          - {label: Fast leavers go first, sub: "the mix gets loyal", accent: "0F7490"}
          - {label: Pooled retention rises, sub: "with age"}
        caption: "Two parameters, alpha and beta, set the whole curve."
        takeaway: The curve bends because the base gets more loyal, and the model says exactly how fast.
        source: notes/03-cohort-and-retention.md
        notes: >-
          This is the shifted beta geometric (sBG) model. It describes a contractual-style survival curve for cohorts in the data.

      - layout: code
        beat: practice
        level: deep
        section: Project the curve, because you cannot wait 24 months
        title: Two formulas hold the whole sBG model
        recall: What are the survival and retention functions of the sBG model?
        answer: "Survival is S(t) = B(alpha, beta + t) / B(alpha, beta), and retention is r(t) = (beta + t - 1) / (alpha + beta + t - 1)."
        lead: "B is the beta function. Two parameters, alpha and beta, are fitted."
        lang: text
        code: |-
          S(t) = B(alpha, beta + t)
                 / B(alpha, beta)

          r(t) = (beta + t - 1)
                 / (alpha + beta + t - 1)
        bullets:
          - "**S(t)**: share still active at time t"
          - "**r(t)** rises with t, so retention improves with age"
        takeaway: Fit alpha and beta on the early months, then read the whole curve off these two functions.
        source: notes/03-cohort-and-retention.md
        notes: >-
          The derivation is in the note and in Fader and Hardie (2007). We replicate their published fits on the next slides.

      - layout: image
        beat: practice
        level: core
        section: Project the curve, because you cannot wait 24 months
        title: Fitted on six months, the sBG curve tracks month 24
        kicker: Calibrated on months 0 to 6
        recall: How well does the sBG curve predict month 24 compared with an exponential?
        answer: "At month 24 the actual survival is 0.238, sBG predicts 0.251 and an exponential 0.087. The fit uses alpha 0.689 and beta 3.883."
        image: ../../assets/sources/images/applied-cohort-sbg.png
        caption: "Observed survival against sBG and exponential fits, calibration window shaded."
        bullets:
          - "Fit: alpha **0.689**, beta **3.883**"
          - "Month 24 actual: **0.238**"
          - "sBG: **0.251**, exponential: **0.087**"
          - "Model retention at months 1, 6, 12: **0.849, 0.928, 0.956**"
        takeaway: With six months of data the sBG curve lands near the 24-month truth, and the exponential does not.
        source: notes/03-cohort-and-retention.md
        notes: >-
          Retention rises from 0.849 at month 1 to 0.956 at month 12, which is the mix getting more loyal. An exponential assumes it stays flat.

      - layout: table
        beat: practice
        level: deep
        section: Project the curve, because you cannot wait 24 months
        title: We reproduced the published fits, with one caveat
        recall: How well does the replication of the sBG paper hold up?
        answer: "Regular alpha 0.704 and beta 1.182. High End alpha 0.668 and beta 3.806 against a printed 0.688, likely a typo. Year-12 forecast errors are -4.1% and -1.7%, with a sign mismatch unresolved."
        header: [Segment, Alpha, Beta, Year-12 error]
        widths: [2.4, 1.8, 1.8, 2.4]
        rows:
          - [Regular, "0.704", "1.182", "−4.1%"]
          - [High End, "0.668 (printed 0.688)", "3.806", "−1.7%"]
        highlight: [1]
        takeaway: Check a method against a published table, and say so where yours differs.
        source: notes/03-cohort-and-retention.md
        notes: >-
          The printed 0.688 is likely a typo in the paper. The sign of the year-12 errors does not match the paper and we could not resolve it. Say that, do not hide it.

      - layout: cards
        beat: wrap
        section: Recommendation
        title: Reinstate email with a holdout, cap paid social
        recall: What is the cohort recommendation, and what would change it?
        answer: "Bring back the email reminders for the existing base with a holdout, and cap paid social at about its old volume until its true cost is confirmed. About half the fall is every channel getting worse, the other half the move to paid social. At £15 CAC the ratio would be about 2.2."
        cards:
          - {title: "Reinstate email", accent: "1E3A5F", body: "For the existing base, **with a holdout** to measure it"}
          - {title: "Cap paid social", accent: "D4621A", body: "At about its old volume until its true CAC is confirmed"}
          - {title: "What would change it", accent: "0F7490", body: "A real CAC of **£15** gives a ratio of about **2.2**"}
        takeaway: Get the real acquisition cost first, and reinstate email through a holdout and not just a date.
        source: notes/03-cohort-and-retention.md
        notes: >-
          The drop in rates coincides with the budget cut, and a before-and-after cannot prove one caused the other. That is why the
          reinstatement needs a holdout.

      - layout: table
        beat: pitfalls
        section: Pitfalls
        title: Retention pitfalls and what to do instead
        recall: What are the main cohort and retention pitfalls?
        answer: "Incomplete cohorts, a blended rate, reading a period effect as a cohort effect, regressing out age, period and cohort, mistaking mix for behaviour, judging a channel on its first order, fitting a curve because it fits, and quoting LTV with invisible assumptions."
        header: [Pitfall, Do instead]
        widths: [4, 5.6]
        rows:
          - [Incomplete cohorts, Mask the triangle]
          - [A blended retention rate, Hold age fixed]
          - [Period read as cohort, Look along the diagonal]
          - ["Regressing out age, period and cohort", State the assumption the identity forces]
          - [Mix taken for behaviour, Decompose and report the order]
          - [Fit-because-it-fits curves, Compare on held-back periods]
          - [Lapsed treated as lost, You observe silence and not churn]
          - [Invisible LTV assumptions, State margin and CAC and show sensitivity]
        takeaway: Most retention mistakes are about age, so hold age fixed before you compare anything.
        source: notes/03-cohort-and-retention.md
        notes: >-
          Also: reading a rising retention rate as growing loyalty. It is usually the less loyal customers having left already.

  - title: Funnel and conversion
    summary: The steps · The headline · Real or redesign · The cost
    notes: A redesign went live and the headline conversion barely moved. We look at each step, ask whether the drop is real and what it costs.
    slides:
      - layout: statement
        beat: problem
        section: The question and the data
        title: Conversion held still, so was the redesign fine?
        recall: What was the situation behind the funnel analysis?
        answer: "The checkout was redesigned on 15 September 2025. Headline conversion moved from 7.48% to 7.60%, so it looks fine."
        kicker: The problem
        statement: "Conversion went from 7.48% to 7.60% after the redesign. It looks like nothing happened."
        attribution: Fernhill, redesign of 15 September 2025
        takeaway: A flat headline can hide a large loss and a large gain that happen to cancel.
        source: notes/04-funnel-and-conversion.md
        notes: >-
          The data is 496,153 sessions from 247,369 users, through six steps. The headline nets out gains and losses.

      - layout: flow
        beat: fundamentals
        section: Conditional rates, step by step
        title: Measure each step as a rate of the one before
        recall: What are the funnel steps and why use conditional rates?
        answer: "Product, basket, checkout, payment, purchase, each step measured as a share of those who reached the one before. A conditional rate shows where a loss happens and is not hidden by the steps before it."
        steps:
          - {label: Product, sub: "unchanged", accent: "94A3B8"}
          - {label: Basket, sub: "rate rose", accent: "1E3A5F"}
          - {label: Checkout, sub: "flat", accent: "0F7490"}
          - {label: Payment, sub: "fell on mobile", accent: "D4621A"}
          - {label: Purchase, sub: "flat"}
        caption: "Five steps. Each rate is the share who reach the step from the one before."
        takeaway: Count conditional rates, and the step that broke shows itself.
        source: notes/04-funnel-and-conversion.md
        notes: >-
          The funnel has six steps in the data. The picture shows the ones where the story is.

      - layout: image
        beat: fundamentals
        section: Conditional rates, step by step
        title: Mobile lost 15 points at the payment step
        kicker: Step rates by device
        recall: Which funnel step fell and by how much on mobile and desktop?
        answer: "On mobile, checkout to payment fell from 82.4% to 67.6%, while desktop held at 83.2% to 84.0%. Basket rose (22.3 to 25.4 mobile) and the other steps were flat."
        image: ../../assets/sources/images/applied-funnel-steps.png
        caption: "Mobile and desktop step rates before and after 15 September 2025."
        bullets:
          - "Mobile payment step: **82.4%** to **67.6%**"
          - "Desktop payment step: **83.2%** to **84.0%**"
          - "Mobile basket: **22.3%** to **25.4%**"
          - "Product step unchanged: **54.9%**"
        takeaway: The loss is one step on one device, and only a conditional rate shows it.
        source: notes/04-funnel-and-conversion.md
        notes: >-
          Mobile checkout 61.9 to 61.3 and purchase 93.3 to 93.0 are flat. Desktop: basket 30.1 to 34.4, checkout 68.2 to 68.0, purchase 94.8 to 95.5.

      - layout: compare
        beat: fundamentals
        section: Why the headline held still
        title: Mobile fell and desktop rose, and the mix hid it
        recall: Why did the headline conversion hold still?
        answer: "Mobile conversion fell from 5.80 to 5.37 and desktop rose from 10.03 to 11.65. The mobile share also rose from 60.5 to 64.5%. Rate effect +0.38, mix -0.25, sum about +0.12."
        emphasis: left
        left:
          title: Rates
          bullets: ["Desktop **10.03** to **11.65**", "Mobile **5.80** to **5.37**", "Rate effect **+0.38**"]
        right:
          title: Mix
          bullets: ["Mobile share **60.5** to **64.5%**", "Mobile converts at about half", "Mix effect **−0.25**"]
        takeaway: Rate and mix almost cancel, which is why a headline can hold still while a step breaks.
        source: notes/04-funnel-and-conversion.md
        notes: >-
          The sum is about +0.12, which is the headline's small rise. This looks like Simpson's paradox (Bickel 1975), but here it is only a relative of it, since the direction of the overall change is not reversed.

      - layout: image
        beat: practice
        level: deep
        section: Why the headline held still
        title: A relative of Simpson's paradox
        kicker: Rate and mix by device
        recall: What does the Simpson figure show?
        answer: "Conversion by device and the mix of devices, where the pooled change points one way and the groups the other."
        image: ../../assets/sources/images/applied-funnel-simpson.png
        caption: "Conversion by device and the pooled headline."
        bullets:
          - "Desktop up, mobile down"
          - "Mobile share up"
          - "Pooled headline barely moves"
        takeaway: Group before you pool, whenever the mix can change.
        source: notes/04-funnel-and-conversion.md
        notes: >-
          This figure sits with the rate and mix argument, and is an optional extension of the same story.

      - layout: steps
        beat: fundamentals
        level: core
        section: Is the drop real, and is it the redesign?
        title: Difference in differences asks it of the data
        recall: How does difference in differences separate the redesign from the calendar?
        answer: "Mobile fell 14.8 points (interval -15.9 to -13.7) and desktop rose 0.8 (-0.2 to +1.7), so the difference is -15.5 (-17.0 to -14.1). It assumes mobile and desktop would have moved in parallel."
        steps:
          - {title: Mobile change, text: "**−14.8** points, interval −15.9 to −13.7"}
          - {title: Desktop change, text: "**+0.8** points, interval −0.2 to +1.7"}
          - {title: The difference, text: "**−15.5** points, interval −17.0 to −14.1", n: "★", accent: "D4621A"}
          - {title: Parallel trends, text: "Assumed, not tested: it is not randomised"}
        takeaway: Desktop is the comparison group, so the estimate holds only if the two would have moved together.
        source: notes/04-funnel-and-conversion.md
        notes: >-
          The number of mobile sessions at the step after is 10,503. The comparison is a before-and-after with a control, not an experiment.

      - layout: table
        beat: fundamentals
        level: core
        section: Sessions or users?
        title: Per user the headline looks worse than per session
        recall: How do per-session and per-user conversion differ, and why?
        answer: "Per session 7.48% to 7.60%. Per user 11.34% to 9.94%. Sessions per user are 1.57 and 1.34 because the windows are 198 and 108 days, so a longer window gives more chances to buy."
        header: [Basis, Before, After, Window]
        widths: [2.4, 1.8, 1.8, 2.4]
        rows:
          - [Per session, 7.48%, 7.60%, "198 vs 108 days"]
          - [Per user, 11.34%, 9.94%, "1.57 vs 1.34 sessions"]
        highlight: [1]
        takeaway: Compare equal windows, because per-user rates rise with the length of the window.
        source: notes/04-funnel-and-conversion.md
        notes: >-
          Windows of 198 and 108 days are unequal, so the per-user figures are not comparable. The effect is 13 times the interval half-width, so the conclusion survives either way.

      - layout: cards
        beat: practice
        section: What it cost
        title: The drop costs about £1,800 of margin a week
        recall: What does the mobile drop cost?
        answer: "About 1,500 orders in 108 days (range 1,378 to 1,659) at an average order of £52.61. The mid case is £79,865 of revenue and £27,953 of margin (range £25,364 to £30,542), which is £1,812 a week."
        cards:
          - {title: "Orders lost", accent: "1E3A5F", body: "About **1,500** in 108 days, range 1,378 to 1,659"}
          - {title: "Revenue", accent: "0F7490", body: "**£79,865** at £52.61 an order"}
          - {title: "Margin", accent: "D4621A", body: "**£27,953**, about **£1,812** a week"}
        takeaway: A rate persuades nobody until it becomes money, with its assumptions stated.
        source: notes/04-funnel-and-conversion.md
        notes: >-
          The margin range is £25,364 to £30,542. The headline alone would have suggested a smaller picture, about 8.4% from 190,528 sessions.

      - layout: table
        beat: practice
        level: core
        section: Can we afford to find out?
        title: Small effects need many sessions to find
        recall: How long does a test take to detect a +2, +5 or +10 point gain?
        answer: "At 97 sessions a day at the step, +2 points needs 8,390 per arm (173 days), +5 points needs 1,302 (27 days) and +10 points needs 305 (6 days). It is close to 16 sigma squared over delta squared."
        header: [Gain to detect, Per arm, Days]
        widths: [3, 3, 2.4]
        rows:
          - [+2 points, "8,390", "173"]
          - [+5 points, "1,302", "27"]
          - [+10 points, "305", "6"]
        highlight: [1]
        takeaway: A low-funnel test can only find a large effect, so decide the smallest gain worth shipping before it starts.
        source: notes/04-funnel-and-conversion.md
        notes: >-
          The rule of thumb is close to 16 sigma squared over delta squared (Kohavi 2009). It uses the 97 sessions a day that reach the step.

      - layout: cards
        beat: wrap
        section: Recommendation
        title: Roll back in a two-week test
        recall: What is the funnel recommendation?
        answer: "Roll the mobile checkout page back in a two-week 50/50 test, then send everyone to the winner. Ship nothing without at least a 5-point gain. Each extra week costs about £1,800. The data is synthetic and not randomised."
        cards:
          - {title: "Roll back", accent: "1E3A5F", body: "A two-week **50/50** test, then everyone to the winner"}
          - {title: "Raise the bar", accent: "D4621A", body: "Ship nothing without at least a **5-point** gain"}
          - {title: "Cost of waiting", accent: "0F7490", body: "About **£1,800** of margin for each extra week"}
        takeaway: Judge a replacement on the checkout-to-payment step, since headline conversion would hide it.
        source: notes/04-funnel-and-conversion.md
        notes: >-
          The analysis cannot say why customers abandon the new page. It needs session recordings, error logs and a few calls with customers. The figures are synthetic, so the method transfers but the numbers do not.

      - layout: bullets
        beat: pitfalls
        section: Pitfalls
        title: Funnel pitfalls
        recall: What are the main funnel pitfalls?
        answer: "Reading only end-to-end conversion, calling a before-and-after an experiment, comparing unequal windows, conditioning on a step the change affects, trusting one event source, assuming a strict funnel, ignoring the step's own traffic and treating lost sessions as lost customers."
        bullets:
          - "Only **end-to-end** conversion: it nets out gains and losses"
          - "A before-and-after is **not** an experiment"
          - "**Unequal windows**: per-user rates grow with length"
          - "Conditioning on a step the **change affects**"
          - "One event source: reconcile to the payment system"
          - "Lost sessions are not always lost customers"
        takeaway: Split a change into conditional steps and then into segments before you say anything about it.
        source: notes/04-funnel-and-conversion.md
        notes: >-
          Also: assuming a strict funnel, since real sessions skip and repeat steps, and ignoring the step's own traffic when sizing a test.

  - title: Segmentation and RFM
    summary: Scores · Shape · Clusters · Concentration · The campaign · A B2B case
    notes: A £4,000 win-back plan targets the customers labelled At risk. We score the segments on a later period and price the campaign.
    slides:
      - layout: statement
        beat: problem
        section: The question and the data
        title: Is the At risk segment worth £4,000?
        recall: What is the question in the segmentation chapter?
        answer: "A £4,000 win-back plan targets the At risk segment. We take a snapshot on 30 June 2025 and score every segment on the next six months, July to December, for 21,085 customers."
        kicker: The problem
        statement: "A £4,000 win-back campaign is planned for the customers called At risk."
        attribution: Fernhill, snapshot 30 June 2025
        takeaway: A segment is a prediction, so score it on a period it has not seen.
        source: notes/05-segmentation-and-rfm.md
        notes: >-
          21,085 customers. Typical customer: median recency 287 days, median frequency 1, median future value 0. Most customers buy once.

      - layout: table
        beat: fundamentals
        section: Scores and named segments
        title: Champions hold 68% of future value
        recall: How do the named RFM segments differ on the later period?
        answer: "Champions are 3,872 customers, 45% buy again, £55.57 each and 68% of future value. At risk is 2,651, 3% buy again, £1.72 and 1%. Middle 7,653, 9%, £7.64, 18%. New 3,061, 14%, £11.30, 11%. Hibernating 3,848, 2%, £1.19, 1%."
        header: [Segment, Customers, Share of future value]
