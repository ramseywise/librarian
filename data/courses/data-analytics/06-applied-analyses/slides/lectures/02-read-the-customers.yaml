        source: notes/05-segmentation-and-rfm.md
        notes: >-
          The figure is generated by the chapter's practice script on the Fernhill data.

      - layout: bullets
        beat: pitfalls
        level: core
        section: Scores and named segments
        title: A tie-break bug shrank New from 3,061 to 315
        recall: What was the tie-break bug in the scores?
        answer: "60.2% of customers have one order, and rank with method first breaks the ties by row order, which follows signup. New came out at 315 instead of 3,061, until ties were broken at random."
        bullets:
          - "**60.2%** of customers have a single order"
          - "`rank(method=\"first\")` breaks ties by row order"
          - "Row order follows **signup**, so it encodes age"
          - "New: **315** instead of **3,061**"
          - "Break ties at random, or use fixed bins"
        takeaway: A heavily tied column plus a silent tie-break makes a segment out of the row order.
        source: notes/05-segmentation-and-rfm.md
        notes: >-
          Nothing errors. The bug only shows when you compare a segment's size against what you expect from the data.

      - layout: table
        beat: fundamentals
        level: deep
        section: The shape underneath the names
        title: The RFM grid has no clean boundaries
        recall: What does the grid of recency and frequency show?
        answer: "Mean future value in pounds runs 18, 34, 54, 113 for customers active in the last 60 days, 6, 10, 17, 22 for 181 to 365 days and 1, 2, 3, 1 for 366 days and over. Fader, Hardie and Lee 2005 show iso-value curves bend backwards, and the correlation is 0.11 among 946 repeat buyers (Fernhill Spearman 0.09)."
        lead: "Mean future value per customer in £, by days since last order and by number of orders:"
        header: [Days since last order, 1 order, 2 orders, 3-4 orders, 5+ orders]
        widths: [2.6, 1.7, 1.7, 1.7, 1.7]
        rows:
          - ["0-60", "18", "34", "54", "113"]
          - ["61-180", "9", "21", "34", "67"]
          - ["181-365", "6", "10", "17", "22"]
          - ["366+", "1", "2", "3", "1"]
        takeaway: Iso-value curves bend backwards, so high frequency with a long silence is not valuable.
        source: notes/05-segmentation-and-rfm.md
        notes: >-
          From Fader, Hardie and Lee (2005), on 23,560 CDNOW customers. The correlation of 0.11 is among 946 repeat buyers.

      - layout: compare
        beat: fundamentals
        section: Does clustering do better?
        title: Clusters differ in order value, not in future value
        recall: Does k-means beat the RFM segments?
        answer: "Silhouettes are about 0.3 (k=2 0.345, k=4 0.31). Clusters 0 and 3 are £77 against £27 on order value but £5.40 against £3.55 in future value. Cluster 1 holds 56% of future value with 3,672 customers."
        emphasis: right
        left:
          title: Order value
          bullets: ["Clusters 0 and 3: **£77**", "Others: **£27**", "A clear split"]
        right:
          title: Future value
          bullets: ["**£5.40** against **£3.55**", "Cluster 1: **56%** of future value", "Silhouette about **0.3**"]
        takeaway: K-means finds the largest spread in the features, which is not the value you need to predict.
        source: notes/05-segmentation-and-rfm.md
        notes: >-
          Silhouettes at k=2 and k=4 are 0.345 and 0.31. Cluster 1 has 3,672 customers and cluster 2 has 3,096 with 23% of future value.

      - layout: image
        beat: fundamentals
        section: How concentrated is value?
        title: Past spenders are not the future's top decile
        kicker: Concentration of past and future value
        recall: How concentrated is value, and how well does the past predict it?
        answer: "The top decile by past value holds 45.4% of past value and 44.3% of future value. The top decile by future value holds 91.9%. Spearman is 0.244, and 0.397 among 3,032 buyers in both periods."
        image: ../../assets/sources/images/applied-rfm-concentration.png
        caption: "Cumulative share of value by customer decile."
        bullets:
          - "Top past decile: **45.4%** of past, **44.3%** of future"
          - "Top future decile: **91.9%** of future"
          - "Spearman **0.244**, or **0.397** among 3,032 repeat buyers"
        takeaway: A few customers carry the value, and the past ranks them only loosely.
        source: notes/05-segmentation-and-rfm.md
        notes: >-
          Beware regression to the mean: top customers look worse next period with no intervention at all.

      - layout: bullets
        beat: pitfalls
        level: deep
        section: How concentrated is value?
        title: Top customers look worse next period on their own
        recall: What is regression to the mean in the segment tables?
        answer: "Customers picked for a high score on one period look worse in the next with no intervention at all, so a campaign aimed at them must be judged against a holdout."
        bullets:
          - "Pick the top by one period, and they **fall back** in the next"
          - "No campaign is needed for the drop to appear"
          - "A before-and-after on a selected group **flatters** any fix"
          - "Compare with a **random holdout** from the same group"
        takeaway: Selected groups drift back to the average, so compare them with a holdout and not with their own past.
        source: notes/05-segmentation-and-rfm.md
        notes: >-
          This is the last pitfall in the segmentation note, and the reason the campaign needs a randomised holdout.

      - layout: table
        beat: practice
        section: The campaign, in money
        title: Only the Lapsing group could pay for a campaign
        recall: What response must each segment show for the campaign to break even?
        answer: "At an average order of £52.67, £18.43 margin per order and £1.50 a contact, breakeven is 8.1 points. At risk needs 4.1 times its base rate (144 per arm), Hibernating 5.5 times (127), Lapsing 1.2 times (589 per arm, cost £1,809)."
        header: [Segment, Buy again, Needs, Per arm]
        widths: [2.6, 2, 2, 2]
        rows:
          - [At risk, 3%, "4.1x", "144"]
          - [Hibernating, 2%, "5.5x", "127"]
          - ["Lapsing (1,206 customers)", 45.2%, "1.2x", "589"]
        highlight: [2]
        takeaway: Only a randomised holdout measures the campaign, and uplift is what counts, not the response rate.
        source: notes/05-segmentation-and-rfm.md
        notes: >-
          The breakeven is 8.1 points of order rate. This is an uplift question (Gutierrez and Gerardy 2017). Predicting who buys is not knowing who is persuadable.

      - layout: cards
        beat: wrap
        section: Recommendation
        title: Do not send to At risk; test the Lapsing half
        recall: What is the segmentation recommendation?
        answer: "Do not send to At risk. Send to a random half of the 1,206 Lapsing customers and keep the other half as a holdout, about £900. The contacted half must beat the holdout by at least 8.1 points of order rate over six months."
        cards:
          - {title: "Not At risk", accent: "94A3B8", body: "Its customers buy again **3%** of the time"}
          - {title: "Lapsing, half", accent: "1E3A5F", body: "A random half of **1,206**, the other half a holdout"}
          - {title: "The bar", accent: "D4621A", body: "Beat the holdout by **8.1** points over six months"}
        takeaway: Spend about £900 to learn whether a campaign works, rather than £4,000 on a label.
        source: notes/05-segmentation-and-rfm.md
        notes: >-
          The campaign for the half costs about £900. The decision is to measure first.

      - layout: statement
        beat: problem
        level: deep
        section: "Case: segmenting B2B customers by behaviour"
        title: A clustering can pass every check and still be noise
        recall: What does the B2B case set out to test?
        answer: "A synthetic set of 400 businesses with seed 42, in three worlds: planted groups, blurred groups and a control with no structure. We test whether each method passes a gate on structure and whether the groups are stable and actionable."
        kicker: A synthetic case
        statement: "A clustering gate is only as good as its control with no structure in it."
        attribution: 400 businesses, seed 42, worlds planted, blurred and control
        takeaway: Always run a control with no structure, because that is the one that shows the gate leaks.
        source: notes/05-segmentation-and-rfm.md
        notes: >-
          The case is synthetic, with the structure planted in one world and absent in the control. The thresholds are design choices.

      - layout: table
        beat: practice
        level: deep
        section: "Case: segmenting B2B customers by behaviour"
        title: HDBSCAN's gate passes on a control
        recall: How do the methods behave on the planted and control worlds?
        answer: "RFM scores an ARI on planted of 0.004. K-means at k=5 has a silhouette of 0.358. HDBSCAN marks 32.8% noise at silhouette 0.458. The control passes with a 16-customer cluster, and across five fresh controls HDBSCAN passes once."
        header: [Method, Result]
        widths: [3, 6.4]
        rows:
          - [RFM on planted, ARI **0.004**]
          - [K-means k=5, silhouette **0.358**]
          - [HDBSCAN, "32.8% noise, silhouette **0.458**"]
          - [HDBSCAN on a control, "passes the gate with a **16**-customer cluster"]
          - [Five fresh controls, HDBSCAN passes **once**]
        takeaway: A silhouette gate rewards a small tight cluster, so test it on data with nothing in it.
        source: notes/05-segmentation-and-rfm.md
        notes: >-
          HDBSCAN is picked on planted although k-means has ARI 0.734 against 0.480. 40 of 54 manufacturers and 52 of 75 early-stage firms are labelled noise. With minimum size 15 it returns all noise.

      - layout: image
        beat: practice
        level: deep
        section: "Case: segmenting B2B customers by behaviour"
        title: UMAP draws clusters on noise
        kicker: UMAP on a control world
        recall: What does UMAP show on the planted and control worlds?
        answer: "Planted gives 6 clusters (0.857 on the map, 0.348 on the features, ARI 0.937). The control with size 10 gives 2 clusters (0.522 and 0.279), and with size 3 gives 48 clusters (0.548 and 0.073)."
        image: ../../assets/sources/images/applied-segments-umap-control.png
        caption: "A UMAP map of the control world, where no structure exists."
        bullets:
          - "Planted: **6** clusters, ARI **0.937**"
          - "Control, size 10: **2** clusters"
          - "Control, size 3: **48** clusters"
          - "UMAP is for **looking**, not for scoring"
        takeaway: A map looks convincing on noise, so trust the features and not the picture.
        source: notes/05-segmentation-and-rfm.md
        notes: >-
          Silhouette on the map beats silhouette on the features in every case, which is the warning. Chari and Pachter use Jaccard above 0.7 for neighbour preservation. Here it is 0.492 and 0.611.

      - layout: table
        beat: practice
        level: deep
        section: "Case: segmenting B2B customers by behaviour"
        title: Stable groups are not always actionable ones
        recall: How stable are the groups, and can anyone act on them?
        answer: "Stability by subsample ARI and against the previous year: planted k-means 0.999 and 0.902, planted HDBSCAN 0.603 and 0.288, control k-means 0.906 and 0.453, control HDBSCAN 0.768 and 0. Actionability AUC is 0.692 for k-means."
        header: [World and method, Subsample ARI, Previous year]
        widths: [4, 2.6, 2.6]
        rows:
          - [Planted k-means, "0.999", "0.902"]
          - [Planted HDBSCAN, "0.603", "0.288"]
          - [Control k-means, "0.906", "0.453"]
          - [Control HDBSCAN, "0.768", "0.000"]
        highlight: [3]
        takeaway: A group that is stable inside one year and gone the next is not a segment you can plan on.
        source: notes/05-segmentation-and-rfm.md
