          After Ben-David et al. (2006). Actionability AUC: 0.692 (k-means), 0.678 (the rule's clusters), 0.526 (RFM), 0.545 (costs exceed income). On the control 0.754, 0.744 and 0.578. A depth-3 tree reproduces the groups with 0.915 accuracy.

      - layout: bullets
        beat: pitfalls
        section: Pitfalls
        title: Segmentation pitfalls
        recall: What are the main segmentation pitfalls?
        answer: "Never validating the segments, future data in the features, tie-breaking by row order, using total spend as M, reading high frequency plus silence as valuable, reporting a campaign response without a holdout, believing the clusters are real, clustering unscaled features and reacting to regression to the mean."
        bullets:
          - "**Never validating** the segments on a later period"
          - "Future data leaking into the features"
          - "Tie-breaking by row order, here sign-up date"
          - "Total spend as M duplicates **frequency**"
          - "A campaign response with **no holdout**"
          - "**K-means always returns k**: judge clusters by use"
        takeaway: Hold out a period every time, because a segmentation not scored later is only a description.
        source: notes/05-segmentation-and-rfm.md
        notes: >-
          Also: high frequency with a long silence usually means gone, unscaled skewed features let one heavy customer decide the distance, and top customers look worse next period with no intervention.

  - title: SQL for analytics
    summary: The bridge · Windows · Spines and islands · The fan-out
    notes: The board pack says revenue is up 2.1%. We write the revenue bridge in SQL, prove it adds up, and look at the join bug that overstates it.
    slides:
      - layout: statement
        beat: problem
        section: The question and the data
        title: Revenue is up 2.1%, and two teams disagree
        recall: What is the question in the SQL chapter?
        answer: "The board pack says revenue is up 2.1%, and two teams read it differently. We answer in DuckDB on 63,958 orders and £3,364,669 revenue."
        kicker: The problem
        statement: "The board pack says revenue is up 2.1%. One team says growth, the other says decline."
        attribution: Fernhill, DuckDB over the order log
        takeaway: A definition written once in SQL ends the argument between two spreadsheets.
        source: notes/06-sql-for-analytics.md
        notes: >-
          Both teams are right, about different rows. The chapter builds the query that shows it.

      - layout: flow
        beat: fundamentals
        section: The revenue bridge
        title: The bridge is built as a chain of small steps
        recall: What are the steps of the revenue bridge query?
        answer: "Orders become a monthly table with one row per customer month, then a history that adds the previous active month, then labels of new, returning or reactivated, then revenue per quarter and kind."
        steps:
          - {label: Orders, sub: "the source rows", accent: "94A3B8"}
          - {label: Monthly, sub: "one row per customer month", accent: "1E3A5F"}
          - {label: History, sub: "previous active month", accent: "0F7490"}
          - {label: Labelled, sub: "new, returning, reactivated", accent: "D4621A"}
          - {label: Per quarter, sub: "revenue by kind"}
        caption: "Each step is a common table expression that can be run and checked by itself."
        takeaway: One idea per step, so that each can be checked on its own.
        source: notes/06-sql-for-analytics.md
        notes: >-
          The label needs a customer's earlier rows, which is exactly what window functions are for: they see other rows without collapsing them.

      - layout: code
        beat: practice
        level: core
        section: The revenue bridge
        title: lag() labels each customer month
        recall: How does the query label a customer month new, returning or reactivated?
        answer: "lag(month) over a partition by customer gives the previous active month. No previous month is new, a gap of at most three months is returning, and otherwise reactivated."
        lead: "The labelling step of the bridge, in DuckDB."
        lang: sql
        code: |-
          history AS (
            SELECT *, lag(month) OVER (
              PARTITION BY customer_id
              ORDER BY month) AS previous_month
            FROM monthly),
          labelled AS (
            SELECT *, CASE
              WHEN previous_month IS NULL THEN 'new'
              WHEN date_diff('month',
                previous_month, month) <= 3
                THEN 'returning'
              ELSE 'reactivated' END AS kind
            FROM history)
        bullets:
          - "No previous month: **new**"
          - "Gap of at most **3** months: **returning**"
          - "The three is a **choice**: state it with the result"
        takeaway: The definition lives in a comment and a number, so show it with the result.
        source: notes/06-sql-for-analytics.md
        notes: >-
          This is an excerpt of the full query in the note. The three-month rule is a choice, and exercise 1 checks how much the answer depends on it.

      - layout: image
        beat: fundamentals
        section: The revenue bridge
        title: Growth hid a 24% fall in returning revenue
        kicker: Revenue per quarter, by kind
        recall: What does the bridge say about the 2.1% rise?
        answer: "Revenue rose £27,264 (2.1%). New customers added £124,260, reactivated £55,021, and returning customers lost £152,017, a fall of 24%."
        image: ../../assets/sources/images/applied-sql-revenue-bridge.png
        caption: "Revenue per quarter split into new, returning and reactivated."
        bullets:
          - "Revenue **+£27,264** (2.1%)"
          - "New **+£124,260**, reactivated **+£55,021**"
          - "Returning **−£152,017**, **−24%**"
        takeaway: A growth figure of 2.1% contains a fall of 24% in revenue from customers who keep buying.
        source: notes/06-sql-for-analytics.md
        notes: >-
          Yearly totals new, returning, reactivated, total: 2023 464,619, 289,962, 46,215, 800,796. 2024 454,068, 638,310, 175,926, 1,268,304. 2025 578,328, 486,293, 230,947, 1,295,568.

      - layout: compare
        beat: practice
        section: Prove it adds up
        title: The bridge sums to the source, within £1
        recall: How do you prove the bridge adds up?
        answer: "Sum the bridge and compare with the source: £3,364,668 against £3,364,669, a £1 rounding difference. Reconcile every report's total before anyone reads it."
        emphasis: left
        left:
          title: The bridge
          bullets: ["Sums to **£3,364,668**", "Three kinds, every quarter"]
        right:
          title: The source
          bullets: ["**£3,364,669**", "A **£1** rounding difference"]
        takeaway: Make the reconciliation a scheduled test, so a broken join alerts someone before a slide does.
        source: notes/06-sql-for-analytics.md
        notes: >-
          A report that does not reconcile to the source is not finished. This one check would have caught the fan-out bug later in the lecture.

      - layout: table
        beat: fundamentals
        level: core
        section: Running totals and year-on-year
        title: Windows give totals and comparisons without collapsing rows
        recall: What do the window figures in the note show?
        answer: "December is down 0.4% year on year. The year-to-date total is 1,295,567 and the three-month average is 115,456. Write the frame as ROWS BETWEEN when you mean rows."
        header: [Window figure, Value]
        widths: [5, 3]
        rows:
          - [December year on year, "−0.4%"]
          - [Year to date, "1,295,567"]
          - [Three-month average, "115,456"]
        takeaway: A window sees neighbouring rows without collapsing them, but write the frame down.
        source: notes/06-sql-for-analytics.md
        notes: >-
          With ORDER BY the default frame is a range that treats ties as peers. Say ROWS BETWEEN when you mean rows.

      - layout: code
        beat: practice
        level: core
        section: Top N per group
        title: QUALIFY filters after the window
        recall: How do you keep the top N per group in DuckDB?
        answer: "Use rank() over a partition and filter it with QUALIFY, because WHERE runs before windows. PostgreSQL has no QUALIFY, so wrap the window in a subquery."
        lead: "The two top customers per year."
        lang: sql
        code: |-
          SELECT year(order_date) AS year,
                 customer_id,
                 round(sum(value)) AS spend,
                 rank() OVER (
                   PARTITION BY year(order_date)
                   ORDER BY sum(value) DESC) AS place
          FROM orders
          GROUP BY 1, 2
          QUALIFY place <= 2
          ORDER BY year, place
        bullets:
          - "`WHERE` runs **before** windows"
          - "`QUALIFY` runs **after** them"
          - "`rank()` leaves gaps, `dense_rank()` does not"
        takeaway: Choose the ranking function on purpose, and add a tie-break if you use row_number().
        source: notes/06-sql-for-analytics.md
        notes: >-
          QUALIFY is not in every database. rank() gives ties the same place, dense_rank() leaves no gap, and row_number() picks a winner arbitrarily unless the ORDER BY has a tie-breaker.

      - layout: bullets
        beat: pitfalls
        level: deep
        section: Top N per group
        title: Rankings and dialects can change the answer
        recall: What can change a top-N or window result between databases or runs?
        answer: "rank() gives ties the same place, dense_rank() leaves no gap and row_number() picks arbitrarily unless the ORDER BY has a tie-break. QUALIFY is not in every database, so PostgreSQL needs a subquery."
        bullets:
          - "`rank()` ties share a place and leave a **gap**"
          - "`dense_rank()` leaves **no gap**"
          - "`row_number()` is **arbitrary** on ties: add a tie-break"
          - "`QUALIFY` is **not** in PostgreSQL: use a subquery"
        takeaway: Name the ranking function on purpose and test it on tied data.
        source: notes/06-sql-for-analytics.md
        notes: >-
          A non-deterministic row_number() can give a different top row on each run, with no error.

      - layout: compare
        beat: fundamentals
        section: Filling gaps with a date spine
        title: Without a spine the average skips empty weeks
        recall: Why do you need a date spine before averaging?
        answer: "Missing periods vanish, so the average is taken only over periods with data. Without a spine it is 1.83 per week against a true 1.38."
        emphasis: right
        left:
          title: No spine
          bullets: ["Empty weeks vanish", "Average **1.83** a week"]
        right:
          title: With a spine
          bullets: ["Every week has a row", "True average **1.38**"]
        takeaway: Build the calendar first and join the data to it.
        source: notes/06-sql-for-analytics.md
        notes: >-
          The same applies to lag(x, 12) on a sparse table, which counts rows and not months.

      - layout: flow
        beat: fundamentals
        level: core
        section: Sessionising events
        title: A gap rule turns page views into sessions
        recall: How are events turned into sessions, and how sensitive is the count?
        answer: "Start a new session when the gap since the previous event exceeds a threshold. 29,782 page views give 5,974 sessions at the note's gap, 6,127 at 15 minutes and 5,894 at 60 minutes."
        steps:
          - {label: Order the events, sub: "by user and time", accent: "94A3B8"}
          - {label: Take the gap, sub: "lag of the timestamp", accent: "1E3A5F"}
          - {label: Flag a new session, sub: "when the gap is large", accent: "0F7490"}
          - {label: Running sum, sub: "numbers the sessions"}
        caption: "29,782 page views give 5,974 sessions. A 15-minute gap gives 6,127 and 60 minutes gives 5,894."
        takeaway: The threshold is a definition, so quote it with the session count.
        source: notes/06-sql-for-analytics.md
        notes: >-
          The count moves by only a few percent across a wide range of thresholds, which is the check that the definition is not driving the answer.

      - layout: bullets
        beat: fundamentals
        level: deep
        section: Gaps and islands
        title: 60% of repeat active months follow a gap
        recall: What do gaps and islands show about customer streaks?
        answer: "54,651 active customer-months form 43,370 streaks across 26,342 customers, so about 60% of repeat active months follow a gap. Streak lengths run 36,135, 5,046, 1,301, 490, 191, 87."
        bullets:
          - "**54,651** active customer-months"
          - "**43,370** streaks across 26,342 customers"
          - "Streak lengths 1 to 6: **36,135**, 5,046, 1,301, 490, 191, 87"
          - "About **60%** of repeat active months follow a gap"
        takeaway: Most buying comes back in bursts, so a streak metric tells you more than a monthly active count.
        source: notes/06-sql-for-analytics.md
        notes: >-
          A streak is found by subtracting a row number from the month, so that consecutive months share a constant.

      - layout: code
        beat: practice
        level: deep
        section: The funnel in one scan
        title: FILTER counts every funnel step in one pass
        recall: How does FILTER compute a funnel in one scan?
        answer: "Each step is a conditional count with FILTER in a single table scan. It reproduces the funnel chapter's 84.0 and 67.6 at the payment step and 11.65 and 5.37 conversion for desktop and mobile."
        lead: "One scan, one row per device."
        lang: sql
        code: |-
          SELECT device,
            count(*) AS sessions,
            count(*) FILTER (furthest >= 3)
              AS at_checkout,
            count(*) FILTER (furthest >= 4)
              AS reached_payment,
            round(100.0 * avg(
              (furthest = 5)::INT), 2)
              AS conversion_pct
          FROM sessions
          WHERE date >= DATE '2025-09-15'
          GROUP BY device
        bullets:
          - "Desktop: **84.0%** at the step, **11.65%** overall"
          - "Mobile: **67.6%** and **5.37%**"
        takeaway: One scan beats a subquery per step, and the numbers match the pandas version exactly.
        source: notes/06-sql-for-analytics.md
        notes: >-
          Without FILTER, sum(CASE WHEN ... THEN 1 ELSE 0 END) does the same job.

      - layout: table
        beat: pitfalls
        section: The fan-out
        title: A join fan-out overstates revenue by 8.2%
        recall: What happens when you join refunds directly to orders?
        answer: "Revenue comes out at £3,641,037 against the right £3,364,669, an overstatement of £276,368 or 8.2%. Refunds are £164,342 both ways, so a spot check on refunds would pass."
        header: [Query, Revenue, Refunds]
        widths: [4, 2.6, 2.6]
        rows:
          - ["Join directly", "£3,641,037", "£164,342"]
          - [Aggregate refunds first, "£3,364,669", "£164,342"]
        highlight: [0]
        takeaway: Aggregate the many side to the grain of the one side before you join, and reconcile to the source.
        source: notes/06-sql-for-analytics.md
        notes: >-
          The overstatement is £276,368, or 8.2%, with no error or warning. Net of refunds revenue is £3,200,327. The many side of a join is never fanned out, so the refunds total passes any spot check.

      - layout: cards
        beat: wrap
        section: Recommendation
        title: Publish the bridge, plan on the returning line
        recall: What is the SQL recommendation?
        answer: "Put the bridge in the board pack with its definition, publish the query as the single shared view, plan 2026 on the returning line rather than the total, and add the reconciliation as a scheduled test."
        cards:
          - {title: "The board line", accent: "1E3A5F", body: "Revenue **+£27,264**; returning **−£152,017**"}
          - {title: "Plan 2026", accent: "D4621A", body: "On the **returning** line, not the 2.1% total"}
          - {title: "Stop the argument", accent: "0F7490", body: "One query in version control, plus a scheduled reconciliation"}
        takeaway: Restoring returning revenue deserves the first call on next year's budget.
        source: notes/06-sql-for-analytics.md
        notes: >-
          A bridge says where revenue landed, not why. Labels depend on the gap chosen, revenue is before refunds, and the figures are synthetic.

      - layout: table
        beat: pitfalls
        section: Pitfalls
        title: SQL pitfalls and what to do instead
        recall: What are the main SQL analytics pitfalls?
        answer: "Joining before aggregating, filtering a left join in WHERE, averaging without a spine, relying on a default frame, lag over a sparse table, non-deterministic row_number, NOT IN with NULLs, assuming one dialect, interpolating values and treating an unreconciled report as finished."
        header: [Pitfall, Do instead]
        widths: [4, 5.6]
        rows:
          - [Joining before aggregating, State the grain and aggregate first]
          - [Left join filtered in WHERE, Put the condition in ON]
          - [Averaging without a spine, Build the calendar first]
          - [A default window frame, Write ROWS BETWEEN]
          - [Non-deterministic row_number, Add a unique tie-break]
          - [NOT IN over NULLs, Use NOT EXISTS]
          - [One dialect everywhere, Check the target engine]
          - [Unreconciled report, Check the total against the source]
        takeaway: Most analytics SQL bugs return a number with no error, so test the totals.
        source: notes/06-sql-for-analytics.md
        notes: >-
          Also: lag(x, 12) on a sparse table counts rows and not months, and values from a user go in as parameters and not into the string.

  - title: Rules of thumb
    agenda: false
    divider: false
    summary: What to carry away
    notes: The rules from the pillar README that this lecture touches.
    slides:
      - layout: cards
        beat: wrap
        title: Four rules for reading customers
        recall: Which rules of thumb come from this lecture?
        answer: "Split a change in any aggregate into rate and mix, a before-and-after is not an experiment, score every segmentation on a later period, and reconcile each report's total against the source."
        cards:
          - {title: "Rate and mix", accent: "1E3A5F", body: "Split a change in any aggregate into **rate and mix** before you explain it"}
          - {title: "Before and after", accent: "D4621A", body: "It is **not an experiment**: find a comparison group, or randomise"}
          - {title: "Segments", accent: "0F7490", body: "Score every segmentation on a **later period**, or it is a description"}
          - {title: "Reconcile", accent: "5B21B6", body: "Check each report's total against the **source** before anyone reads it"}
        takeaway: Four habits catch most of the mistakes in this lecture.
        source: README.md
        notes: >-
          From the pillar README. Also from this lecture: price the result, and predicting who buys is not the same as knowing who is persuadable.
