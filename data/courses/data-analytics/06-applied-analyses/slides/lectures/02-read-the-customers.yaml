          - [Hibernating, "3,848", 1%]
        highlight: [1]
        takeaway: The label At risk sounds like a save, but its 2,651 customers hold 1% of the next six months' value.
        source: notes/05-segmentation-and-rfm.md
        notes: >-
          Scores of recency, frequency and monetary value are built from before the snapshot only. The named segments are a rule on top of the scores.

      - layout: image
        beat: fundamentals
        section: Scores and named segments
        title: The segments, scored on the later six months
        kicker: Future value per head by segment
        recall: What does the RFM segments figure show?
        answer: "Champions are far above the rest on future value per head, and At risk and Hibernating are near zero."
        image: ../../assets/sources/images/applied-rfm-segments.png
