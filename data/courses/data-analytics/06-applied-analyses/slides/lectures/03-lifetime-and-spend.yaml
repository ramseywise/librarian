      - layout: image
        beat: practice
        section: Clustering into journey types
        title: Four journey shapes
        kicker: Index plot of the clusters
        recall: What does each cluster look like over time?
        answer: "A churns from month one, B by about month ten, C alternates active and lapsed, and D is mostly active throughout."
        image: ../../assets/sources/images/applied-sequence-typical.png
        caption: "Index plot of four clusters, one row per customer."
        bullets:
          - "A: **1,627** mostly gone from month one"
          - "B: **940** gone by about month ten"
          - "C: **706** alternating; D: **727** mostly active"
        takeaway: A picture of the four shapes says what a silhouette score cannot.
        source: notes/08-states-and-sequences.md
        notes: >-
          The medoid of A is NCCCCCCCCCCCCCCCCC and of D is NAAAAAAAAAAAAAAAAA.


      - layout: compare
        beat: pitfalls
        section: Description, not prediction
        title: Clustering on the outcome, then predicting it
        recall: Why must clusters not be used to value customers?
        answer: "Cluster chains give £901.14 against a truth of 513.29, and cluster D is £3,936 against a true steady value of £1,486. Clusters formed on a whole history cannot value that history."
        emphasis: right
        left:
          title: Describe
          bullets: ["Explain the four shapes", "Tell the growth team what happens"]
        right:
          title: Predict
          bullets: ["Cluster chains give **£901.14**", "Truth is **£513.29**; D is **£3,936**"]
        takeaway: Clusters formed on a whole history describe it well and value it badly.
        source: notes/08-states-and-sequences.md
        notes: >-
          The note's interview table says clusters inflated the value by about 75%. Here the ratio is about 1.76.


      - layout: cards
        beat: wrap
        section: Recommendation
        title: What to do about journeys
        recall: What does the states-and-sequences chapter recommend?
        answer: "Do not budget on the pooled chain, do not value lapsed from the pooled row (£413 against £5 to £1,259), put effort into the first month, check on a holdout, and use the shapes to explain."
        cards:
          - {title: "Not the pool", accent: 1E3A5F, body: "It is about 19% low across seeds"}
          - {title: "Lapsed is a mix", accent: D4621A, body: "£413 averages groups worth £5 and £1,259"}
          - {title: "First month", accent: 0F7490, body: "A quarter have gone by month 1"}
          - {title: "Holdout", accent: 1E3A5F, body: "Check any chain before it forecasts"}
        takeaway: Quote the mixture with its range, and check it on a holdout before it forecasts.
        source: notes/08-states-and-sequences.md
        notes: >-
          What would change it: a mixture that does no better than the pooled chain on a holdout would mean heterogeneity is not the problem.


      - layout: bullets
        beat: pitfalls
        section: Pitfalls
        title: Journey pitfalls
        recall: Which journey pitfalls end in a wrong value?
        answer: "Treating an inferred state as observed, pooling unlike customers, reading stationarity failure as real change, clustering on the outcome, trusting a low churn value, taking a silhouette as a count of types, and treating substitution costs as discovered."
        bullets:
          - "An inferred state is not an observed one"
          - "Pooling unlike customers gives too few survivors"
          - "A later table looks better because the worst have gone"
          - "A low churn rate of 0.017 against 0.02 moved value **14%**"
          - "A silhouette preferred **2** clusters; the generator has **4**"
        takeaway: Report a range, and treat every cost and state rule as a choice you made.
        source: notes/08-states-and-sequences.md
        notes: >-
          Clustering on the outcome and then predicting it gives a surprising value for the best cluster, £3,936 here.

  - title: What the marketing caused
    summary: Attribution · Experiments · Adstock · A mix model · Moving the budget
    notes: The dashboard says paid social closes about half the sales. We ask how much it caused.
