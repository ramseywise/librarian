        recall: How does marginal ROAS for paid social fall with spend?
        answer: "At £7,300 average ROAS is 1.31 and marginal is 0.71. Marginal is 1.70 at £1,000, 1.74 at £2,500, 1.12 at £5,000 and 0.27 at £13,000."
