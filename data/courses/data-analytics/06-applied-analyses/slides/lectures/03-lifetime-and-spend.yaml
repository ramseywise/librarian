        title: Why a plain regression fails
        recall: Why does OLS get the channels wrong, and what is the data budget?
        answer: "OLS gives email 0.46 and organic 2.69 against a true 2.89 and 1.59. With 157 weeks and about 31 parameters there are about 5 per parameter, against a guideline of 7 to 10."
        bullets:
