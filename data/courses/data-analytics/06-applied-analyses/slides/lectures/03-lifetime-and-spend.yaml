          - "**157** weeks, about **31** parameters"
          - "About **5** observations a parameter; guideline **7 to 10**"
          - "Spends move together: correlation **-0.72**"
        takeaway: Moving-together spends and few weeks mean the data alone cannot separate the channels.
        source: notes/09-marketing-measurement.md
        notes: >-
          The guideline is from Chan and Perry. A Bayesian model lets priors and the geo test fill the gap.


