        right:
          title: By type
          bullets: ["steady **0.975**, comeback **0.877**", "drifter **0.765**, one_and_done **0.087**"]
        takeaway: The first move and the channel say most of what is known about a second order.
        source: notes/08-states-and-sequences.md
        notes: >-
