        title: Marketing pitfalls
        recall: Which marketing-measurement pitfalls end in a wrong decision?
        answer: "Reading attribution as cause, reading Shapley as causal, using an average for a marginal decision, believing R squared, trusting library defaults, accepting the first sampler run, and using posterior means in a nonlinear formula."
        bullets:
