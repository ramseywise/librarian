      - layout: bullets
        beat: pitfalls
        section: Pitfalls
        title: Lifetime value pitfalls
        recall: What are the three lifetime-value pitfalls?
        answer: "Trusting library defaults, forgetting that a below 1 has no finite lifetime total, and reading narrow posteriors as narrow knowledge."
        bullets:
          - "Library defaults pulled p from the truth; compare with maximum likelihood"
          - "With a below 1, undiscounted orders keep growing"
          - "A narrow posterior leaves out model error, and missed the truth"
        takeaway: Set a horizon and a discount, compare with maximum likelihood, and widen the interval for model error.
        source: notes/09b-customer-lifetime-value.md
        notes: >-
          Horizon and discount choices range the value from £136 to £192 in the exercise.
