          - [C, "706", "0.999", "£483"]
          - [D, "727", "1.000", "£1,052"]
        highlight: [3]
        takeaway: Use the shapes to explain what is happening to the growth team, not to score.
        source: notes/08-states-and-sequences.md
        notes: >-
