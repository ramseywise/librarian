      - layout: table
        beat: pitfalls
        section: "Checking the chain: the Markov property and a holdout"
        title: The Markov property fails in the pool
        recall: How does the previous state change the chance of staying active?
        answer: "Pooled, the chance of staying active is 0.772, 0.521 and 0.679 by previous state. Within the steady type it is 0.857, 0.859 and 0.880."
        header: [Previous state, Stay active, Within steady]
        widths: [3.0, 2.4, 2.4]
        rows:
          - [active, "0.772", "0.857"]
          - [lapsed, "0.521", "0.859"]
          - [new, "0.679", "0.880"]
        highlight: [1]
        takeaway: The memory in a pooled chain is a mixture at work, and inside one type it disappears.
        source: notes/08-states-and-sequences.md
        notes: >-
          This is the Markov-property check. Inside a type the history stops mattering, which is what the property says.


      - layout: image
        beat: pitfalls
        section: "Checking the chain: the Markov property and a holdout"
        title: The pooled chain fails the holdout
        kicker: Fit on months 0 to 8
        recall: How does the pooled chain do on months 9 to 17?
        answer: "Alive at 17 is 0.247 observed, 0.178 pooled and 0.257 with type chains. Revenue is 126.17 observed, 94.76 pooled, 128.34 type chains."
        image: ../../assets/sources/images/applied-sequence-holdout.png
        caption: "Share not yet churned by month: observed, pooled chain and type chains."
        bullets:
          - "Alive at 17: **0.247** observed, **0.178** pooled, **0.257** types"
          - "Revenue, months 9 to 17: **126.17**, **94.76**, **128.34**"
        takeaway: Test any chain on a later period before it forecasts, because the pooled one fails visibly.
        source: notes/08-states-and-sequences.md
        notes: >-
          The pooled chain runs above observed at first, then falls below it. The type chains track the data.


      - layout: steps
        beat: practice
        level: deep
        section: "Journeys as strings: optimal matching"
        title: Optimal matching in three ideas
        recall: How does optimal matching compare two journeys?
        answer: "It counts the cheapest mix of substitutions and insertions or deletions that turns one string into another. With substitution 2 and indel 1 the hand distance is 34.0. TRATE costs run 1.39 to 1.96."
        steps:
          - {title: "Edit", n: 1, accent: 1E3A5F, text: "Substitute a state or insert or delete one, at a cost"}
          - {title: "Price", n: 2, accent: D4621A, text: "Substitution 2, indel 1 gives a hand distance of 34.0"}
          - {title: "Learn costs", n: 3, accent: 0F7490, text: "TRATE: 2 minus p(i|j) minus p(j|i), from 1.39 to 1.96"}
        takeaway: The cost table is a modelling choice, so show how the clusters change when you change it.
        source: notes/08-states-and-sequences.md
        notes: >-
          The hand version and the sequenzo library agree on 300 random pairs. There are 1,466 distinct sequences and the mean distance is 15.95.


      - layout: table
        beat: practice
