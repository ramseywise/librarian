parts:
  - title: How long customers stay
    divider: false
    summary: Censoring · Kaplan-Meier · Cox · Time-varying effects · Standardised survival
    notes: Fernhill sells a subscription box with a welcome call. We ask how long people stay, and what the call is worth.
    slides:
      - layout: statement
        beat: problem
        section: The question and the data
        title: Does the welcome call keep people subscribed?
        recall: What is the survival question, and what are its three traps?
        answer: "Fernhill wants to know if the welcome call keeps subscribers. The traps are censoring, confounding, and a price rise in mid-life."
        kicker: The problem
        statement: "Called subscribers stay longer. Did the call do it, or were they the ones who stay anyway?"
        attribution: Fernhill subscription box
        takeaway: A lifetime question has three traps before any model is fitted.
        source: notes/07-survival-and-event-history.md
        notes: >-
          Fernhill sells a subscription box and phones some new subscribers. A third of the subscriptions are still running.


      - layout: bullets
        beat: fundamentals
        section: The question and the data
        title: Three traps in one table
        recall: What are the three traps in the subscription data?
        answer: "Censoring (a third are still subscribed), confounding (the call goes mostly to channels that stay longer) and a mid-life price rise."
        bullets:
          - "**Censoring:** a third are still subscribed"
          - "**Confounding:** calls go to channels that stay longer"
          - "**Price rise:** hits subscribers mid-life"
          - "**5,061** subscriptions, **44,840** person-periods"
          - "Exits: **2,979** cancel, **401** downgrade, **1,681** still on"
        takeaway: Name the traps first, and each later model is the answer to one of them.
        source: notes/07-survival-and-event-history.md
        notes: >-
          The person-period table has one row per subscriber per month. A downgrade is a different exit from a cancel, which matters later.


      - layout: cards
        beat: fundamentals
        section: "Censoring: why the obvious average is wrong"
        title: Three averages of one lifetime
        recall: Why is the mean of the churned lifetimes wrong?
        answer: "The churned-only mean is 212.8 days and counting censored as end is 250.9, against a true mean of 401.8. The longest stayers are the ones missing."
        cards:
          - {title: "Churned only", accent: 1E3A5F, body: "**212.8** days"}
          - {title: "Censored as the end", accent: D4621A, body: "**250.9** days"}
          - {title: "True mean", accent: 0F7490, body: "**401.8** days"}
        takeaway: Never average lifetimes over those who left, because the longest stayers are the missing ones.
        source: notes/07-survival-and-event-history.md
        notes: >-
          The longest true lifetime is 10,309 days but the data stop at 1,088. Both naive averages are far below the truth.

      - layout: compare
        beat: fundamentals
        level: core
        section: "Censoring: why the obvious average is wrong"
        title: 55% or 68% alive? The honest answer is 71%
        recall: In the brain-tumour example, how does Kaplan-Meier beat both naive shares?
        answer: "Of 88 patients 53 were alive at the end. 48 of 88 is 55% and 48 of 71 is 68%. Kaplan-Meier gives 71%."
        emphasis: right
        left:
          title: Naive shares
          bullets: ["48 of 88 is **55%**", "48 of 71 is **68%**", "Both throw away the censored"]
        right:
          title: Kaplan-Meier
          bullets: ["Uses each person while at risk", "Gives **71%**"]
        takeaway: Kaplan-Meier uses a censored person for as long as they were seen, and no longer.
        source: notes/07-survival-and-event-history.md
        notes: >-
          This is the ISLP brain-tumour example. Dropping the censored cases or counting them as events both bias the share.


      - layout: table
        beat: fundamentals
        section: "Who leaves first: Kaplan-Meier by channel"
        title: Paid social leaves first
        recall: How do median lifetime and 360-day survival differ by channel?
        answer: "Paid social median 139 days and 23.4% left at 360 days. Organic 288 and 40.8%, email 350 and 48.8%, referral 286 and 40.9%."
        header: [Channel, n, Median days, Still on at 360]
        widths: [2.4, 1.4, 2.0, 2.4]
        rows:
          - [paid_social, "1,481", "139", 23.4%]
          - [organic, "1,839", "288", 40.8%]
          - [email, "1,018", "350", 48.8%]
          - [referral, "723", "286", 40.9%]
        highlight: [0]
        takeaway: The curve shows who leaves first, and paid social leaves in half the time of email.
        source: notes/07-survival-and-event-history.md
        notes: >-
          The overall Kaplan-Meier median is 255 days against a truth of 248. The restricted mean to day 1080 is 361.1 against 355.0.


      - layout: image
        beat: fundamentals
        section: "Who leaves first: Kaplan-Meier by channel"
        title: The four channel curves fan out early
        kicker: Kaplan-Meier by channel
        recall: What does the Kaplan-Meier chart show about paid social?
        answer: "Paid social falls fastest, to about 23% by day 360. Organic and referral overlap near 41%. Email is highest near 49%."
        image: ../../assets/sources/images/applied-survival-km-channel.png
        caption: "Share of each channel still subscribed, by day."
        bullets:
          - "Paid social: about **23%** at day 360"
          - "Organic and referral overlap, near **41%**"
          - "Email: highest, near **49%**"
        takeaway: Plot the curves before you model them, because the gaps already say where to look.
        source: notes/07-survival-and-event-history.md
        notes: >-
          Log-rank test across the four channels gives chi-squared 296.7 on 3 degrees of freedom, p of 5.0e-64.


      - layout: compare
        beat: fundamentals
        section: "The Cox model, and the number that hides the story"
        title: One hazard ratio, unadjusted and adjusted
        recall: What does the welcome-call hazard ratio become once channel and plan are adjusted for?
        answer: "Unadjusted 0.681, adjusted 0.811 (interval 0.753 to 0.875). Part of the raw gap was the channels."
        emphasis: right
        left:
          title: Unadjusted
          bullets: ["Hazard ratio **0.681**", "Mixes the call with the channel"]
        right:
          title: Adjusted
          bullets: ["Hazard ratio **0.811**", "Interval 0.753 to 0.875"]
        takeaway: A hazard ratio is the factor on the baseline hazard, and adjusting for channel shrinks the call's effect.
        source: notes/07-survival-and-event-history.md
        notes: >-
          The Cox model gives each covariate a factor on a shared baseline hazard, without having to specify the baseline.


      - layout: table
        beat: fundamentals
        level: core
        section: "The Cox model, and the number that hides the story"
        title: What else moves the hazard
        recall: Which covariates raise or lower the hazard, and which one fails the proportional-hazards check?
        answer: "Paid social 1.781, email 0.794, referral 0.990, large 0.760, welcome call 0.811. The check fails only for welcome_call (p below 5e-05)."
        header: [Covariate, Adjusted hazard ratio]
        widths: [3.2, 3.2]
        rows:
          - [welcome_call, "0.811"]
          - [paid_social, "1.781"]
          - [email, "0.794"]
          - [referral, "0.990"]
          - [large, "0.760"]
        highlight: [0]
        takeaway: Only the welcome call breaks the proportional-hazards check, so its single ratio hides something.
        source: notes/07-survival-and-event-history.md
        notes: >-
          A ratio near 1 means no change. Referral at 0.990 is indistinguishable from organic.


      - layout: image
        beat: pitfalls
        section: "The Cox model, and the number that hides the story"
        title: The call works for 90 days and then stops
        kicker: The number that hides the story
        recall: How does the welcome call's hazard ratio change by tenure band?
        answer: "0.535 in days 0 to 90 (0.472 to 0.606), then 1.024, 0.984 and 1.076 in the later bands."
        image: ../../assets/sources/images/applied-survival-wear-off.png
        caption: "Welcome-call hazard ratio in four tenure bands, with the single ratio of 0.81 marked."
        bullets:
          - "Days 0 to 90: **0.535**"
          - "Days 90 to 180: **1.024**"
          - "Days 180 to 360: **0.984**; 360 and over: **1.076**"
        takeaway: One hazard ratio of 0.81 averages a strong early effect and a null one later.
        source: notes/07-survival-and-event-history.md
        notes: >-
          The single ratio drifts towards 1 the longer you follow people, without anything having changed.


      - layout: code
        beat: practice
        level: deep
        section: "The Cox model, and the number that hides the story"
        title: The partial likelihood
        recall: How does the Cox partial likelihood compare each leaver with those still at risk?
        answer: "For each event, the leaver's exp(c'b) is divided by the sum of exp(c'b) over everyone at risk then, and the terms are multiplied."
        lead: "Each event is scored against the risk set at that time:"
        lang: text
        code: |-
          L(b) = product over events i of

              exp(c_i' b)
            -------------------------------
            sum over k at risk of exp(c_k' b)

          c = covariates, b = log hazard ratios
          no baseline hazard appears
        takeaway: The baseline hazard cancels, so Cox needs no assumption about the shape of survival over time.
        source: notes/07-survival-and-event-history.md
        notes: >-
          This is the formula behind the fit. Ties and the numerical routine are left to the library.


      - layout: cards
        beat: pitfalls
        level: deep
        section: "The Cox model, and the number that hides the story"
        title: The proportional-hazards check fails only for the call
        recall: Which covariate fails the proportional-hazards check, and what do the others show?
        answer: "Only welcome_call fails, with test statistics of 36.46 (km) and 39.75 (rank) and a p-value below 0.005. Email, large, paid_social and referral all pass."
        cards:
          - title: welcome_call
            accent: pitfalls
            body: "Test statistic **36.46** (km) and **39.75** (rank), p below 0.005. The check fails."
          - title: The other four
            body: "Email, large, paid_social and referral all pass, with p between 0.21 and 0.68."
          - title: So what
            accent: wrap
            body: "The call's single ratio of 0.811 hides a change over tenure, so look at the ratio by tenure band."
        takeaway: Only the welcome call breaks the check, which is why one ratio is not enough for it.
        source: notes/07-survival-and-event-history.md
        notes: >-
          The lifelines documentation warns that even very small violations show up in a large sample. Here the failure is large, so we look at the ratio over tenure.


      - layout: table
        beat: fundamentals
        section: "Time-varying covariates: the price rise and the call's wear-off"
        title: Split time at the price rise and the call's wear-off
        recall: How close does the time-varying model get to the generator's truth?
        answer: "On 10,112 episodes, five of seven intervals contain the truth. Call early 0.535 (0.6), call late 1.024 (1.0), rise 1.494 (1.5)."
        lead: The Truth column holds the ratios the generator used to simulate the data.
        header: [Covariate, Estimate, Truth]
        widths: [3.0, 1.8, 1.8]
        rows:
          - [call_early, "0.535", "0.6"]
          - [call_late, "1.024", "1.0"]
          - [rise, "1.494", "1.5"]
          - [paid_social, "1.756", "1.6"]
          - [email, "0.779", "0.7"]
          - [large, "0.757", "0.8"]
        highlight: [0, 2]
        takeaway: Split the clock at each change, and the model recovers an early effect and a price-rise effect.
        source: notes/07-survival-and-event-history.md
        notes: >-
          Referral comes out at 0.994 against 0.9. Five of seven intervals contain the truth, so two miss, and that is reported.


      - layout: table
        beat: fundamentals
        level: core
        section: A survival model is a logistic regression on person-periods
        title: A logit on person-months gives the same answer
        recall: How does a discrete-time logit compare with Cox?
        answer: "Odds ratios and hazard ratios agree closely: welcome_early 0.531 against 0.535, price_rise 1.541 against 1.494, paid_social 1.771 against 1.756."
        header: [Covariate, Logit odds ratio, Cox hazard ratio]
        widths: [3.0, 2.4, 2.4]
        rows:
          - [welcome_early, "0.531", "0.535"]
          - [welcome_late, "1.008", "1.024"]
          - [price_rise_active, "1.541", "1.494"]
          - [paid_social, "1.771", "1.756"]
          - [email, "0.781", "0.779"]
        highlight: [0]
        takeaway: With a small monthly hazard, a logistic regression on person-months is a survival model.
        source: notes/07-survival-and-event-history.md
        notes: >-
          The mean monthly cancel hazard is 0.066. Referral is 0.992 against 0.994 and large is 0.744 against 0.757.


      - layout: cards
        beat: pitfalls
        section: Competing risks
        title: Cancel and downgrade compete
        recall: Why does one minus Kaplan-Meier overstate the cancel probability?
        answer: "By day 720 the large plan has 0.620 cancel and 0.208 downgrade. Treating downgrades as censored gives a naive 0.726, too high."
        cards:
          - {title: "Large: cancel", accent: 1E3A5F, body: "**0.620** by day 720"}
          - {title: "Large: downgrade", accent: 0F7490, body: "**0.208** by day 720"}
          - {title: "Naive 1 - KM", accent: D4621A, body: "**0.726**, too high"}
        takeaway: Count each exit as its own cumulative incidence, or the exits add to more than the truth.
        source: notes/07-survival-and-event-history.md
        notes: >-
          A subscriber who downgrades can no longer cancel from the large plan. Censoring them says they might still.


      - layout: bullets
        beat: fundamentals
        level: deep
        section: The link to the sBG curve of chapter 3
        title: The sBG forecast drifts high
        recall: How does the sBG forecast fitted on months 0 to 12 compare with Kaplan-Meier later?
        answer: "Alpha 2.079 and beta 19.876. At month 24 Kaplan-Meier is 0.176 against 0.199, and at month 36 it is 0.087 against 0.121."
        bullets:
          - "Fit on months 0 to 12: alpha **2.079**, beta **19.876**"
          - "Month 12: **0.380** against **0.382**"
          - "Month 24: **0.176** against **0.199**"
          - "Month 36: **0.087** against **0.121**"
        takeaway: A curve fitted on the first year overstates survival, partly because the price rise came later.
        source: notes/07-survival-and-event-history.md
        notes: >-
          Removing the time after the rise gives 0.208 at month 24. The generator uses a Weibull with shape 0.75.
      - layout: image
        beat: practice
        section: "Standardised survival: what the call is worth"
        title: Standardised, the call lifts survival early
        kicker: Everyone called vs nobody called
        recall: What does the standardised-survival chart show about the call's gain?
        answer: "The called curve pulls ahead by about 11 points over three months, and the gap narrows to about 2 points at month 36."
        image: ../../assets/sources/images/applied-survival-standardised.png
        caption: "Survival if all were called and if none were, with the true curves dotted."
        bullets:
          - "Gap of about **11** points by month 3"
          - "Narrows to about **2** points by month 36"
          - "Dotted truth lies close to both curves"
        takeaway: Standardising answers what everyone called would do, which a hazard ratio cannot say.
        source: notes/07-survival-and-event-history.md
        notes: >-
          The crude gap at day 360 is 0.131, which is the confounded number. The adjusted one is smaller.


      - layout: cards
        beat: practice
        section: "Standardised survival: what the call is worth"
        title: The call's gain, over time
        recall: How big is the call's survival gain at months 3, 12, 24 and 36?
        answer: "0.114 at month 3, 0.059 at month 12 (0.033 to 0.083, truth 0.053), 0.033 at month 24 and 0.021 at month 36."
        cards:
          - {title: "Month 3", accent: 1E3A5F, body: "Gain of **0.114**"}
          - {title: "Month 12", accent: D4621A, body: "Gain of **0.059**, interval 0.033 to 0.083, truth 0.053"}
          - {title: "Month 24", accent: 0F7490, body: "Gain of **0.033**, interval 0.007 to 0.056, truth 0.029"}
          - {title: "Month 36", accent: 1E3A5F, body: "Gain of **0.021**"}
        takeaway: The gain peaks early and fades, so quote it at a stated month, not as one number.
        source: notes/07-survival-and-event-history.md
        notes: >-
          Box-months gained in 24 months is 1.48 (0.91 to 1.95) against a truth of 1.30. This uses the parametric g-formula.


      - layout: bullets
        beat: practice
        level: core
        section: Pricing the call and the price rise
        title: Pricing the call
        recall: What is the call worth per subscriber, and in total?
        answer: "At an assumed margin of 0.35 a box-month is worth £10.03. A call gains £14.85 (£9.09 to £19.52) against an assumed £4 cost. On 2,235 uncalled subscribers that is £24,242."
        bullets:
          - "Margin **0.35** (assumed); call cost **£4** (assumed)"
          - "Margin per box-month: **£10.03**"
          - "Gain per call: **£14.85** (£9.09 to £19.52)"
          - "**2,235** uncalled subscribers: net **£24,242**"
        takeaway: The call pays for itself several times over, if the estimate is causal.
        source: notes/07-survival-and-event-history.md
        notes: >-
          The margin and the call cost are assumptions, labelled as such. Only a randomised rollout makes the gain causal.


      - layout: compare
        beat: practice
        section: Pricing the call and the price rise
        title: The price rise lost subscribers and made money
        recall: What did the price rise do to cancels and to margin?
        answer: "Cancels giving price as the reason went from 21.4% to 44.8%, an implied hazard ratio of 1.42 (Cox 1.49). Margin per subscriber gained £16.95 at 6 months, £23.56 at 12 and £24.14 at 24."
        emphasis: right
        left:
          title: Lost
          bullets: ["Price-reason cancels **21.4%** to **44.8%**", "Implied hazard ratio **1.42**", "Cox says **1.49**"]
        right:
          title: Gained
          bullets: ["**1,582** on the books at the rise", "**£16.95** a subscriber at 6 months", "**£23.56** at 12, **£24.14** at 24"]
        takeaway: A price rise can lose subscribers and still add margin, so price the net.
        source: notes/07-survival-and-event-history.md
        notes: >-
          This compares margin with and without the rise, and does not extrapolate to a second rise.


      - layout: cards
        beat: wrap
        section: Recommendation
        title: What to do about the call
        recall: What does the survival chapter recommend?
        answer: "Extend the call as a randomised rollout, judge it on 12-month survival and box-months, do not target by channel, and do not treat the price rise as a mistake."
        cards:
          - {title: "Extend, randomised", accent: 1E3A5F, body: "Hold back a random share of new subscribers"}
          - {title: "Judge on survival", accent: D4621A, body: "12-month survival and box-months, not a hazard ratio"}
          - {title: "Do not target", accent: 0F7490, body: "Not by channel, on this evidence"}
          - {title: "Keep the rise", accent: 1E3A5F, body: "It lost subscribers and made money"}
        takeaway: Roll out the call at random, and change the plan if the gain falls below about 0.4 box-months.
        source: notes/07-survival-and-event-history.md
        notes: >-
          What would change it: a randomised gain below about 0.4 box-months, where the assumed £4 stops paying at £10.03 a box-month.


      - layout: bullets
        beat: pitfalls
        section: Pitfalls
        title: Survival pitfalls
        recall: Which survival pitfalls end in a wrong number?
        answer: "Averaging over the leavers, assuming censoring is harmless, counting the future as the present, quoting one hazard ratio that moves, reading a p-value as a size, censoring competing events, and reading a hazard ratio as a share saved."
        bullets:
          - "Averaging over those who left"
          - "Counting the future as the present: split time at the change"
          - "One hazard ratio when it moves: report bands or curves"
          - "Censoring competing events without saying so"
          - "A ratio of **0.53** for 3 months is about **6** points at a year"
          - "An adjusted estimate is not an experiment"
        takeaway: Convert a hazard ratio to survival before you price it, and say what was censored.
        source: notes/07-survival-and-event-history.md
        notes: >-
          The remaining pitfalls are assuming censoring is harmless and reading a check_assumptions p-value as a size.

  - title: Journeys and states
    summary: States · Transition matrix · Markov CLV · Optimal matching · Journey types
    notes: Fernhill's pooled chain values a new customer at £431 against a true £513. We find out why.
    slides:

      - layout: statement
        beat: problem
        section: The question and the data
        title: Why did the chain value a customer at £431?
        recall: What goes wrong with the pooled Markov chain?
        answer: "It values a new customer at £431 against a true £513, because it pools customers of unlike kinds."
        kicker: The problem
        statement: "The pooled chain says £431 for a new customer. The truth is £513."
        attribution: Fernhill customers, 18 months
        takeaway: A pooled chain can be wrong in a way that looks fine on the page.
        source: notes/08-states-and-sequences.md
        notes: >-
          The chapter asks what a customer is worth when we follow them through states, and what the pooling hides.


      - layout: bullets
        beat: fundamentals
        section: The question and the data
        title: Four states over eighteen months
        recall: What are the states and the size of the data?
        answer: "New, active, lapsed and churned. 72,000 rows, 4,000 customers, 18 months. The commonest string is NCCCCCCCCCCCCCCCCC, 978 customers."
        bullets:
          - "**72,000** rows, **4,000** customers, **18** months"
          - "States: new, active, lapsed, churned"
          - "Counts: **4,000**, **17,436**, **11,145**, **39,419**"
          - "Commonest string: **N** then 17 months of **C**, 978 customers"
        takeaway: Each customer becomes a string of states, one letter a month.
        source: notes/08-states-and-sequences.md
        notes: >-
          Most customers are churned most of the time, as the state counts show.


      - layout: compare
        beat: pitfalls
        section: States from an order log
        title: An order log has no state called churned
        recall: What happens when churn is defined as four silent months?
        answer: "Of 12,201 customers ever called churned, 2,684 (22.0%) ordered again. Transition new to lapsed is 0.849 there, against 0.312 in the journeys table."
        emphasis: right
        left:
          title: A rule you chose
          bullets: ["Four silent months means churned", "12,201 customers ever called churned"]
        right:
          title: What happens
          bullets: ["**2,684** (22.0%) ordered again", "New to lapsed is **0.849**, against **0.312**"]
        takeaway: Churn in an order log is your rule, so test how the result moves when you change it.
        source: notes/08-states-and-sequences.md
        notes: >-
          The order log has 12,633 customers. A real churned row should have no moves out, and here it does.


      - layout: table
        beat: fundamentals
        section: The transition matrix
        title: The pooled transition matrix
        recall: How do customers move between states in one month?
        answer: "Active stays active 0.707, goes lapsed 0.257 and churned 0.036. Lapsed returns to active 0.351. Churned is absorbing."
        header: [From, new, active, lapsed, churned]
        widths: [2.0, 1.6, 1.6, 1.6, 1.8]
        rows:
          - [new, "0.0", "0.444", "0.312", "0.244"]
          - [active, "0.0", "0.707", "0.257", "0.036"]
          - [lapsed, "0.0", "0.351", "0.516", "0.132"]
          - [churned, "0", "0", "0", "1"]
        highlight: [1]
        takeaway: "Read a transition matrix by rows: each row is where a customer in that state goes next."
        source: notes/08-states-and-sequences.md
        notes: >-
          Every row sums to one. No one returns to new, and churned is absorbing.


      - layout: code
        beat: practice
        level: deep
        section: Absorbing states and time to churn
        title: Months to churn from the fundamental matrix
        recall: How is time to churn computed from the transition matrix?
        answer: "Take Q, the moves among non-absorbing states. N is the inverse of I minus Q, and the row sums are the expected months to churn."
        lead: "The drunkard's walk, on Fernhill's states:"
        lang: text
        code: |-
          Q = moves among new, active, lapsed
          N = (I - Q)^-1
          t = N times a column of ones

          t = (3, 4, 3)    drunkard's walk check

          pooled chain, months to churn
          new 11.31  active 14.42  lapsed 12.54
          truth for a new customer: 13.91
        takeaway: The fundamental matrix gives expected months to churn, and the pooled chain misses the truth for a new customer.
        source: notes/08-states-and-sequences.md
        notes: >-
          The small drunkard's walk example, with t of 3, 4 and 3, checks the code before it is used on the chain.


      - layout: code
        beat: practice
        section: Markov CLV, and what the pooled chain gets wrong
        title: Markov customer lifetime value
        recall: What is the Markov CLV formula, and what does the pooled chain give?
        answer: "V is the inverse of I minus P over one plus d, times R. The pooled values are new 430.73, active 580.02 and lapsed 412.61, against a true 513.29 for a new customer."
        lead: "Discount the chain and add up revenue:"
        lang: text
        code: |-
          V = (I - P / (1 + d))^-1 R

          P = transition matrix
          d = monthly discount rate
          R = revenue by state

          pooled value (£)
          new 430.73  active 580.02
          lapsed 412.61
          true new customer: 513.29
        takeaway: One matrix inverse values every state, but the pooled one is low by about a fifth.
        source: notes/08-states-and-sequences.md
        notes: >-
          Across 12 seeds the truth averages 515.0 and the pooled chain 415.8, about 19% low.


      - layout: table
        beat: pitfalls
        section: Markov CLV, and what the pooled chain gets wrong
        title: Four customer types, one pooled chain
        recall: How do the four types differ in share and value?
        answer: "Steady 23.9% worth 1,688.9 (true 1,485.9), drifter 27.4% worth 233.1, one-and-done 31.6% worth 54.2, comeback 17.0% worth 443.1."
        header: [Type, Share, Estimated, True]
        widths: [2.6, 1.6, 2.0, 1.8]
        rows:
          - [steady, "0.239", "1688.9", "1485.9"]
          - [drifter, "0.274", "233.1", "230.3"]
          - [one_and_done, "0.316", "54.2", "53.35"]
          - [comeback, "0.170", "443.1", "458.2"]
        highlight: [0]
        takeaway: A customer worth £1,486 and one worth £53 sit in the same pooled row.
        source: notes/08-states-and-sequences.md
        notes: >-
          The mixture of type chains gives 560.28, with a 95% interval of 521 to 595 against 411 to 451 for the pooled chain.


      - layout: compare
        beat: practice
        section: Which journeys lead to a second order
        title: Who comes back for a second order
        recall: How does the second-order rate vary by channel and by type?
        answer: "Overall 0.620; the pooled chain says 0.670. By channel: paid social 0.404, organic 0.673, email 0.808, referral 0.660. By type: steady 0.975, drifter 0.765, one_and_done 0.087, comeback 0.877."
        emphasis: right
        left:
          title: By channel
