      - layout: cards
        beat: fundamentals
        section: Writing a definition two analysts agree on
        title: Five choices hide inside every definition
        recall: What five choices make two analysts disagree about one metric?
        answer: "The population and when it is final, the window, the clock, the unit, and the owner and version."
        cards:
          - {title: Population, accent: "1E3A5F", body: "Who counts, and when are they final? Repeat rate ever is 46.5% against 24.4%"}
          - {title: Window, accent: "0F7490", body: "Active customers are 1,881 (30 days), 4,820 (90) or 13,825 (365)"}
          - {title: Clock, accent: "D4621A", body: "November revenue is £117,454 by order date and £113,299 by delivery"}
          - {title: Unit, accent: "5B21B6", body: "Conversion is 7.52% per session and 14.20% per visitor"}
          - {title: Owner and version, accent: "94A3B8", body: "REPEAT_90 v1.0 has an owner, a version and a rule for when it is final"}
        takeaway: Write all five down, because any one can shift a number by more than the effect you are measuring.
        source: notes/11-metric-trees.md
        notes: >-
          The 90-day repeat rate has 30.4% for everyone against 18.1%, and 30.4% for final customers against 20.2% (7,923 of
          10,503). December joiners show 4.6% of 854, which is right-censoring.

