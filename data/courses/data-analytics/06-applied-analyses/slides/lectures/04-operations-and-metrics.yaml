      - layout: flow
        beat: pitfalls
        section: How a proxy goes wrong
        title: Goodhart's law has four variants
        recall: What are the four variants of Goodhart's law?
        answer: "Regressional, extremal, causal and adversarial (Manheim and Garrabrant, a preprint)."
        steps:
          - {label: Regressional, sub: "picking on the metric picks noise", accent: "94A3B8"}
          - {label: Extremal, sub: "the link breaks at the extreme", accent: "1E3A5F"}
          - {label: Causal, sub: "pushing the proxy does not move the goal", accent: "0F7490"}
          - {label: Adversarial, sub: "people game it", accent: "D4621A"}
        caption: "Any metric that becomes a target will meet at least one of these."
        takeaway: Name which variant a proxy is exposed to, and pair it with a counter-metric that would catch it.
        source: notes/11-metric-trees.md
        notes: >-
          Manheim and Garrabrant is a preprint, so treat the taxonomy as a useful framing, not settled science.

