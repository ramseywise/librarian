      - layout: code
        beat: practice
        level: deep
        section: Writing a definition two analysts agree on
        title: A metric as a frozen dataclass
        recall: What does a MetricSpec record?
        answer: "Name, version, question, population, numerator, denominator, clock, window, how many days before a customer is final, and an owner."
        lang: python
        code: |-
          @dataclass(frozen=True)
          class MetricSpec:
              name: str
              version: str
              question: str
              population: str
              numerator: str
              denominator: str
              clock: str
              window_days: int
              final_after_days: int
              owner: str
        bullets:
          - "**frozen** makes a changed definition a new version"
          - "`repeat_90d` returns **None** if nobody is final"
        takeaway: A definition written as code can be versioned, reviewed and refused when its inputs are not final.
        source: notes/11-metric-trees.md
        notes: >-
          REPEAT_90 v1.0 gives 30.4% in 2024 and 20.2% in 2025. A semantic layer such as dbt can enforce the definition, but
          deciding it is still a human job.

      - layout: steps
        beat: practice
        level: core
        section: Using the tree to diagnose
        title: Walk down the tree to find where it moved
        recall: How do you use the tree to diagnose a fall in revenue?
        answer: "Attribute the change across the identity leaves, find the leaf that moved, and then read the dashed edges under it as hypotheses to test."
        steps:
          - {title: Attribute the change, text: "Split the move across active, per customer and per order"}
          - {title: Find the leaf that moved, text: "Usually one leaf carries most of the change"}
          - {title: Read the dashed edges below it, text: "They are hypotheses, not findings"}
          - {title: Test the likeliest, text: "An experiment or another design before action", n: "★", accent: "D4621A"}
        takeaway: The tree says where to look, and a test says what to do.
        source: notes/11-metric-trees.md
        notes: >-
          Orders per customer fell from 1.22 to 1.12 in the month window. The January 2025 email budget cut is confirmed by
          the retail.py generator, which is synthetic.

