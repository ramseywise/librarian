      - layout: compare
        beat: fundamentals
        section: Guardrails and counter-metrics
        title: A guardrail is global, a counter-metric is paired
        recall: What is the difference between a guardrail and a counter-metric?
        answer: "A guardrail is a global must-not-break such as delivery speed and applies to every change. A counter-metric is paired with one target and names how that target could be hit badly."
        emphasis: right
        left:
          title: Guardrail
          bullets: ["A global **must-not-break**", "Delivery speed, refunds, page load", "A breach stops the work"]
        right:
          title: Counter-metric
          bullets: ["Paired with **one target**", "Asks how a lazy team would hit it", "Cost per repeater against new customers"]
        takeaway: There is no primary source for the distinction, so treat it as the working one this course uses.
        source: notes/11-metric-trees.md
        notes: >-
          The test of a counter-metric is whether it would have moved. In an experiment, a guardrail needs a non-inferiority
          test of its own.

