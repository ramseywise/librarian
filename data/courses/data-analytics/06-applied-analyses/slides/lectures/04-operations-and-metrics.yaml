  - title: Metrics - a tree to look through
    summary: Revenue identity · Two kinds of edge · North star · Guardrails · Goodhart · Definitions · Diagnosis
    notes: We move from operations to the scoreboard, and build a metric tree whose edges are labelled as identities or claims.
    slides:
      - layout: statement
        beat: problem
        section: The question and the data
        title: Revenue is up 2.1%, and nobody is happy
        recall: Why is a revenue line not enough for Fernhill's scoreboard?
        answer: "Revenue rose 2.1% while marketing spend rose 66.4% and revenue less marketing fell 17.1%, so the headline hides a worse business."
        kicker: The problem
        statement: "Revenue grew. Marketing spend grew faster. The scoreboard has to say which of the two the business is doing."
        takeaway: A single revenue line cannot say what to change, so build a tree that can.
        source: notes/11-metric-trees.md
        notes: >-
          The data is 63,958 orders from 26,342 customers over 2023 to 2025. The question is what the top of the scoreboard
          should be.

      - layout: compare
        beat: fundamentals
        section: A tree has two kinds of edge
        title: A tree has two kinds of edge
        recall: What is the difference between a solid and a dashed edge?
        answer: "A solid edge is an identity you can check with an assert and that attributes a change exactly. A dashed edge is a causal claim that needs an experiment before anyone acts on it."
        emphasis: right
        left:
          title: Solid edge
          bullets: ["An **identity**", "Check it with an assert", "Attributes a change exactly"]
        right:
          title: Dashed edge
          bullets: ["A **causal claim**", "Needs an experiment first", "The tree only tells you where to look"]
        takeaway: Draw the two differently, because identities are read as arithmetic and claims are read as hypotheses.
        source: notes/11-metric-trees.md
        notes: >-
          Revenue is active customers times orders per customer times value per order whatever the business does. The belief
          that a reminder email raises orders per customer is a hypothesis, and it can be false while the identity holds.

      - layout: code
        beat: practice
        level: core
        section: A tree has two kinds of edge
        title: The identity runs as an assert
        recall: What does the assert on the revenue tree protect against?
        answer: "If the leaves stop multiplying back to the ledger, someone has changed a definition."
        lang: python
        code: |-
          def tree(frame):
              active = frame.customer_id.nunique()
              n_orders = len(frame)
              revenue = frame.value.sum()
              return pd.Series({
                  "revenue": revenue, "active": active,
                  "per_customer": n_orders / active,
                  "per_order": revenue / n_orders})

          years["rebuilt"] = (years.active * years.per_customer
                              * years.per_order)
          assert np.allclose(years.revenue, years.rebuilt)
        bullets:
          - "Three leaves multiply to the ledger"
          - "A failed assert means a **definition** changed"
        takeaway: An assert on the identity turns a silent definition change into a failing check.
        source: notes/11-metric-trees.md
        notes: >-
          The two side boxes in the tree, the counter-metric and the guardrail, have no edges because they constrain the tree
          without feeding it.

      - layout: table
        beat: fundamentals
        section: A tree has two kinds of edge
        title: 2025 revenue is three numbers multiplied
        recall: What are the three factors of 2025 revenue?
        answer: "£1,295,567 is 13,825 active customers times 1.79 orders per customer times £52.27 per order."
        header: [Year, Revenue, Active, Orders per customer, Per order]
        widths: [1.6, 2.4, 1.8, 2.2, 1.8]
        rows:
          - ["2023", "£800,797", "7,940", "1.91", "£52.83"]
          - ["2024", "£1,268,304", "10,324", "2.33", "£52.82"]
          - ["2025", "£1,295,567", "13,825", "1.79", "£52.27"]
        highlight: [2]
        takeaway: Active customers rose, orders per customer fell, and the value of an order barely moved.
        source: notes/11-metric-trees.md
        notes: >-
