      - layout: table
        beat: pitfalls
        section: Pitfalls
        title: Six metric-tree pitfalls
        recall: Name two ways a metric tree can mislead.
        answer: "A tree of only identities that nobody can act on, and reading a dashed edge as solid, such as getting email opens up to feed repeat purchase."
        header: [Pitfall, Do instead]
        widths: [4, 5.6]
        rows:
          - ["A tree of only identities", "Draw and test the dashed edges"]
          - ["Reading a dashed edge as solid", "Say which edges have been tested"]
          - ["A counter-metric from the same step", "Pair it with a later step: cost per repeater moved 36%, cost per new 4%"]
          - ["Comparing across a definition change", "Version the definition and restate history"]
          - ["A trailing window mixed with a calendar period", "State which: two 2024 revenues sit £3,321 apart"]
          - ["Unreconciled tables in an identity", "Keep the web log beside the tree, not under the ledger"]
        takeaway: Most scoreboard failures are a definition that quietly changed or an edge that was never tested.
        source: notes/11-metric-trees.md
        notes: >-
          The note lists nine pitfalls. The remaining three are a north star that restates revenue, reporting an immature
          cohort as a fall, and too many metrics with one owner.
