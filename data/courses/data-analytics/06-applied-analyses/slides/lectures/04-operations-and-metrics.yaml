      - layout: code
        beat: practice
        level: deep
        section: A shift plan as a linear programme
        title: The LP in pulp
        recall: What are the variables and constraints of the shift plan?
        answer: "One permanent variable, one agency variable per day, a cost of five wage-days per permanent plus the premium per agency day, and a need constraint per day."
        lang: python
        code: |-
          model = pulp.LpProblem("shifts", pulp.LpMinimize)
          permanent = model.add_variable("permanent", lowBound=0)
          agency = {}
          for d in WEEKDAYS:
              agency[d] = model.add_variable(f"agency_{d}", lowBound=0)
          extra = [premium * wage_day * agency[d] for d in WEEKDAYS]
          model += 5 * wage_day * permanent + pulp.lpSum(extra)
          for d in WEEKDAYS:
              model += permanent + agency[d] >= need[d], d
        bullets:
          - "Integer or continuous: **cat=kind** in the full function"
          - "Shadow prices come from the constraints' **pi**"
        takeaway: The whole model is one cost line and one constraint per day, which is why it solves instantly.
        source: notes/10b-packers-queues-and-a-shift-plan.md
        notes: >-
          pulp 4.2.0 needs numpy installed, CBC comes with pulp[cbc] and COIN_CMD, and LpVariable with lowBound raises a
          TypeError, so the note uses add_variable.

