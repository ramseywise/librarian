parts:
  - title: Stock - what to order and what to keep
    divider: false
    summary: Newsvendor · Order size (EOQ) · Safety stock · Does the buffer deliver
    notes: We start with the stock decisions, one season's order, how much to order at a time and how much to hold in reserve, and check each against the truth.
    slides:
      - layout: statement
        beat: problem
        section: The question and the data
        title: How much do we order, and how much do we keep?
        recall: What stock question does Fernhill's operations manager face?
        answer: "How much of each line to order for a season, how much to order at a time, and how much to hold in reserve, for 12 products, three of them sold only before Christmas."
        kicker: The problem
        statement: "Order too much and the stock sits unsold. Order too little and a customer goes elsewhere. The two mistakes do not cost the same."
        takeaway: The cost of being short and the cost of being over are different numbers, and the order should reflect that.
        source: notes/10-operations-and-supply-chain.md
        notes: >-
          The data is 12 products, three of them Christmas-only (sold in the eight weeks before Christmas), 20 supplier
          orders per product, and a packing line observed over 13 weeks. Everything is synthetic and seeded.

      - layout: cards
        beat: fundamentals
        section: The question and the data
        title: Three stock decisions, three tools
        recall: Which three stock decisions does the chapter separate, and what tool does each use?
        answer: "One season's order (the newsvendor), how much to order at a time (EOQ) and how much to keep in reserve (safety stock)."
        cards:
          - {title: One season's order, accent: "1E3A5F", body: "The newsvendor: a single order for a season that cannot be repeated"}
          - {title: How much at a time, accent: "0F7490", body: "EOQ: balance the cost of placing an order against the cost of holding stock"}
          - {title: How much in reserve, accent: "D4621A", body: "Safety stock: a buffer for demand and lead time that vary"}
        takeaway: Each decision has its own cost trade-off, so each gets its own formula.
        source: notes/10-operations-and-supply-chain.md
        notes: >-
          The three are usually taught together because they use the same data. They answer different questions, and mixing
          them up is the commonest way to size stock wrongly.

      - layout: flow
        beat: fundamentals
        level: core
        section: "One season's order: the newsvendor"
        title: The newsvendor weighs two costs
        recall: How is the newsvendor's target fractile worked out?
        answer: "Underage is price minus cost, overage is cost minus salvage, and the fractile is underage divided by underage plus overage. Here that is about 0.73, near 0.727 for TEX-03."
        steps:
          - {label: Underage, sub: "price minus cost", accent: "D4621A"}
          - {label: Overage, sub: "cost minus salvage", accent: "94A3B8"}
          - {label: Fractile, sub: "underage over the sum", accent: "1E3A5F"}
          - {label: Order that quantile, sub: "of the demand forecast", accent: "0F7490"}
        caption: "Here the fractile is about 0.73: order above the forecast mean, not at it."
        takeaway: When a missed sale costs more than a leftover, the right order sits above the mean.
        source: notes/10-operations-and-supply-chain.md
        notes: >-
          The mean is the right order only when the two costs are equal. Salvage value is what an unsold unit fetches after
          the season.

      - layout: code
        beat: practice
        level: core
        section: "One season's order: the newsvendor"
        title: The fractile and the profit in code
        recall: How do you score an order quantity against demand?
        answer: "Units sold are the smaller of the order and demand. Profit is sales at price plus leftovers at salvage minus the cost of everything ordered."
        lang: python
        code: |-
          def profit(q, d, p):
              sold = np.minimum(q, d)
              return (p.unit_price * sold
                      + p.salvage_value * (q - sold)
                      - p.unit_cost * q).mean()
        bullets:
          - "**sold** is capped by both the order and the demand"
          - "Leftovers earn **salvage**, not price"
          - "Average over demand draws to compare orders"
        takeaway: Score every ordering rule with the same profit function over the same demand draws.
        source: notes/10-operations-and-supply-chain.md
        notes: >-
          The note also has season_forecast and critical_fractile. The profit function is what lets us compare the forecast
          order, the ratio route and the fractile against the true demand.

      - layout: image
        beat: fundamentals
        section: "One season's order: the newsvendor"
        title: Profit by ordering rule, against the truth
        kicker: Three Christmas lines
        recall: Which ordering rule earned the most across the three Christmas lines?
        answer: "The fractile rule earned £49,177 against £48,191 for ordering the forecast, with £49,827 as the best possible (truth)."
        image: ../../assets/sources/images/applied-newsvendor-profit.png
        caption: "Profit across the three Christmas-only lines under each ordering rule."
        takeaway: Ordering the fractile closes most of the gap between the forecast and the best possible order.
        source: notes/10-operations-and-supply-chain.md
        notes: >-
          The fractile is about 2% over the forecast order in total. Individual lines behave very differently, which the
          next two slides show.

      - layout: cards
        beat: fundamentals
        section: "One season's order: the newsvendor"
        title: Total profit across the three lines
        recall: How much profit does each ordering route earn across the three lines?
        answer: "Forecast £48,191, ratio route £48,914, fractile £49,177 and truth £49,827."
        cards:
          - {title: Order the forecast, accent: "94A3B8", body: "£48,191, the furthest from the truth"}
          - {title: Ratio route, accent: "0F7490", body: "£48,914, in between"}
          - {title: Fractile of the forecast, accent: "D4621A", body: "£49,177, the closest"}
          - {title: Truth, accent: "1E3A5F", body: "£49,827, the ceiling"}
        takeaway: Each step towards the cost-based quantile earns more, and the fractile gets within about £650 of the truth.
        source: notes/10-operations-and-supply-chain.md
        notes: >-
          The truth row uses the generator's own demand distribution, so it is not available in practice. It marks what a
          perfect forecast of the distribution would earn.

      - layout: compare
        beat: pitfalls
        section: "One season's order: the newsvendor"
        title: Two lines, two different failures
        recall: Why did TEX-03 lose money and LGT-03 fall short of the best?
        answer: "TEX-03's forecast error spread was 218 against a true 144, so the order was too cautious. LGT-03's forecast mean of 854 sat well below the true 960, so it stocked out 59% of the time against a 26% target."
        emphasis: right
        left:
          title: TEX-03
          bullets: ["Forecast 1,164 against a true mean of 1,120", "Error sd **218** against a true 144", "Stockout 11% against a 27% target", "Loses **£139**"]
        right:
          title: LGT-03
          bullets: ["Forecast 854 against a true 960", "Stockout **59%** against a 26% target", "Gain £860, but **£471** short of the best"]
        takeaway: A quantile of a poor forecast is a precise-looking poor order, so the forecast error matters more than the rule.
        source: notes/10-operations-and-supply-chain.md
        notes: >-
          The rule did what it should in both cases. The inputs were wrong, in different ways: one spread too wide, one mean
          too low.

      - layout: bullets
        beat: fundamentals
        level: core
        section: "One season's order: the newsvendor"
        title: One season is not a verdict on the rule
        recall: Does the fractile rule beat ordering the forecast on average?
        answer: "Over seeds 100 to 111 the average gain was 1.70% and positive on 11 of 12. The real 2025 season is £161 up across the three lines."
        bullets:
          - "Seeds 100 to 111: average gain **1.70%**"
          - "Positive in **11 of 12** seeds"
          - "The real 2025 season: **£161** up across the three lines"
        takeaway: Judge an ordering rule over many seasons, because one draw can go either way.
        source: notes/10-operations-and-supply-chain.md
        notes: >-
          Judge the rule over many seeds, not over the one real season.

      - layout: flow
        beat: fundamentals
        level: core
        section: "How much to order at a time: EOQ"
        title: EOQ balances ordering cost against holding cost
        recall: What is the EOQ formula?
        answer: "The square root of two times annual units times the cost per order, divided by the holding cost per unit."
        steps:
          - {label: Annual units, sub: "yearly demand", accent: "1E3A5F"}
          - {label: Order cost, sub: "per order placed", accent: "D4621A"}
          - {label: Holding cost, sub: "per unit a year", accent: "94A3B8"}
          - {label: EOQ, sub: "root of 2 × units × order ÷ holding", accent: "0F7490"}
        caption: "Today's order is assumed to be eight weeks of 2025 demand."
        takeaway: Order often enough that the extra order cost matches the saved holding cost, and no more often than that.
        source: notes/10-operations-and-supply-chain.md
        notes: >-
          The eight-week rule is the baseline Fernhill uses today. EOQ is compared against it product by product.

      - layout: table
        beat: fundamentals
        section: "How much to order at a time: EOQ"
        title: Missing the EOQ costs less than you fear
        recall: How much more does ordering off the EOQ cost?
        answer: "Ordering 25% over costs 2.5% more, and ordering 50% over costs 8.3% more. Ordering half the EOQ costs 25% more."
        header: [Multiple of EOQ, Cost against the best]
        widths: [4.6, 5.0]
        rows:
          - ["0.5", "1.25"]
          - ["0.75", "1.042"]
          - ["1.25", "1.025"]
          - ["1.5", "1.083"]
          - ["2", "1.25"]
        highlight: [2]
        takeaway: The cost curve is flat near the best, so a roughly right order size is nearly as good as the exact one.
        source: notes/10-operations-and-supply-chain.md
        notes: >-
          This is why EOQ only matters where today's order is far from it. A product whose order is within a quarter of the
          EOQ gains almost nothing.

      - layout: bullets
        beat: fundamentals
        section: "How much to order at a time: EOQ"
        title: EOQ saves 8.4%, and nothing on furniture
        recall: What does EOQ save over today's eight-week order, and where?
        answer: "8.4%, or £907 a year, with the total cycle cost falling from £10,767 to £9,860. It saves nothing on furniture, where eight weeks is already near the EOQ."
        bullets:
          - "Total cycle cost: **£10,767** to **£9,860**"
          - "A saving of **8.4%**, or £907 a year"
          - "Gains come on kitchen and textiles"
          - "**Nothing** on furniture"
        takeaway: Move to EOQ only where today's order is far from it, which here is kitchen and textiles.
        source: notes/10-operations-and-supply-chain.md
        notes: >-
          About £900 a year is small against the stock decisions that follow, which is a useful sense of scale before anyone
          builds an inventory system around it.

      - layout: flow
        beat: fundamentals
        level: core
        section: "How much to keep in reserve: safety stock"
        title: Safety stock covers demand noise and lead-time noise
        recall: What goes into the safety stock formula?
        answer: "A z-score for the service level times the square root of lead time times weekly demand variance plus weekly mean squared times lead-time variance."
        steps:
          - {label: Service level, sub: "gives z", accent: "94A3B8"}
          - {label: Demand noise, sub: "lead time × weekly variance", accent: "1E3A5F"}
          - {label: Lead-time noise, sub: "weekly mean² × lead variance", accent: "D4621A"}
          - {label: Buffer, sub: "z × the root of the sum", accent: "0F7490"}
        caption: "34.4% of the buffer here is lead-time noise, which a demand-only formula drops."
        takeaway: A late delivery empties the shelf as surely as high demand, so the buffer has two sources of variance.
        source: notes/10-operations-and-supply-chain.md
        notes: >-
          FUR-03's lead-time sd was 0.9 weeks from 20 orders against about 1.8 true, so a small count of orders can halve the
          estimate of its noise.

      - layout: code
        beat: practice
        level: deep
        section: "How much to keep in reserve: safety stock"
        title: Safety stock in one line
        recall: How is the safety stock computed in code?
        answer: "The normal quantile of the service level times the square root of lead weeks times weekly variance plus weekly mean squared times lead-time variance in weeks squared."
        lang: python
        code: |-
          def safety_stock(level, weekly_mean, weekly_var,
                           lead_weeks, lead_sd_weeks):
              return norm.ppf(level) * (
                  lead_weeks * weekly_var
                  + weekly_mean**2 * lead_sd_weeks**2
              ) ** .5
        bullets:
          - "**norm.ppf** turns a service level into z"
          - "Set **lead_sd_weeks** to 0 and you get the demand-only version"
        takeaway: Pass the lead-time standard deviation in, and the buffer stops ignoring late deliveries.
        source: notes/10-operations-and-supply-chain.md
        notes: >-
          The note loops this over the staple products at each service level. Only FUR-03's row is printed in the note.

      - layout: table
        beat: fundamentals
        section: "How much to keep in reserve: safety stock"
        title: Each extra point of service costs more
        recall: What does each service level cost a year in held stock?
        answer: "80% costs £2,476, 90% £3,770, 95% £4,839, 98% £6,042 and 99% £6,844. Going from 95% to 99% adds £2,005 a year."
        header: [Service level, Cost a year]
        widths: [4.6, 5.0]
        rows:
          - ["80%", "£2,476"]
          - ["90%", "£3,770"]
          - ["95%", "£4,839"]
          - ["98%", "£6,042"]
          - ["99%", "£6,844"]
        highlight: [2]
        takeaway: The buffer's cost curve steepens, so the service level is a price to agree and not a number to maximise.
        source: notes/10-operations-and-supply-chain.md
        notes: >-
          The step from 95% to 99% costs £2,005 a year for four points of service. Whether that is worth it is a business
          decision.

      - layout: image
        beat: practice
        section: "How much to keep in reserve: safety stock"
        title: Does the buffer deliver what it promises?
        kicker: Cycle service by period
        recall: How does the buffer's delivered service compare with its 95% promise?
        answer: "Off-season it delivers 94.8% against 95%. In season it falls to 79.4%, because demand runs about 60% higher."
        image: ../../assets/sources/images/applied-safety-stock-service.png
        caption: "Simulated service level against the target, off-season and in season."
        bullets:
          - "Off-season cycle service **94.8%** against 95%"
          - "In season **79.4%** (81.4% in the ladder's draw)"
          - "Demand runs **60% higher** in season"
        takeaway: A reorder point built on a year-round mean keeps the promise off-season and breaks it in season.
        source: notes/10-operations-and-supply-chain.md
        notes: >-
          The buffer is sized from a year-round demand mean. In season demand is far higher, so the same buffer covers less
          of the lead time.

      - layout: table
        beat: pitfalls
        section: "How much to keep in reserve: safety stock"
        title: The same weeks, three service numbers
        recall: How do the delivered service numbers differ by period and measure?
        answer: "Cycle service is 94.8% off-season, 79.4% in season and 91.4% over the whole year. Fill rate is 94.7% in season. A 99% target lifts in-season service only to 89%."
        header: [Measure, Value]
        widths: [5.6, 4.0]
        rows:
          - ["Cycle service, off-season", "94.8%"]
          - ["Cycle service, in season", "79.4%"]
          - ["Cycle service, all year", "91.4%"]
          - ["Fill rate, in season", "94.7%"]
          - ["Cycle service in season at a 99% target", "89%"]
        highlight: [1]
        takeaway: Cycle service and fill rate describe the same weeks differently, so say which one a target means.
        source: notes/10-operations-and-supply-chain.md
        notes: >-
          An all-year figure of 91.4% hides a season at 79%. Raising z to 99% only reaches 89% in season, so splitting the
          reorder point by season is the cheaper fix.

      - layout: compare
        beat: practice
        section: "How much to keep in reserve: safety stock"
        title: Fix the season, not the service level
        recall: What is the cheaper fix for in-season stockouts?
        answer: "A seasonal reorder point lifts in-season service from 80.0% to 94.7% for about £374 a year, against over £2,000 a year by raising z."
        emphasis: left
        left:
          title: Split by season
          bullets: ["In-season service **80.0%** to **94.7%**", "About **£374** a year"]
        right:
          title: Raise z for the whole year
          bullets: ["Costs over **£2,000** a year", "Holds the extra stock off-season too"]
        takeaway: Match the buffer to the season that fails, and the cost is a fraction of a blanket increase.
        source: notes/10-operations-and-supply-chain.md
        notes: >-
          This is the second try-it in the note. The seasonal reorder point uses in-season demand for the in-season months only.

      - layout: bullets
        beat: wrap
        section: Recommendation
        title: What to do with the stock
        recall: What four stock recommendations does the note make?
        answer: "Order Christmas lines at the fractile near 73%, move kitchen and textiles to EOQ for about £900 a year, set the reorder point by season, and treat 95% as a decision since 99% costs about £2,000 more."
        bullets:
          - "Christmas lines: order the **fractile**, near 73%"
          - "Staples: **EOQ** on kitchen and textiles, about £900 a year"
          - "Set the reorder point **by season**"
          - "Treat **95%** as a decision: 99% costs about £2,000 more"
        takeaway: Spend more effort on the forecast than on the rule, because on LGT-03 forecast error cost more than the rule earned.
        source: notes/10-operations-and-supply-chain.md
        notes: >-
          These are simulated tables and real demand will not match. A better forecast error than these two seasons gave
          would change the stock recommendations. The packer recommendations are in the next note.

      - layout: table
        beat: pitfalls
        section: Pitfalls
        title: Five stock pitfalls
        recall: Name two ways a stock rule can quietly go wrong.
        answer: "Ordering the point forecast (stockouts of 37% to 80% against about 27%), and a year-round mean in a seasonal reorder point (healthy annual service, December stockouts)."
        header: [Pitfall, Do instead]
        widths: [4, 5.6]
        rows:
          - ["Ordering the point forecast", "Order the cost-based fractile; stockouts ran 37% to 80% against about 27%"]
          - ["Trusting the forecast's own error", "Check the spread and the mean; TEX-03 was 50% too wide, LGT-03 11% too low"]
          - ["A year-round mean in a seasonal reorder point", "Split service by period"]
          - ["Cycle service and fill rate as one thing", "Say which; here 79% and 95% describe the same weeks"]
          - ["Dropping lead-time variance", "Keep it; it is a third of the buffer and 20 orders can halve it"]
        takeaway: Most stock failures come from a precise rule fed a rough input.
        source: notes/10-operations-and-supply-chain.md
        notes: >-
          Each row is a symptom the note observed in the simulation, so each can be checked on your own data.

  - title: Queues - packers on a Monday
    summary: Little's law · Erlang C · A day that starts empty · Price a packer · Shift plan
    notes: We move from stock to people, measure the packing line, check it against queueing theory, and turn the answer into a shift plan.
    slides:
      - layout: statement
        beat: problem
        section: The packing line, and Little's law
        title: Monday is busiest, but it is not the longest wait
        recall: Which weekday has the longest packing wait at Fernhill?
        answer: "Wednesday, at 4.35 minutes. Its four packers run as hot as Monday's six, and a smaller crew pools less."
        kicker: The problem
        statement: "A queue the textbook says waits 3.9 minutes does not wait 3.9 minutes when the shift starts with nobody in it."
        takeaway: Look at the wait and the utilisation before proposing a fix for the busiest day.
        source: notes/10b-packers-queues-and-a-shift-plan.md
        notes: >-
          The packing line has 22,566 parcels over 65 days. Each weekday has its own arrival rate and crew, and the question
          is how many packers to roster.

      - layout: table
        beat: fundamentals
        section: The packing line, and Little's law
        title: The line by weekday
        recall: What are the mean wait, utilisation and crew by weekday?
        answer: "Monday 2.909 minutes (6 packers, ρ 0.849), Tuesday 1.171, Wednesday 4.348 (4 packers, ρ 0.838), Thursday 1.984 and Friday 1.957."
        header: [Weekday, Packers, ρ, Mean wait, Erlang C]
        widths: [2.4, 1.6, 1.6, 2.0, 2.0]
        rows:
          - [Monday, "6", "0.849", "2.909", "3.894"]
          - [Tuesday, "5", "0.720", "1.171", "1.623"]
          - [Wednesday, "4", "0.838", "4.348", "4.933"]
          - [Thursday, "4", "0.784", "1.984", "3.489"]
          - [Friday, "4", "0.725", "1.957", "1.893"]
        highlight: [2]
        takeaway: Wednesday's four packers run about as hot as Monday's six, so Wednesday waits longest.
        source: notes/10b-packers-queues-and-a-shift-plan.md
        notes: >-
          Utilisation, ρ, is arrivals divided by what the crew can pack in an hour. The service rate is 12 parcels an hour per
          packer. Waits are in minutes.

      - layout: flow
        beat: fundamentals
        level: core
        section: The packing line, and Little's law
        title: Little's law is a check on the log
        recall: What does Little's law say, and what does it check here?
        answer: "L = λW: the average number in the system equals the arrival rate times the average time in it. It held to 8.88e-16 over 65 days, so the timestamps are sound."
        steps:
          - {label: L, sub: "average number waiting", accent: "1E3A5F"}
          - {label: λ, sub: "arrivals per minute", accent: "94A3B8"}
          - {label: W, sub: "average time in the system", accent: "D4621A"}
          - {label: L = λW, sub: "gap 8.88e-16 over 65 days", accent: "0F7490"}
        caption: "Walk the floor every 30 minutes and count: Monday's implied wait is 2.86 against 2.91 recorded."
        takeaway: If a real log failed Little's law, the timestamps would be wrong, and you would know before modelling.
        source: notes/10b-packers-queues-and-a-shift-plan.md
        notes: >-
          The law needs stationary arrivals and finite means and no particular distribution. Our days start empty and run
          until the line clears, so nothing straddles the ends and it holds to rounding error.

      - layout: image
        beat: fundamentals
        section: Erlang C, and a day that starts empty
        title: A day that starts empty waits less at first
        kicker: Mean wait by arrival hour
        recall: Why does a shift sit below the Erlang C wait?
        answer: "It starts empty. The first hour waits under half as long, and the line only reaches Erlang's level by mid-afternoon."
        image: ../../assets/sources/images/applied-packing-wait-by-hour.png
        caption: "Monday with six packers and Wednesday with four, from 3,000 simulated days each."
        bullets:
          - "Both start low at 08:00: about **1.7** and **2.3** minutes"
          - "Climb steeply for two hours"
          - "Level near the dashed Erlang lines of **3.9** and **4.9**"
        takeaway: Erlang C describes the afternoon, not the day.
        source: notes/10b-packers-queues-and-a-shift-plan.md
        notes: >-
          Erlang C is the steady-state wait of an M/M/c queue: c servers, Poisson arrivals and exponential service. A shift
          starts empty, arrivals stop at 16:00 and packers work until the line clears.

      - layout: code
        beat: practice
        level: deep
        section: Erlang C, and a day that starts empty
        title: Simulating the day the generator runs
        recall: How does the simulation model a day?
        answer: "A Poisson count of parcels, uniform arrival times, exponential service and first come first served on c packers, starting empty at 08:00, repeated 2,000 times."
        lang: python
        code: |-
          free = [0.0] * packers
          heapq.heapify(free)
          w = np.zeros(n)
          for i in range(n):
              soonest = heapq.heappop(free)
              begin = max(times[i], soonest)
              w[i] = begin - times[i]
              heapq.heappush(free, begin + minutes[i])
        bullets:
          - "A **heap** of times each packer becomes free"
          - "A parcel starts when it arrives or when the **soonest** packer is free"
        takeaway: A heap of free times is all a first-come-first-served multi-packer queue needs.
        source: notes/10b-packers-queues-and-a-shift-plan.md
        notes: >-
          The full function also records the overrun past 16:00 and each day's mean wait. The loop is the core.

