  - title: Weight of evidence and fitting
    divider: false
    summary: Which loans to approve · WoE and IV · Signs · Gini and KS
    notes: We step out of Fernhill. A bank has to decide today, on a form, about a loan whose outcome arrives years later.
    slides:
      - layout: statement
        beat: problem
        section: The question and the data
        title: Which applications should the bank approve?
        recall: What are the two halves of the credit question?
        answer: "A modelling half (how to rank applicants) and a policy half (where to draw the line), plus how much capital the resulting book requires."
        kicker: Credit scoring
        statement: "Which applications should the bank approve, and how much capital does the resulting book require?"
        takeaway: The ranking is half the job, and the line you draw and the capital behind it are the other half.
        source: notes/02-credit-scoring.md
        notes: >-
          A loan is an unusual product, because you find out whether the sale was good years after making it. The analyst
          answers to a credit committee that asks what the policy costs and to a regulator that asks about capital.

      - layout: cards
        beat: pitfalls
        section: The question and the data
        title: Three facts about the data change the analysis
        recall: Which three facts about South German Credit change the analysis?
        answer: "Bad loans were oversampled (30% in the sample against about 5% in reality), all the loans were approved so repayment is seen only for people who passed the checks, and the credit amount is scrambled by an unknown monotonic transformation."
        cards:
          - {title: Oversampled bads, accent: "D4621A", body: "30% bad in the file, about 5% in the real book. Probabilities are wrong by a known amount"}
          - {title: Approved loans only, accent: "1E3A5F", body: "Repayment is seen only for people who passed. Reject inference cannot recover the rest"}
          - {title: Scrambled amount, accent: "0F7490", body: "Its order means something, and its absolute values do not"}
        takeaway: Read the dataset's documentation first, because three of its facts decide what the model can claim.
        source: notes/02-credit-scoring.md
        notes: >-
          The data is 1,000 consumer loans from 1973 to 1975 by a regional bank in southern Germany. Groemping showed the
          widely circulated Statlog code table was wrong for several variables and published a corrected version. We check
          against a published cross-tabulation before doing anything else.

      - layout: code
        beat: practice
        level: practice
        section: The question and the data
        title: Check the target against a published table
        recall: How do we confirm the target is read the right way round?
        answer: "Cross-tabulate the checking-account status against the target and compare with Table 1 of Groemping (2019): no account is 45.00% of bad and 19.86% of good, and it matched."
        lang: python
        code: |-
          raw["bad"] = 1 - raw.pop("good")
          print(raw.shape, "bad rate", raw.bad.mean())
          # Table 1 of Groemping (2019): "no checking account"
          # is 45.00% of bad and 19.86% of good.
          print((pd.crosstab(raw.status, raw.bad,
                 normalize="columns") * 100).round(2).head(1))
          # (1000, 21) bad rate 0.3
          # status 1:  19.86 (good)  45.0 (bad)
        bullets:
          - "**1,000** loans, bad rate **0.3**"
          - "**45.0%** and **19.86%** match the report"
          - "Her text codes 0 as good, but the file has 700 ones"
        takeaway: A famous dataset can be wrong, so validate it against its documentation before you model it.
        source: notes/02-credit-scoring.md
        notes: >-
          The report is inconsistent on one point: its text gives the target coding as 0 for good, whereas the file has 700
          ones, and her R code labels 1 as good.

      - layout: flow
        beat: fundamentals
        section: Weight of evidence
        title: Weight of evidence turns every class into one currency
        recall: What is weight of evidence, and why use it?
        answer: "WoE(class) = ln(share of goods in the class / share of bads in the class). Positive means safer than average. Each class gets its own effect, so no variable needs special care, and it is the log likelihood ratio that Bayes' rule adds to the prior log odds."
        steps:
          - {label: Split into classes, sub: "a characteristic", accent: "94A3B8"}
          - {label: Share of goods, sub: "over share of bads", accent: "1E3A5F"}
          - {label: Take the log, sub: "positive means safer", accent: "0F7490"}
          - {label: Feed a logistic model, sub: "coefficients near 1"}
        caption: "Each new value is a known transformation of the raw value, so you can read the model and defend it."
        takeaway: WoE is the log of the likelihood ratio, so a model on WoE terms reads as Bayes' rule.
        source: notes/02-credit-scoring.md
        notes: >-
          Why go to this trouble rather than feed the codes to a model? A non-linear or unordered variable needs no more care
          than a linear one, the new values are readable, and coefficients are near 1 when the characteristics are independent.

      - layout: code
        beat: fundamentals
        level: deep
        section: Weight of evidence
        title: The two formulas
        recall: What are the formulas for weight of evidence and information value?
        answer: "WoE(class) = ln(share of goods / share of bads). IV = the sum over classes of (share of goods minus share of bads) times WoE(class)."
        lang: text
        code: |-
          WoE(class)  = ln( share of goods in class
                            / share of bads in class )

          IV          = sum over classes of
                        (share of goods - share of bads)
                        * WoE(class)
        takeaway: IV sums the class evidence into one measure of how well a characteristic separates goods from bads.
        source: notes/02-credit-scoring.md
        notes: >-
          IV weights each class's WoE by how much of the population it holds, which is why a rare class with an extreme WoE
          does not dominate.

      - layout: table
        beat: fundamentals
        section: Weight of evidence
        title: Read information value as a convention
        recall: How is information value usually read, and where do the bands come from?
        answer: "Under 0.02 not predictive, 0.02 to 0.1 weak, 0.1 to 0.3 medium, above 0.3 strong. They trace to Siddiqi's book, reported second-hand, and are conventions, not theorems."
        header: [IV, Reading]
        widths: [3, 5]
        rows:
          - ["Below 0.02", Not predictive]
          - ["0.02 to 0.1", Weak]
          - ["0.1 to 0.3", Medium]
          - ["Above 0.3", Strong]
        takeaway: The IV bands are conventions, so use them to shortlist characteristics and not to prove anything.
        source: notes/02-credit-scoring.md
        notes: >-
          The bands trace to Siddiqi's book, which we report second-hand through a conference paper citing it. On the
          training set the checking account status scores 0.641, credit history 0.289, and telephone 0.000.

      - layout: code
        beat: practice
        level: deep
        section: Weight of evidence
        title: Classes are learned on the training set only
        recall: How are the classes and their WoE learned without leaking?
        answer: "Quintiles for continuous variables, levels under 5% pooled into one class, and half a count added to each cell so an empty class cannot give an infinite weight. Fit on training data only, so the procedure can be repeated inside cross-validation."
        lang: python
        code: |-
          def fit_bins(x, y):
              if x.name in CONTINUOUS:
                  edges = np.unique(np.quantile(
                      x, [0, .2, .4, .6, .8, 1]))
                  classes = pd.cut(x, edges)
              else:
                  share = x.value_counts(normalize=True)
                  rare = share[share < .05].index
                  classes = x.where(~x.isin(rare), -1)
              # 0.5 added to each cell: no infinite weight
              table["woe"] = np.log(table.pct_good
                                    / table.pct_bad)
              iv = ((table.pct_good - table.pct_bad)
                    * table.woe).sum()
        takeaway: Binning learned from the target is part of the model, so it belongs inside the training fold.
        source: notes/02-credit-scoring.md
        notes: >-
          In real scorecard work an analyst would adjust the classes by hand to make business sense. Here the rule is
          automatic so that it can be repeated in every fold.

      - layout: image
        beat: practice
        section: Weight of evidence
        title: The checking account carries most of the signal
        kicker: Four checking-account classes
        recall: What does the WoE of the checking-account classes show?
        answer: "WoE runs from minus 0.80 for no account through minus 0.38 and 0.50 to plus 1.17 for the highest balance or salary account, in a sensible order. That order is the first thing to check."
        image: ../../assets/sources/images/applied-credit-woe-status.png
        caption: "Training set. Status of the checking account has an IV of 0.641."
        bullets:
          - "Classes run in a **sensible order**"
          - "WoE from **-0.80** to **+1.17**"
          - "IV **0.641**, the strongest of 17 candidates"
        takeaway: Check first that the classes run in a sensible order, and then let the numbers speak.
        source: notes/02-credit-scoring.md
        notes: >-
          The four classes hold 98.5 goods and 94.5 bads for no account, 121.5 and 76.5, 36.5 and 9.5, and 235.5 and 31.5
          for the highest balance or salary account.

      - layout: bullets
        beat: pitfalls
        section: Weight of evidence
        title: Three characteristics are never considered
        recall: Which characteristics are left out, and why is removing a column not enough?
        answer: "Sex and marital status, age and foreign-worker status. It is a decision and not a statistical finding, because lending law restricts them. Removing a column does not remove its proxies, such as housing or job, so test outcomes across groups."
        bullets:
          - "Left out: **sex and marital status, age, foreign-worker status**"
          - "A **decision**, and not a statistical finding"
          - "In the US, **Regulation B** bars discrimination on these grounds, with carve-outs for age"
          - "Housing or job may carry part of the same signal"
          - "A real deployment tests **outcomes across groups**"
        takeaway: Dropping a protected column is not the same as being fair, and the check is outcomes across groups.
        source: notes/02-credit-scoring.md
        notes: >-
          What the law says depends on the country, so take legal advice for your jurisdiction.

      - layout: compare
        beat: pitfalls
        section: Fit, and check the signs
        title: A wrong-sign coefficient cannot go on a card
        recall: What is the sign check, and what did it catch?
        answer: "The target is bad and a higher WoE is safer, so every coefficient should be negative. Job came out positive, so with an IV of only 0.027 it was dropped."
        emphasis: right
        left:
          title: What should happen
          bullets: ["Target is **bad**", "Higher WoE means **safer**", "Every coefficient **negative**"]
        right:
          title: What job did
          bullets: ["Coefficient came out **positive**", "IV only **0.027**: doing little", "Dropped"]
        takeaway: Check the sign of every coefficient, because a wrong sign is usually collinearity and cannot go on a card.
        source: notes/02-credit-scoring.md
        notes: >-
          Thirteen of 17 candidates pass IV of 0.02. After dropping job there are twelve, with intercept -0.871.

      - layout: code
        beat: practice
        level: deep
        section: Fit, and check the signs
        title: Gini and KS in code
        recall: How are Gini and KS defined?
        answer: "Gini is 2 times AUC minus 1, known to risk teams as the accuracy ratio. KS is the largest vertical distance between the cumulative score distributions of goods and bads. Both measure ranking and not the level of the probability."
        lang: python
        code: |-
          def gini(y, p):
              return 2 * roc_auc_score(y, p) - 1

          def ks(y, p):
              order = np.argsort(p)
              y = np.asarray(y)[order]
              return np.abs(np.cumsum(y) / y.sum()
                            - np.cumsum(1 - y)
                            / (1 - y).sum()).max()
          # train Gini 0.678, KS 0.548
          # test  Gini 0.480, KS 0.411
        takeaway: Both measures rank applicants and neither cares about the level of the probability, which matters shortly.
        source: notes/02-credit-scoring.md
        notes: >-
          The test Gini of 0.480 has a bootstrap interval of 0.355 to 0.600 on 300 rows.

      - layout: image
        beat: practice
        section: Fit, and check the signs
        title: KS is the widest gap between the goods and the bads
        kicker: Cumulative scores, test set
        recall: What do the train and test figures say about the model?
        answer: "The Gini falls from 0.678 on train to 0.480 on test, a large gap and an honest warning about 700 rows. The bootstrap interval on test is 0.355 to 0.600, so one split is one draw."
        image: ../../assets/sources/images/applied-credit-ks.png
        caption: "Test set. The largest gap is 0.41."
        bullets:
          - "Train Gini **0.678**, test **0.480**"
          - "Test interval **0.355 to 0.600**"
          - "A single split is one draw, so compare models by repeated cross-validation"
        takeaway: The Gini falls from 0.678 to 0.480 on unseen rows, and an interval is more honest than a single number.
        source: notes/02-credit-scoring.md
        notes: >-
          The picture shows the cumulative score distributions of goods and bads, with the largest gap marked.

      - layout: table
        beat: practice
        section: Fit, and check the signs
        title: Three models cannot be told apart on this data
        recall: How did the WoE scorecard compare with gradient boosting?
        answer: "Over 5-fold cross-validation repeated 4 times, Gini was 0.561 for the WoE logistic, 0.550 for raw codes and 0.570 for gradient boosting. Fold standard deviations are about 0.06, so the scorecard gives up nothing measurable."
        header: [Model, Mean Gini, SD of 20 folds]
        widths: [4, 2.4, 2.8]
        rows:
          - [WoE logistic, "0.561", "0.068"]
          - [Raw codes logistic, "0.550", "0.059"]
          - [Gradient boosting, "0.570", "0.066"]
        takeaway: The scorecard gives up nothing measurable to boosting on this data, and it can be printed on one page.
        source: notes/02-credit-scoring.md
        notes: >-
          This is one small dataset, so it is not a general result about boosting. With millions of rows and bureau-level
          features, tree ensembles often do win, and the choice becomes a real trade-off with explainability.

  - title: The prior and the policy
    summary: Prior correction · Points · Cutoff · Costs
    notes: The largest error in the chapter has nothing to do with the choice of model.
    slides:
      - layout: statement
        beat: problem
        section: "The error that matters: the sample is not the population"
        title: The model says 27% default and the book runs at 5%
        recall: What is the largest error in the credit analysis?
        answer: "Using probabilities calibrated on an oversampled file. The model's mean PD is about 27% against a real book near 5%, so decisions would be about a population that does not exist."
        kicker: The error that matters
        statement: "Our model says the mean PD is about 27%. The real book runs at about 5%."
        attribution: A reviewer who looks only at Gini and KS will never see it
        takeaway: Compare the mean predicted PD with the known population bad rate, since Gini and KS cannot see this error.
        source: notes/02-credit-scoring.md
        notes: >-
          If we use these probabilities to make decisions, we are making decisions about a population that does not exist.

      - layout: flow
        beat: fundamentals
        section: "The error that matters: the sample is not the population"
        title: Replace one prior with the other
        recall: How is the PD corrected for the oversampling?
        answer: "Posterior odds are prior odds times the likelihood ratio. Oversampling changes the prior and leaves the likelihood ratio alone, so replace one prior with the other, a constant shift in log odds."
        steps:
          - {label: Posterior odds, sub: "prior odds times the likelihood ratio", accent: "94A3B8"}
          - {label: Oversampling, sub: "changes the prior only", accent: "D4621A"}
          - {label: Swap the priors, sub: "a constant in log odds", accent: "1E3A5F"}
          - {label: Shift is -2.097, sub: "ranking unchanged"}
        caption: "A constant added to every log odds preserves the order, so the Gini cannot move."
        takeaway: Fix the prior with one constant shift in log odds, since the likelihood ratio is untouched.
        source: notes/02-credit-scoring.md
        notes: >-
          The shift is ln(0.05/0.95) minus ln(0.30/0.70), which is -2.097.

      - layout: code
        beat: practice
        level: deep
        section: "The error that matters: the sample is not the population"
        title: The correction and the weights
        recall: How is the prior correction coded, and why weight the test set?
        answer: "Add the shift to the logit and map back. To evaluate the test set as if it were the population, each good must count for more than each bad, with weights true/sample for bads and (1 minus true)/(1 minus sample) for goods."
        lang: python
        code: |-
          sample_bad, true_bad = raw.bad.mean(), .05
          shift = (np.log(true_bad / (1 - true_bad))
                   - np.log(sample_bad / (1 - sample_bad)))

          def pd_true(frame):
              p = pd_sample(frame)
              logit = np.log(p / (1 - p)) + shift
              return 1 / (1 + np.exp(-logit))

          w_test = np.where(
              y_test == 1, true_bad / sample_bad,
              (1 - true_bad) / (1 - sample_bad))
        takeaway: The weighting undoes the stratified sample, so each good stands for more goods than each bad does.
        source: notes/02-credit-scoring.md
        notes: >-
          The corrected mean of 4.7% is close to 5%.

      - layout: compare
        beat: practice
        section: "The error that matters: the sample is not the population"
        title: The mean PD moves and the Gini does not
        recall: What happened to the PD and the Gini after the correction?
        answer: "Mean PD went from 0.265 to 0.047 (population weighted), and the Gini stayed exactly at 0.480, because adding a constant to every log odds preserves the order."
        emphasis: left
        left:
          title: Before correction
          bullets: ["Mean PD **0.265**", "Gini **0.480**"]
        right:
          title: After correction
          bullets: ["Mean PD **0.047**", "Gini **0.480**, unchanged"]
        takeaway: The Gini has not moved at all, which is exactly why it cannot see the error.
        source: notes/02-credit-scoring.md
        notes: >-
          A reviewer who looks only at Gini and KS will never see this error, and it affects every decision made on the
          probability.

      - layout: steps
        beat: fundamentals
        section: From probability to points
        title: Building the scorecard scale
        recall: How is a score built from the log odds?
        answer: "Pick a score for reference odds and the points that double the odds (PDO). Here 600 means 30 to 1 and every 20 points doubles the odds, giving factor 28.85 and offset 501.86, with score = offset + factor times the log of the good:bad odds."
        steps:
          - {title: Choose the reference, text: "600 points means 30 to 1"}
          - {title: Choose PDO, text: "Every 20 points doubles the odds"}
          - {title: Factor, text: "PDO / ln 2 = 28.85"}
          - {title: Offset, text: "600 - factor x ln 30 = 501.86"}
          - {title: Spread across characteristics, text: "The score is the sum of one line from each table", n: "★", accent: "D4621A"}
        takeaway: A score is an affine function of the log odds, split into one line of points per characteristic.
        source: notes/02-credit-scoring.md
        notes: >-
          points = -(coefficient x WoE + intercept / n) x factor + offset / n, where n is the number of characteristics.

      - layout: code
        beat: practice
        level: deep
        section: From probability to points
        title: Points per class in code
        recall: How are the points for a class computed?
        answer: "points = -(coefficient times WoE plus alpha divided by n) times factor plus offset divided by n, where alpha is the intercept plus the prior shift."
        lang: python
        code: |-
          PDO, BASE_SCORE, BASE_ODDS = 20, 600, 30
          factor = PDO / np.log(2)
          offset = BASE_SCORE - factor * np.log(BASE_ODDS)

          n = len(features)
          alpha = model.intercept_[0] + shift
          t = bins["status"]["table"]
          points = (-(coef["status"] * t.woe + alpha / n)
                    * factor + offset / n)
          # factor 28.85, offset 501.86
        takeaway: The intercept and the prior shift are spread evenly across the characteristics.
        source: notes/02-credit-scoring.md
        notes: >-
          The first test applicant has a PD of 0.014 and a score of 625.

      - layout: table
        beat: practice
        section: From probability to points
        title: The status line is clean and the duration line is not
        recall: Why does the duration line fail the sense check?
        answer: "A loan of 24 to 30 months scores 50 and one of 15 to 24 months scores 43, saying a longer loan is safer than a shorter one. It is almost certainly noise from automatic quintiles on 700 rows, so merge classes until the points run in order."
        header: [Status class, Points, Duration class, Points]
        widths: [2, 1.6, 3.2, 1.6]
        rows:
          - ["1", "30", "up to 12 months", "64"]
          - ["2", "40", "12 to 15", "66"]
          - ["3", "61", "15 to 24", "43"]
          - ["4", "77", "24 to 30", "50"]
          - ["", "", "over 30", "30"]
        highlight: [2, 3]
        takeaway: Merge classes until the points run in order, and then check the Gini does not suffer.
        source: notes/02-credit-scoring.md
        notes: >-
          Status runs 30, 40, 61, 77, as it should. In a production card an analyst would merge duration classes by hand.

      - layout: bullets
        beat: fundamentals
        section: Set the policy
        title: A cost ratio of 5 to 1 gives a cutoff of 1 in 6
        recall: How is the approval cutoff derived from the costs?
        answer: "Accept while the expected loss from accepting is below the expected loss from rejecting: PD times 5 less than (1 minus PD) times 1, so PD is below 1/6. That applies only to a calibrated PD, which is where the prior correction pays off."
        bullets:
          - "Accepting a bad loan costs **5**, and rejecting a good one costs **1**"
          - "Accept while **PD x 5 < (1 - PD) x 1**, so **PD < 1/6**"
          - "In score terms: odds of 5 to 1 is **548 points**"
          - "It holds only for a **calibrated** PD"
        takeaway: The cutoff comes from the costs and a calibrated PD, so ask the business for the cost ratio first.
        source: notes/02-credit-scoring.md
        notes: >-
          Groemping's report repeats the long-standing suggestion that accepting a bad loan costs five times as much as
          rejecting a good one. The score at a PD of 1/6 is 501.86 + 28.85 x ln 5, which is 548.

      - layout: table
        beat: practice
        section: Set the policy
        title: Four policies, priced on the population
        recall: What did each of the four policies cost per application?
        answer: "Approve everyone costs 0.250, the sample PD with a 1/6 cutoff costs 0.444 and approves 58.3%, the true-prior PD with 1/6 costs 0.245 and approves 92.8%, and reject everyone costs 0.950."
        header: [Policy, Approved, Cost per application]
        widths: [5.2, 1.8, 2.4]
        rows:
          - [Approve everyone, "100.0%", "0.250"]
          - ["Sample PD, cutoff 1/6 (prior ignored)", "58.3%", "0.444"]
          - ["True-prior PD, cutoff 1/6", "92.8%", "0.245"]
          - [Reject everyone, "0.0%", "0.950"]
        highlight: [1, 2]
        takeaway: The uncorrected model costs 0.444, worse than approving everyone at 0.250.
        source: notes/02-credit-scoring.md
        notes: >-
          All the ranking work in the world could not have rescued the first version.

      - layout: image
        beat: practice
        section: Set the policy
        title: Ignoring the prior rejects 42% of applicants
        kicker: Test set, 5% bad rate, 5:1 costs
        recall: What does the cost curve show about the corrected and uncorrected cutoffs?
        answer: "The true-prior cutoff approves 93% of applicants at cost 0.245. Ignoring the prior approves only 58% (rejecting 42%) at cost 0.444. The curve minimum of 0.218 was found on the test set, so do not quote it."
        image: ../../assets/sources/images/applied-credit-cost-curve.png
        caption: "Expected cost per application against share approved."
        bullets:
          - "True prior: **93%** approved, cost **0.245**"
          - "Prior ignored: **58%** approved, cost **0.444**"
          - "Minimum **0.218** was found on test, so it is not quotable"
        takeaway: Taking the cutoff that looked best on test turns the test set into a tuning set.
        source: notes/02-credit-scoring.md
        notes: >-
          The uncorrected model rejects 42% of the applicants.

      - layout: compare
        beat: pitfalls
        section: Set the policy
        title: At 5 to 1 the scorecard barely beats approving everyone
        recall: When is a scorecard worth having, according to the cost ratio?
        answer: "At a 5% bad rate and 5:1 the scorecard improves on approving everyone by only 2%. At 10:1 the comparison is 0.403 against 0.500, a saving of 19%. The cost ratio is the first number to ask the business for."
        emphasis: right
        left:
          title: Costs 5 to 1
          bullets: ["Approve everyone **0.250**", "Scorecard **0.245**", "Saves about **2%**"]
        right:
          title: Costs 10 to 1
          bullets: ["Approve everyone **0.500**", "Scorecard **0.403**", "Saves **19%**"]
        takeaway: A scorecard earns its keep when bads are expensive or common, so ask for the cost ratio first.
        source: notes/02-credit-scoring.md
        notes: >-
          A cut-off decides who gets declined, and the cost table does not say who those people are. The data science
          chapter on reading the errors reads them on a larger credit book.

  - title: Basel, monitoring and recommendation
    summary: PD, LGD, EAD · IRB capital · PSI · Recommendation
    notes: PD feeds a second decision, the capital the bank must hold, and the model has to be watched after it ships.
    slides:
      - layout: table
        beat: fundamentals
        section: The Basel vocabulary
        title: The words an analyst in a bank needs
        recall: What are PD, LGD, EAD, expected loss, K and RWA?
        answer: "PD is the probability of default over a year, LGD the share lost, EAD the amount owed. Expected loss is PD x LGD x EAD. Unexpected loss is covered by capital, K is capital per unit of exposure and RWA is K x 12.5 x EAD, where 12.5 is the reciprocal of 8%."
        header: [Term, Meaning]
        widths: [2.4, 7.2]
        rows:
          - [PD, Probability of default over one year]
          - [LGD, "Loss given default, the share of the exposure lost"]
          - [EAD, "Exposure at default, the amount owed at that point"]
          - [Expected loss, "PD x LGD x EAD, covered by pricing and provisions"]
          - [Unexpected loss, "The loss in a bad year above expected, covered by capital"]
          - [K and RWA, "K per unit of exposure, and RWA = K x 12.5 x EAD"]
          - [F-IRB and A-IRB, "Bank supplies PD (foundation), or LGD and EAD too (advanced)"]
        takeaway: Expected loss goes into pricing and provisions, and capital covers the unexpected part above it.
        source: notes/02-credit-scoring.md
        notes: >-
          Under the Basel internal ratings-based approach, PD feeds the capital requirement.

      - layout: flow
        beat: fundamentals
        level: practice
        section: The Basel vocabulary
        title: IRB capital covers a one-in-a-thousand-year loss
        recall: What does the IRB capital formula compute?
        answer: "A one-factor model treats all borrowers as exposed to one systematic factor with correlation R. It computes the default rate in a very bad state at the 99.9th percentile, and capital covers that loss minus the expected loss."
        steps:
          - {label: One systematic factor, sub: "correlation R", accent: "94A3B8"}
          - {label: A very bad state, sub: "the 99.9th percentile", accent: "D4621A"}
          - {label: Default rate there, sub: "loss in that state", accent: "1E3A5F"}
          - {label: Subtract expected loss, sub: "capital covers the rest"}
        caption: "Retail has no maturity adjustment, and R falls from 0.16 to 0.03 as PD rises. Floors: PD 0.05%, and LGD 30% for unsecured retail."
        takeaway: Capital covers the loss in a very bad year above the expected loss, not the expected loss itself.
        source: notes/02-credit-scoring.md
        notes: >-
          The reasoning is in the Basel Committee's 2005 explanatory note. The current rules are in the Basel Framework
          chapters CRE31 and CRE32, in force since January 2023.

      - layout: table
        beat: practice
        level: practice
        section: The Basel vocabulary
        title: Twenty times the expected loss, 2.3 times the capital
        recall: Why does capital grow so much more slowly than expected loss as PD rises?
        answer: "From a PD of 0.5% to 10%, expected loss rises 20 times and capital only 2.3 times. The loss above expected shrinks as a high PD moves more of the risk into the expected part, and R falls as PD rises. The 60% LGD and 5,000 exposure are assumptions."
        header: [PD, Expected loss, K, Capital, RWA]
        widths: [1.6, 2.2, 1.6, 2, 2]
        rows:
          - ["0.5%", "15", "3.45%", "173", "2157"]
          - ["1.0%", "30", "4.88%", "244", "3052"]
          - ["3.0%", "90", "6.70%", "335", "4186"]
          - ["10.0%", "300", "8.06%", "403", "5036"]
        takeaway: Price has to carry the expected loss, and capital handles what is left, and this scorecard is not a capital model.
        source: notes/02-credit-scoring.md
        notes: >-
          Its PDs come from one prior correction on a 1970s sample, and a regulator would ask for long default histories
          before accepting anything like it.

      - layout: bullets
        beat: practice
        section: Keep watching it
        title: PSI warns years before the defaults arrive
        recall: What does the population stability index measure, and what are its rules of thumb?
        answer: "How far today's score distribution has moved from the one you built on, summed over bins as (actual minus expected) times ln(actual/expected). Under 0.10 little shift, above 0.25 significant. Train against test gives 0.043, and recoding the safest status class gives 0.252."
        bullets:
          - "PSI compares today's score distribution with the **build** distribution"
          - "Under **0.10** little shift, above **0.25** needs action: triggers for review, not tests"
          - "Train against test: **0.043**, as expected for a random split"
          - "Top status class recoded as no account: **0.252**"
          - "It needs **no outcomes**, so it warns before the defaults arrive"
        takeaway: PSI needs no outcomes, so treat 0.10 and 0.25 as triggers for a review and remember it grows with noise in small samples.
        source: notes/02-credit-scoring.md
        notes: >-
          Yurdakul points out that these benchmarks are used without reference to error rates. The data science chapter on
          drift picks this up on a far larger card book.

      - layout: compare
        beat: wrap
        section: Recommendation
        title: Approve applications scoring above 548
        recall: What is the credit recommendation, and what limits it?
        answer: "Approve applications scoring above 548, the score at a corrected PD of 1/6, treating the cutoff as provisional until the bank confirms the 5:1 cost ratio. Never use the uncorrected PDs. The data is small and from the 1970s, approved loans only, and at this ratio the scorecard barely beats approving everyone."
        emphasis: left
        left:
          title: The recommendation
          bullets:
            - "Approve above **548**, corrected PD of 1/6"
            - "Provisional until the **5:1** ratio is confirmed"
            - "Use the WoE scorecard: matches boosting within noise"
        right:
          title: Limits
          bullets:
            - "The data is from the **1970s** and small, so the Gini interval is wide"
            - "Only **approved** loans, so rejects are an extrapolation"
            - "Barely beats approving everyone at this ratio"
        takeaway: The first conversation to have with the business is the true cost of a bad loan.
        source: notes/02-credit-scoring.md
        notes: >-
          Do not put the uncorrected PDs anywhere near a decision, since they would turn away 42% of applicants at a far
          higher expected cost.

      - layout: table
        beat: pitfalls
        section: Pitfalls
        title: Credit scoring pitfalls and what to do instead
        recall: What are the main credit scoring pitfalls?
        answer: "Using oversampled PDs, fitting bins on all the data, trusting automatic bins, wrong-sign coefficients, taking the test-best cutoff, ignoring selection, dropping a protected column and calling it fair, and reporting one Gini from one split."
        header: [Pitfall, Do instead]
        widths: [4, 5.6]
        rows:
          - [Oversampled PDs used as real, Compare the mean PD to the known bad rate]
          - [Bins fitted on all the data, Fit them inside the training fold]
          - [Trusting automatic bins, Merge classes until the points run in order]
          - [Wrong-sign coefficients, "Investigate collinearity, then drop or re-bin"]
          - [The cutoff that looked best on test, Pick it from the costs on a calibrated PD]
          - [Ignoring selection, Reject inference cannot supply unobserved outcomes]
          - [Dropping a protected column, Test outcomes across groups]
          - [One Gini from one split, Report an interval]
        takeaway: Most credit mistakes are invisible to Gini, so check the prior, the folds and the cutoff.
        source: notes/02-credit-scoring.md
        notes: >-
          Also: treating Basel capital as the expected loss, and trusting a famous dataset. The Statlog code table was
          wrong for decades.
