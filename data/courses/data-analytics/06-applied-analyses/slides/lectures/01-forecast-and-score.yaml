  output: 01-forecast-and-score.pptx
  notes: >-
    This is the second lecture of the applied analyses series, after the overview. It covers step 1. By the end you should
    be able to beat a baseline before trusting a model, backtest over many origins, turn a forecast into a decision using the
    costs, build and defend a logistic scorecard, and correct for a sample that is not the population.

