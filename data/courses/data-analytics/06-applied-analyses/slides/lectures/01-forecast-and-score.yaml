parts:
  - title: Forecasting, baselines and models
    divider: false
    summary: The question · The data · Free benchmarks · Three models
    notes: We start with the manager's question, look at the data before fitting anything, and set the bar a model must clear.
    slides:
      - layout: statement
        beat: problem
        section: The question and the data
        title: How many people does the warehouse need?
        recall: What does Fernhill's operations manager actually need from a forecast?
        answer: "A number of people to book for thirteen weeks, with a reason to believe it. The discipline that decides which model has earned the right to supply it matters most."
        kicker: The problem
        statement: "The last Monday of September. Book too few staff and parcels go out late. Book too many and people stand around. She does not want a forecast. She wants a number of people."
        takeaway: She wants a number and a reason to believe it, so the work is in deciding which model has earned the right to supply it.
        source: notes/01-forecasting.md
        notes: >-
          Fernhill's operations manager has to book temporary staff for the thirteen weeks that hold Black Friday and
          Christmas. Everything that follows is about getting her a defensible number.

      - layout: compare
        beat: fundamentals
        section: The question and the data
        title: Being short costs three times being over
        recall: What are the two costs in the staffing question?
        answer: "About £12 a unit when parcels go out late (short), and £4 a unit for idle staff (over). Both figures are assumptions for the exercise."
        emphasis: left
        left:
          title: Staff too few
          bullets: ["Parcels go out late", "About **£12** a unit"]
        right:
          title: Staff too many
          bullets: ["People standing around", "**£4** a unit"]
        takeaway: The question is units per week for thirteen weeks, with costs that are not symmetric.
        source: notes/01-forecasting.md
        notes: >-
          The figures are assumptions, so replace them with your own. Everything in the analysis follows from how the
          question is put: thirteen weeks ahead, at weekly grain, with unequal costs.

      - layout: image
        beat: fundamentals
        section: The question and the data
        title: Four features in the data will each break a method
        kicker: Fernhill weekly units, 2021 to 2025
        recall: Which four features of the weekly series will break some forecasting method?
        answer: "A trend (units grow 6% to 11% a year), a yearly season, an event that moves (Black Friday) and a hole (the warehouse outage in June 2023)."
        image: ../../assets/sources/images/applied-forecast-weekly-units.png
        caption: "261 weeks of seeded Fernhill data. The results describe this generator."
        bullets:
          - "**Trend:** 6% to 11% growth a year"
          - "**Season:** a broad autumn hump each year"
          - "**A moving event:** Black Friday is the day after the fourth Thursday"
          - "**A hole:** June 2023, a supply problem and not demand"
        takeaway: Look before you fit, because a method that copies last year will copy the outage too.
        source: notes/01-forecasting.md
        notes: >-
          No open dataset gives five years of weekly units with an outage we can point to and a known truth behind it, so
          the data is synthetic and seeded. When a model beats another below, that is evidence about how to run the comparison,
          not that one model is better in general.

      - layout: bullets
        beat: fundamentals
        level: practice
        section: The question and the data
        title: A 52.18-week year rules out the classic seasonal methods
        recall: Why is weekly seasonality awkward to model?
        answer: "The seasonal period is about 52.18 weeks: large and not a whole number, which rules out the classic seasonal methods that want a short integer period."
        bullets:
          - "Weekly seasonal period: **52.18**, long and not a whole number"
          - "Classic seasonal methods want a short integer period"
          - "FPP3 suggests **STL** with a non-seasonal model, or **dynamic harmonic regression**"
          - "We add **Prophet** as a third candidate"
          - "None is trusted until it has beaten something simple"
        takeaway: Fourier terms at the true period, or STL with a non-seasonal model, handle a non-integer season.
        source: notes/01-forecasting.md
        notes: >-
          This follows Hyndman and Athanasopoulos, section 13.1, on weekly data. The calendar problem is one reason this
          chapter spends so much time on how to compare models and so little on any single one.

      - layout: steps
        beat: fundamentals
        level: practice
        section: The question and the data
        title: Two checks before modelling
        recall: What two checks come before fitting a model?
        answer: "Test stationarity with the augmented Dickey-Fuller test and difference if needed, and take the seasonal period from the calendar, not from the lag count the test reports."
        steps:
          - {title: Test stationarity, text: "Augmented Dickey-Fuller: the null is a unit root, so a large p-value means not stationary"}
          - {title: Compare with critical values, text: "Read the statistic against the critical value, not only the p-value"}
          - {title: Difference a trend, text: "Models that cannot handle a trend need differencing first"}
          - {title: Take the period from the calendar, text: "12 for months, 52.18 for weeks, never the lag count", n: "★", accent: "D4621A"}
        takeaway: Stationarity is a reason to difference, and the seasonal period comes from the calendar and not from a diagnostic.
        source: notes/01-forecasting.md
        notes: >-
          Wilson's chapter on researching an ML project runs the same prep work on monthly airport passengers. The test's
          lag count is not a seasonal period. The chapter's listing also has a typo and an API statsmodels now flags, so
          the sketch on the next slide uses the current API on simulated monthly data.

      - layout: code
        beat: practice
        level: deep
        section: The question and the data
        title: A wrong period leaves the season in the residuals
        recall: What happens if you decompose at the lag count instead of the true period?
        answer: "On simulated monthly data, decomposing at 13 instead of 12 leaves a residual SD of 11.62 against 2.47 and a lag-1 autocorrelation of 0.82, the signature of a wrong period."
        lead: "Simulated monthly series: trend 0.8 a month, a 12-month sine of amplitude 15, noise SD 3."
        lang: python
        code: |-
          adf = adfuller(y, autolag="AIC",
                         result_object=True)
          d12 = adfuller(y.diff(12).dropna(),
                         autolag="AIC",
                         result_object=True)
          for period in (12, adf.lags):
              r = seasonal_decompose(
                  y, period=period).resid.dropna()
              print(period, r.std(), r.autocorr(1))
          # ADF -0.04, p 0.955, 5% critical -2.88
          # after 12-month difference: ADF -6.10
          # period 12: SD 2.47, lag-1 -0.17
          # period 13: SD 11.62, lag-1 0.82
        bullets:
          - "-0.04 sits far above -2.88: **not stationary**"
          - "One seasonal difference gives **-6.10**"
          - "Period 13 leaves a residual SD of **11.62**, against 2.47 at period 12"
        takeaway: Decompose at the known period, which costs nothing, and the autocorrelated residual disappears.
        source: notes/01-forecasting.md
        notes: >-
          Autolag happened to pick 13 lags here, as it did in the book. The weekly warehouse series needs the same two
          checks, with a 52-week difference being only approximate because the true period is 52.18.

      - layout: statement
        beat: problem
        section: Baselines come first
        title: A forecast is only good relative to doing nothing
        recall: Why compute simple benchmarks before fitting a model?
        answer: "A forecast is only good relative to what you could have done with no effort. If a model cannot beat the free benchmarks it has added cost and no information."
        kicker: Hyndman and Athanasopoulos, FPP3 section 5.2
        statement: "A forecast is only good relative to what you could have done with no effort."
        attribution: Four benchmarks that cost nothing to compute
        takeaway: Compute the free benchmarks first, and beat them before you trust anything fancier.
        source: notes/01-forecasting.md
        notes: >-
          A MASE of 0.6 means nothing to a manager until you add "and the thing we do now scores 1.2". That comparison needs
          the baseline.

      - layout: table
        beat: fundamentals
        section: Baselines come first
        title: Four free benchmarks, and the one to beat
        recall: Which four free benchmarks does FPP3 set out, and which one is hardest to beat on a seasonal series?
        answer: "Mean, naive (last value), seasonal naive (value one season ago) and drift (first-to-last line extended). The seasonal naive is the one to beat."
        header: [Method, The forecast is, First three weeks]
        widths: [2.2, 4.6, 2.6]
        rows:
          - [Mean, the mean of the history, "2259 2259 2259"]
          - [Naive, the last value, "2962 2962 2962"]
          - [Seasonal naive, the value from one season ago, "2589 2749 2661"]
          - [Drift, the line from the first point to the last extended, "2966 2970 2974"]
        highlight: [2]
        takeaway: The seasonal naive already knows the season, needs no fitting and fits in a spreadsheet, so a model must beat it.
        source: notes/01-forecasting.md
        notes: >-
          If your model cannot beat the seasonal naive, the model has added cost and no information, and you should say so.

      - layout: code
        beat: practice
        level: practice
        section: Baselines come first
        title: Two of the benchmarks in code
        recall: How do you compute the seasonal naive and drift forecasts?
        answer: "Seasonal naive repeats the first 13 weeks of the last 52. Drift extends the line from the first to the last observation."
        lang: python
        code: |-
          H, SEASON = 13, 52

          def seasonal_naive(train, h=H):
              return train.iloc[-SEASON:-SEASON + h]

          def drift(train, h=H):
              slope = ((train.iloc[-1] - train.iloc[0])
                       / (len(train) - 1))
              return (train.iloc[-1]
                      + slope * np.arange(1, h + 1))
        bullets:
          - "Seasonal naive **ignores growth**, so it runs low"
          - "It repeats last year, **outage included**"
        takeaway: "The seasonal naive has two weaknesses you can read off the method: it ignores growth and it copies last year's outage."
        source: notes/01-forecasting.md
        notes: >-
          The backtest later shows the first weakness as a bias of about +185 units a week.

      - layout: cards
        beat: fundamentals
        section: Three models that can handle a 52.18-week year
        title: Three models that can handle a 52.18-week year
        recall: Which three models does the chapter try on weekly data?
        answer: "STL plus ETS, dynamic harmonic regression, and Prophet."
        cards:
          - {title: STL + ETS, accent: "1E3A5F", body: "STL splits trend, season and remainder. ETS forecasts what is left. A moving event smears across weeks"}
          - {title: Harmonic regression, accent: "0F7490", body: "Sines and cosines at the true period, a trend, a Black Friday flag, AR(1) errors"}
          - {title: Prophet, accent: "D4621A", body: "A curve fit of piecewise trend, Fourier season and holidays, multiplicative here"}
        takeaway: All three handle the long season, and they differ in how they learn about a moving event.
        source: notes/01-forecasting.md
        notes: >-
          Taylor and Letham frame forecasting as curve fitting, built so an analyst can adjust it using quantities that make
          sense in the business. Seen this way Prophet is close to the harmonic regression, with an automatic piecewise trend
          and no explicit error autocorrelation.

      - layout: flow
        beat: fundamentals
        level: practice
        section: Three models that can handle a 52.18-week year
        title: STL plus ETS removes the season, then forecasts the rest
        recall: How does STL plus ETS forecast?
        answer: "Fit on the log scale, let STL split trend, season and remainder, forecast the seasonally adjusted part with exponential smoothing and add the season back."
        steps:
          - {label: Take logs, sub: "errors scale with level", accent: "94A3B8"}
          - {label: STL splits, sub: "trend, season, rest", accent: "1E3A5F"}
          - {label: ETS forecasts, sub: "the adjusted part", accent: "0F7490"}
          - {label: Add season back, sub: "a 52-week pattern"}
        caption: "Cheap and robust, but it learns a moving event only as a smear across neighbouring weeks."
        takeaway: STL plus ETS is cheap and robust, but it cannot see Black Friday as an event.
        source: notes/01-forecasting.md
        notes: >-
          We fit on the log scale for this model and the harmonic regression so that errors scale with the level and the
          forecasts stay positive.

      - layout: bullets
        beat: fundamentals
        level: practice
        section: Three models that can handle a 52.18-week year
        title: Harmonic regression writes the season as sines and cosines
        recall: How does dynamic harmonic regression model a season, and how is K chosen?
        answer: "As K pairs of sines and cosines at the true period of 52.18 weeks plus a trend and a Black Friday flag, with AR(1) errors. K is chosen by minimising AICc, inside each backtest fold."
        bullets:
          - "One sine and cosine pair per harmonic, at the true period of **52.18** weeks"
          - "Add a trend, a **Black Friday flag** and AR(1) errors"
          - "**K** pairs sets how wiggly the season can be"
          - "FPP3 chooses K by minimising **AICc**"
          - "K is chosen inside the function, so each origin uses only its own past"
        takeaway: K comes from AICc inside every backtest fold and never from the whole series.
        source: notes/01-forecasting.md
        notes: >-
          AICc picks K = 6 on everything before the last 13 weeks. Choosing K inside the function is what keeps each
          backtest origin honest.

      - layout: code
        beat: practice
        level: deep
        section: Three models that can handle a 52.18-week year
        title: The harmonic terms and the choice of K
        recall: How are the harmonic regression's input columns built?
        answer: "Fourier sine and cosine terms at the 52.18-week period, K pairs of them, plus a trend and a Black Friday flag."
        lang: python
        code: |-
          def harmonic_exog(index, K):
              t = (index - start).days / 7
              terms = {"trend": t / 52.18,
                       "black_friday": bf_weeks(index)}
              for k in range(1, K + 1):
                  terms[f"sin{k}"] = np.sin(2*np.pi*k*t/52.18)
                  terms[f"cos{k}"] = np.cos(2*np.pi*k*t/52.18)
              return pd.DataFrame(terms, index=index)

          def best_K(train, candidates=(2, 4, 6, 8, 10, 12)):
              return min(candidates,
                         key=lambda K: aicc(dhr_fit(train, K)))
        takeaway: The season is a handful of sine and cosine columns, and the AICc search over K runs on each origin's own past.
        source: notes/01-forecasting.md
        notes: >-
          The model is a SARIMAX with AR(1) errors on the log series. start is the first Monday, 2021-01-04, and bf_weeks
          flags the week holding Black Friday. Both are in the practice script.

      - layout: compare
        beat: pitfalls
        section: Three models that can handle a 52.18-week year
        title: Two models were told the true Black Friday rule
        recall: What did the harmonic regression and Prophet get that a real series would not give you?
        answer: "The true Black Friday rule, which is also how the generator builds the series. A real series gives no such guarantee, so be clear what your model was told."
        emphasis: right
        left:
          title: What we handed them
          bullets: ["The true Black Friday rule", "Also how the generator builds the series", "A fair test of the calendar, not of discovery"]
        right:
          title: What a real series gives
          bullets: ["No guarantee the rule is known", "Results flatter the model", "Be clear what your model was told"]
        takeaway: When a model beats another, ask what each was told, because knowing the calendar may explain the lead.
        source: notes/01-forecasting.md
        notes: >-
          This matters when you read the results below. Exercise 3 in the note removes Black Friday from the harmonic
          regression: MASE rises from 0.70 to 0.98, so most of its lead over STL plus ETS came from knowing the calendar.

  - title: Backtest and intervals
    summary: Rolling origins · Error measures · Interval coverage
    notes: "Now the discipline: how to compare the models fairly, and how to test the bands they give you."
    slides:
      - layout: statement
        beat: problem
        section: Backtest, because one split is one anecdote
        title: One split is one anecdote
        recall: Why is a single train and test split not enough to pick a model?
        answer: "It tells you how a model did on one quarter. Rolling-origin evaluation repeats the exercise over many origins, training only on the past."
        kicker: Rolling origins, FPP3 section 5.10
        statement: "A single split tells you how a model did on one quarter. Fit on the past, forecast thirteen weeks, step forward, and repeat."
        attribution: Never train on the future of the series you are forecasting
        takeaway: Rolling origins train only on the past, and a random k-fold split would let the model see the future.
        source: notes/01-forecasting.md
        notes: >-
          This is the central discipline of the chapter. Everything else, from the choice of K to the buffer, happens inside
          or after this loop.

      - layout: code
        beat: fundamentals
        level: practice
        section: Backtest, because one split is one anecdote
        title: Twelve origins, and the last one stays locked
        recall: How are the twelve rolling origins used?
        answer: "Eleven origins, thirteen weeks apart, are for choosing a model and a buffer. The twelfth stays locked as the exam, because a test set that has guided a choice is no longer a test set."
        lead: Each origin trains on everything up to a date and tests on the next 13 weeks.
        lang: text
        code: |-
          origin 1   |==== train ====|-- 13 test --|
          origin 2   |====== train ======|-- 13 test --|
          origin 3   |========= train =========|-- 13 test --|
          ...
          origin 12  |============ train ============|-- 13 test --|
                                     ^ the exam, locked
        takeaway: Choose on eleven origins and touch the twelfth once, after the model and the buffer are chosen.
        source: notes/01-forecasting.md
        notes: >-
          The twelfth origin is the Q4 we are pretending to stand in front of. The origins run from 2023-01-02 to 2025-09-29.

      - layout: table
        beat: fundamentals
        level: practice
        section: Backtest, because one split is one anecdote
        title: Each error measure answers a different question
        recall: What does each error measure reward, and what should you watch for?
        answer: "MAE leads to the median, RMSE to the mean, MAPE blows up near zero, MASE scales by the in-sample naive MAE and is unit-free, and bias is the mean of actual minus forecast."
        header: [Measure, What it rewards, Watch for]
        widths: [1.6, 3.6, 4.4]
        rows:
          - [MAE, forecasts of the median, "In the series' own units"]
          - [RMSE, forecasts of the mean, Can legitimately disagree with MAE]
          - [MAPE, small percentage errors, "Undefined at zero, unequal for over and under"]
          - [MASE, beating the seasonal naive's in-sample error, "Unit-free, comparable across series"]
          - [Bias, no consistent shortfall, Positive means we under-forecast]
        takeaway: Use a scaled error and report bias separately.
        source: notes/01-forecasting.md
        notes: >-
          Hyndman and Koehler proposed scaling because percentage errors blow up near zero and penalise over-forecasting and
          under-forecasting unequally. MASE divides each error by the in-sample mean absolute error of a naive method, here
          the seasonal naive.

      - layout: bullets
        beat: pitfalls
        level: practice
        section: Backtest, because one split is one anecdote
        title: Read MASE with care, and report bias on its own
        recall: Why does the seasonal naive not score exactly 1 on MASE, and why report bias?
        answer: "The MASE scale is the seasonal naive's one-step, in-sample error, a harder target than its thirteen-week-ahead error. Bias matters because a consistent shortfall means being understaffed every week."
        bullets:
          - "MASE below 1 beats the seasonal naive's **one-step, in-sample** error"
          - "That is a harder target than its thirteen-week-ahead error"
          - "So the seasonal naive itself does not score exactly 1"
          - "Bias matters more than scatter for a warehouse: a **steady shortfall** is understaffing every week"
        takeaway: A MASE below 1 does not mean better than the benchmark's forecast, only than its in-sample error.
        source: notes/01-forecasting.md
        notes: >-
          We track bias as the mean of actual minus forecast. Positive means we under-forecast.

      - layout: code
        beat: practice
        level: deep
        section: Backtest, because one split is one anecdote
        title: The backtest loop in code
        recall: How is the rolling-origin backtest written?
        answer: "For each origin, train on the past, compute the in-sample seasonal naive MAE as the MASE scale, call every method for 13 weeks, and record actuals and forecasts. Choose on the first eleven origins and hold the last as the exam."
        lang: python
        code: |-
          origins = [len(units) - H * i
                     for i in range(12, 0, -1)]
          for n_train in origins:
              train = units.iloc[:n_train]
              test = units.iloc[n_train:n_train + H]
              scale = train.diff(SEASON).abs().mean()
              for name, method in METHODS.items():
                  point = method(train)
                  # record origin, week, step, model,
                  # actual, forecast and scale

          select = backtest[backtest.origin < exam_origin]
          exam = backtest[backtest.origin == exam_origin]
        takeaway: Every origin computes its own scale and its own forecasts from its own past, and the exam is split off at the end.
        source: notes/01-forecasting.md
        notes: >-
          The MASE scale is the in-sample seasonal naive MAE, which each origin computes from its own past.

      - layout: table
        beat: practice
        section: Backtest, because one split is one anecdote
        title: Three models beat the seasonal naive on eleven origins
        recall: How did the seven methods score across the eleven selection origins?
        answer: "Prophet scored a MASE of 0.63 and harmonic regression 0.70, both below the seasonal naive at 1.21. STL plus ETS reached 1.02, and mean, naive and drift scored 1.84, 1.61 and 1.66."
        header: [Model, MAE, RMSE, MASE, Bias]
        widths: [3.2, 1.6, 1.6, 1.4, 1.6]
        rows:
          - [Mean, "359.04", "504.46", "1.84", "271.42"]
          - [Naive, "313.76", "427.83", "1.61", "27.03"]
          - [Drift, "322.86", "432.41", "1.66", "9.67"]
          - [Seasonal naive, "235.31", "315.71", "1.21", "184.68"]
          - [STL + ETS, "196.55", "285.66", "1.02", "73.29"]
          - [Harmonic regression, "134.85", "192.69", "0.70", "16.06"]
          - [Prophet, "121.59", "175.29", "0.63", "14.00"]
        highlight: [5, 6]
        takeaway: Prophet at 0.63 and harmonic regression at 0.70 clear the seasonal naive at 1.21, and the gap between them is too small to bet on.
        source: notes/01-forecasting.md
        notes: >-
          Read the table from the top. Mean, naive and drift know nothing about the season. The seasonal naive has a bias of
          about +185 units a week, the failure we predicted.

      - layout: image
        beat: practice
        section: Backtest, because one split is one anecdote
        title: Knowing the season is what separates the models
        kicker: MASE over eleven origins, 13 weeks ahead
        recall: Why does STL plus ETS only reach a MASE of 1.02?
        answer: "It smears Black Friday across neighbouring weeks. It beats the seasonal naive on scatter and cuts its bias to about 40%, but cannot see the moving event."
        image: ../../assets/sources/images/applied-forecast-backtest-mase.png
        caption: "Three models fall below the seasonal naive, and the three other baselines sit above it."
        bullets:
          - "Mean, naive, drift: **1.84, 1.61, 1.66**"
          - "Seasonal naive **1.21**, with bias of about +185 units a week"
          - "STL + ETS **1.02**: it smears Black Friday"
          - "Harmonic **0.70** and Prophet **0.63**, both told the moving event"
        takeaway: The seasonal naive copies last year into a business that has grown, which is why it runs about 185 units a week low.
        source: notes/01-forecasting.md
        notes: >-
          The two best models had the moving event explained to them, and the generator really does behave that way.

      - layout: table
        beat: practice
        section: Check the intervals before anyone relies on them
        title: Does the 80% interval contain 80% of the outcomes?
        recall: What share of actuals fell inside each model's nominal 80% interval?
        answer: "Harmonic regression 93.0% (too wide), Prophet 74.8% (a little narrow) and STL plus ETS 47.6% (misses badly, as it cannot see Black Friday)."
        header: [Model, Actuals inside the interval, Reading]
        widths: [3.2, 2.6, 4]
        rows:
          - [Harmonic regression, "93.0%", Too wide]
          - [Prophet, "74.8%", A little narrow]
          - [STL + ETS, "47.6%", Misses badly]
        highlight: [2]
        takeaway: Never quote an interval you have not tested, and measure coverage on your own backtest.
        source: notes/01-forecasting.md
        notes: >-
          An interval makes a claim you can test. Taylor and Letham's intervals come from simulating future trend changes on
          the assumption that they resemble past ones, so treat them as an estimate. We will not use the model's interval for
          the staffing decision, as it turns out: we do better with the backtest errors directly.

  - title: From forecast to decision
    summary: Newsvendor · A buffer · The exam · Recommendation
    notes: A forecast is not the deliverable. The deliverable is the plan, priced.
    slides:
      - layout: flow
        beat: fundamentals
        section: From forecast to decision
        title: Staff to the quantile the costs imply
        recall: Which quantile of demand should the manager staff to, and why?
        answer: "The 75th percentile. Short costs £12 and over costs £4, so the critical ratio is 12 / (12 + 4) = 0.75: keep adding capacity until the chance a unit is needed falls to 4/16."
        steps:
          - {label: One more unit, sub: "£12 saved if needed", accent: "1E3A5F"}
          - {label: Or wasted, sub: "£4 if not", accent: "94A3B8"}
          - {label: Critical ratio, sub: "12 / (12 + 4) = 0.75", accent: "0F7490"}
          - {label: Staff to the 75th percentile, sub: "not the expected demand"}
        caption: "The newsvendor result. Operations and supply chain runs the same ratio on a season's stock order."
        takeaway: Do not staff to expected demand. Staff to the percentile the cost ratio sets.
        source: notes/01-forecasting.md
        notes: >-
          Suppose you are deciding whether to staff for one more unit. It pays off when the unit turns out to be needed.
          Add capacity until the probability it is needed falls to 4/(12+4).

      - layout: code
        beat: practice
        level: practice
        section: From forecast to decision
        title: The buffer is a quantile of past errors
        recall: How is the staffing buffer read off the backtest?
        answer: "Take actual divided by forecast at each week of the eleven selection origins and use its 75th percentile as a multiplicative buffer: 1.047 times the forecast."
        lang: python
        code: |-
          ratio = select[select.model == best].eval(
              "actual / forecast")
          target = cost_short / (cost_short + cost_over)
          buffer = ratio.quantile(target)
          # critical ratio 0.75, buffer 1.047

          def plan_cost(plan, actual):
              short = np.maximum(actual - plan, 0)
              over = np.maximum(plan - actual, 0)
              return (cost_short * short
                      + cost_over * over).sum()
        takeaway: The buffer comes from the errors the chosen model really made, and the exam is opened only after it is set.
        source: notes/01-forecasting.md
        notes: >-
          The model's own interval is not used. The backtest errors give the percentile directly.

