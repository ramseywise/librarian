  notes: >-
    This is the sixth and last lecture of the applied analyses series. It covers step 5. By the end you should be able to
    say why a margin of error fails on an email blast, design a stratified or clustered sample, report what happened to every
    case, weight respondents to known totals and say what weighting cannot fix, state a margin that reflects the design, and
    test whether a question measures what you mean.

