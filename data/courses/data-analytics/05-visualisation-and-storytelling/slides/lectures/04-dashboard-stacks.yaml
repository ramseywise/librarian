          accent: "1E3A5F"
        right:
          title: FastAPI and React
          tag: Full stack
          bullets: ["**147** lines of Python, **100** of TypeScript, a Node toolchain", "About **177 KB** first load", "A key check; your SSO in production"]
          accent: "0F7490"
