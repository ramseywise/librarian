      - layout: compare
        beat: fundamentals
        section: "Worked example: the Fernhill segments page, twice"
        title: 42 lines of Python against 247 lines and a toolchain
        recall: How do the Dash and FastAPI-with-React builds compare?
        answer: "Dash is 42 lines of Python and about 1,901 KB first load, with no login in our demo. FastAPI and React is 147 lines of Python and 100 of TypeScript plus a Node toolchain, about 177 KB, with a key check in the demo."
        emphasis: none
        left:
          title: Dash
          tag: Python app
