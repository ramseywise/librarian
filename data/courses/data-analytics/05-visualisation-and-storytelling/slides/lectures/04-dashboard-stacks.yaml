      - layout: compare
        beat: pitfalls
        section: What the browser downloads
        title: A Python app is not free of download weight
        recall: How do the Dash and React pages compare on first load?
        answer: "Dash fetched 21 files totalling 6,716 KB, about 1,901 KB gzipped. React fetched 5 files totalling 610 KB, about 177 KB gzipped. The tenfold gap matters on phones and hardly at all on office broadband."
        emphasis: none
        left:
          title: Dash page
          tag: First load
          bullets: ["**21** files, 6,716 KB", "About **1,901 KB** gzipped"]
          accent: "1E3A5F"
        right:
          title: React page
          tag: First load
          bullets: ["**5** files, 610 KB", "About **177 KB** gzipped"]
          accent: "0F7490"
        takeaway: The tenfold gap matters for customers on phones and hardly at all for a CRM team on office broadband.
        source: notes/06b-dashboard-data-path-points-colour-and-worked-example.md
        notes: >-
          Measured in Chrome on localhost on 3 November 2026. Dash sends plotly.js and its component libraries.

      - layout: table
        beat: practice
        level: deep
        section: When there are many points
        title: WebGL loses at 1,000 points and wins from 10,000
        recall: At which point counts does scattergl beat SVG scatter in the measurements?
        answer: "SVG is quicker at 1,000 points (27 against 42 ms). WebGL wins from 10,000 (102 against 46 ms), and at 50,000 it is 55 ms against 476 ms. WebGL ran 200,000 in 76 ms and 400,000 in 111 ms."
        header: [Points, "SVG scatter, ms", "WebGL scattergl, ms"]
        widths: [2.6, 3.2, 3.4]
        bold_first: true
        rows:
          - ["1,000", "27", "42"]
          - ["10,000", "102", "46"]
          - ["50,000", "476", "55"]
          - ["200,000", "not run", "76"]
          - ["400,000", "not run", "111"]
        takeaway: Read the shape of the numbers and not the digits, because reruns moved WebGL by tens of milliseconds.
        source: notes/06b-dashboard-data-path-points-colour-and-worked-example.md
        notes: >-
          Drawn in Chrome 156 with plotly.js 4.2.0 on an Apple M4 Pro, headless at 800 by 500, median of three, until two
          animation frames had passed. This measures one fast laptop drawing once, and panning and a phone would both differ. Sometimes
          an analyst does want every point, and there are three rungs; climb only as far as you need. SVG makes one page element per
          mark and scattergl hands the drawing to the graphics card.

      - layout: bullets
        beat: pitfalls
        level: deep
        section: When there are many points
        title: WebGL has limits of its own
        recall: What limits does Plotly's performance page set on WebGL?
        answer: "Most browsers allow between 8 and 16 WebGL contexts per page, which generally means 4 to 8 figures, and past that some figures will not render. Plotly Express switches to WebGL above 1,000 rows. The ceiling for WebGL traces is around a million points."
        bullets:
          - "Browsers allow **8 to 16** WebGL contexts per page"
          - "That generally means **4 to 8 figures** on one page"
          - "Past it, some figures **will not render**"
          - "Plotly Express switches to WebGL above **1,000 rows**"
          - "The ceiling is **around a million points**"
        takeaway: WebGL scales to around a million points, and the cost is the number of figures per page.
        source: notes/06b-dashboard-data-path-points-colour-and-worked-example.md
        notes: >-
          These figures are quoted from the Plotly performance page.

      - layout: code
        beat: practice
        level: deep
        section: When there are many points
        title: Datashader draws five million points in 21 ms
        recall: How long does Datashader take on five million points, first and second time?
        answer: "371 ms the first time, which includes compiling, and 21 ms the second, producing an 800 by 500 image."
        lead: "Count into a grid, then shade."
        lang: python
        code: |-
          canvas = ds.Canvas(plot_width=800, plot_height=500)
          for attempt in ("first, compiling", "second"):
              start = time.perf_counter()
              image = ds.tf.shade(
                  canvas.points(cloud, "x", "y")).to_pil()
              print(attempt, image.size,
                    time.perf_counter() - start)
        bullets:
          - "5,000,000 points, **371 ms** then **21 ms**"
          - "Only the aggregation stage touches the whole dataset"
        takeaway: With the server doing the counting, the browser's cost stops depending on the number of points.
        source: notes/06b-dashboard-data-path-points-colour-and-worked-example.md
        notes: >-
          The five million points are resampled from the 50,000 with noise. The printout in the note shows the time in
          milliseconds. In Datashader's own pipeline, only one stage, aggregation, requires access to the entire dataset.

      - layout: image
        beat: practice
        level: deep
        section: When there are many points
        title: An image of density instead of a mark per customer
        kicker: Datashader output
        recall: What does the Datashader image weigh against a Plotly figure, and what is the catch?
        answer: "The image shaded by segment is 255 KB, against 362 KB gzipped for a Plotly figure of only 50,000 points. It needs a running Python process to show more detail when zooming."
        image: ../../assets/sources/images/viz-segments-datashader.png
        caption: "Five million synthetic points drawn as a soft image, with four coloured groups and no individual marks"
        bullets:
          - "Image **255 KB**, Plotly with 50,000 points **362 KB**"
          - "Zooming for detail needs a **running server**"
        takeaway: It suits Panel or HoloViews and a small audience, because it needs a server running.
        source: notes/06b-dashboard-data-path-points-colour-and-worked-example.md
        notes: >-
          Datashader's docs say you will not be able to see more detail when zooming in unless the Python process is running.

      - layout: statement
        beat: wrap
        level: deep
        section: When there are many points
        title: Ask whether you need the points at all
        recall: What is the third rung for many points?
        answer: "Ask whether you need the points at all. For the CRM team the answer is no, and the grid of counts is 2.4 KB."
        kicker: The third rung
        statement: "For the CRM team the answer is no, and the grid of counts is 2.4 KB."
        takeaway: The cheapest point to draw is the one you never send.
        source: notes/06b-dashboard-data-path-points-colour-and-worked-example.md
        notes: >-
          The three rungs were SVG then WebGL, render on the server, and ask whether you need the points at all.

      - layout: code
        beat: practice
        level: deep
        section: Maps
        title: Folium writes a page where Leaflet draws
        recall: How big is the Folium page for ten regions, and for 5,000 markers?
        answer: "10 KB for ten region circles. The same page with 5,000 individual circle markers was 2,435 KB, because each marker is written into the HTML."
        lead: "One sized circle per region."
        lang: python
        code: |-
          counts = table.groupby("region").size()
          uk = folium.Map(location=[53.5, -2], zoom_start=6)
          for region, (_, lat, lon) in segments.REGIONS.items():
              folium.CircleMarker(
                  [lat, lon], radius=counts[region] ** .5 / 8,
                  tooltip=f"{region}: {counts[region]:,}"
              ).add_to(uk)
        bullets:
          - "Ten regions: **10 KB**"
          - "5,000 markers: **2,435 KB**"
        takeaway: Aggregate to regions first, because every marker is written into the page.
        source: notes/06b-dashboard-data-path-points-colour-and-worked-example.md
        notes: >-
          Trimmed from the note's block, which also sets tiles, weight and fill and saves the file. The 2,435 KB figure comes from
          ch06_stack_map.py.

      - layout: cards
        beat: pitfalls
        level: deep
        section: Maps
        title: Three traps on a customer map
        recall: What three things go wrong on a customer map?
        answer: "A region's size misleads on a choropleth. Tiles are someone else's server with no SLA. A home address is personal data, so a map of customers' homes is a privacy decision."
        cards:
          - {title: Size misleads, accent: "D4621A", body: "On a choropleth large regions dominate; shade a density, or use a sized circle for a count"}
          - {title: Tiles are borrowed, accent: "1E3A5F", body: "OpenStreetMap offers no SLA or guarantee and asks for clear attribution"}
          - {title: Homes are personal, accent: "0F7490", body: "Our coordinates are one city per region on purpose"}
        takeaway: A map of customers' homes is a privacy decision and not a chart choice.
        source: notes/06b-dashboard-data-path-points-colour-and-worked-example.md
        notes: >-
          A choropleth is a map with each region shaded by its value. Wilke notes that we perceive larger areas as corresponding to
          larger amounts, and that choropleths work best when the colouring represents a density. OpenStreetMap's policy says
          availability is best-effort, and warns that access may be withdrawn from commercial services. For anything a business
          depends on, arrange your own tiles.

  - title: Colour, access, two pages
    divider: false
    summary: Colour for categories · Four WCAG checks · The same page twice
    notes: We fix the colour the draft got wrong, run the four accessibility checks, and then compare the segments page built on Dash and on FastAPI with React.
    slides:
      - layout: statement
        beat: problem
        section: Colour for categories
        title: The draft coloured groups by their cluster number
        recall: What does Plotly do when the colour column is numeric?
        answer: "It treats it as continuous and draws a colour bar with values such as 1.5, which is not a group that exists."
        kicker: Plotly's documentation
        statement: "If the data is numeric, the color will automatically be considered continuous."
        attribution: "A colour bar with 1.5 on it is not a group"
        takeaway: A default can break a colour rule silently, so name the groups.
        source: notes/06b-dashboard-data-path-points-colour-and-worked-example.md
        notes: >-
          Note 1 covers colour's jobs. This is that rule failing silently inside a default.

      - layout: image
        beat: fundamentals
        section: Colour for categories
        title: A numeric scale on the left, four named groups on the right
        kicker: The same customers twice
        card: false
        recall: How do the two scatters in the figure differ?
        answer: "On the left, numeric cluster ids on a purple-to-yellow scale with a colour bar from 0 to 3. On the right, four named segments in four colours and four shapes with a legend."
        image: ../../assets/sources/images/viz-segments-numeric-vs-categorical.png
        caption: "Two scatter plots of the same customers, numeric cluster ids against four named segments"
        bullets:
          - "Left: colour bar from **0 to 3**"
          - "Right: four colours **and** four shapes"
        takeaway: The right-hand chart can be read from its legend, and the left one implies an order.
        source: notes/06b-dashboard-data-path-points-colour-and-worked-example.md
        notes: >-
          Image source: generated by practice/ch06_stack_map.py, synthetic data.

      - layout: code
        beat: practice
        level: core
        section: Colour for categories
        title: Fix the colour by name, not by order of appearance
        recall: Why does filtering out a segment repaint the others under default colours?
        answer: "Default colour follows order of appearance, so removing one segment shifts the colours of every other one. Fix the mapping by name with color_discrete_map."
        lead: "Four named traces with a fixed palette."
        lang: python
        code: |-
          COLOURS = dict(zip(segments.NAMES,
              ["#2a78d6", "#eb6834", "#1baf7a", "#eda100"]))
          named = px.scatter(table, x="x", y="y",
              color="segment", symbol="segment",
              category_orders={"segment": segments.NAMES},
              color_discrete_map=COLOURS)
        bullets:
          - "Numeric ids: **1 trace** and a colour bar"
          - "Names: **4 traces**"
        takeaway: With colour tied to the name, a filter cannot change what a colour means.
        source: notes/06b-dashboard-data-path-points-colour-and-worked-example.md
        notes: >-
          In the default run, Discount hunters is first and blue. With one segment filtered out the remaining three shift to
          the next colours. In React, a lookup table does the same job, as our STYLE object does. Wilke finds that qualitative
          scales work best when there are three to five different categories.

      - layout: steps
        beat: fundamentals
        section: Accessibility is part of the contract
        title: Four WCAG checks that apply to a chart page
        recall: What are the four WCAG 2.2 checks applied to a chart page?
        answer: "Colour is not alone (1.4.1), contrast (1.4.3 and 1.4.11), a table view (1.1.1), and keyboard and hover (2.1.1 and 1.4.13)."
        steps:
          - {title: Colour is not alone, text: "WCAG 1.4.1: our segments also differ in shape", n: "1"}
          - {title: Contrast, text: "WCAG 1.4.3 and 1.4.11: 4.5:1 for text, 3:1 for marks", n: "2"}
          - {title: A table view, text: "WCAG 1.1.1: the actual data is provided in a table", n: "3"}
          - {title: Keyboard and hover, text: "WCAG 2.1.1 and 1.4.13: a real select works free", n: "4"}
        takeaway: A dashboard is often someone's only route to these numbers, so it has to work for them.
        source: notes/06b-dashboard-data-path-points-colour-and-worked-example.md
        notes: >-
          WCAG 2.2 is the W3C's web accessibility guidelines. About 8% of men and 0.5% of women have some colour-vision deficiency
          (Wilke). Our filter is a real select element, which gets keyboard support free. Anything found only on hover fails for
          keyboard and touch users.

      - layout: bullets
        beat: pitfalls
        level: core
        section: Accessibility is part of the contract
        title: Our palette passes colour-vision checks and fails contrast
        recall: Which of our colours fall short of 3:1 contrast, and what is the escape?
        answer: "Aqua at 2.74:1 and yellow at 2.11:1 fall short of 3:1 on the near-white surface. WCAG accepts the information being available in another form, so our table meets the check."
        bullets:
          - "Aqua is **2.74:1** and yellow **2.11:1**, under 3:1"
          - "Text needs **4.5:1**, or 3:1 if large"
          - "A **table** meets the check, so ours does"
          - "No screen-reader test: we claim **only these checks**"
        takeaway: A low-contrast shape is still low contrast, and the table is what carries the claim.
        source: notes/06b-dashboard-data-path-points-colour-and-worked-example.md
        notes: >-
          The shapes and legend help. The numbers are from the validator we ran. We have not tested these pages with a screen
          reader.

