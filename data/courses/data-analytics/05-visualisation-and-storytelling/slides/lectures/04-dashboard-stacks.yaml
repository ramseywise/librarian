deck:
  title: Dashboard Stacks
  subtitle: From a Python result to a browser
  tagline: "Stacks · APIs · Many points · Colour · Accessibility"
  reference: "Notes: data-analytics/05-visualisation-and-storytelling, notes 6 and 6b"
  output: 04-dashboard-stacks.pptx
  notes: >-
    This is the fifth lecture of the visualisation series and covers step 4. By the end you should be able to name the three
    layers of a dashboard, say who really draws a Python chart, choose between a BI tool, a Python app and a full stack by
    situation, list what was wrong with an endpoint that returns the customer table, explain why labels are precomputed and
    not refitted on a filter, and colour categories and meet four accessibility checks.

