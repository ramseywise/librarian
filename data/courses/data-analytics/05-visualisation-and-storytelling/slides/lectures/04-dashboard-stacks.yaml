      - layout: compare
        beat: wrap
        section: "Worked example: the Fernhill segments page, twice"
        title: For Fernhill, a Python app on the Dash row
        recall: Which route should Fernhill take, and when would React earn its code?
        answer: "A CRM team of a few people, inside the company, with labels that change only when someone approves a refit, belongs on the Python app row. The 42-line Dash file is enough behind the company's login proxy. React earns its extra code when these views go into the customer-facing product."
        emphasis: left
        left:
          title: Today
          tag: A CRM team inside the company
          bullets: ["A few people, labels change on approval", "The 42-line Dash file", "Behind the company's login proxy"]
          accent: "0F7490"
        right:
          title: The day it changes
          tag: Customer-facing
          bullets: ["Views go into the customer product", "React earns its extra code", "A BI tool already paid for is cheaper still"]
          accent: "D4621A"
        takeaway: The situation picks the route, and a change of situation is when to change it.
        source: notes/06b-dashboard-data-path-points-colour-and-worked-example.md
        notes: >-
          A login proxy is a service in front of the app that checks the company sign-in before passing any request through. If the
          same numbers were going into a BI tool the company already pays for, publishing the summary table to it would be
          cheaper still.

      - layout: cards
        beat: pitfalls
        section: Pitfalls
        title: Three pitfalls that pass a demo
        recall: Name three dashboard data-path pitfalls that pass a demo
        answer: "A list endpoint that returns the table, a secret or cap only in the front end, and refitting on a filter or keying on a cluster number."
        cards:
          - {title: The table as an endpoint, accent: "D4621A", body: "At 50,000 rows it is half a second and 11 MB. Return an aggregate"}
          - {title: Front-end secrets, accent: "1E3A5F", body: "Anything in the bundle is public. Keep keys and limits on the server"}
          - {title: Refit or cluster id, accent: "0F7490", body: "A segment name changes meaning when a slider moves. Read named labels from a table"}
        takeaway: Aggregate by default, keep secrets and caps on the server, and read named labels from a table.
        source: notes/06b-dashboard-data-path-points-colour-and-worked-example.md
        notes: >-
          An email list built on cluster 2 targets a different group after a refit. A dropdown limited to 100 rows does nothing
          against someone calling the address directly.
