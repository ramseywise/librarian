parts:
  - title: Static charts with matplotlib
    summary: Figure and Axes · Declutter · Small multiples
    notes: First the object model, then a default chart stripped down to its message.
    slides:
      - layout: statement
        beat: problem
        title: Matplotlib draws almost every static chart
        recall: Why learn matplotlib when you mostly write seaborn or pandas?
        answer: "Almost every static chart in the Python world is drawn by matplotlib, even when the code says seaborn or pandas, so a mental model of it pays off everywhere."
        kicker: The problem
        statement: "Almost every static chart in the Python world is drawn by matplotlib, even when the code says seaborn or pandas."
        attribution: Its defaults are famously unpersuasive
        takeaway: Build the model once, then strip a default chart down to what it needs to say.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          The API has two personalities, which is why many people copy snippets for years without forming a mental model.
          This lecture builds that model, then uses it to declutter a chart, and then shows when seaborn saves the work.

      - layout: flow
        beat: fundamentals
        section: The object model
        title: A Figure holds Axes, an Axes holds artists
        recall: What are a Figure, an Axes and an artist in matplotlib?
        answer: "A Figure is the whole canvas and owns saving. An Axes is one plot with its own coordinate system. Everything you see inside an Axes is an artist, such as a Line2D, Text or Rectangle."
        steps:
          - {label: Figure, sub: "the canvas and savefig", accent: "1E3A5F"}
          - {label: Axes, sub: "one plot, own coordinates", accent: "0F7490"}
          - {label: "XAxis, YAxis", sub: "ticks and labels", accent: "0EA5C9"}
          - {label: Artists, sub: "Line2D, Rectangle, Text", accent: "D4621A"}
        caption: "The plural Axes is a historical name. It does not mean the x and y axes."
        takeaway: Everything you see is an artist, and everything can be reached and changed.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          A Figure can contain one or more Axes. Each Axes contains Line2D, Text, Rectangle and other artists.

      - layout: compare
        beat: fundamentals
        section: The object model
        title: Two personalities, one to keep
        recall: Why prefer ax.plot to plt.plot for anything you will keep?
        answer: "plt.plot acts on a hidden current axes, which stops being safe once a figure has two panels. ax.plot names its target, and every helper function wants an ax argument anyway."
        emphasis: right
        left:
          title: pyplot state machine
          tag: plt.plot
          bullets: ["Acts on the current axes", "Fine for a quick look", "Unsafe with two panels"]
        right:
          title: Object-oriented API
          tag: ax.plot
          bullets: ["Acts on the axes you name", "Use it for anything you keep", "Helpers take an ax argument"]
        takeaway: Name the Axes from the first line, with fig, ax = plt.subplots().
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          The matplotlib quick start documents both. Once a figure has two panels, current stops being a safe idea.

      - layout: image
        beat: problem
        section: The object model
        title: Everything matplotlib offers, taken as is
        kicker: The default chart
        recall: What is wrong with the default matplotlib revenue chart?
        answer: "Markers repeat what the axis says, the grid and box are as dark as the data, the legend sits on the lines, the title only describes, and the green and blue crossing has no more weight than the rest."
        image: ../../assets/sources/images/viz-matplotlib-default-chart.png
        caption: "Fernhill revenue by channel with matplotlib's own defaults, the before picture."
        bullets:
          - "**Markers** on every month, which the axis already says"
          - "**Grid and box** as dark as the data"
          - "**Legend** sits on the lines"
          - "**Title** describes without saying anything"
        takeaway: Nothing here is wrong, and everything competes, including the crossing that matters most.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          Thirty-six markers per line say these are months. The x labels say 2023-05 when the only structure that matters
          is the year. The moment green and blue cross has no more visual weight than the rest.

      - layout: statement
        beat: fundamentals
        section: "Declutter: every element must earn its place"
        title: Clutter is effort without understanding
        recall: What counts as clutter, in Knaflic's framing?
        answer: "Each thing on the page costs the reader some effort, and elements that add effort without adding understanding are clutter."
        kicker: Cognitive load
        statement: "Each thing on the page costs the reader some effort. Elements that add effort without adding understanding are clutter."
        attribution: Knaflic, Storytelling with Data, ch. 3
        takeaway: A checklist you can apply mechanically before you have had a single design thought.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          Knaflic's framing is cognitive load. Her sequence is a checklist, which is why it can be turned into code.

      - layout: steps
        beat: fundamentals
        section: "Declutter: every element must earn its place"
        title: The declutter sequence
        recall: What are the steps of Knaflic's declutter sequence?
        answer: "Remove the border, drop or fade gridlines, remove data markers, clean up axis labels, label the data directly, and use colour with intent."
        steps:
          - {title: Remove the border, text: "Spines go, except the baseline", n: "1", accent: "1E3A5F"}
          - {title: Fade the grid, text: "Or drop the gridlines", n: "2"}
          - {title: Remove data markers, text: "The line already says it", n: "3"}
          - {title: Clean up axis labels, text: "Years, not every month", n: "4"}
          - {title: Label directly, text: "No trip to a legend", n: "5"}
          - {title: Colour with intent, text: "Colour carries meaning", n: "6", accent: "D4621A"}
        takeaway: Six small removals turn a default into a chart with one message.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          Doing it chart by chart would be tedious, and it would drift. So the next slide sets every decision once.

      - layout: code
        beat: practice
        level: deep
        section: "Declutter: every element must earn its place"
        title: One rcParams call holds the decisions
        card: false
        lang: python
        code: |-
          plt.rcParams.update({
              "axes.spines.top": False, "axes.spines.right": False,
              "axes.spines.left": False,
              "axes.grid": True, "axes.grid.axis": "y",
              "axes.axisbelow": True,
              "grid.color": "#e1e0d9", "grid.linewidth": .7,
              "ytick.major.size": 0, "lines.linewidth": 2,
              "legend.frameon": False,
              "axes.titlelocation": "left",
              "figure.constrained_layout.use": True,
          })
        takeaway: Matplotlib stores its defaults in rcParams, so set them once and every chart agrees.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          Most of practice/chartstyle.py is this one call, and each line is a declutter decision. This block needs
          matplotlib.pyplot imported as plt, as in every other block here.

      - layout: bullets
        beat: fundamentals
        section: "Declutter: every element must earn its place"
        level: core
        title: Reading the style block
        recall: Why does the decluttered style keep a horizontal grid but drop the spines?
        answer: "The grid survives only as a horizontal hairline behind the data, because it helps the reader read values and has no reason to be noticed. The spines go, except the baseline."
        bullets:
          - "**Spines** go, except the baseline"
          - "**Grid** survives as a horizontal hairline behind the data"
          - "**Titles** align left, where a reader starts"
          - "**Constrained layout** keeps labels from colliding"
        takeaway: Keep a grid only because it helps reading, and make it too quiet to notice.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          Each line of the call maps to one item of the declutter checklist.

      - layout: code
        beat: practice
        level: deep
        section: "Declutter: every element must earn its place"
        title: The same chart, with the same data
        card: false
        lang: python
        code: |-
          cs.apply()
          fig, ax = plt.subplots(figsize=(8, 4))
          nudge = {"email": 5, "referral": -6}
          for channel in fernhill.CHANNELS:
              ax.plot(wide.index, wide[channel],
                      color=cs.CHANNEL_COLOUR[channel])
              ax.annotate(fernhill.LABELS[channel],
                          (wide.index[-1], wide[channel].iloc[-1]),
                          xytext=(6, nudge.get(channel, 0)),
                          textcoords="offset points", va="center",
                          color=cs.SECONDARY)
          ax.set_ylim(0)
          ax.set_title("Paid social overtook email in January 2025")
        takeaway: The annotate call is the single most useful line in matplotlib.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          Abridged from the note. The full block also builds the legend and leaves room for the end labels.
          The nudge separates two line ends that land close together, and you do it by eye.

      - layout: image
        beat: practice
        section: "Declutter: every element must earn its place"
        title: Direct labels and a title that says something
        kicker: The decluttered chart
        recall: What changed between the default chart and the decluttered one?
        answer: "Direct labels in ink colour replace the legend lookup, the grid and box are quiet, and the title states the finding: paid social overtook email in January 2025."
        image: ../../assets/sources/images/viz-matplotlib-decluttered-chart.png
        caption: "The same chart decluttered, with direct labels and a title that states the finding."
        bullets:
          - "**Direct labels** in ink, since yellow text is hard to read"
          - "**A small legend** stays, as a second cue for readers who cannot separate hues"
          - "**Title** states what the chart shows"
        takeaway: The reader never has to leave the data to learn what a line is.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          Many storytelling guides would remove the legend once direct labels are there, and for a slide with two or three
          lines you could.

      - layout: compare
        beat: fundamentals
        section: "Declutter: every element must earn its place"
        title: A label against a finding
        recall: Why is the title Paid social overtook email in January 2025 better than Revenue by channel?
        answer: "Revenue by channel labels the chart and repeats the axes. The finding says what it shows."
        emphasis: right
        left:
          title: Revenue by channel
          tag: Labels
          bullets: ["Repeats the axes", "Leaves the reader to look for a point"]
        right:
          title: Paid social overtook email in January 2025
          tag: Says
          bullets: ["States what the chart shows", "Gives the reader the point first"]
        takeaway: State the finding in the title if you know it.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          The same pitfall appears later as title as label.

      - layout: table
        beat: problem
        section: Small multiples
        title: Repeat rate fell in every channel
        recall: By how much did the 90-day repeat rate fall in each Fernhill channel?
        answer: "Paid social fell 5.5 points, organic 7.6, email 9.6 and referral 8.2, so the fall is not just a change in which channels customers came from."
        header: [Channel, Before, After, Change in points]
        widths: [2.4, 1.6, 1.6, 2.4]
        rows:
          - ["Paid social", "0.246", "0.190", "-5.5"]
          - ["Organic", "0.370", "0.294", "-7.6"]
          - ["Email", "0.491", "0.395", "-9.6"]
          - ["Referral", "0.356", "0.274", "-8.2"]
        highlight: [2]
        takeaway: The fall is between about 5.5 and 9.6 points everywhere, so mix alone does not explain it.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          That matters later, because it means the overall fall is not only a change in which channels customers came from.
          Four lines on one axis would be readable here, but small multiples are the general answer.

      - layout: code
        beat: practice
        level: deep
        section: Small multiples
        title: Every other series, quietly, behind
        card: false
        lang: python
        code: |-
          fig, axes = plt.subplots(1, 4, figsize=(9, 2.6),
                                   sharex=True, sharey=True)
          for ax, channel in zip(axes, fernhill.CHANNELS):
              for other in fernhill.CHANNELS:
                  if other != channel:
                      part = rate[rate.channel == other]
                      ax.plot(part.month, part.rate,
                              color=cs.GRID, linewidth=1)
              part = rate[rate.channel == channel]
              ax.plot(part.month, part.rate, color=cs.BLUE)
              ax.axvline(fernhill.CUT, color=cs.MUTED)
              ax.set_title(fernhill.LABELS[channel])
              ax.set_ylim(0, 60)
        takeaway: Pale grey for the others keeps the context of the group in every panel.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          Abridged from the note. The trick that makes small multiples work is drawing every other series in pale grey
          behind the highlighted one.

      - layout: image
        beat: fundamentals
        section: Small multiples
        title: One chart made of four panels
        kicker: Small multiples
        recall: What makes small multiples one chart rather than four?
        answer: "sharex=True and sharey=True, so the scale does not change between panels. It puts the value on position and scales to a dozen panels."
        image: ../../assets/sources/images/viz-small-multiples-repeat-rate.png
        caption: "Four panels of repeat rate by channel, each highlighting one channel against the others in grey."
        bullets:
          - "**sharex and sharey** make the panels comparable"
          - "**Position** is the top of the perceptual ranking"
          - "**A dozen panels** stay readable, where a dozen hues would not"
        takeaway: A shared scale makes four panels one chart, and it scales gracefully.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          Once more this puts the value on position, the top of the perceptual ranking from the first lecture.

  - title: Seaborn and static output
    summary: Figure-level and axes-level · Skew · Heatmap colour · File formats
    notes: Seaborn does the grouping and statistics, and static output has choices of its own.
    slides:
      - layout: compare
        beat: fundamentals
        section: "Seaborn: statistics and facets for free"
        title: Figure-level against axes-level
        recall: What is the difference between figure-level and axes-level seaborn functions?
        answer: "Figure-level functions such as relplot, displot and catplot create their own figure and return a FacetGrid, so they can facet. Axes-level functions such as scatterplot, boxplot and heatmap draw into an ax you pass. If ax= raises an error, you called a figure-level function."
        emphasis: right
        left:
          title: Figure-level
          tag: relplot, displot, catplot
          bullets: ["Create their own figure", "Return a FacetGrid", "Can do col= and row="]
        right:
          title: Axes-level
          tag: scatterplot, boxplot, heatmap
          bullets: ["Draw into an ax you pass", "Compose with everything above", "Error with ax=? You called a figure-level one"]
        takeaway: Facets need a figure-level function, and composition needs an axes-level one.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          Seaborn is a layer over matplotlib that takes tidy data and thinks in the grammar. You name columns, and it does
          the grouping, the statistics and the legend. The split trips up most newcomers.

      - layout: image
        beat: practice
        section: "Seaborn: statistics and facets for free"
        title: One call, two panels and a legend
        kicker: relplot on the tips data
        recall: What does one relplot call give you on the tips data?
        answer: "Two panels, lunch and dinner, with a shared scale, colour by smoker and one legend. Tip percentage stays near 15% in all four groups."
        image: ../../assets/sources/images/viz-seaborn-tips-facets.png
        caption: "Tips against total bill, faceted by lunch and dinner and coloured by smoker."
        bullets:
          - "**244 bills**, two panels, shared scale"
          - "**Tip share** near 15% in all four groups"
          - "**Larger bills** show wider scatter"
          - "**A surface-coloured edge** keeps overlapping points apart"
        takeaway: Seaborn still draws through matplotlib, so the chartstyle settings still apply.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          The tips dataset is already in this subject's repo, used across the pandas pillar. The call returns a FacetGrid
          with 2 axes.

      - layout: table
        beat: practice
        section: "Seaborn: statistics and facets for free"
        title: Median tip share by time and smoker
        recall: What are the median tip shares for lunch and dinner by smoker?
        answer: "Dinner 0.156 for non-smokers and 0.149 for smokers. Lunch 0.153 for non-smokers and 0.154 for smokers. Tip percentage hardly differs."
        header: [Time, Smoker, Median tip share]
        widths: [2, 2, 3]
        rows:
          - ["Dinner", "No", "0.156"]
          - ["Dinner", "Yes", "0.149"]
          - ["Lunch", "No", "0.153"]
          - ["Lunch", "Yes", "0.154"]
        takeaway: The medians agree with what the picture hints, around 15% in every group.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          Print the numbers next to the chart, so the picture is checked rather than trusted.

      - layout: table
        beat: problem
        section: "Seaborn: statistics and facets for free"
        title: Order values are skewed
        recall: Why would a bar chart of mean order value hide the shape of Fernhill's orders?
        answer: "The mean sits above the median in every category and furniture's maximum is more than four times its mean, so means hide the right skew."
        header: [Category, Count, Median, Mean, Max]
        widths: [2.2, 1.4, 1.6, 1.6, 1.6]
        rows:
          - ["Furniture", "419", "175.9", "203.4", "918.7"]
          - ["Lighting", "660", "71.0", "86.4", "398.4"]
          - ["Garden", "557", "59.8", "69.5", "337.7"]
          - ["Textiles", "1,018", "48.4", "56.1", "309.7"]
          - ["Kitchen", "1,346", "41.6", "47.5", "300.8"]
        highlight: [0]
        takeaway: Mean above median is the signature of right skew, and a bar of means would hide it.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          Distributions are where seaborn saves the most code. A box plot on a log scale shows five categories and two
          devices in one view.

      - layout: image
        beat: practice
        section: "Seaborn: statistics and facets for free"
        title: A box plot on a log scale
        kicker: Order value by category and device
        recall: Why is a box or a dot the right mark on a log scale?
        answer: "On a log scale a bar has no honest starting point, since its baseline would have to be 1 rather than 0 (Wilke)."
        image: ../../assets/sources/images/viz-seaborn-order-value-distribution.png
        caption: "Box plots of order value by category and device on a log scale."
        bullets:
          - "**Furniture baskets** dwarf the rest"
          - "**Desktop** runs higher in every category"
          - "**Log scale** gives a bar no honest baseline, so use a box or a dot"
        takeaway: Pass order and hue_order so a refresh cannot reorder or recolour the chart.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          Wilke's argument is in chapter 17 of Fundamentals of Data Visualization. The title of the chart states the
          finding.

      - layout: compare
        beat: fundamentals
        section: Heatmaps and colour scales
        title: Sequential or diverging
        recall: Which colour scale suits a count, and which suits a change?
        answer: "A count or a rate needs a sequential scale. A change has a meaningful zero, so it needs a diverging scale with the neutral colour pinned to that zero."
        emphasis: right
        left:
          title: Sequential
          tag: A count or a rate
          bullets: ["Low to high magnitude", "No meaningful midpoint"]
        right:
          title: Diverging
          tag: A change
          bullets: ["Meaningful zero", "Neutral colour pinned to zero"]
        takeaway: A heatmap trades accuracy for density, so print the values when the grid is small.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          Colour is the least accurate channel, so write the values in the cells whenever the grid is small enough.

      - layout: table
        beat: practice
        section: Heatmaps and colour scales
        title: Revenue change, 2025 against 2024
        recall: How did revenue change by channel and quarter from 2024 to 2025?
        answer: "Paid social rose 131, 123, 118 and 110 percent across Q1 to Q4. Email fell about 55 percent every quarter. Organic search and referral moved by only a few percent."
        header: [Channel, Q1, Q2, Q3, Q4]
        widths: [2.6, 1.4, 1.4, 1.4, 1.4]
        rows:
          - ["Paid social", "+131", "+123", "+118", "+110"]
          - ["Organic search", "+4", "+6", "+3", "+2"]
          - ["Email", "-55", "-55", "-54", "-56"]
          - ["Referral", "+6", "+2", "+10", "+6"]
        highlight: [2]
        takeaway: These percentages are what the heatmap colours, and they decide the scale.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          Values are in percent. The heatmap code groups revenue by channel, year and quarter and divides 2025 by 2024.

      - layout: image
        beat: pitfalls
        section: Heatmaps and colour scales
        title: center=0 is the important argument
        kicker: Diverging heatmap
        recall: Why does the heatmap need center=0, and what does fixing vmin and vmax do?
        answer: "Without center=0 seaborn sets the colour midpoint halfway between the extremes, so a +2% change could look like growth or decline. Symmetric vmin and vmax stop the colours changing meaning between refreshes."
        image: ../../assets/sources/images/viz-seaborn-diverging-heatmap.png
        caption: "Diverging heatmap of revenue change by channel and quarter."
        bullets:
          - "**center=0** pins neutral to zero"
          - "**vmin and vmax** symmetric, so colours keep their meaning"
          - "**Cell values** printed, since colour is the weakest channel"
        takeaway: A diverging scale makes a claim about where zero is.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          Try it asks you to remove center=0 and set vmin=-60 and vmax=135. The midpoint moves to about +37%, so a small
          rise looks like a decline.

      - layout: table
        beat: practice
        section: Choosing a file format
        title: PNG, SVG or PDF
        recall: When should you pick PNG, SVG or PDF for a chart?
        answer: "PNG for slides, documents and charts with many marks. SVG for the web unless there are many marks. PDF for print or a paper. Vector files grow with the number of marks."
        header: [Format, Size here, Use for]
        widths: [1.4, 1.6, 4.2]
        rows:
          - ["PNG", "50 KB", "Slides and documents, or many marks"]
          - ["SVG", "24 KB", "The web, unless there are many marks"]
          - ["PDF", "8 KB", "Print or a paper"]
        takeaway: Vector stays sharp at any zoom, but a 100,000-point scatter is many megabytes of SVG.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          Those sizes are for one simple line chart. PNG has a fixed pixel count and its size depends on the resolution.

      - layout: cards
        beat: pitfalls
        section: Pitfalls
        title: Four ways a static chart goes wrong
        recall: Name four ways a matplotlib or seaborn chart goes wrong in code
        answer: "Mixing plt and ax, forgetting plt.close(fig), passing ax= to a figure-level seaborn function, and letting seaborn choose the category order."
        cards:
          - {title: "Mixing plt. and ax.", accent: "1E3A5F", body: "Works until a second panel appears. Start with fig, ax = plt.subplots()"}
          - {title: "No plt.close(fig)", accent: "0F7490", body: "Each open figure holds memory, and matplotlib warns after 20"}
          - {title: "ax= on relplot", accent: "0EA5C9", body: "Figure-level functions make their own figure"}
          - {title: Category order, accent: "D4621A", body: "Pass order= and hue_order= so a refresh cannot reorder"}
        takeaway: Name the Axes, close the figure, match the function level and fix the order.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          The save helper in the practice code closes each figure.

      - layout: bullets
        beat: pitfalls
        section: Pitfalls
        title: Three more, about colour, size and title
        recall: Name three static-chart pitfalls about colour, size and title
        answer: "Colour that follows rank, saving at the wrong size, and a title that only labels the chart."
        bullets:
          - "**Colour that follows rank.** Fix a mapping such as CHANNEL_COLOUR and always use it"
          - "**Wrong size.** Set figsize for display and dpi for density, since scaling a small PNG up blurs it"
          - "**Title as label.** State the finding if you know it"
        takeaway: One colour per entity everywhere, saved at the final size, with a title that says something.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          If paid social is blue in one chart and orange in the next, readers learn the wrong thing.

  - title: Interactive charts in Python
    summary: Shneiderman's mantra · Plotly · Exporting · Altair
    notes: When an interaction earns its cost, and how to ship one.
    slides:
      - layout: statement
        beat: problem
        title: Interaction moves work to the reader
        recall: What is the hidden cost of an interactive chart?
        answer: "It moves work from you to the reader, who may not do it. The people who asked for the analysis will not brush a time range to find the January drop."
        kicker: The problem
        statement: "A chart with hover, zoom and a filter feels more powerful than a picture. It also moves work from you to the reader, who may not do it."
        attribution: Plotly and interactive charts
        takeaway: This lecture is about when an interaction earns its cost, as much as how to write one.
        source: notes/03-plotly-and-interactive.md
        notes: >-
          A marketing manager going through her own channel next week very well might use the controls. The people who
          asked for the Fernhill analysis will not.

      - layout: flow
        beat: fundamentals
        section: What interaction is for
        title: Overview first, then zoom, then details
        recall: What is Shneiderman's visual information-seeking mantra?
        answer: "Overview first, zoom and filter, then details on demand (Shneiderman, 1996)."
        steps:
          - {label: Overview first, sub: "see the whole", accent: "1E3A5F"}
          - {label: Zoom and filter, sub: "narrow to the part you care about", accent: "0F7490"}
          - {label: Details on demand, sub: "the exact value and its context", accent: "D4621A"}
        caption: "Read it as a sequence of reader needs. Each step suggests an interaction."
        takeaway: Interaction lets one view cover more data than a static one could, at the cost of attention.
        source: notes/03-plotly-and-interactive.md
        notes: >-
          Munzner's textbook gives the idea a formal home, with a chapter on manipulating a view. Anything hidden behind a
          hover may go unseen.

      - layout: table
        beat: fundamentals
        section: What interaction is for
        title: Choose the medium by the reader
        recall: Which medium suits an executive, an analyst, a returning manager and a member of the public?
        answer: "An executive gets a static chart with the answer in the title. An analyst gets an interactive chart or notebook. A manager who returns weekly gets a dashboard. A curious member of the public gets an interactive piece, overview first."
        header: [Your reader, Their question, Medium]
        widths: [2.6, 3.4, 2.8]
        rows:
          - ["An executive reading your memo", "\"What happened, what should we do?\"", "Static, answer in the title"]
          - ["An analyst checking your work", "\"Does this hold in my segment?\"", "Interactive chart or notebook"]
          - ["A manager returning every week", "\"What is my number, and is it okay?\"", "Dashboard (lecture 4)"]
          - ["A curious member of the public", "\"Where am I in this?\"", "Interactive piece, overview first"]
        takeaway: The reader's question picks the medium, and availability of a tool does not.
        source: notes/03-plotly-and-interactive.md
        notes: >-
          Note what is missing from the table: the case where interaction is used because it is available.

      - layout: statement
        beat: fundamentals
        section: What interaction is for
        title: If you can state the finding, state it
        recall: When should you not use hover?
        answer: "When you can state the finding. Hover is an exploration tool, in Knaflic's explanatory-versus-exploratory split."
        kicker: A working rule
        statement: "If you can state the finding, state it. Hover is an exploration tool."
        attribution: Knaflic's explanatory against exploratory split
        takeaway: Use interaction for exploration, and state the finding for everyone else.
        source: notes/03-plotly-and-interactive.md
        notes: >-
          Knaflic's split applies here too. Hover is an exploration tool.

      - layout: compare
        beat: fundamentals
        section: "Plotly Express: a chart as a data structure"
        title: Express above, graph_objects below
        recall: What are plotly's two levels?
        answer: "plotly.express takes a tidy DataFrame and names columns, like seaborn. plotly.graph_objects is the level underneath, where a figure is a list of traces and a layout."
        emphasis: left
        left:
          title: plotly.express
          tag: Start here
          bullets: ["Takes a tidy DataFrame", "You name the columns", "Like seaborn and the grammar"]
        right:
          title: plotly.graph_objects
          tag: Underneath
          bullets: ["A list of traces", "Plus a layout", "Full control"]
        takeaway: Start with Express, and drop to graph_objects when you need a control it lacks.
        source: notes/03-plotly-and-interactive.md
        notes: >-
          The note builds Fernhill's revenue by channel with px.line and custom_data.

      - layout: code
        beat: practice
        level: deep
        section: "Plotly Express: a chart as a data structure"
        title: A line chart with extra hover columns
        card: false
        lang: python
        code: |-
          fig = px.line(monthly, x="month", y="revenue",
                        color="channel",
                        color_discrete_map=colours,
                        labels={"revenue": "Revenue (£)", "month": ""},
                        custom_data=["sessions", "orders"],
                        title="Monthly revenue by channel")
          print(type(fig).__name__, len(fig.data), "traces")
          print(fig.data[0].hovertemplate)
        takeaway: Hover can show only what the browser has, so custom_data sends the columns along.
        source: notes/03-plotly-and-interactive.md
        notes: >-
          The output is Figure 4 traces, and the default hover text that every unconfigured plotly chart shows.

      - layout: compare
        beat: pitfalls
        section: "Plotly Express: a chart as a data structure"
        title: Default hover text against a template
        recall: Why is plotly's default hover text a problem?
        answer: "It shows raw field names in an order nobody chose, such as channel=Paid social and an empty label. Fixing that with a hovertemplate is most of the work of making a good one."
        emphasis: right
        left:
          title: Default
          tag: Unfinished
          bullets: ["\"channel=Paid social<br>=%{x}<br>Revenue (£)=%{y}\"", "Raw field names", "An order nobody chose"]
        right:
          title: Template
          tag: Written
          bullets: ["\"%{x|%b %Y}<br><b>£%{y:,.0f}</b>\"", "Sessions and orders from customdata", "Trace name in the extra tag"]
        takeaway: Write the hover template, because the default is what every unconfigured chart shows.
        source: notes/03-plotly-and-interactive.md
        notes: >-
          A hover template is a small format string interpreted by JavaScript, with its own syntax. The extra tag is the
          secondary box that shows the trace name.

      - layout: cards
        beat: fundamentals
        section: "Plotly Express: a chart as a data structure"
        title: A figure is data and layout, drawn by plotly.js
        recall: What is a plotly figure under the hood?
        answer: "A dictionary with data and layout keys. Python writes JSON, and plotly.js in the browser renders it."
        cards:
          - {title: data, accent: "1E3A5F", body: "A list of traces, four here: one per channel"}
          - {title: layout, accent: "0F7490", body: "Template, axes, legend, shapes and annotations"}
          - {title: plotly.js, accent: "D4621A", body: "Renders the JSON in the browser. Python draws nothing"}
        takeaway: Data and layout as JSON, drawn by plotly.js in the browser.
        source: notes/03-plotly-and-interactive.md
        notes: >-
          The printed keys are data and layout. The template none setting removes plotly's grey background, and the range
          slider is the zoom in the mantra. The vertical marker uses yref paper, which measures y as a fraction of the
          plot height.

      - layout: table
        beat: practice
        section: "Exporting: what actually ships"
        title: Inline JavaScript or a CDN
        recall: What does include_plotlyjs change about an exported plotly chart?
        answer: "True puts the plotly.js library inside the HTML, about 4.7 MB, and it works offline forever. cdn loads the library from the network, about 10 KB, and needs a connection whenever it is opened."
        header: [Setting, File size, Needs a network]
        widths: [3, 2, 3]
        rows:
          - ["include_plotlyjs=True", "4,713 KB", "No, works offline"]
          - ["include_plotlyjs=\"cdn\"", "10 KB", "Yes, every time it opens"]
        takeaway: Email the inline version and host the CDN version, and a page of twenty charts loads the library once.
        source: notes/03-plotly-and-interactive.md
        notes: >-
          The difference is the plotly.js library. The static copy comes from Kaleido, which drives a headless Chrome behind
          the scenes, so write_image fails on a machine with no browser.

      - layout: image
        beat: pitfalls
        section: "Exporting: what actually ships"
        title: Always export a static copy too
        kicker: The static copy
        recall: Why export a static copy of an interactive chart?
        answer: "Hover is inaccessible on a phone, invisible in print and unreachable from a keyboard unless someone built for it. Anything that matters must be visible without it."
        image: ../../assets/sources/images/viz-plotly-revenue-by-channel.png
        caption: "Plotly chart of monthly revenue by channel with a range slider and marked budget cut."
        bullets:
          - "**Phone**: hover is inaccessible"
          - "**Print**: hover is invisible"
          - "**Keyboard**: unreachable by default"
          - "**Exact values**: a linked data table"
        takeaway: Anything that matters must be visible without hover, so export a static copy that shows what matters.
        source: notes/03-plotly-and-interactive.md
        notes: >-
          A PNG cannot show the hover, which is the reason to ship the interactive file alongside it.

      - layout: code
        beat: practice
        level: deep
        section: A filter without a server
        title: A dropdown that flips visibility
        card: false
        lang: python
        code: |-
          choice = go.Figure()
          names = [fernhill.LABELS[c] for c in fernhill.CHANNELS]
          for name in names:
              choice.add_trace(go.Scatter(
                  x=wide.index, y=wide[name], name=name,
                  visible=name == names[0]))
          buttons = [dict(label=name, method="update",
                          args=[{"visible": [n == name for n in names]}])
                     for name in names]
          choice.update_layout(updatemenus=[dict(buttons=buttons)])
          print(buttons[2]["label"], buttons[2]["args"][0]["visible"])
        takeaway: The visible list is the whole trick, and the Email button shows the third trace only.
        source: notes/03-plotly-and-interactive.md
        notes: >-
          Abridged from the note. The output is Email followed by False, False, True, False. A dropdown needs no Python at
          runtime, because the figure holds every trace.

      - layout: compare
        beat: pitfalls
        section: A filter without a server
        title: What a static file can filter
        recall: What limits a filter built from plotly traces?
        answer: "All the data ships inside the HTML. Three years of monthly data is fine, a filter across ten million rows is not, and when a choice has to trigger a new query you need a server."
        emphasis: right
        left:
          title: Fine
          tag: Ships in the page
          bullets: ["Three years of monthly data", "Choice only flips visibility"]
        right:
          title: Outgrown
          tag: Needs a server
          bullets: ["A filter across ten million rows", "A choice that triggers a new query", "Streamlit in lecture 4"]
        takeaway: When the user's choice must trigger a query, a static file is the wrong tool.
        source: notes/03-plotly-and-interactive.md
        notes: >-
          This brings us to Streamlit in lecture 4.

      - layout: code
        beat: practice
        level: deep
        section: Linked views with Altair
        title: Brush one chart, zoom another
        card: false
        lang: python
        code: |-
          brush = alt.selection_interval(encodings=["x"])
          overview = (alt.Chart(story).mark_line()
                      .encode(x=alt.X("month:T"), y="revenue:Q")
                      .properties(width=640, height=90)
                      .add_params(brush))
          detail = (alt.Chart(story).mark_line(point=True)
                    .encode(x=alt.X("month:T",
                                    scale=alt.Scale(domain=brush)),
                            y="rate_pct:Q")
                    .properties(width=640, height=220))
          linked = alt.vconcat(overview, detail)
        takeaway: The only link between the panels is scale=alt.Scale(domain=brush).
        source: notes/03-plotly-and-interactive.md
        notes: >-
          Abridged from the note. Open practice/output/linked_brush.html and drag over the top panel. No event handler is
          written anywhere.

      - layout: flow
        beat: fundamentals
        section: Linked views with Altair
        title: A selection is a declared parameter
        recall: How does Altair link two charts?
        answer: "A selection parameter is declared on one chart and used as another's scale domain or filter, with no event-handling code."
        steps:
          - {label: Declare, sub: "selection_interval on x", accent: "1E3A5F"}
          - {label: Attach, sub: "add_params on the overview", accent: "0F7490"}
          - {label: Use, sub: "as the detail's scale domain", accent: "D4621A"}
        caption: "Six or seven kilobytes of specification ship, with the data inline."
        takeaway: Vega-Lite made interaction part of the specification and not a callback.
        source: notes/03-plotly-and-interactive.md
        notes: >-
          The saved file is 6,749 bytes, with the libraries loaded from a CDN. Coordinating several views is where the
          grammar shows its advantage over plotly.

      - layout: compare
        beat: pitfalls
        section: Linked views with Altair
        title: Two tools, two opposite limits
        recall: What are the data limits of plotly and Altair?
        answer: "Plotly ships every point to the browser, so the file grows with the rows. Altair embeds the data in its specification and raises MaxRowsError above 5,000 rows by default. Aggregate first or pass a URL."
        left:
          title: Plotly
          tag: Strongest at one rich chart
          bullets: ["Every point ships to the browser", "File and rendering grow with rows"]
        right:
          title: Altair
          tag: Strongest at linked views
          bullets: ["Spec embeds the data", "MaxRowsError above 5,000 rows", "Aggregate first, or pass a URL"]
        takeaway: Aggregate before you chart, because both tools carry the data to the browser.
        source: notes/03-plotly-and-interactive.md
        notes: >-
          The guard is a default. For more than 5,000 rows aggregate first or pass a URL.

