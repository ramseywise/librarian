      - layout: bullets
        beat: pitfalls
        section: "Vega-Lite: say what, not how"
        title: What the grammar costs
        recall: What is the price of working in a grammar like Vega-Lite?
        answer: "You can only say what the grammar can say. Placing text at a pixel offset such as dy: -150 is a hack that a resize would break, and dates need scale type utc or the first January tick moves."
        bullets:
          - "**Only what it can say.** The grammar thinks in data"
          - "**dy: -150** places text by pixels, and a resize would break it"
          - "**scale: utc** is needed, or the 2023 label was lost on one machine"
          - "**Dates** need the most care in all three libraries"
        takeaway: A grammar fights you on pixel-level annotation and on dates.
        source: notes/04-javascript-d3-vega-lite-observable-plot.md
        notes: >-
          Without utc, Vega-Lite reads 2023-01-01 in local time, which moved the first January tick on the author's machine.

      - layout: code
        beat: practice
        level: deep
        section: "Observable Plot: the short version"
        title: Marks plus options
        card: false
        lang: javascript
        code: |-
          const figure = Plot.plot({
            y: { domain: [0, 60], grid: true },
            x: { label: null, ticks: "year", tickFormat: "%Y" },
            color: { domain: ORDER, range: COLOURS, legend: false },
            marks: [
              Plot.ruleY([0]),
              Plot.lineY(rows, { x: "date", y: "rate",
                                 stroke: "channel", tip: true }),
              Plot.text(rows, Plot.selectLast({
                x: "date", y: "rate", z: "channel",
                text: "channel", textAnchor: "start", dx: 6 })),
              Plot.ruleX([new Date("2025-01-01")]),
            ],
          });
        takeaway: lineY groups rows by stroke, and selectLast makes end labels one mark.
        source: notes/04-javascript-d3-vega-lite-observable-plot.md
        notes: >-
          Abridged from plot_chart.mjs. It is the shortest of the three. tip true adds a tooltip in a browser.

