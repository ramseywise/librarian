      - layout: flow
        beat: wrap
        section: Comparing the three
        title: The analyst's default progression
        recall: In what order should an analyst reach for these tools?
        answer: "Altair or plotly from Python while you can, Vega-Lite when a product team needs to embed a chart defined by data, Plot when already in JavaScript and wanting speed, and D3 for a chart that needs custom design and is worth a few days."
        steps:
          - {label: Altair or plotly, sub: "from Python, while you can", accent: "0EA5C9"}
          - {label: Vega-Lite, sub: "a product embeds a data-defined chart", accent: "0F7490"}
          - {label: Plot, sub: "already in JavaScript, want speed", accent: "1E3A5F"}
          - {label: D3, sub: "custom design, worth a few days", accent: "5B21B6"}
        takeaway: Climb down the ladder only when the rung above cannot say it.
        source: notes/04-javascript-d3-vega-lite-observable-plot.md
        notes: >-
          Most business charts do not need D3.

      - layout: cards
        beat: pitfalls
        section: Pitfalls
        title: Four JavaScript chart pitfalls
        recall: Name four ways a JavaScript chart goes wrong
        answer: "Reaching for D3 first, local time against UTC, forgetting xmlns on standalone SVG, and expecting layout from jsdom."
        cards:
          - {title: D3 first, accent: "5B21B6", body: "The most flexible and the slowest. Most business charts do not need it"}
          - {title: Local time and UTC, accent: "D4621A", body: "Use scaleUtc and utcFormat throughout, or labels drift"}
          - {title: No xmlns, accent: "1E3A5F", body: "resvg and other SVG tools need it on standalone SVG"}
          - {title: jsdom has no layout, accent: "0F7490", body: "getBBox and text measuring need a real browser"}
        takeaway: Start high on the ladder, use UTC throughout and test layout in a real browser.
        source: notes/04-javascript-d3-vega-lite-observable-plot.md
        notes: >-
          Date handling is where all three libraries need the most care.

      - layout: bullets
        beat: pitfalls
        section: Pitfalls
        title: Three more, about files, colour and hit targets
        recall: Name three JavaScript chart pitfalls about files, colour and hit targets
        answer: "Importing modules from file URLs, colouring text like the series, and hit targets as thin as the mark."
        bullets:
          - "**file:// and modules.** Browsers refuse ES module imports from local files, so serve the folder"
          - "**Text in the series colour.** Yellow on a pale surface fails contrast, so use ink"
          - "**Thin hit targets.** Add a larger invisible target, or a Voronoi overlay for dense points"
        takeaway: Serve the folder, ink the text and make the target bigger than the mark.
        source: notes/04-javascript-d3-vega-lite-observable-plot.md
        notes: >-
          It is tempting to colour text like the series in D3, where nothing stops you.

  - title: Rules of thumb
    agenda: false
    divider: false
    slides:
      - layout: cards
        beat: wrap
        title: Six answers to give in an interview
        card: false
        recall: How do you answer the Figure, hover, plotly, Altair, D3 and date questions?
        answer: "A Figure is the canvas and owns saving, while an Axes is one plot. Interaction is the wrong choice when you know the finding. A plotly figure is data and layout rendered by plotly.js. Altair links charts with a selection used as a scale domain. D3 is a toolkit that binds data to the DOM. The common date bug is parsing as UTC and formatting in local time."
        cards:
          - {title: Figure and Axes, accent: "1E3A5F", body: "The canvas owns saving. An Axes is one plot with its own coordinates"}
          - {title: Interaction, accent: "D4621A", body: "Wrong when you already know the finding. State it"}
          - {title: Plotly, accent: "0F7490", body: "JSON data and layout, rendered by plotly.js"}
          - {title: Altair, accent: "0EA5C9", body: "A declared selection used as another chart's scale domain"}
          - {title: D3, accent: "5B21B6", body: "A toolkit that binds data to the DOM, not a charting library"}
          - {title: Dates, accent: "1E3A5F", body: "Parse as UTC and format in local time, and ticks move"}
        takeaway: Declutter once, state the finding, and climb the ladder only as far as the chart needs.
        source: notes/02-matplotlib-and-seaborn.md
        notes: >-
          The interview tables in the three notes also cover small multiples, sequential against diverging, PNG against
          SVG, include_plotlyjs, accessibility of hover, the data join and testing without a browser.

