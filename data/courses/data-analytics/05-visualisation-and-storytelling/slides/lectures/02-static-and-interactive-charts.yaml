        recall: Why does the static Plot exhibit use direct labels instead of a legend?
        answer: "legend: true makes Plot return an HTML figure with swatches outside the SVG, and resvg only renders SVG. In a browser you would turn the legend on."
        image: ../../assets/sources/images/viz-js-observable-plot-repeat-rate.png
        caption: "Observable Plot line chart of the same repeat-rate data with end labels."
        bullets:
