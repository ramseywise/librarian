          tag: What
          bullets: ["Data", "Mark", "Encodings by field and type"]
        right:
          title: Compiler derives
          tag: How
          bullets: ["Scales and axes", "Grid and legend", "Correct ordering"]
        takeaway: "Scales, axes, grid, legend and ordering, all derived from field types."
        source: notes/04-javascript-d3-vega-lite-observable-plot.md
        notes: >-
          The compile step printed 3 Vega mark groups, 3 scales, 3 axes and 1 legend.

      - layout: code
        beat: practice
        level: deep
        section: "Vega-Lite: say what, not how"
        title: The same chart as a specification
        card: false
        lang: javascript
        code: |-
          const spec = {
            data: { values: data },
            layer: [{
              mark: { type: "line", strokeWidth: 2 },
              encoding: {
                x: { field: "month", type: "temporal",
                     scale: { type: "utc" } },
                y: { field: "rate", type: "quantitative",
                     scale: { domain: [0, 60] } },
                color: { field: "channel", type: "nominal",
                         scale: { domain: ORDER, range: COLOURS } },
              },
            }],
          };
          const compiled = vl.compile(spec).spec;
        takeaway: Scales, axes, grid and legend are gone from the code.
        source: notes/04-javascript-d3-vega-lite-observable-plot.md
        notes: >-
          Abridged from vegalite_chart.mjs. The full spec adds the budget cut rule and text layers and some styling.

      - layout: image
        beat: practice
