      - layout: steps
        beat: fundamentals
        section: "D3: every decision is yours"
        title: The D3 chart in five parts
        recall: What are the parts of the D3 repeat-rate chart?
        answer: "Scales turn data into pixels and colours, axes are drawn from the scales and restyled, a data join makes one path per channel, direct labels, a legend and an event marker follow, and a hover layer of invisible targets finishes."
        steps:
          - {title: Scales, text: "Ordinary functions: y(30) returns a pixel", n: "1", accent: "1E3A5F"}
          - {title: Axes, text: "Generated from scales, then styled down", n: "2"}
          - {title: Data join, text: "One path per channel", n: "3", accent: "D4621A"}
          - {title: Labels, legend, marker, text: "Everything a high-level library would do", n: "4"}
          - {title: Hover layer, text: "A big invisible circle at each point", n: "5"}
        takeaway: "Scales, axes, a data join, direct labels and a hover layer: the grammar by hand."
        source: notes/04-javascript-d3-vega-lite-observable-plot.md
        notes: >-
          The module takes a container and data and touches nothing specific to Node, so the same file runs in a browser.
          The call pattern hands a selection to a function so you can keep chaining.

      - layout: statement
        beat: fundamentals
        section: "D3: every decision is yours"
        title: The data join
        recall: What is the D3 data join?
        answer: "Matching a list of data to a set of elements: needed elements get created, extra ones removed and existing ones updated, so the page follows the data."
        kicker: The idea that makes D3 D3
        statement: "Make the set of paths on the page match this list. Run the same code with new data and the page follows."
        attribution: selectAll("path").data(series).join("path")
        takeaway: See a chart as a list of data and a matching list of elements.
        source: notes/04-javascript-d3-vega-lite-observable-plot.md
        notes: >-
          Murray's book teaches this slowly and well from a blank page, and Meeks and Dufour's third edition goes further
          with D3 v7 and modern frameworks.

      - layout: code
        beat: practice
        level: deep
        section: "D3: every decision is yours"
        title: Scales and the join, in D3
        card: false
        lang: javascript
        code: |-
          const x = d3.scaleUtc(d3.extent(rows, (d) => d.date),
                                [margin.left, width - margin.right]);
          const y = d3.scaleLinear([0, 60],
                                   [height - margin.bottom, margin.top]);
          const colour = d3.scaleOrdinal(order, colours);

          const line = d3.line().x((d) => x(d.date)).y((d) => y(d.rate));
          const series = d3.groups(rows, (d) => d.channel);
          svg.append("g").selectAll("path").data(series).join("path")
            .attr("fill", "none").attr("stroke-width", 2)
            .attr("stroke", ([name]) => colour(name))
            .attr("d", ([, values]) => line(values));
        takeaway: Scales map data to pixels, and the join makes one path per channel.
        source: notes/04-javascript-d3-vega-lite-observable-plot.md
        notes: >-
          Abridged from repeat_chart.mjs. Axes, labels, legend and the hover layer are the other parts of the chart.

