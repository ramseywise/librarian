      - layout: compare
        beat: fundamentals
        section: "Vega-Lite: say what, not how"
        title: You state it, the compiler derives it
        recall: What does Vega-Lite derive for you that D3 makes you write?
        answer: "You state data, mark and encodings. The compiler derives the scales, axes, grid, legend and correct ordering from the field types, giving 3 scales, 3 axes and 1 legend."
        emphasis: right
        left:
