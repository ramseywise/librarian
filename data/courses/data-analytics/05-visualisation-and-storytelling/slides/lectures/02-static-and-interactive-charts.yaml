        level: core
        section: Which tool, when
        title: Which tool, when
        recall: Which tool fits quick exploration, an emailed interactive, linked brushing, publication figures, custom forms and live queries?
        answer: "plotly.express for notebook exploration, plotly with inline JS to email, Altair for linked brushing, matplotlib for publication figures, D3 for custom interaction and new chart forms, Streamlit or a BI tool for live queries."
        header: [Need, Reach for, Reason]
        widths: [3.2, 2.2, 3.6]
        rows:
          - ["Quick exploration in a notebook", "plotly.express", "Hover and zoom in one line"]
          - ["A one-off interactive to email", "Plotly, inline JS", "One self-contained file"]
          - ["Linked brushing across views", "Altair", "Selections are declared"]
          - ["Publication or slide figures", "Matplotlib", "Control of every element"]
          - ["Custom interaction, new chart forms", "D3", "See the JavaScript section"]
          - ["A filtered view on live queries", "Streamlit or a BI tool", "See lecture 4"]
        takeaway: Pick by the need, from one line of express up to D3 when nothing else can say it.
        source: notes/03-plotly-and-interactive.md
        notes: >-
          The dashboard stacks lecture is for choosing the stack.

      - layout: cards
        beat: pitfalls
        section: Pitfalls
        title: Four interactive-chart pitfalls
        recall: Name four ways an interactive chart goes wrong
        answer: "Hiding the finding behind hover, default hover text, emailing a CDN file, and too much data in the page."
        cards:
          - {title: Finding behind hover, accent: "1E3A5F", body: "Most readers will not discover it. Put it in the title"}
          - {title: Default hover text, accent: "0F7490", body: "Looks unfinished and leaks column names. Write a template"}
          - {title: Emailing a CDN file, accent: "D4621A", body: "Opens blank on a plane. Use the inline setting"}
          - {title: Too much data, accent: "5B21B6", body: "Every point ships. Aggregate, or use go.Scattergl"}
        takeaway: State the finding, write the template, inline the library and aggregate the data.
        source: notes/03-plotly-and-interactive.md
        notes: >-
          WebGL traces are for a large scatter. The inline setting is include_plotlyjs=True.

      - layout: bullets
        beat: pitfalls
        section: Pitfalls
        title: Three more, about touch, print and hovermode
        recall: Name three interactive-chart pitfalls about touch, print and hovermode
        answer: "Relying on the mouse, forgetting the static version, and leaving plotly's hovermode at its default on many series."
        bullets:
          - "**Relying on the mouse.** Test on a phone, and keep a table view"
          - "**No static version.** Slides, PDFs and printouts cannot run JavaScript, so export a PNG"
          - "**Default hovermode on many series.** Unified hover helps with four lines and covers the chart with forty"
        takeaway: Test on touch, export a PNG, and choose the hovermode deliberately.
        source: notes/03-plotly-and-interactive.md
        notes: >-
          Tap behaviour differs from hover, so test on a phone.

  - title: JavaScript under the charts
    summary: The ladder · D3 · Vega-Lite · Observable Plot · Choosing
    notes: Draw one chart three times, at three levels of abstraction.
    slides:
      - layout: statement
        beat: problem
        title: Every chart in a product is JavaScript
        recall: Why does a Python analyst need to know about the JavaScript layer?
        answer: "Every chart on a news site or inside a product is JavaScript in a browser. Sooner or later someone asks for a chart no library offers, or one that has to live in a web product and not a notebook."
        kicker: The problem
        statement: "Every chart you see on a news site or inside a product is JavaScript in a browser, and so was every interactive chart in the interactive-chart section."
        attribution: Whatever language wrote its configuration
        takeaway: One Fernhill chart drawn three times shows what each level gives and costs.
        source: notes/04-javascript-d3-vega-lite-observable-plot.md
        notes: >-
          Python analysts can go a long way without touching that layer. This section draws one chart at three levels of
          abstraction.

      - layout: flow
        beat: fundamentals
        section: Three levels of abstraction
        title: A ladder from marks to the browser
        recall: Where do Observable Plot, Vega-Lite, Vega and D3 sit relative to each other?
        answer: "Observable Plot and Vega-Lite are high-level. Vega-Lite compiles to Vega. D3 is the base under both, and everything ends as SVG or Canvas in the browser."
        steps:
          - {label: Observable Plot, sub: "marks and options", accent: "0EA5C9"}
          - {label: Vega-Lite, sub: "a JSON grammar", accent: "0F7490"}
          - {label: Vega, sub: "a lower-level JSON grammar", accent: "1E3A5F"}
          - {label: D3, sub: "scales, joins, shapes", accent: "5B21B6"}
          - {label: SVG or Canvas, sub: "in the browser", accent: "D4621A"}
        caption: "The question at each rung is how much of the chart you have to say."
        takeaway: The higher you stand, the less you say and the less you can change.
        source: notes/04-javascript-d3-vega-lite-observable-plot.md
        notes: >-
          In the note's diagram Plot leads to Vega-Lite and to D3, Vega-Lite leads to Vega, and Vega and D3 both end at SVG
          or Canvas.

      - layout: cards
        beat: fundamentals
        section: Three levels of abstraction
        title: Three libraries, three jobs
        recall: What is each of D3, Vega-Lite and Observable Plot?
        answer: "D3 is a toolkit for binding data to document elements, with scales, axes and shapes. Vega-Lite is the grammar from the first lecture written as JSON that compiles to Vega. Observable Plot is a concise JavaScript API over D3, the counterpart of seaborn."
        cards:
          - {title: D3, accent: "5B21B6", body: "Not a charting library, since it has no barChart(). A toolkit that binds data to elements"}
          - {title: Vega-Lite, accent: "0F7490", body: "The grammar as JSON. Altair generates this same JSON"}
          - {title: Observable Plot, accent: "0EA5C9", body: "By the people behind D3. The JavaScript counterpart of seaborn"}
        takeaway: A chart written in Altair is a Vega-Lite chart.
        source: notes/04-javascript-d3-vega-lite-observable-plot.md
        notes: >-
          D3's founding paper argued for working directly on the document model, so every standard browser tool works on
          what it produces. Vega-Lite compiles to a longer Vega specification with the axes, legends and scales filled in.

