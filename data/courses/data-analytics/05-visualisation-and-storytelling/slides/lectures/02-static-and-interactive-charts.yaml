        title: D3, Vega-Lite and Observable Plot side by side
        recall: How do D3, Vega-Lite and Observable Plot compare on code, strengths and weaknesses?
        answer: "D3 took 67 lines, you describe elements and geometry, it is good at anything and fights you on time. Vega-Lite took 33 lines, a JSON spec, good at portable specs and linked views, and fights you on pixel annotation. Plot took 24 lines, marks and options, good at fast exploration and fights you on bespoke interaction."
