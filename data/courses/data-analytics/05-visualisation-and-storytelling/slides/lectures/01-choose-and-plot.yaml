          - {title: Zero baseline, accent: "5B21B6", body: "Bars start at zero, lines may zoom if the axis is plain"}
        takeaway: Decide what the chart must say, then pick position, zero and colour to say it honestly.
        source: notes/01-grammar-and-chart-choice.md
