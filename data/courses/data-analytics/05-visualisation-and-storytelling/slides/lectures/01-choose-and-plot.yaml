      - layout: table
        beat: practice
        level: core
        section: Which chart answers which question
        title: Which chart answers which question
        recall: Which call draws a line, a bar, a histogram, a box and a scatter?
        answer: "ax.plot or series.plot() for a line, series.plot.barh() or sns.barplot for bars, ax.hist or sns.histplot, sns.boxplot, and sns.scatterplot or sns.regplot."
        header: [Question, Chart, Call]
        widths: [3.6, 2.6, 3.6]
        rows:
          - ["How does it change over time?", "Line", "ax.plot, series.plot()"]
          - ["How do categories compare?", "Sorted bars from zero", "series.plot.barh()"]
          - ["What shape does one column have?", "Histogram", "ax.hist, sns.histplot"]
          - ["How do distributions differ?", "Box or violin", "sns.boxplot"]
          - ["How do two numbers relate?", "Scatter", "sns.scatterplot"]
          - ["Do all numeric columns relate?", "Pair plot, heatmap", "sns.pairplot"]
          - ["Is the pattern the same across groups?", "Small multiples", "sns.catplot(col=...)"]
          - ["A value over two categories?", "Heatmap of a pivot table", "sns.heatmap"]
        takeaway: Choose from the question, and do not start from the chart you made last time.
        source: notes/01b-plotting-your-own-data.md
        notes: >-
          McKinney uses pairplot for this exploratory pass, and notes that barplot draws each bar as a mean with a 95%
          confidence interval by default. A pie compares angles, which people judge worse than position and length, and a
          chart with two y axes implies a relationship set by whichever scales you picked. Pillar 05 returns to both.

      - layout: bullets
        beat: practice
        level: deep
        section: Which chart answers which question
        title: Check colormap, outliers and counts before reading a shape
        recall: Why is jet a poor default colormap compared with viridis?
        answer: "A default colormap should have steadily rising luminance. Viridis rises monotonically from 0.18 to 0.88, while jet is not monotonic and its two ends measure 0.17 and 0.27, so in grayscale the high end looks like the low end."
        bullets:
          - "**Rising luminance.** Viridis 0.18 to 0.88, while jet's ends are **0.17** and **0.27**"
          - "**Outliers swamp a scale.** Clip with plt.clim and extend the colourbar"
          - "**Many points.** plt.plot with markers is faster than scatter past a few thousand"
          - "**Group sizes.** The marathon violin hid **7** runners over 80"
        takeaway: Check the colormap's luminance, clip outliers visibly and count each group before reading a shape.
        source: notes/01b-plotting-your-own-data.md
        notes: >-
          The luminance numbers come from the note's own run of the book's formula on current matplotlib. The speed claim is
          qualitative, with no timing given.

      - layout: code
        beat: pitfalls
        level: deep
        section: Old notebooks and current seaborn
        title: Old plotting code breaks on current seaborn
        recall: Why does sns.regplot with positional columns fail on current seaborn?
        answer: "Since seaborn 0.12 data columns are passed by keyword, as x= and y=. factorplot became catplot, which draws a strip plot by default, so state kind=."
        lang: python
        code: |-
          try:
              sns.regplot("total_bill", "tip", data=tips)
          except TypeError as e:
              print("TypeError:", str(e)[:70])
          print(hasattr(sns, "factorplot"),
                hasattr(sns, "catplot"))
          sns.regplot(x="total_bill", y="tip", data=tips)
        bullets:
          - "Error: **multiple values for data**"
          - "Prints **False True**"
          - "State **kind=** for catplot"
        takeaway: Pass columns by keyword, and rename factorplot to catplot.
        source: notes/01b-plotting-your-own-data.md
        notes: >-
          These changes account for most of the errors you will meet in old plotting code, such as 5_Plotting.ipynb and the
          McKinney notebooks.

      - layout: bullets
        beat: practice
        section: Saving and showing
        title: Save by extension, and close what you open
        recall: Which file format and which habits suit saving a figure?
        answer: "PNG for screens and notebooks, SVG or PDF for anything scaled or printed. Call tight_layout before saving, and plt.close(fig) when making figures in a loop."
        bullets:
          - "**PNG** for screens and notebooks; **SVG or PDF** for scaled or printed"
          - "**fig.tight_layout()** stops labels overlapping"
          - "**plt.close(fig)** in a loop, since each figure holds memory"
          - "In Jupyter, every drawing call for a figure goes in **one cell**"
        takeaway: The extension picks the format, and tight_layout comes before the save.
        source: notes/01b-plotting-your-own-data.md
        notes: >-
          The book's example uses dpi=400, and bbox_inches="tight" trims surrounding whitespace.

      - layout: cards
        beat: pitfalls
        section: Pitfalls
        title: Four plotting pitfalls with a one-line fix
        recall: Name four matplotlib habits that mislead, and the one-line fix for each
        answer: "Using plt. with several plots, unsorted x on a line, connecting categories with a line, and bars not starting at zero."
        cards:
          - {title: "plt. with many plots", accent: "1E3A5F", body: "It lands on the current Axes. Use ax. methods"}
          - {title: Unsorted x, accent: "0F7490", body: "A line connects in row order. sort_index() first"}
          - {title: Lines for categories, accent: "0EA5C9", body: "A line implies order. Use bars for products or regions"}
          - {title: Bars off zero, accent: "D4621A", body: "A shortened bar misstates the ratio. Show dots or differences"}
        takeaway: Name the Axes, sort the index, match the mark to the data and start bars at zero.
        source: notes/01b-plotting-your-own-data.md
        notes: >-
          Also on the list are different scales across panels, overplotting, one histogram bin count, confidence bands read
          as data, and a title that names a column.

      - layout: bullets
        beat: pitfalls
        section: Pitfalls
        title: Five more ways a plot misleads
        card: false
        recall: Which five further pitfalls does the plotting chapter list?
        answer: "Panels on different scales, overplotting, one histogram bin count, confidence bands read as data, and a title that names a column."
        bullets:
          - "**Different scales.** Use sharey=True across panels"
          - "**Overplotting.** Lower alpha, or use histplot or hexbin"
          - "**One bin count.** Try several"
          - "**Bands read as data.** The regplot band is uncertainty about the line"
          - "**Title as label.** Say what you found, not the column"
        takeaway: Share the scales, thin the dots, and let the title say what to see.
        source: notes/01b-plotting-your-own-data.md
        notes: >-
          Revenue names a column. Revenue rises and jumps in December tells the reader what to see.

