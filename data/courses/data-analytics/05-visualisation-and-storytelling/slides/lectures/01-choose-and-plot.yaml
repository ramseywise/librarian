        section: "Seaborn: start from the table"
        title: Axes-level or figure-level seaborn
        recall: What is the difference between axes-level and figure-level seaborn functions?
        answer: "Axes-level functions such as boxplot and scatterplot draw on an Axes you give them. Figure-level functions such as catplot, relplot and displot make their own Figure, take col= and row=, and return a FacetGrid."
        emphasis: right
        left:
          title: Axes-level
          tag: boxplot, scatterplot
          bullets: ["Draw on an Axes you pass in", "Sized by figsize", "Return an Axes"]
        right:
          title: Figure-level
          tag: catplot, relplot, displot
          bullets: ["Build their own Figure", "Take col= and row=", "Return a FacetGrid, sized by height= and aspect="]
        takeaway: Facets need figure-level functions, because they lay out the whole Figure.
        source: notes/01b-plotting-your-own-data.md
        notes: >-
          Rather than draw four lines on one plot, draw one plot four times on the same scale, one per group.

