        answer: "The grammar composes a chart from data, marks, encodings, statistics, scales, coordinates and facets. Position on a common scale is read most accurately. Dual axes are arbitrary, so use panels or an index. Bars start at zero because length is the value, while lines may zoom."
        cards:
