      - layout: code
        beat: practice
        level: deep
        section: "Line charts: change over time"
        title: Draw, label, annotate, save on one Axes
        recall: What is the whole line chart workflow on one Axes?
        answer: "Draw with ax.plot, label and annotate with methods on ax, then save and close the figure."
        lang: python
        code: |-
          fig, ax = plt.subplots(figsize=(8, 3.4))
          ax.plot(regular.index, regular, color=GREY,
                  linewidth=0.8, label="daily")
          ax.plot(regular.index, regular.rolling(7).mean(),
                  color=TEAL, linewidth=2, label="7-day mean")
          ax.set(title="Daily revenue rises through the year"
                       " and jumps in December",
                 ylabel="revenue", ylim=(0, None))
          ax.legend(frameon=False, loc="upper left")
          fig.tight_layout()
          fig.savefig("da01-plotting-line.png")
          plt.close(fig)
        takeaway: Every labelling call is a method on ax, and the title says what you found.
        source: notes/01b-plotting-your-own-data.md
        notes: >-
          The note also adds an annotate call for the December bump, left out here for space.

