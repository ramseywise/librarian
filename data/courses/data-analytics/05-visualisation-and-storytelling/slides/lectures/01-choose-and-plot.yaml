        bullets:
          - "**Correlation 0.933,** by design, since visitors was built from revenue plus noise"
          - "**Lower the opacity** when dots pile up"
          - "**regplot** adds a fitted line with a confidence band"
          - "**Causation** is pillar 03, and the fit cannot show it"
        takeaway: A fit shows that two numbers move together, and not why.
        source: notes/01b-plotting-your-own-data.md
        notes: >-
          Colour can carry a third variable. The tight fit is by design, so do not expect real data to look like this.

      - layout: compare
