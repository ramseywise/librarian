deck:
  title: Dashboards and Story
  subtitle: A number to watch, a sentence to send
  tagline: "Dashboards · Streamlit · BI tools · Storytelling"
  reference: "Notes: data-analytics/05-visualisation-and-storytelling, note 5"
  output: 03-dashboards-and-story.pptx
  notes: >-
    This is the fourth lecture of the visualisation series, after the three on choosing and drawing charts. It covers step 3.
    By the end you should be able to tell a dashboard from an explanatory story, build one that pairs a growth metric with a
    health metric, read a Streamlit script in rerun terms, choose between Streamlit and a BI tool by asking who will change it,
    and turn an analysis into one sentence, one chart and a three-act story with a holdout.

