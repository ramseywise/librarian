      - layout: cards
        beat: fundamentals
        level: core
        section: Scoring against the truth
        title: Different methods answer different questions
        recall: Why do CEM's £20.96 and entropy balancing's £26 not disagree?
        answer: "CEM dropped 41% of joiners and the true effect for the customers it kept is £17.31 against £23.38 for all joiners. The no-replacement match kept 53% with a true effect of £15.32. Measured against their own targets all three miss by about £3."
        cards:
          - {title: CEM, accent: fundamentals, body: "Dropped **41%** of joiners. Truth for those kept is **£17.31**"}
          - {title: No replacement, accent: practice, body: "Kept **53%**. Truth for those kept is **£15.32**"}
          - {title: The trap, accent: pitfalls, body: "£18.26 looks near the true ATE of £15.96, which it does **not estimate**"}
        takeaway: A matched estimate has to say who was kept.
        source: notes/05-matching-and-weighting.md
        notes: >-
          Iacus, King and Porro call the result of pruning treated units a local SATT and ask authors to be transparent about
          it. Hainmueller's reason for keeping every treated unit is the same. The club does more for frequent buyers, so
          dropping them moves the target down.

      - layout: image
        beat: pitfalls
