        section: Scoring against the truth
        title: One dataset is one draw, so score twenty
        kicker: Gap from the truth over 20 generated datasets
        recall: What do twenty datasets show that one cannot?
        answer: "Every sound ATT design lands high, by 3.15 to 4.31. The perfect score of -0.11 for matching with replacement was luck, with a standard deviation of 2.42. Plain propensity weights are the worst, with a mean gap of 8.27 and a standard deviation of 7.76."
        image: ../../assets/sources/images/causal-club-estimates.png
        caption: "Eight ATT designs over twenty datasets. Every design lands high, matching's -0.11 was a good draw (mean gap 4.31), and plain weights have mean gap 8.27, SD 7.76."
        takeaway: Twenty datasets from one generator do not make a general ranking of methods.
        source: notes/05-matching-and-weighting.md
        notes: >-
          The datasets have 9,108 to 9,482 customers. Trimming the weights to scores between 0.05 and 0.95 brings the gap
          down to 3.15, at the price of changing the target. Entropy balancing and regression by arm are close and far
          steadier than matching with replacement and plain weights.

