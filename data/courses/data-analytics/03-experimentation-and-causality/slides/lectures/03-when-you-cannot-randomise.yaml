  subtitle: Confounding, quasi-experiments, matching and weighting
  tagline: "Causal inference from observational data"
  reference: "Notes: data-analytics/03-experimentation-and-causality, notes 4, 4b and 5"
  output: 03-when-you-cannot-randomise.pptx
  notes: >-
    This is the fourth lecture of the experimentation and causality series. It covers step 3. By the end you should be able
    to read a correlation without fooling yourself, tell a confounder from a mediator and a collider, spot Simpson's paradox,
    choose among weighting, difference-in-differences, instrumental variables, regression discontinuity and synthetic control,
    build a comparison group and check its balance before reading the outcome, and say honestly what an estimate assumes.

