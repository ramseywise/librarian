      - layout: cards
        beat: pitfalls
        level: core
        section: Where the £3 comes from
        title: Most of the gap is the hidden confounder
        recall: How do you reproduce the £3 with arithmetic, and what got worse?
        answer: "Omitted-variable bias is about the hidden trait's effect on spend times the imbalance it leaves: £8 per SD times 0.48 SD gives 3.81 against the measured 3.59. Engagement imbalance went from 0.29 SD before adjustment to 0.48 after."
        cards:
          - {title: The arithmetic, accent: fundamentals, body: "**£8** per SD times **0.48** SD gives **£3.81**, against £3.59 measured"}
          - {title: Imbalance grew, accent: pitfalls, body: "Engagement gap **0.29 to 0.48 SD** after balancing the logged history"}
          - {title: The floor, accent: practice, body: "A floor at zero moves **regression only**, by £1.12 once engagement is in"}
        takeaway: A perfect Love plot says nothing about the trait nobody logged.
        source: notes/05-matching-and-weighting.md
        notes: >-
          A plausible reading is that once history accounts for much of who joins, the hidden trait explains more of the
          choice that remains. We measured the change but did not prove that mechanism. Iacus, King and Porro say CEM will not
          rescue an analysis that leaves out an important covariate.

      - layout: compare
        beat: pitfalls
        level: core
        section: The bad control that helped
        title: Sessions help in one world and hurt in another
        recall: Why does the rule exclude sessions even though they helped?
        answer: "In the generator sessions do not cause spend, and adding them halves the regression gap from 4.20 to 2.01. In a second world where spend gains 14.10 per session the same control takes the estimate to 0.79 and erases a real effect (the truth is 23.38)."
        emphasis: right
        left:
          title: Sessions are a proxy
          bullets: ["Regression ATT **26.44** to **24.17**", "Gap over 20 datasets **4.20 to 2.01**", "Sessions do not cause spend here"]
        right:
          title: Sessions are a mediator
          bullets: ["**£14.10** per session", "Without the control **31.60**", "With it **0.79**, truth 23.38"]
        takeaway: The data cannot tell the two worlds apart, so the arrow from sessions to spend is an assumption.
        source: notes/05-matching-and-weighting.md
        notes: >-
          A pre-treatment proxy for engagement, such as sessions before the opening date, gives the benefit without the risk.
          Fernhill's table does not have one, so the better fix is a change to what gets logged.

      - layout: table
        beat: pitfalls
        level: deep
        section: DoWhy as the cross-check
        title: DoWhy's default clipping turned £18.75 into £39.24
        recall: What did DoWhy's defaults do to the weighting estimate?
        answer: "Its weighting estimator clips scores to 0.05 to 0.95, which caps the weight of the high-score non-joiners, so the control mean falls and the ATT rises to 39.24. With clipping off it is 17.01 against our 18.75. Both refuters passed on a biased estimate."
        header: [Estimator, "ATT (£)"]
        widths: [5.2, 2.4]
        rows:
          - [Weighting with defaults, "39.24"]
          - [Weighting with clipping off, "17.01"]
          - [Matching, "23.47"]
          - [Stratification, "20.60"]
          - [Our hand-written weights, "18.75"]
        highlight: [0]
        takeaway: Read what the estimator does, and replicate one number by hand.
        source: notes/05-matching-and-weighting.md
        notes: >-
          DoWhy writes the clipped score into the model's data frame and the next estimator reuses it. In the first run on one
          shared model matching read 26.58 and stratification 27.60. Build a new model for each estimator. The random common
          cause and placebo treatment refuters can catch a broken pipeline but not a missing confounder.

      - layout: cards
        beat: practice
        level: core
        section: "Sensitivity: what would it take?"
        title: Three checks for a hidden confounder
        recall: What did the E-value, Rosenbaum bounds and whiteboard arithmetic give?
        answer: "The E-value is 1.79 for the estimate and 1.64 for the interval's lower limit. Rosenbaum bounds on 1,972 pairs hold until gamma reaches 2.35. The whiteboard bias is about gamma times delta, the trait's pounds per SD times the imbalance left."
        cards:
          - {title: E-value, accent: fundamentals, body: "**1.79** for the estimate, **1.64** for the lower limit"}
          - {title: Rosenbaum bounds, accent: practice, body: "The test of no effect holds until gamma reaches **2.35**"}
          - {title: Whiteboard, accent: wrap, body: "Bias is about **gamma times delta**"}
        takeaway: Each of these checks answers a narrower question than it seems.
        source: notes/05-matching-and-weighting.md
        notes: >-
          The E-value is the minimum association with both treatment and outcome that a hidden confounder would need to
          explain the result away. For a ratio RR above 1 it is RR plus the square root of RR times RR minus 1. The ratio of
          means is 136.13 over 109.64, which is 1.242.

      - layout: compare
        beat: pitfalls
        level: core
        section: "Sensitivity: what would it take?"
        title: The checks answered the wrong question, except the arithmetic
        recall: How did each check score against the planted confounder?
        answer: "The real bias overstated the effect by about 15% and moving the estimate to the truth needs an E-value of just 1.20, so 1.79 gives no assurance about size. Gamma is a worst case, and engagement's median hidden odds ratio of 1.68 and 90th percentile of 3.34 exceed 2.35 yet the effect is real. Gamma times delta gave 4.16 against 3.11."
        emphasis: right
        left:
          title: Erase the effect entirely
          bullets: ["E-value **1.79** and Gamma **2.35**", "Honest reading: the club **probably does something**", "Truth needs an E-value of only **1.20**"]
        right:
          title: Size the bias
          bullets: ["**£4.16** against £3.11 on this dataset", "**£3.81** against £3.59 on average", "But it used the **true** gamma and delta"]
        takeaway: Report estimate, balance, who was kept and these checks together.
        source: notes/05-matching-and-weighting.md
        notes: >-
          Gamma varies only the confounder's link with treatment and sets its link with the outcome at infinity, so it
          describes a trait that also fully decides the outcome's direction in each pair. Engagement does not. To ask about
          size, compute the E-value for a smaller effect you would care about.

      - layout: bullets
        beat: wrap
        level: core
        section: "Sensitivity: what would it take?"
        title: Report four things together
        recall: What should a matching or weighting report contain?
        answer: "The estimate, the balance table, who was kept, and the sensitivity checks, with the trait you worry about named."
        bullets:
          - "**The estimate**, with its target named (ATE or ATT)"
          - "**Balance** before and after, so readers can judge the design"
          - "**Who was kept**, since dropping joiners moves the target"
          - "**The checks**: E-value, Rosenbaum bounds and the whiteboard arithmetic"
        takeaway: No single number carries the claim, and the four together show what it rests on.
        source: notes/05-matching-and-weighting.md
        notes: >-
          This is the note's closing advice for the sensitivity section.

      - layout: table
        beat: pitfalls
        section: Pitfalls
        title: Pitfalls in matching and weighting
        recall: What are the main pitfalls in matching and weighting?
        answer: "Choosing the design after reading the outcome, reporting balance as proof of no bias, comparing a local ATT with an ATT, trusting a large control count, library defaults, and adjusting for something measured after treatment."
        header: [Pitfall, "What goes wrong", Fix]
        widths: [3.0, 3.4, 2.8]
        rows:
          - [Design chosen after the outcome, "the spread here was £15 to £32", "fix the design on balance alone"]
          - [Balance as proof of no bias, "perfect Love plot, still about £3.60 high", "balance covers observed covariates only"]
          - [A local ATT against an ATT, "£20.96 and £26.49 target different customers", "report who was kept"]
          - [A large control count, "5,710 weighted controls were worth 107", "report effective sample and largest weight"]
          - [Library defaults, "clipping turned £18.75 into £39.24", "replicate one number by hand"]
          - [A post-treatment adjustment, "sessions halved the bias in one world and erased the effect in another", "pre-treatment covariates only"]
        takeaway: Most of these failures are decided before the outcome is read.
        source: notes/05-matching-and-weighting.md
        notes: >-
          The note lists nine pitfalls. The three left out here are treating one dataset's success as evidence, treating a
          passed refuter as a validity check, and reading an E-value of 1.79 as robust.

      - layout: statement
        beat: wrap
        section: Pitfalls
        title: Say what the estimate assumes
        recall: What is the one rule that ties this lecture together?
        answer: "Without randomisation every causal estimate rests on an assumption you cannot test in the data, so name it, check balance and overlap, and run a sensitivity analysis."
        kicker: When you cannot randomise
        statement: "Check balance before the outcome, report who was kept, and name the trait you worry about."
        attribution: The analyst's closing paragraph
        takeaway: Check balance before the outcome, report who was kept, and name the trait you worry about.
        source: notes/05-matching-and-weighting.md
        notes: >-
          This closes the lecture. The next pillar's README, applied analyses, puts these ideas to work on a retail table.
