  - title: Overfitting and information criteria
    divider: false
    summary: Training fit · Deviance gap · AIC and WAIC · Reading a comparison
    notes: Everything so far asks how well a model explains the data it saw, and this part shows why that question has the wrong answer built in.
    slides:
      - layout: statement
        beat: problem
        section: Overfitting and information criteria
        title: A perfect fit to seven points
        recall: What does a polynomial of degree 6 do to seven hominin species?
        answer: "R squared rises from 0.49 at degree 1 to 0.99 at degree 5 and 1.00 at degree 6, where seven parameters pass through seven points and the curve predicts a negative brain size near 58 kg."
        kicker: Brain volume against body mass
        statement: "Seven parameters pass through seven points, and the curve predicts a negative brain size."
        attribution: Polynomials of degree 1 to 6, McElreath chapter 6
        takeaway: Fit to the sample improves with every parameter, so it cannot be the yardstick.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          R squared is 0.49 at degree 1, 0.99 at degree 5 and 1.00 at degree 6. The negative brain size appears near 58 kg.

      - layout: code
        beat: fundamentals
        section: Overfitting and information criteria
        level: core
        title: Train and test deviance for models of one to five parameters
        recall: How was the deviance simulation built?
        answer: "y is Normal with mean 0.15 x1 minus 0.4 x2, so the true model has three parameters. Models with one to five parameters are fitted by least squares and scored on a fresh sample of the same size."
        lead: "Deviance is minus twice the log-likelihood."
        lang: python
        code: |-
          def dev(y, mu):   # -2 * log-lik, sigma = 1
              return (np.log(2 * np.pi) + (y - mu) ** 2).sum()

          def one_run(n, k, rng):
              X = rng.normal(size=(2 * n, 4))
              noise = rng.normal(size=2 * n)
              y = 0.15 * X[:, 0] - 0.4 * X[:, 1] + noise
              A = np.c_[np.ones(2 * n), X[:, :k - 1]]
              tr, te = slice(0, n), slice(n, None)
              b = np.linalg.lstsq(A[tr], y[tr], rcond=None)[0]
              return dev(y[tr], A[tr] @ b), dev(y[te], A[te] @ b)
        bullets:
          - "True model has **three** parameters"
          - "Fit on one sample, score on a fresh one of the same size"
          - "**5,000** runs per row"
        takeaway: Score on data the model has not seen, because the training score only ever improves.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          The simulation is the chapter's, re-run. The book used 10,000 runs and prints slightly different gaps.

      - layout: table
        beat: fundamentals
        section: Overfitting and information criteria
        level: core
        title: Test deviance bottoms out at the true three parameters
        recall: At which number of parameters is test deviance lowest?
        answer: "At three, the true model. At N = 20 the two-parameter model is worse out of sample than the one-parameter one, and the gap between test and train is close to twice the number of parameters."
        header: [N, Parameters, Train, Test, Gap]
        widths: [1.4, 2.2, 1.8, 1.8, 1.8]
        rows:
          - ["20", "1", "59.3", "61.5", "2.2"]
          - ["20", "2", "57.5", "62.3", "4.8"]
          - ["20", "3", "53.7", "60.3", "6.6"]
          - ["20", "4", "52.8", "61.9", "9.1"]
          - ["20", "5", "51.8", "63.9", "12.1"]
          - ["100", "3", "280.9", "286.9", "6.0"]
        highlight: [2]
        takeaway: Training deviance falls with every parameter, while test deviance turns upward past the true model.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          The note also prints N = 100 for one parameter (train 300.3, test 303.0, gap 2.7) and five (279.1, 289.3, 10.2).
          The book's gaps at N = 20 are 2, 4.1, 5.3, 7.6 and 9.7.

      - layout: image
        beat: fundamentals
        section: Overfitting and information criteria
        title: The gap is about twice the parameters, which is AIC
        recall: What idea does the gap between test and train deviance give?
        answer: "The gap is close to twice the number of parameters, which is AIC = D_train + 2p. AIC is reliable only with flat priors, a near-Gaussian posterior and N much larger than the parameter count."
        kicker: Statistical Rethinking, Fig. 6.7
        image: ../../assets/sources/images/statistical-rethinking-fig6-7.png
        caption: "Training and test deviance against number of parameters at N = 20 and N = 100. The gap is close to 2p, so AIC = D_train + 2p."
        takeaway: AIC is a corrected training score, and a regularising prior takes you outside its conditions.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          That is why chapter 3 pairs regularising priors with a different criterion.

      - layout: flow
        beat: fundamentals
        section: Overfitting and information criteria
        level: core
        title: WAIC is computed pointwise from the posterior draws
        recall: How is WAIC computed?
        answer: "WAIC = -2(lppd - pWAIC). The lppd sums over observations the log of the average likelihood across draws, and pWAIC sums over observations the variance across draws of the log-likelihood."
        steps:
          - {label: Posterior draws, sub: "log-likelihood per point", accent: "94A3B8"}
          - {label: lppd, sub: "log of the mean likelihood, summed", accent: "1E3A5F"}
          - {label: pWAIC, sub: "variance of the log-likelihood, summed", accent: "0F7490"}
          - {label: WAIC, sub: "-2 (lppd - pWAIC)", accent: "D4621A"}
        caption: "It needs no Gaussian assumption."
        takeaway: The penalty is measured from the posterior itself, so there is no parameter count to get wrong.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          In Python the route is az.compare on InferenceData objects that carry log_likelihood.

      - layout: compare
        beat: pitfalls
        section: Overfitting and information criteria
        level: core
        title: What DIC and WAIC do well, and where they stop
        recall: How accurate are DIC and WAIC, and what are their caveats?
        answer: "In the book's simulation both land within about 1 deviance point of the true average test deviance in most settings, WAIC the closer. They assume test data come from the training process, are hard for time series, and none is consistent for picking the true model."
        emphasis: right
        left:
          title: In the simulation
          bullets: ["Within about 1 deviance point of the true test deviance", "In most settings", "WAIC is the closer"]
        right:
          title: The book's caveats
          bullets: ["Test data must come from the training process", "WAIC is hard to define for time series", "None is consistent for the true model"]
        takeaway: Treat an information criterion as an estimate of out-of-sample fit under assumptions, not as a verdict.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          The simulation used Normal(0, 100) and Normal(0, 0.5) priors on the slopes.

