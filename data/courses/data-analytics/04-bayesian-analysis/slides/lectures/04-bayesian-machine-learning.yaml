  - title: Variational inference and the VAE
    divider: false
    summary: The ELBO · Reparameterisation · Where it goes wrong · The VAE
    notes: The second half takes the same questions to posteriors too large to sample, starting with approximating the posterior by optimisation.
    slides:
      - layout: statement
        beat: problem
        section: Where this sits
        title: Too big to sample, so make it smaller
        recall: What does variational inference do instead of sampling?
        answer: "It approximates the posterior with a simpler distribution q and makes q as close as possible, turning inference into optimisation over a KL divergence."
        kicker: The idea
        statement: "When the posterior is too big to sample, approximate it with a simpler distribution q, and make q as close as possible."
        attribution: Blei, Kucukelbir and McAuliffe, JASA, 2017
        takeaway: Variational inference swaps integration for optimisation, and the price is that q is narrower than the truth.
        source: notes/06b-variational-inference-and-gaussian-processes.md
        notes: >-
          The review frames the method and its trade-off: faster and better scaling than MCMC, and it generally underestimates
          the variance of the posterior.

      - layout: bullets
        beat: fundamentals
        section: Where this sits
        title: The second half of the coursework
        recall: What do weeks 5 and 6 and the final assignment cover?
        answer: "Week 5 is a VAE on MNIST with the ELBO, week 6 is Gaussian processes and Bayesian optimisation, and the final assignment, Finding the suspect, combines a VAE with Bayesian optimisation."
        bullets:
          - "**Week 5:** VAE on MNIST, the ELBO and an amortised posterior"
          - "**Week 6:** Gaussian processes and Bayesian optimisation"
          - "**Final assignment:** Finding the suspect, a VAE plus Bayesian optimisation"
        takeaway: The second half moves from approximating a posterior to using one to choose experiments.
        source: notes/06b-variational-inference-and-gaussian-processes.md
        notes: >-
          The weeks 5 and 6 notebooks run only in the pinned legacy environment, so this lecture reads them for the method.

      - layout: code
        beat: fundamentals
        section: Variational inference and the VAE (week 5)
        title: The ELBO is reconstruction minus a regulariser
        recall: What is the evidence lower bound?
        answer: "log p(x) is at least the expected log p(x given z) under q minus the KL from q(z given x) to the prior p(z). The gap is exactly the KL from q to the true posterior."
        lead: "KL to the true posterior needs the evidence we cannot compute, so we maximise this instead."
        lang: text
        code: |-
          log p(x) >= E_q[ log p(x | z) ] - KL( q(z | x) || p(z) )
                      reconstruction        regulariser

          # gap = KL( q || true posterior )
        bullets:
          - "**Reconstruction** rewards q for explaining the data"
          - "**Regulariser** keeps q close to the prior"
          - "The gap is the KL to the true posterior"
        takeaway: Maximising the ELBO closes the gap to the true posterior without ever computing the evidence.
        source: notes/06b-variational-inference-and-gaussian-processes.md
        notes: >-
          The ELBO is an equivalent quantity to the KL, which needs the evidence we could not compute.

      - layout: table
        beat: fundamentals
        section: Variational inference and the VAE (week 5)
        level: core
        title: On a toy model the gap goes to zero at the exact posterior
        recall: What does the ELBO table show for x = 2 with x from N(z, 1) and z from N(0, 1)?
        answer: "The log evidence is -2.2655. From the prior the ELBO is -3.4199 with a gap of 1.1544, and at the exact posterior N(1, 0.71 squared) it is -2.2660 with a gap of 0.0005."
        header: [q, Reconstruction, KL, ELBO, Gap]
        widths: [2.6, 1.9, 1.5, 1.7, 1.7]
        rows:
          - ["N(0, 1)", "-3.4199", "0.0000", "-3.4199", "1.1544"]
          - ["N(0.5, 1)", "-2.5449", "0.1250", "-2.6699", "0.4044"]
          - ["N(1, 1)", "-1.9200", "0.5000", "-2.4200", "0.1545"]
          - ["N(1, 0.71 squared)", "-1.6694", "0.5966", "-2.2660", "0.0005"]
        highlight: [3]
        takeaway: Moving q toward the data costs some KL and gains more reconstruction, until the ELBO reaches the log evidence.
        source: notes/06b-variational-inference-and-gaussian-processes.md
        notes: >-
          The log evidence is -2.2655. At the exact posterior the ELBO matches it up to Monte Carlo noise in the fourth
          decimal, so the gap you cannot measure in a real model is visible here.

      - layout: code
        beat: practice
        section: Variational inference and the VAE (week 5)
        level: core
        title: "The reparameterisation trick gives a gradient via sampling"
        recall: What does the reparameterisation trick do?
        answer: "It writes z = m + s times epsilon with epsilon from N(0, 1), so the randomness no longer depends on what we differentiate. Forty noisy gradient steps reached the exact mean of 1.000."
        lead: "Forty noisy steps of gradient ascent on the ELBO."
        lang: python
        code: |-
          def grad_m(m, s, seed=1, n=200_000):
              eps = np.random.default_rng(seed).standard_normal(n)
              z = m + s * eps
              lik = ((x_obs - z) / sigma**2).mean()
              return lik - m / s0**2

          m, s = 0.0, post_sd
          for step in range(40):
              m += 0.2 * grad_m(m, s, seed=step)
          # m 1.000   exact 1.000
        bullets:
          - "**z = m + s * eps**, with eps from N(0, 1)"
          - "The randomness no longer depends on m"
          - "Reaches the exact mean **1.000**"
        takeaway: Move the randomness out of the parameters and you can differentiate straight through the sampling step.
        source: notes/06b-variational-inference-and-gaussian-processes.md
        notes: >-
          This is the core of a VAE. It is not the core of Blei et al., whose review never uses the trick.

      - layout: cards
        beat: fundamentals
        section: Variational inference and the VAE (week 5)
        level: core
        title: Three ways to optimise q
        recall: Which algorithms do Blei et al. centre, and where does the trick belong?
        answer: "Their main algorithm is coordinate ascent (CAVI), which updates one factor of q at a time, plus a stochastic version (SVI) for large data. The reparameterisation trick is the VAE's route."
        cards:
          - {title: CAVI, accent: "1E3A5F", body: "**Coordinate ascent**: updates one factor of q at a time from the same complete conditional a Gibbs sampler draws from"}
          - {title: SVI, accent: "0F7490", body: "A stochastic version for **large data**, following noisy natural gradients on a sampled data point"}
          - {title: Reparameterisation, accent: "D4621A", body: "The route of a **VAE**. Kingma and Welling appear in the review only as a black-box example"}
        takeaway: The review's algorithms are CAVI and SVI, and the reparameterisation trick belongs to the VAE line.
        source: notes/06b-variational-inference-and-gaussian-processes.md
        notes: >-
          PyMC's pm.fit with method advi is the same idea, with a Normal q per parameter.

      - layout: code
        beat: practice
        section: Variational inference and the VAE (week 5)
        level: core
        title: ADVI against NUTS on two nearly collinear inputs
        recall: What was the setup of the ADVI against NUTS comparison?
        answer: "Two inputs with correlation 0.95 and true coefficients of 1 each, 80 points. The posterior over the two coefficients is a narrow diagonal ridge."
        lead: "The posterior is a narrow diagonal ridge."
        lang: python
        code: |-
          noise = rng.normal(size=80)
          x2 = 0.95 * x + np.sqrt(1 - 0.95**2) * noise
          y_vi = 1.0 * x + 1.0 * x2 + rng.normal(0, 1, 80)
          with pm.Model():
              a = pm.Normal("a", 0, 5)
              b = pm.Normal("b", 0, 5)
              mu = a * x + b * x2
              pm.Normal("y", mu, 1, observed=y_vi)
              mcmc = pm.sample(1000, tune=1000)
              approx = pm.fit(20000, method="advi")
              vi = approx.sample(4000)
        bullets:
          - "Two inputs correlated at **0.95**"
          - "Same model, fitted by **NUTS** and by **ADVI**"
          - "ADVI uses a Normal q per parameter"
        takeaway: Fit the same model both ways on a correlated problem to see what mean-field misses.
        source: notes/06b-variational-inference-and-gaussian-processes.md
        notes: >-
          The comparison is on the standard deviations and on the correlation, which is where a mean-field approximation shows
          its limit.

      - layout: table
        beat: practice
        section: Variational inference and the VAE (week 5)
        level: core
        title: ADVI gets the means and misses the spread
        recall: How did ADVI's standard deviations compare with NUTS's?
        answer: "Marginal sds were about 0.39 under NUTS and 0.13 under ADVI, threefold too narrow. The sd of a + b was 0.181 against 0.113, and the correlation -0.96 became -0.01."
        header: [Method, Mean a, Mean b, Sd a, Sd b, Sd of a + b, Corr]
        widths: [1.6, 1.3, 1.3, 1.2, 1.2, 1.7, 1.1]
        rows:
          - [NUTS, "1.218", "0.960", "0.390", "0.397", "0.113", "-0.96"]
          - [ADVI, "1.153", "1.018", "0.127", "0.130", "0.181", "-0.01"]
        highlight: [1]
        takeaway: If you need intervals rather than a prediction, check VI against MCMC on a sample of the data first.
        source: notes/06b-variational-inference-and-gaussian-processes.md
        notes: >-
          A mean-field q has no way to express the correlation of -0.96, and that also misstates the sum: the well-determined
          a + b gets an sd of 0.181 against 0.113.

      - layout: image
        beat: pitfalls
        section: Variational inference and the VAE (week 5)
        level: core
        title: "A factorised q is too narrow: it ignores the correlation"
        recall: What does a mean-field approximation look like against a correlated posterior?
        answer: "The exact posterior is a tilted ellipse, and the mean-field approximation is too narrow because it misses the correlation."
        kicker: Blei et al., Fig. 1
        image: ../../assets/sources/images/blei-variational-inference-fig1.png
        caption: "Exact correlated posterior against its mean-field approximation, drawn as 2-sigma ellipses."
        bullets:
          - "The ellipses are **2-sigma** contours"
          - "Mean-field misses the correlation and is too narrow"
          - "Bishop: a factorised approximation tends to be **too compact**"
        takeaway: Under a factorised q the narrowness is built in, and the correlation is the part it cannot represent.
        source: notes/06b-variational-inference-and-gaussian-processes.md
        notes: >-
          Bishop's PRML shows where the narrowness comes from: minimising KL(q to p) with a factorised q matches the variance of
          the narrowest direction and under-estimates the rest (chapter 10, page 467).

      - layout: cards
        beat: pitfalls
        section: Variational inference and the VAE (week 5)
        level: core
        title: How accurate VI is against MCMC is still unknown
        recall: What do Blei et al. say about VI against MCMC, and its limits?
        answer: "The relative accuracy 'is still unknown'. CAVI fit a 30-cluster mixture to 10,000 images in under a minute but it was 'not a definitive comparison'. The ELBO is non-convex, and choosing a model by it is 'not justified in theory'."
        cards:
          - {title: Unknown, accent: "1E3A5F", body: "Relative accuracy of VI and MCMC **'is still unknown'**. VI underestimates variance but need not lose predictive accuracy"}
          - {title: A speed result, accent: "0F7490", body: "CAVI fit a **30-cluster** mixture to **10,000** images in under a minute. A footnote: **'not a definitive comparison'**"}
          - {title: Two limits, accent: "D4621A", body: "The ELBO is **non-convex**, so CAVI finds a local optimum. Model choice by ELBO is **'not justified in theory'**"}
        takeaway: Do not generalise from one speed result, and do not rank models by their ELBO alone.
        source: notes/06b-variational-inference-and-gaussian-processes.md
        notes: >-
          The images are 576-dimensional colour histograms, and the sampler was the HMC-based one in Stan, which the review
          cites at version 2.8. No hardware is stated. The result says nothing about intervals.

      - layout: table
        beat: fundamentals
        section: Variational inference and the VAE (week 5)
        level: deep
        title: A VAE learns both halves of the ELBO with networks
        recall: What are the parts of a VAE?
        answer: "An encoder gives the mean and log-variance of q, reparameterisation lets gradients flow through the sampling, a decoder gives p(x given z), and the prior is N(0, I). A conditional VAE adds the label."
        header: [Part, Role]
        widths: [2.6, 6.8]
        rows:
          - [Encoder, "outputs the mean and log-variance of q(z given x): an amortised posterior"]
          - [Reparameterisation, "z = mu + sigma times eps, so gradients flow through the sampling"]
          - [Decoder, "p(x given z); Bernoulli per pixel for binarised MNIST"]
          - [Prior, "N(0, I); sampling from it and decoding hallucinates new digits"]
          - [Conditional VAE, "condition encoder and decoder on the label to generate a chosen digit"]
        takeaway: The ELBO's two halves become a decoder and an encoder, trained together by gradient ascent.
        source: notes/06b-variational-inference-and-gaussian-processes.md
        notes: >-
          The VAE is from Kingma and Welling, 2013. Week 5 builds this for MNIST in Keras 2.3 on TensorFlow 1.15, with the pinned
          environment.

      - layout: bullets
        beat: fundamentals
        section: Variational inference and the VAE (week 5)
        level: deep
        title: ADVI fits one q per model, a VAE one encoder
        recall: What makes a VAE amortised?
        answer: "ADVI fits one q per model, while a VAE fits one encoder that outputs a q per data point. That is why a VAE can handle a new image without refitting."
        bullets:
          - "**ADVI:** one q per model, so a new data point means a refit"
          - "**VAE:** one encoder outputs a q per data point, so a new image needs no refit"
        takeaway: Amortising the posterior into a network is what lets a VAE handle new data without refitting.
        source: notes/06b-variational-inference-and-gaussian-processes.md
        notes: >-
          The encoder outputs a posterior for any input, rather than fitting one per data point.

  - title: Gaussian processes and Bayesian optimisation
    divider: false
    summary: A prior over functions · Posterior with error bars · Acquisition functions · Tuning a model
    notes: The last idea keeps an exact posterior, over functions, and uses it to choose the next expensive experiment.
    slides:
      - layout: statement
        beat: problem
        section: Gaussian processes and Bayesian optimisation (week 6)
        title: A prediction with an error bar at every x
        recall: What does a Gaussian process give you?
        answer: "A prior over functions: conditioning on observed points gives a posterior mean and a variance at every x, a prediction with an error bar."
        kicker: The idea
        statement: "Conditioning on observed points gives a posterior mean and a variance at every x: a prediction with an error bar."
        attribution: A Gaussian process, Rasmussen and Williams
        takeaway: A GP does not just predict, it says how sure it is at each input.
        source: notes/06b-variational-inference-and-gaussian-processes.md
        notes: >-
          Rasmussen and Williams is the standard text. The algebra is a Normal conditional, which takes a few lines.

      - layout: cards
        beat: fundamentals
        section: Gaussian processes and Bayesian optimisation (week 6)
        title: A GP is a prior over functions with a kernel
        recall: What defines a Gaussian process?
        answer: "Any finite set of function values is jointly Normal, with covariance given by a kernel such as the RBF, k(x, x') = sigma squared times exp(-distance squared over 2 ell squared)."
        cards:
          - {title: Jointly Normal, accent: "1E3A5F", body: "Any finite set of function values is **jointly Normal**"}
          - {title: A kernel, accent: "0F7490", body: "The covariance comes from a kernel such as the **RBF**, with variance and lengthscale ell"}
          - {title: Condition on data, accent: "D4621A", body: "A posterior **mean and variance at every x**"}
        takeaway: Choose a kernel, condition on the points, and you get an exact posterior over functions.
        source: notes/06b-variational-inference-and-gaussian-processes.md
        notes: >-
          The RBF kernel is k(x, x') = sigma squared times exp of minus the squared distance over twice the lengthscale squared.

      - layout: code
        beat: practice
        section: Gaussian processes and Bayesian optimisation (week 6)
        level: core
        title: A GP posterior in a few lines of NumPy
        recall: How is the GP posterior computed by hand?
        answer: "Build the kernel matrix K for the observed points, solve for alpha, and take the mean as Ks times alpha and the variance as the prior variance minus the explained part."
        lead: "Three observed points of sin(x)."
        lang: python
        code: |-
          def gp_posterior(X, y, Xn, noise=1e-6, **kw):
              K = rbf(X, X, **kw) + noise * np.eye(len(X))
              Ks = rbf(Xn, X, **kw)
              alpha = np.linalg.solve(K, y)
              mean = Ks @ alpha
              v = np.linalg.solve(K, Ks.T)
              explained = (Ks * v.T).sum(axis=1)
              prior = np.diag(rbf(Xn, Xn, **kw))
              var = prior - explained
              return mean, np.sqrt(np.maximum(var, 0))
        bullets:
          - "Observed at **x = 1, 3 and 4**, where y = sin(x)"
          - "Scikit-learn gives the same answer, with a largest difference of **0.0**"
          - "The week 6 notebook fits the kernel hyperparameters with GPy"
        takeaway: The algebra is one linear solve, and an established library confirms it exactly.
        source: notes/06b-variational-inference-and-gaussian-processes.md
        notes: >-
          GPy fits the kernel's hyperparameters by marginal likelihood, and sparse GPs cut the O(n cubed) cost for large n.

