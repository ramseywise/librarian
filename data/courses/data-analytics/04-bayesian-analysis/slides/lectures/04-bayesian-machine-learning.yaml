      - layout: code
        beat: practice
        section: Gaussian processes and Bayesian optimisation (week 6)
        level: core
        title: Tuning a gradient-boosted model, 20 fits in total
        recall: How was the Bayesian optimisation loop run on the gradient-boosted model?
        answer: "It tuned the learning rate and leaf count on a small built-in dataset, four starting fits then expected improvement over 2,000 random candidates each round, 20 fits in all."
        lead: "Log loss from 3-fold cross-validation."
        lang: python
        code: |-
          def expected_improvement(mean, sd, best):
              z = (mean - best) / sd
              gain = (mean - best) * stats.norm.cdf(z)
              return gain + sd * stats.norm.pdf(z)

          # each round: fit a GP, score 2000 candidates,
          #   evaluate the best one
          candidates = rng.uniform(low, high, (2000, 2))
          mean, sd = gp.predict(candidates, return_std=True)
          ei = expected_improvement(mean, sd + 1e-9, y_u.max())
          next_u = candidates[np.argmax(ei)]
        bullets:
          - "**4** starting fits, **20** in total"
          - "Tunes learning rate and leaf count"
          - "Expected improvement over **2,000** random candidates"
        takeaway: The whole method is a GP fit, a score for candidates, and one expensive evaluation per round.
        source: notes/06b-variational-inference-and-gaussian-processes.md
        notes: >-
          The week 6 coursework tunes XGBoost with GPyOpt and repeats it for an SVR. That code needs the pinned environment.

