  notes: >-
    This is the fifth lecture of the Bayesian analysis series, after the overview, infer, compute and check, and decide. It covers
    step 4. By the end you should be able to fit a Gaussian mixture by EM and say what it gives up, read a Bayesian logistic
    regression, choose a likelihood and link, explain why training fit is the wrong yardstick, and say what variational inference
    and a Gaussian process each buy you.

