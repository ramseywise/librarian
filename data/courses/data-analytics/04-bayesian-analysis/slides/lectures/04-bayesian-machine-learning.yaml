        answer: "The neocortex and log body mass model had WAIC -15.0 and an Akaike weight of 0.93, against -8.3 for the intercept-only model. The difference is 6.7 with a standard error of 7.26, and the ranking reverses with chance 0.18."
        cards:
          - {title: Two models, accent: "1E3A5F", body: "WAIC **-15.0** with neocortex and log body mass, **-8.3** intercept-only, on 17 species"}
          - {title: Weight 0.93, accent: "0F7490", body: "The probability the model predicts best, conditional on the set compared"}
          - {title: Difference 6.7, accent: "D4621A", body: "Standard error **7.26**. The chance the ranking reverses is **0.18**"}
