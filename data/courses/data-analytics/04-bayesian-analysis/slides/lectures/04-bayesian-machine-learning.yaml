      - layout: flow
        beat: fundamentals
        section: Gaussian processes and Bayesian optimisation (week 6)
        title: Bayesian optimisation picks the next expensive evaluation
        recall: How does Bayesian optimisation use a GP?
        answer: "The GP is a cheap surrogate for an expensive black-box function. An acquisition function turns its mean and uncertainty into the next point to evaluate, trading exploration against exploitation."
        steps:
          - {label: Surrogate, sub: "a GP fit to the points so far", accent: "1E3A5F"}
          - {label: Acquisition function, sub: "mean and uncertainty to a score", accent: "0F7490"}
          - {label: Evaluate there, sub: "the expensive function", accent: "D4621A"}
          - {label: Add the point, sub: "and refit", accent: "94A3B8"}
        caption: "It trades off exploration and exploitation, as the bandits of chapter 3b do."
        takeaway: Spend a few expensive evaluations where the surrogate says they will teach or earn the most.
        source: notes/06b-variational-inference-and-gaussian-processes.md
        notes: >-
          A typical expensive function is a model's validation score as a function of its hyperparameters. Snoek, Larochelle and
          Adams made this a standard approach for tuning models in 2012.

