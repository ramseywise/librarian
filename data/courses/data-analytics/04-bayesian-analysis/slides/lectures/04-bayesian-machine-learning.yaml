parts:
  - title: EM for Gaussian mixtures
    divider: false
    summary: Hidden labels · E-step and M-step · Restarts · EM against MCMC
    notes: We start with the simplest model where a hidden variable stops you from writing the answer down, and fit it by optimisation instead of sampling.
    slides:
      - layout: statement
        beat: problem
        section: Where this sits
        title: What if every point has a label you never saw?
        recall: Why is a mixture model hard to fit directly?
        answer: "Each point has a hidden cluster label. With the labels the parameters are simple averages, and with the parameters the labels follow from Bayes' rule, but you have neither."
        kicker: The problem
        statement: "If you knew the labels, the parameters would be simple averages. If you knew the parameters, the labels would follow from Bayes' rule."
        attribution: A Gaussian mixture with weights, means and covariances
        takeaway: Each half of the problem is easy when the other half is known, and EM alternates between them.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          The model is chapter 2's mixture, fitted by optimisation instead of sampling. Expectation-maximisation is due to
          Dempster, Laird and Rubin in 1977.

      - layout: table
        beat: fundamentals
        section: Where this sits
        title: The coursework behind this lecture
        recall: Which inference method does each week of the coursework use?
        answer: "Week 2 uses EM on a Gaussian mixture, week 4 MCMC on logistic regression, week 5 variational inference on a VAE, and week 6 an exact GP posterior for Bayesian optimisation."
        header: [Coursework, Topic, Inference method]
        widths: [1.8, 3.8, 3.8]
        rows:
          - [Week 2, Gaussian mixture model, Expectation-maximisation]
          - [Week 4, "Markov chains, Bayesian logistic regression", "MCMC (Metropolis, NUTS)"]
          - [Week 5, Variational autoencoder on MNIST, Variational inference (ELBO)]
          - [Week 6, "Gaussian processes, Bayesian optimisation", Exact GP posterior]
        takeaway: The coursework is legacy code, so read it for the method and run the NumPy, PyMC and scikit-learn versions here.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          The coursework is HSE's Bayesian Methods for Machine Learning on Coursera. Its environment pins Python 3.7, TensorFlow
          1.15 and pymc3 3.11.4, and every notebook imports a grader module that is not included. Weeks 5 and 6 are covered from
          the second half of this lecture.

      - layout: flow
        beat: fundamentals
        section: EM for Gaussian mixtures (week 2)
        title: EM alternates two steps until the bound plateaus
        recall: What are the steps of expectation-maximisation?
        answer: "Start from a guess, compute responsibilities in the E-step, re-fit the parameters from them in the M-step, and repeat until the lower bound on the log-likelihood plateaus."
        steps:
          - {label: Initial guess, sub: "weights, means, covariances", accent: "94A3B8"}
          - {label: E-step, sub: "responsibilities per point", accent: "1E3A5F"}
          - {label: M-step, sub: "parameters from responsibilities", accent: "0F7490"}
          - {label: Check the bound, sub: "rises monotonically", accent: "D4621A"}
        caption: "Stop when the lower bound on the log-likelihood plateaus."
        takeaway: EM trades the full posterior for a loop of two easy steps, and each pass can only improve the bound.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          Each point x_i has a hidden label t_i among C clusters. The responsibility is the probability of a label given the
          point, and the M-step turns those soft assignments into updated parameters.

      - layout: table
        beat: fundamentals
        section: EM for Gaussian mixtures (week 2)
        level: core
        title: What the E-step and M-step compute
        recall: What does each EM step compute?
        answer: "The E-step gives responsibilities proportional to the weight times the Normal density, normalised over clusters. The M-step sets the weights, means and covariances from those responsibilities."
        header: [Step, Computes, Formula]
        widths: [1.6, 3.4, 4.4]
        rows:
          - [E-step, "responsibilities P(t_i = c given x_i)", "weight times Normal density, normalised over c"]
          - [M-step, parameters given responsibilities, "mean of the responsibilities; weighted means and covariances"]
          - [Loss, lower bound on the log-likelihood, "rises monotonically; stop when it plateaus"]
        highlight: [0]
        takeaway: If you can write the two conditional updates, the algorithm is just those two lines in a loop.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          The M-step weight is the mean of the responsibilities for that cluster. The mean is the responsibility-weighted average
          of the points, and the covariance is the responsibility-weighted covariance.

      - layout: code
        beat: practice
        section: EM for Gaussian mixtures (week 2)
        level: core
        title: The E-step in log space avoids underflow
        recall: Why does the E-step work in log space?
        answer: "Multiplying small densities underflows, so the code adds logs and normalises with logaddexp, the log-sum-exp trick."
        lead: "The M-step then re-fits the parameters from r."
        lang: python
        code: |-
          def e_step(X, pi, mu, cov):
              cols = [np.log(pi[c]) + log_gauss(X, mu[c], cov[c])
                      for c in range(len(pi))]
              log_r = np.stack(cols, axis=1)
              log_norm = np.logaddexp.reduce(
                  log_r, axis=1, keepdims=True)
              return np.exp(log_r - log_norm), log_norm.sum()

          def m_step(X, r):
              Nk = r.sum(axis=0)
              pi = Nk / len(X)
              mu = (r.T @ X) / Nk[:, None]
              ...  # plus 1e-6 * I on each covariance
        bullets:
          - "Returns the responsibilities and the log-likelihood"
          - "**1e-6 * I** stops a component collapsing onto one point"
          - "Bishop calls the collapse a singularity of maximum likelihood that a prior removes"
        takeaway: Do the arithmetic in log space, and guard the covariance against collapsing.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          A collapsing covariance is the failure where a component shrinks onto a single point and the likelihood rises without
          limit. The reference is Bishop, PRML, chapter 9, pages 434 and 441. The log-sum-exp trick is explained in the numbers
          and memory note of the programming course.

      - layout: code
        beat: practice
        section: EM for Gaussian mixtures (week 2)
        level: core
        title: Ten restarts on three clusters of unequal size
        recall: What happened across ten random restarts of EM?
        answer: "Eight restarts reached a log-likelihood of -1107.8 and two ended lower, at -1186.9 and -1268.1. The best fit recovered the weights 0.33, 0.5 and 0.17."
        lead: "Clusters of 150, 100 and 50 points."
        lang: python
        code: |-
          fits = [train_em(X, C=3, seed=s) for s in range(10)]
          final = [f[3][-1] for f in fits]
          # final log-likelihood by restart:
          #   -1107.8 x 8,  -1186.9,  -1268.1
          pi, mu, cov, trace = fits[int(np.argmax(final))]
          # always rising: True   iterations: 28
          # weights [0.33 0.5 0.17]
        bullets:
          - "The bound rose at every step, as the theory promises"
          - "Two starts got **stuck** in worse local optima"
          - "The weights match the 0.5, 0.33 and 0.17 shares of the points"
          - "The labels come out in a different order"
        takeaway: EM only promises a local peak, so run several restarts and keep the best.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          The labels coming out in a different order is the label problem from chapter 2 again. The bound never falls, but a
          monotone climb says nothing about whether it found the highest peak.

      - layout: compare
        beat: fundamentals
        section: EM for Gaussian mixtures (week 2)
        title: EM or MCMC for the same mixture
        recall: How do EM and MCMC differ on the same model?
        answer: "EM gives a fast point estimate with no parameter uncertainty and fails on local optima and collapsing covariances. MCMC gives the full posterior, more slowly, and fails on slow mixing and label switching."
        emphasis: right
        left:
          title: EM
          bullets: ["A point estimate, MAP or MLE", "Fast, deterministic per restart", "No uncertainty on parameters", "Fails: local optima, collapsing covariances"]
        right:
          title: MCMC
          bullets: ["Samples from the full posterior", "Slower", "Full uncertainty", "Fails: slow mixing, label switching"]
        takeaway: Take EM for a fast point estimate, and MCMC when you need to know how sure the parameters are.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          This is the same decision as the interview prompt in the note: EM for a fast point estimate, MCMC when you need
          parameter uncertainty.

  - title: MCMC and Bayesian logistic regression
    divider: false
    summary: Start-point independence · Odds ratio with an interval · Metropolis against NUTS
    notes: Next we put the sampler of chapter 2 to work on a real regression, and check it in two ways.
    slides:
      - layout: statement
        beat: problem
        section: MCMC and Bayesian logistic regression (week 4)
        title: Does it matter where the sampler starts?
        recall: Why does MCMC give the same answer from different starting points?
        answer: "A stationary distribution that does not depend on where you start is what makes MCMC valid. After burn-in, starts at 10 and at 1,000 agree."
        kicker: Task 1, Alice and Bob
        statement: "A stationary distribution that does not depend on where you start is exactly what makes MCMC valid."
        attribution: Two sellers setting prices from each other's last price
        takeaway: Discard a burn-in, and the start no longer matters, which is the property every sampler relies on.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          Each seller sets a price from the other's last price plus Gaussian noise. The simulation is a two-variable Markov chain
          you can solve by algebra, so you can check the sampler against the answer.

      - layout: code
        beat: practice
        section: MCMC and Bayesian logistic regression (week 4)
        level: core
        title: Three very different starts land on the algebra
        recall: What did the three Alice and Bob starts give against the algebra?
        answer: "Alice averaged about 278 to 279 and Bob about 314 to 315 from every start. The algebra gives 278.6 and 314.3."
        lead: "Burn-in of 1,000 discarded, 10,000 hours kept."
        lang: python
        code: |-
          alice = 0.6 * bob + 90 + rng.normal(0, 20)
          bob = 1.2 * alice - 20 + rng.normal(0, 10)
          # start  300  Alice 279.2  Bob 315.2  corr 0.96
          # start 1000  Alice 277.9  Bob 313.5  corr 0.96
          # start   10  Alice 279.0  Bob 314.8  corr 0.96
          # long-run mean by algebra:
          #   Alice 278.6   Bob 314.3
        bullets:
          - "Starts at **10** and **1,000** make no difference"
          - "Long-run means match the algebra"
          - "The two prices are correlated at **0.96**"
        takeaway: Check a sampler against a case with a known answer before you trust it on one without.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          The standard deviations are about 30 for Alice and 37 for Bob in every run. The numbers in the code comments are from
          the three seeded runs in the note.

      - layout: code
        beat: practice
        section: MCMC and Bayesian logistic regression (week 4)
        level: core
        title: Does sex affect income, with the truth known?
        recall: Why check a model on simulated data with known truth?
        answer: "Simulation shows how far one dataset's estimate can sit from the truth. Here 2,000 simulated rows had a true odds ratio of 2.01, and NUTS gave 1.65 with a 95% interval of 1.27 to 2.12."
        lead: "Controls: age, age squared, education and hours."
        lang: python
        code: |-
          with pm.Model():
              b0 = pm.Normal("b0", 0, 5)
              b = pm.Normal("b", 0, 2.5, shape=5)
              logit = b0 + design @ b
              pm.Bernoulli("y", logit_p=logit, observed=y)
              idata = pm.sample(1000, tune=1000)
          # odds ratio for male: 1.65
          # 95% interval [1.27, 2.12]
        bullets:
          - "The census file is not included, so the data are **simulated**"
          - "True odds ratio **2.01**, from a log-odds of 0.7"
          - "The odds ratio is exp of the coefficient"
        takeaway: Simulation shows how far one dataset's estimate can sit from the truth, and a credible interval is not a guarantee.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          The coursework wrote the model through a PyMC3 formula interface that no longer exists. Current PyMC writes it out
          directly, and bambi offers a formula interface again. A 95% interval from one simulated dataset leaves out the truth
          some of the time.

      - layout: bullets
        beat: practice
        section: MCMC and Bayesian logistic regression (week 4)
        title: Metropolis against NUTS on the same model
        recall: How did Metropolis and NUTS compare on the same regression?
        answer: "From the same draws, Metropolis had a minimum ESS of 155 of 4,000 and a max r_hat of 1.041. NUTS had 3,306 and 1.001, about twenty times the effective samples."
        bullets:
          - "**Metropolis:** minimum ESS **155** of 4,000 draws, max r_hat **1.041**"
          - "**NUTS:** minimum ESS **3,306** of 4,000 draws, max r_hat **1.001**"
        takeaway: NUTS gives about twenty times the effective samples from the same draws, so Metropolis needs far more draws for the same precision.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          This is the Challenger comparison again with more dimensions. The coursework ends on the point chapter 1 makes, that a
          credible interval can be read the way people wish they could read a confidence interval.

  - title: Likelihoods and links
    divider: false
    summary: Maximum entropy · Binomial regression · Counts and mixtures · Ordered outcomes
    notes: The models so far used a Gaussian or a Bernoulli likelihood without saying why, so we now ask where a likelihood should come from.
    slides:
      - layout: statement
        beat: problem
        section: "Likelihoods and links: maximum entropy, counts and mixtures"
        title: Why a Gaussian, and why a Bernoulli?
        recall: What is McElreath's maximum entropy answer to choosing a likelihood?
        answer: "Given what you know about an outcome, such as its support, mean or variance, choose the distribution that can be realised in the most ways, so it assumes the least more."
        kicker: The problem
        statement: "Choose the distribution that can be realised in the most ways, and so assumes the least more."
        attribution: McElreath, Statistical Rethinking, chapter 9
        takeaway: Pick a likelihood from what you know about the outcome, not from habit.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          The constraints are things you know about an outcome, such as its support, its mean or its variance.

      - layout: cards
        beat: fundamentals
        section: "Likelihoods and links: maximum entropy, counts and mixtures"
        title: The common likelihoods are maximum entropy choices
        recall: Which constraints make the Gaussian, binomial and Poisson the maximum entropy choice?
        answer: "Ten pebbles in five buckets make the flat arrangement 113,400 ways, with entropy log 5 = 1.609. The Gaussian is highest for a given variance, the binomial for two unordered outcomes with a constant mean, and the Poisson is its limit."
        cards:
          - {title: Flat wins, accent: "1E3A5F", body: "Ten pebbles in five buckets: two per bucket is **113,400** ways, entropy log 5 = **1.609**"}
          - {title: Gaussian, accent: "0F7490", body: "Highest entropy on the real line for a **given variance**"}
          - {title: Binomial, accent: "D4621A", body: "Highest for **two unordered outcomes** with a constant expected value"}
          - {title: Poisson, accent: "94A3B8", body: "The binomial's **large-n, small-p** limit, with the same constraints"}
        takeaway: The familiar likelihoods are what you get when you assume the least beyond the constraints you actually know.
        source: notes/06-bayesian-machine-learning.md
        level: core
        notes: >-
          The flat arrangement is the one that can be produced in the most ways, more than any other, and its entropy is the
          largest possible.

      - layout: image
        beat: fundamentals
        section: "Likelihoods and links: maximum entropy, counts and mixtures"
        level: core
        title: A brute-force check of the binomial claim
        recall: How did McElreath check that the binomial has maximum entropy?
        answer: "Of 100,000 random distributions over two draws with expected value 1.4, the largest entropy found was 1.221728, against 1.221729 for the binomial with p = 0.7."
        kicker: Statistical Rethinking, Fig. 9.4
        image: ../../assets/sources/images/statistical-rethinking-fig9-4.png
        caption: "Entropies of 100,000 random distributions with expected value 1.4: largest found 1.221728, binomial with p = 0.7 gives 1.221729."
        takeaway: No random distribution beat the binomial, so the claim holds by brute force as well as by proof.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          Each of the random distributions had an expected value of 1.4 over two draws, which is the binomial's constraint.

      - layout: bullets
        beat: fundamentals
        section: "Likelihoods and links: maximum entropy, counts and mixtures"
        title: "A link bends the scale, and WAIC needs one likelihood"
        recall: What are the two practical consequences of choosing a likelihood and link?
        answer: "A link keeps predictions in range, but no coefficient gives a constant change on the outcome scale. WAIC cannot compare models with different outcome distributions."
        bullets:
          - "A **link** (logit for probabilities, log for rates) keeps predictions in range"
          - "No coefficient then gives a constant change on the outcome scale"
          - "A half-unit rise in log-odds from 0 moves probability by about **0.25**, and further up the curve far less"
          - "**WAIC** cannot compare models with different outcome distributions"
          - "Deviance includes the normalising constants"
        takeaway: Read a coefficient on the link scale, and compare models only within one outcome distribution.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          Both points are from Statistical Rethinking, chapter 9. The link table and Poisson offset belong with the regression
          and GLMs note in the probability and statistics pillar.

      - layout: bullets
        beat: practice
        section: "Likelihoods and links: maximum entropy, counts and mixtures"
        level: core
        title: Add the department and the sign reverses
        recall: What did the Berkeley admissions model show with and without department?
        answer: "Pooled, men had an odds ratio of 1.84 (bm +0.61). With department intercepts the sign reversed to an odds ratio of 0.91 (bm -0.10), because women applied more to departments with low admission rates."
        bullets:
          - "**Pooled, no department:** bm **+0.61** (sd 0.07), odds ratio **1.84**"
          - "**With department:** bm **-0.10** (sd 0.08), odds ratio **0.91**"
          - "Women applied more to departments with low admission rates"
        takeaway: A pooled comparison can reverse once you condition on where people applied, which is Simpson's paradox.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          The data have 12 rows, 6 departments by gender, standing for 4,526 applications of which 38.8% were admitted. The
          department intercepts run from 0.68 down to -2.64, and the model is a Binomial with a logit link.

      - layout: image
        beat: practice
        section: "Likelihoods and links: maximum entropy, counts and mixtures"
        level: core
        title: WAIC ties with and without gender once department is in
        recall: What did WAIC say about gender once department was in the model?
        answer: "The pooled model beat the intercept-only model by 91.5 WAIC points but fit each department badly. With department intercepts WAIC tied with and without gender, at 5200.9 and 5201.4."
        kicker: Statistical Rethinking, Fig. 10.6
        image: ../../assets/sources/images/statistical-rethinking-fig10-6.png
        caption: "Observed admission proportions against predictions for the six departments."
        bullets:
          - "Pooled model beats intercept-only by **91.5** WAIC points"
          - "With department, WAIC is **5200.9** against **5201.4** without gender"
          - "The data cannot say whether gender matters within departments"
        takeaway: A lower WAIC is not a good fit, and a tie means the data cannot separate the two models.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          The result is the book's, with bm of +0.61 and then -0.10 reproduced in a PyMC re-run.

      - layout: cards
        beat: pitfalls
        section: "Likelihoods and links: maximum entropy, counts and mixtures"
        level: core
        title: "Coefficient size, separation and counts: three warnings"
        recall: What are the warnings about coefficients, separation and counts?
        answer: "A log-odds slope of 0.61 can move a probability only from 0.982 to 0.990. With near-perfect separation a flat-prior glm gave a slope of 11.43 with sd 2,955, against 4.02 under Normal(0, 10). Keep counts as counts."
        cards:
          - {title: Big coefficient, small effect, accent: "1E3A5F", body: "A slope of **0.61** multiplies the odds by 1.84, but from an intercept of 4 moves p only **0.982 to 0.990**"}
          - {title: Separation, accent: "D4621A", body: "Flat-prior glm gave slope **11.43**, sd **2,955**, no warning. Normal(0, 10) gave **4.02**"}
          - {title: Counts stay counts, accent: "0F7490", body: "Never convert to proportions, which discards the sample size. A Poisson over different exposures takes **log(exposure)** as an offset"}
        takeaway: Judge an effect on the outcome scale, put a prior on a separated model, and keep the sample size in the data.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          His monastery simulation recovers 1.61 against a true 1.5 and 0.59 against 0.5. The Oceanic tools example warns about
          correlated parameters: contact and its interaction with population both overlap zero, with a correlation of -0.99, yet
          95.27% of the posterior mass says a high-contact island at log-population 8 has more tools.

      - layout: cards
        beat: fundamentals
        section: "Likelihoods and links: maximum entropy, counts and mixtures"
        level: deep
        title: Ordered logit puts K categories on K minus 1 cutpoints
        recall: How does an ordered logit work?
        answer: "K categories get K-1 cutpoints on the log-cumulative-odds scale, and a linear predictor is subtracted from all of them at once. The book's interaction model had WAIC 36,929.4 against 37,090.3 for the additive one."
        cards:
          - {title: Cutpoints, accent: "1E3A5F", body: "**K - 1** cutpoints on the log-cumulative-odds scale"}
          - {title: One predictor, accent: "0F7490", body: "The linear predictor is **subtracted from all** cutpoints at once"}
          - {title: Interaction wins, accent: "D4621A", body: "WAIC **36,929.4** against **37,090.3** (difference 160.8, se 25.80). Contact by intention slope **-1.27** is the largest"}
        takeaway: The cutpoints carry the shape of the response, and the predictor shifts all of them together.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          The comparison and the slope are from Statistical Rethinking, chapter 11, on the 9,930 trolley-problem responses.

      - layout: image
        beat: practice
        section: "Likelihoods and links: maximum entropy, counts and mixtures"
        level: deep
        title: Cutpoints you can check by eye
        recall: What are the intercept-only cutpoints on the trolley data, and are they recovered?
        answer: "They are the logit of the cumulative proportions. The logits are -1.92, -1.27, -0.72, 0.25, 0.89 and 1.77, and OrderedLogistic recovers -1.91, -1.26, -0.73, 0.23, 0.87 and 1.74."
        kicker: Statistical Rethinking, Fig. 11.1
        image: ../../assets/sources/images/statistical-rethinking-fig11-1.png
        caption: "9,930 responses on a 1 to 7 scale, re-described as cumulative proportions and then log-cumulative-odds. Cutpoints recovered within 0.03."
        takeaway: With no predictors the fitted cutpoints should equal the logit of the cumulative proportions, so you can check them by eye.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          The data are not in the repo, so the re-run simulates 9,930 responses from the book's cumulative proportions and fits
          an OrderedLogistic with an ordered transform.

      - layout: cards
        beat: practice
        section: "Likelihoods and links: maximum entropy, counts and mixtures"
        level: deep
        title: Zero inflation is two sources of zeros
        recall: What does a zero-inflated Poisson model, and how well did the re-run recover it?
        answer: "A zero comes from not working with probability p or from working and producing none, with likelihood p + (1 - p) exp(-lambda). Our seed 11 estimated 0.13 against 0.20 and 0.85 against 1.00."
        cards:
          - {title: Two processes, accent: "1E3A5F", body: "A zero from not working (probability **p**) or from working and producing none: **p + (1 - p) exp(-lambda)**"}
          - {title: The book's run, accent: "0F7490", body: "365 days, p = 0.2, rate 1.0, recovered as **0.1994** and **1.05**"}
          - {title: Our run, accent: "D4621A", body: "Seed 11 gave 184 zero days and **0.13** (true 0.20) and **0.85** (true 1.00)"}
        takeaway: The two sources of zeros are only weakly identified, so a single run can miss by this much.
        source: notes/06-bayesian-machine-learning.md
        notes: >-
          The estimates here are p and the rate. The point is that one run can miss, not that the model is wrong.

      - layout: bullets
