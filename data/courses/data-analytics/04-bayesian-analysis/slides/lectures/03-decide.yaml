      - layout: table
        beat: pitfalls
        section: Pitfalls
        title: Six ways a decision analysis goes wrong
        recall: Which pitfalls of Bayesian decisions does the note list?
        answer: "Reporting the posterior mean by habit, using accuracy on asymmetric costs, treating the loss as objective, a smooth optimiser on a spiky loss, averaging outcomes before applying the loss, and forgetting predictive noise."
        header: [Pitfall, What goes wrong, Fix]
        widths: [3.0, 3.4, 3.0]
        rows:
          - [Posterior mean by habit, It answers squared loss, Write the loss down first]
          - [Accuracy on asymmetric costs, A 0.5 threshold ignores costs, Set the threshold from the costs]
          - [Treating the loss as objective, Costs are estimates with owners, Show results across a range of costs]
          - [Smooth optimiser on a spiky loss, fmin stops at a local bump, Use a grid or restarts]
          - [Averaging before the loss, "L(E[theta]) is not E[L(theta)]", "Apply the loss per draw, then average"]
          - [Forgetting predictive noise, A posterior on the mean understates risk, Draw outcomes]
        takeaway: Apply the loss per draw, then average, and show the answer across a range of costs.
        source: notes/05-loss-functions-and-decisions.md
        notes: >-
          The note refers to the stock_fit and newsvendor code, where noise and a Poisson draw are added.
