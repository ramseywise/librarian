      - layout: code
        beat: practice
        section: "Example: predicting stock returns with a sign-sensitive loss"
        title: A wrong-way call costs more than an overshoot
        recall: What does the sign-sensitive loss give for true +0.01 and predictions of -0.01, +0.03 and 0.00?
        answer: "0.03, 0.02 and 0.01. The wrong-sign prediction costs most and making no call costs least. Squared error rates the first two equally."
        lead: "True return +0.01, three predictions."
        lang: python
        code: |-
          def stock_loss(true_return, yhat, alpha=100.0):
              wrong_way = true_return * yhat < 0
              return np.where(
                  wrong_way,
                  alpha * yhat**2
                  - np.sign(true_return) * yhat
                  + np.abs(true_return),
                  np.abs(true_return - yhat))
          # predict -0.01: 0.03
          # predict +0.03: 0.02
          # predict  0.00: 0.01
        bullets:
          - "Squared error rates -0.01 and +0.03 **equally**"
          - "Here they cost **0.03** and **0.02**"
          - "No call costs least: **0.01**"
        takeaway: When the direction matters more than the size, the loss has to say so.
        source: notes/05-loss-functions-and-decisions.md
        notes: >-
          The book prints the two squared losses as 0.004 each. The correct values are 0.0004 and 0.0004, and the point stands
          because both are equal.

