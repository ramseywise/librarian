      - layout: code
        beat: practice
        section: Ranking with few observations
        title: Star ratings use the same lower bound
        recall: How do seven star ratings become a lower bound?
        answer: "Map n stars out of 5 to n/5 and sum to S = 6.20 over seven ratings. The mean is 4.43 stars and the lower bound on the 0-1 scale is 0.591."
        lead: "Seven ratings out of 5 stars."
        lang: python
        code: |-
          ratings = np.array([5, 5, 4, 3, 5, 4, 5])
          S = (ratings / 5).sum()
          # a = 1 + S, b = 1 + (count - S)
          print(S, ratings.mean(),
                lower_bound(S, len(ratings) - S))
          # S 6.20  mean 4.43  lower bound 0.591
        bullets:
          - "Sum of normalised stars: **S = 6.20**"
          - "Mean **4.43** stars, lower bound **0.591**"
        takeaway: Anything with successes and trials ranks the same way, from products to sellers to ads.
