          - ["Expected loss, daily", "0.589", "0.143", "1.000"]
          - ["Expected loss, from day 14", "0.482", "0.038", "1.000"]
        highlight: [1, 2]
        takeaway: The columns that matter are the harmful one and the no-effect one, so read both before choosing a rule.
        source: notes/04-bayesian-ab-testing.md
        notes: >-
