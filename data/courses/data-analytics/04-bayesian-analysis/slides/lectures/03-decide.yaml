      - layout: statement
        beat: fundamentals
        section: "Expected loss: the decision rule"
        title: P(B > A) does not say how bad the other 9% is
        recall: What does expected loss measure that P(B > A) does not?
        answer: "The average conversion rate you give up by shipping B, counting only the worlds where A was actually better."
        kicker: Stucchio's decision rule
        statement: "E[loss | choose B] = E[ max(p_A - p_B, 0) ]"
        attribution: The conversion rate you give up, in the worlds where A was better
        takeaway: Expected loss turns the posterior into a number that has the cost of being wrong built in.
        source: notes/04-bayesian-ab-testing.md
        notes: >-
          It is a loss function in the sense of the chapter on loss functions, later in this lecture.

      - layout: bullets
        beat: fundamentals
        section: "Expected loss: the decision rule"
        title: Three ways to decide to ship B
        recall: What three decision rules does the chapter compare?
        answer: "A probability threshold (P(B > A) above 0.95), an expected-loss threshold (below epsilon, the smallest difference you care about) and a credible interval that excludes 0."
        bullets:
          - "**Probability threshold:** ship B when P(B > A) > 0.95"
          - "**Expected-loss threshold:** ship B when E[loss given B] < epsilon, for example 0.1 points"
          - "**Credible interval:** ship B when the 95% interval of the lift excludes 0"
        takeaway: The expected-loss rule stops early when B is clearly better, and also when the arms are so close that being wrong costs almost nothing.
        source: notes/04-bayesian-ab-testing.md
        notes: >-
          The rule keeps running only when the choice still matters. That second behaviour is the source of the surprise in the
          peeking simulation below.

