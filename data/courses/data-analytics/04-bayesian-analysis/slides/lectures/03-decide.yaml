      - layout: table
        beat: fundamentals
        section: In analytics practice
        title: Five decisions, five losses
        recall: What loss and Bayes action go with each analytics decision?
        answer: "Ship B or keep A: max(p_A - p_B, 0), ship if below epsilon. Inventory: an upper quantile. Fraud: the cost-balancing threshold. Price or bid: shade toward the safe side. Model selection: the business metric."
        header: [Decision, Loss to write down, Bayes action]
        widths: [2.4, 3.6, 3.4]
        rows:
          - [Ship B or keep A, "conversion lost if wrong", ship if expected loss < epsilon]
          - [Inventory or capacity, stock-outs cost more than surplus, an upper quantile and not the mean]
          - [Fraud threshold, missed fraud against blocked customer, threshold where expected costs balance]
          - [Price or bid, asymmetric payoff around a cutoff, shade toward the safe side]
          - [Model selection, the business metric, "the model with least expected business loss"]
        takeaway: Name the decision, write its loss, and the action follows from the posterior.
        source: notes/05-loss-functions-and-decisions.md
        notes: >-
          The first row is the expected-loss rule from the A/B chapter.

      - layout: code
        beat: practice
        section: In analytics practice
        level: core
        title: Stock the quantile, not the mean
        recall: What stock level minimises cost when running out costs five times a surplus unit?
        answer: "46, the quantile 5/6 (0.833) of predictive demand. The cost is 15.26 at the mean and 9.92 at the Bayes action."
        lead: "1,200 units over 30 days, Gamma posterior on the daily rate."
        lang: python
        code: |-
          rate = rng.gamma(1 + 1200, 1 / (0.03 + 30), 8000)
          demand = rng.poisson(rate)
          def stock_cost(q, short=5.0, over=1.0):
              return (short * np.maximum(demand - q, 0)
                      + over * np.maximum(q - demand, 0)).mean()
          # predictive mean 40.0, sd 6.5
          # best stock 46 = quantile 5/6
          # cost at the mean 15.26, at 46: 9.92
        bullets:
          - "Critical quantile **short / (short + over)** = 0.833"
          - "Best stock **46**, against a mean of 40"
          - "The mean costs about **54% more**"
        takeaway: The newsvendor answer is a quantile of the predictive distribution, and predictive noise belongs in it.
        source: notes/05-loss-functions-and-decisions.md
        notes: >-
          The demand draw adds Poisson noise on top of the posterior of the rate. A posterior on the mean alone would understate
          the risk.

