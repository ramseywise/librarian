        title: The answer the head of product asked for
        recall: What does the head of product get from the Larkspur posterior?
        answer: "The new checkout is better with probability above 0.9999, shipping a worse one costs 0.000001 pp in expectation, keeping A gives up 0.645 pp, and the lift clears half a point with probability 0.827 but a full point only 0.011."
        bullets:
