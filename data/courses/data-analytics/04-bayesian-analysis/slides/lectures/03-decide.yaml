  - title: Loss functions and decisions
    divider: false
    summary: Accuracy is not enough · Bayes actions · Showcase · Stocking and fraud · Should it ship
    notes: A posterior is not a decision. We write down what each wrong answer costs, average it over the posterior and pick the action with the smallest expected loss.
    slides:
      - layout: statement
        beat: problem
        section: Why accuracy is not enough
        title: A 1% hurricane is not a rounding error
        recall: What does a loss function measure that accuracy does not?
        answer: "Accuracy measures how close the estimate is. A loss function measures how bad acting on it would be."
        kicker: Bayesian Methods for Hackers, chapter 5
        statement: "Accuracy measures how close the estimate is. A loss function measures how bad acting on it would be."
        attribution: A meteorologist 95% sure there will be no hurricane advises no evacuation
        takeaway: Write down what each wrong answer costs before you pick the number to report.
        source: notes/05-loss-functions-and-decisions.md
        notes: >-
          Larkspur has a posterior for the checkout lift, and a posterior is not a decision. The finance lead wants to know if the
          redesign pays, and that depends on what a wrong call costs in each direction.

      - layout: table
        beat: fundamentals
        section: A catalogue of loss functions
        level: core
        title: Eight losses, and the job each fits
        recall: Which losses are in the catalogue, and what does each punish?
        answer: "Squared (large errors, outlier-sensitive), asymmetric squared (underestimating), absolute (robust), zero-one (right or wrong), log loss (confident wrong probabilities), bounded, pundit and sign-sensitive."
        header: [Loss, Behaviour, Typical use]
        widths: [2.6, 3.8, 3.2]
        rows:
          - [Squared error, "punishes large errors, outlier-sensitive", regression and most of ML]
          - [Asymmetric squared, underestimating costs more, capacity planning]
          - [Absolute error, linear and robust, forecasting with heavy tails]
          - [Zero-one, right or wrong, classification accuracy]
          - [Log loss, punishes confident wrong probabilities, probabilistic classifiers]
          - [Bounded, indifferent once far enough off, '"wrong is wrong" past a point']
          - [Pundit, huge near 0 and 1, confident yes/no calls]
          - [Sign-sensitive, wrong direction costs far more, trading and bets on a direction]
        takeaway: The loss you choose is a modelling decision, and it changes which answer is best.
        source: notes/05-loss-functions-and-decisions.md
        notes: >-
          The Weather Channel reports 20% rain when it believes 5 or 10%, since people notice a missed rain forecast more than a
          false alarm, per Silver. The loss being minimised is the forecaster's, not yours, so ask whose loss it is.

      - layout: bullets
        beat: pitfalls
        section: A catalogue of loss functions
        title: Whose loss is the forecast minimising
        recall: Why might a forecast be biased on purpose?
        answer: "The forecaster minimises its own loss. The Weather Channel reports a 20% chance of rain when it believes 5 or 10%, since people notice a missed rain forecast more than a false alarm."
        bullets:
          - "The Weather Channel reports **20%** rain when it believes **5 or 10%**"
          - "People notice a missed rain forecast more than a false alarm (Silver)"
          - "The loss being minimised is the forecaster's, not yours"
          - "Whenever you are handed a forecast, ask whose loss it is"
        takeaway: A number handed to you already has a loss function baked in, and it may not be yours.
        source: notes/05-loss-functions-and-decisions.md
        notes: >-
          The same question applies to any model score you inherit, such as a fraud probability tuned for someone else's costs.

      - layout: code
        beat: practice
        section: Expected loss and the Bayes action
        title: Minimise the average loss over posterior draws
        recall: What does minimising squared and absolute loss over a skewed posterior give?
        answer: "On a Gamma(2, 10) posterior, squared loss gives 20.03, the posterior mean, and absolute loss gives 16.85, the median. The mode is 10.00."
        lead: "A right-skewed posterior, Gamma(2, 10)."
        lang: python
        code: |-
          samples = rng.gamma(2.0, 10.0, 100_000)
          losses = {"squared": lambda t, g: (t - g) ** 2,
                    "absolute": lambda t, g: np.abs(t - g)}
          for name, loss in losses.items():
              best = sop.minimize_scalar(
                  lambda g: loss(samples, g).mean(),
                  bounds=(0, 100), method="bounded").x
              print(name, best)
          # squared  20.03   absolute 16.85
          # mean 20.03, median 16.85, mode 10.00
        bullets:
          - "Expected loss is the **average of L** over draws"
          - "The Bayes action minimises it"
          - "No formula was given to the optimiser"
        takeaway: With samples, a Bayes action is a vectorised loss and an optimiser.
        source: notes/05-loss-functions-and-decisions.md
        notes: >-
          The expected loss, or Bayesian risk, is l of theta-hat equal to the average of the loss over theta drawn from the
          posterior.

      - layout: image
        beat: fundamentals
        section: Expected loss and the Bayes action
        title: Mean, median and mode each answer a different loss
        recall: Which loss gives the mean, the median and the mode?
        answer: "Squared error gives the posterior mean, absolute error the median, and zero-one in the limit the mode, also called MAP."
        kicker: Gamma(2, scale 10)
        image: ../../assets/sources/images/bayes-actions-skewed-posterior.png
        caption: "Mode 10, median 16.8 and mean 20, each labelled with the loss that picks it."
        bullets:
          - "Squared error: posterior **mean**"
          - "Absolute error: posterior **median**"
          - "Zero-one, in the limit: posterior **mode** (MAP)"
          - "When your loss is none of these, none of them is your answer"
        takeaway: The mean, median and MAP are the usual summaries because each is optimal for one particular loss.
        source: notes/05-loss-functions-and-decisions.md
        notes: >-
          Zero-one needs a limit because every exact guess misses on a continuous posterior. As the miss width falls from 5.0 to
          1.0 to 0.2, the best guess moves from 10.95 to 9.60 to 9.30 toward the mode, and gets noisy when few samples fall in the
          window.

      - layout: bullets
        beat: fundamentals
        section: Expected loss and the Bayes action
        level: core
        title: Zero-one loss needs a window, and the window sets the answer
        recall: How does the zero-one best guess move as the miss width shrinks?
        answer: "Miss widths 5.0, 1.0 and 0.2 give best guesses 10.95, 9.60 and 9.30, moving toward the mode at 10.00 and getting noisier."
        bullets:
          - "**Miss width 5.0:** best guess **10.95**"
          - "**Miss width 1.0:** best guess **9.60**"
          - "**Miss width 0.2:** best guess **9.30**, and the guess gets noisier"
          - "The guess moves toward the mode at **10.00** as the window shrinks"
        takeaway: The mode is the limit of the zero-one loss, and the estimate gets noisy when few samples fall in the window.
        source: notes/05-loss-functions-and-decisions.md
        notes: >-
          Every exact guess misses on a continuous posterior, so zero-one loss only makes sense as a limit. The mode of the Gamma
          is 10.00.

      - layout: statement
        beat: problem
        section: "Example: The Price is Right showcase"
        title: One dollar over and you get nothing
        recall: What makes the showcase bid a good test of a loss function?
        answer: "The payoff has a cliff: bid over the true total and you get nothing, bid within $250 under and you win both showcases."
        kicker: Bayesian Methods for Hackers
        statement: "Bid over the true total and you get nothing. Bid within $250 under and you win both showcases."
        attribution: A snowblower and a trip to Toronto
        takeaway: A payoff with a cliff makes the posterior mean the wrong bid.
        source: notes/05-loss-functions-and-decisions.md
        notes: >-
          Someone adding point guesses would bid $15,000 regardless of uncertainty, and a naive Bayesian would bid the posterior
          mean. Neither accounts for the payoff.

      - layout: bullets
        beat: fundamentals
        section: "Example: The Price is Right showcase"
        level: core
        title: The posterior mean drops to $20,000
        recall: What posterior mean does the showcase model give, and how does it compare with the closed form?
        answer: "Sampling gives a posterior mean of 20,000 (sd 3,677). The closed form gives 19,899 (sd 3,712). That is about $15,000 below the prior mean of 35,000."
        bullets:
          - "Prior: true price ~ Normal(**35,000**, 7,500)"
          - "Guesses: snowblower Normal(3,000, 500), trip Normal(12,000, 3,000)"
          - "Fit of guesses to price: Normal(prize 1 + prize 2, 3,000)"
          - "Posterior mean **20,000**, sd 3,677. Closed form **19,899**, sd 3,712"
          - "`pm.Potential` adds any extra log-probability term"
        takeaway: The two prizes look cheap, so the posterior sits well below the prior, and it still is not the bid.
        source: notes/05-loss-functions-and-decisions.md
        notes: >-
          Normal priors and Normal evidence combine by precision, so the model has a closed form, and the sampled answer sits within
          Monte Carlo noise of it.

      - layout: code
        beat: practice
        section: "Example: The Price is Right showcase"
        level: deep
        title: The showdown loss has a cliff and a window
        recall: How is the showdown loss written?
        answer: "Underbid: lose the gap. Overbid: a fixed risk. Within 250 under: win both, a loss of minus twice the price."
        lang: python
        code: |-
          def showdown_loss(guess, true_price, risk=80000):
              loss = np.abs(guess - true_price)
              loss[true_price < guess] = risk
              close = ((true_price >= guess)
                       & (true_price - guess <= 250))
              loss[close] = -2 * true_price[close]
              return loss

          grid = np.arange(5000, 40000, 50)
          # expected loss per bid, over the draws,
          # then take the grid minimum
        bullets:
          - "`risk` is what the contestant says an overbid costs"
          - "The window pays out only for **rare draws**"
        takeaway: Search a grid, because a spiky expected loss defeats a smooth optimiser.
        source: notes/05-loss-functions-and-decisions.md
        notes: >-
          The book uses scipy fmin from a start of 15,000 and gets minima between 14,189 and 11,266 as risk rises, which sits a few
          hundred dollars from the grid. fmin only finds a local minimum. The book's prose says a frequentist bids 35,000, but
          3,000 plus 12,000 is 15,000 and the 35,000 is the prior's mean.

