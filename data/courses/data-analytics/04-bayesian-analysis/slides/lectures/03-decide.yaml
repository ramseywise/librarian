parts:
  - title: Bandits and Thompson sampling
    divider: false
    summary: Explore or exploit · Beta updates · Regret · Extensions · Bandit or A/B test
    notes: We start with the choice that makes a bandit hard, then let the Beta posterior decide which arm to pull next.
    slides:
      - layout: statement
        beat: problem
        section: Bayesian bandits (Thompson sampling)
        title: Which option do you try next?
        recall: Why is a multi-armed bandit hard?
        answer: "Each pull earns a reward and also teaches you about that arm. Pull the best-looking arm too early and you may never find the real best one."
        kicker: The problem
        statement: "Pull the best-looking arm too early and you may never discover the real best one."
        attribution: N slot machines with unknown payout rates
        takeaway: Every pull is both a payout and a lesson, so the choice is how much to learn and how much to earn.
        source: notes/03b-bandits-and-thompson-sampling.md
        notes: >-
          The multi-armed bandit is N slot machines with unknown payout rates. The Bayesian answer needs nothing beyond the
          Beta posterior from the earlier chapters.

      - layout: bullets
        beat: fundamentals
        section: Bayesian bandits (Thompson sampling)
        title: An A/B test explores uniformly, then exploits
        recall: How does an A/B test relate to a bandit?
        answer: "An A/B test is a bandit that explores uniformly until a fixed N and then exploits. A bandit shifts traffic as it learns."
        bullets:
          - "**Explore too little:** pull the best-looking arm early and you may never find the real best"
          - "**Explore too much:** pull every arm equally and you waste pulls on the losers"
          - "**An A/B test** explores uniformly until a fixed N, then exploits"
          - "**A bandit** shifts traffic toward the winner as evidence arrives"
        takeaway: A bandit sits between the two failures and moves its pulls toward the winner as evidence arrives.
        source: notes/03b-bandits-and-thompson-sampling.md
        notes: >-
          The A/B test is the special case with a fixed exploration phase. Thompson sampling, below, makes the shift
          gradual and automatic.

      - layout: cards
        beat: fundamentals
        section: Bayesian bandits (Thompson sampling)
        title: The posterior update is arithmetic
        recall: What are the two conjugate cases that cover most arms?
        answer: "Bernoulli reward with a Beta prior, and Gaussian reward with a Gaussian prior. From Beta(1, 1), 3 successes in 10 pulls gives Beta(4, 8); a N(0, 1) prior with S_4 = 2 gives mean 0.4 and variance 0.2."
        cards:
          - {title: Bernoulli and Beta, accent: "1E3A5F", body: "Beta(a, b) becomes Beta(a + S, b + t - S). From Beta(1, 1), **3 of 10** gives **Beta(4, 8)**"}
          - {title: Gaussian and Gaussian, accent: "0F7490", body: "A precision-weighted average of prior and data. N(0, 1) with S_4 = 2 gives mean **0.4**, variance **0.2**"}
          - {title: A pseudo-count, accent: "D4621A", body: "A conjugate prior acts like n0 earlier observations. Pick one you can update or sample cheaply"}
        takeaway: Thompson sampling is cheap because each update is arithmetic, and a non-conjugate arm needs MCMC every round.
        source: notes/03b-bandits-and-thompson-sampling.md
        level: core
        notes: >-
          After t pulls with S_t successes the Beta posterior has predictive success probability equal to its mean. The Gaussian
          case assumes unit-variance noise, and its variance does not depend on what was observed.

      - layout: flow
        beat: fundamentals
        section: Bayesian bandits (Thompson sampling)
        title: Thompson sampling in one loop
        recall: What are the steps of one round of Thompson sampling?
        answer: "Draw one sample from each arm's posterior, pull the arm with the largest draw, observe the reward and update that arm's Beta."
        steps:
          - {label: Posterior per arm, sub: "Beta(1 + wins, 1 + losses)", accent: "1E3A5F"}
          - {label: Draw one sample each, sub: "one per arm", accent: "0F7490"}
          - {label: Pull the largest, sub: "the arm with the top draw"}
          - {label: Observe the reward, sub: "win or loss", accent: "94A3B8"}
          - {label: Update that Beta, sub: "back to the start", accent: "D4621A"}
        caption: "Uncertain arms give widely spread samples, so they still win the draw sometimes."
        takeaway: Exploration happens automatically and fades as evidence accumulates, and losers are never discarded.
        source: notes/03b-bandits-and-thompson-sampling.md
        notes: >-
          The rule is due to Thompson in 1933 and spent decades in the shade. Empirical work by Chapelle and Li in 2011 found
          it highly competitive and argued it should be a standard baseline.

      - layout: code
        beat: practice
        section: Bayesian bandits (Thompson sampling)
        title: A 12-line strategy learns which arm to stop paying for
        recall: What does Thompson sampling do over 1,000 pulls on rates 0.85, 0.60 and 0.75?
        answer: "It pulls the arms [926, 26, 48] times. The 0.85 arm gets 926 pulls and a tight posterior, and the others stay wide."
        lead: "Three arms with true rates 0.85, 0.60 and 0.75."
        lang: python
        code: |-
          class BayesianStrategy:
              def __init__(self, bandits):
                  self.bandits = bandits
                  k = len(bandits)
                  self.wins = np.zeros(k)
                  self.trials = np.zeros(k)
              def sample_bandits(self, n=1):
                  for _ in range(n):
                      draw = rng.beta(1 + self.wins,
                          1 + self.trials - self.wins)
                      i = np.argmax(draw)
                      self.wins[i] += self.bandits.pull(i)
                      self.trials[i] += 1
          # pulls    [926  26  48]
          # post sd  [0.011 0.091 0.061]
        bullets:
          - "**926** of 1,000 pulls go to the 0.85 arm"
          - "Its posterior sd is **0.011**, the others **0.091** and **0.061**"
          - "Wide posteriors are correct: enough was learned to stop paying"
        takeaway: The strategy learns just enough about the losers to stop paying for more.
        source: notes/03b-bandits-and-thompson-sampling.md
        notes: >-
          The draw line is the whole algorithm. Everything else is bookkeeping. The Bandits class only returns a reward with the
          arm's true probability.

      - layout: bullets
        beat: fundamentals
        section: Bayesian bandits (Thompson sampling)
        level: core
        title: "Regret counts what you gave up by not pulling the best arm"
        recall: What is regret, and how must it grow for a good strategy?
        answer: "R_T sums, over rounds, the best arm's true rate minus the chosen arm's rate. Lai and Robbins proved a good strategy's regret must grow at least logarithmically in T."
        bullets:
          - "**R_T** is the sum of (best true rate - chosen arm's rate) over T rounds"
          - "Zero regret means you always picked the best arm"
          - "Any good strategy's regret grows at least **logarithmically** in T (Lai and Robbins, 1985)"
          - "Thompson sampling is logarithmic (Agrawal and Goyal, 2012)"
          - "Bayes-UCB is asymptotically optimal for binary rewards (Kaufmann et al., 2012)"
        takeaway: A strategy that matches the logarithmic rate has solved the problem, in the book's phrase.
        source: notes/03b-bandits-and-thompson-sampling.md
        notes: >-
          Regret is the yardstick for comparing strategies. The strategies on the next slides differ in how they trade
          exploring against earning.

      - layout: table
        beat: fundamentals
        section: Bayesian bandits (Thompson sampling)
        level: core
        title: Five rules, and what each one guarantees
        recall: Which strategies have a logarithmic regret guarantee?
        answer: "Bayes-UCB and Thompson sampling. Random is linear in T, max mean can lock onto a wrong arm, and the fixed 95% bound is measured, with no guarantee claimed."
        header: [Strategy, Rule, Expected regret]
        widths: [2.0, 4.0, 3.4]
        rows:
          - [Random, pick uniformly, linear in T]
          - [Max mean, pick the highest posterior mean, can lock onto a wrong arm]
          - [Upper credible bound, pick the highest 95th percentile, "no guarantee claimed, measured"]
          - [Bayes-UCB, pick a posterior quantile that rises over time, "logarithmic, optimal for binary"]
          - [Thompson, sample and take the max, logarithmic]
        highlight: [4]
        takeaway: Only Bayes-UCB and Thompson sampling carry a logarithmic guarantee, and Thompson has no quantile to choose.
        source: notes/03b-bandits-and-thompson-sampling.md
        notes: >-
          The upper credible bound uses a fixed quantile, so the note measures it in a simulation instead of quoting a bound.

      - layout: table
        beat: practice
        section: Bayesian bandits (Thompson sampling)
        title: On low checkout-style rates the plain bound beat Thompson
        recall: At 2,000 pulls, what regret did each rule reach on rates 0.15, 0.20 and 0.10?
        answer: "Random 100.0, max mean 28.3, the 95% upper bound 14.6 and Thompson 22.8. The ordering depends on the gaps and the horizon, so it is not a ranking."
        header: [Rule, Regret at 100, At 500, At 2000]
        widths: [3.0, 2.2, 2.2, 2.2]
        rows:
          - [Random, "5.0", "24.9", "100.0"]
          - [Max mean, "2.9", "8.8", "28.3"]
          - [95% upper bound, "3.3", "8.6", "14.6"]
          - [Thompson, "3.8", "12.4", "22.8"]
        highlight: [3]
        takeaway: Do not read this as a ranking, and run your own simulation with your rates and horizon before you commit.
        source: notes/03b-bandits-and-thompson-sampling.md
        notes: >-
          These are means over 300 runs, so they still carry noise. Random pays at a constant rate, while Thompson climbs from 12
          to 23 as pulls quadruple. At 500 pulls max mean is level with the bound.

      - layout: code
        beat: practice
        section: Bayesian bandits (Thompson sampling)
        level: deep
        title: Each rule is one lambda over wins and trials
        recall: How is the regret comparison set up?
        answer: "Each rule maps wins, trials and the round to an arm. The run repeats 300 times and averages the cumulative regret at pulls 100, 500 and 2000."
        lang: python
        code: |-
          rules = {
            "random": lambda w, n, t, r:
                r.integers(len(w)),
            "max mean": lambda w, n, t, r:
                np.argmax((1 + w) / (2 + n)),
            "95% upper bound": lambda w, n, t, r:
                np.argmax(stats.beta.ppf(
                    0.95, 1 + w, 1 + n - w)),
            "Thompson": lambda w, n, t, r:
                np.argmax(r.beta(1 + w, 1 + n - w)),
          }
          p = np.array([0.15, 0.20, 0.10])
        bullets:
          - "**300** runs of **2000** pulls per rule"
          - "Rates like a checkout, not a slot machine"
          - "Regret is read at pulls **100, 500, 2000**"
        takeaway: A new rule is one more lambda, so you can test any rule on your own rates in minutes.
        source: notes/03b-bandits-and-thompson-sampling.md
        notes: >-
          The run function cumulates p.max() minus the chosen arm's rate each round. It is the Law of Large Numbers again, as in the
          book's 500-run estimate.

      - layout: cards
        beat: fundamentals
        section: Bayesian bandits (Thompson sampling)
        level: core
        title: What the guarantees say, and what they do not
        recall: What three results sharpen the regret table?
        answer: "Bayesian regret averages over the prior and does not bound any single instance. Thompson's bounds are Thm 36.1 and 36.3. In Experiment 36.1 Thompson scored 29.9 against 23.8 for AdaUCB."
        cards:
          - {title: Bayesian regret, accent: "1E3A5F", body: "An average over your prior, so it does not bound any one instance. Analyse the frequentist regret instead"}
          - {title: Thompson's bounds, accent: "0F7490", body: "Thm 36.1 bounds Bayesian regret. Thm 36.3 gives asymptotic optimality for unit-variance Gaussian arms"}
          - {title: Experiment 36.1, accent: "D4621A", body: "Means (1/5, 0), n = 2,000: Thompson **29.9** against AdaUCB **23.8**, with a much larger variance"}
        takeaway: Thompson is a good default, and a tuned bound can beat it at a given horizon.
        source: notes/03b-bandits-and-thompson-sampling.md
        notes: >-
          Thm 36.1 gives a Bayesian regret of at most C times the square root of k n log n. Even the Bayes-optimal policy can have
          positive Bayesian regret, because it cannot know the best arm in round one. Thompson still beat the plain UCB of the
          book's chapter 7.

      - layout: compare
        beat: pitfalls
        section: Bayesian bandits (Thompson sampling)
        level: core
        title: A bad prior does not wash out in a bandit
        recall: Why can a misspecified prior fail to wash out in a bandit?
        answer: "If the prior underestimates an arm, Thompson sampling may rarely or never play it, so no data arrives to correct the belief. Check the arm counts, not only the posterior means."
        emphasis: right
        left:
          title: Ordinary Bayes
          bullets: ["Data overrules a bad prior", "The prior washes out"]
        right:
          title: A bandit
          bullets: ["The prior underrates an arm", "It is rarely or never played", "No data arrives to fix it"]
        takeaway: When the prior is shaky, check the arm counts, because the data you needed may never have been collected.
        source: notes/03b-bandits-and-thompson-sampling.md
        notes: >-
          This is Note 5 of chapter 36 in the bandit book, which leaves an exercise with means (0, 1/10) and n = 1,000.

      - layout: cards
        beat: fundamentals
        section: Bayesian bandits (Thompson sampling)
        title: Four extensions change one line each
        recall: What are the BMH extensions of Thompson sampling?
        answer: "Minimise instead (take argmin), non-stationary arms (a learning rate below 1 forgets old evidence), non-binary rewards (sample the posterior of the expected reward) and comment ranking (sample a score per comment and sort)."
        cards:
          - {title: Minimise, accent: "1E3A5F", body: "Prizes are bad: take the **argmin** of the samples"}
          - {title: Forget, accent: "0F7490", body: "Non-stationary arms: wins = rate * wins + result, with rate below 1"}
          - {title: Other rewards, accent: "94A3B8", body: "Sample each arm's expected reward. Needs MCMC if not conjugate"}
          - {title: Rank comments, accent: "D4621A", body: "Beta(1 + U, 1 + D) per comment, sampled and sorted at each page load"}
        takeaway: Sampling a score per item, and not ranking by a lower bound, still gives new items a chance to be seen.
        source: notes/03b-bandits-and-thompson-sampling.md
        notes: >-
          The comment-ranking row is the contrast with the lower-bound ranking in the Bayesian A/B chapter, covered later in this
          lecture.

      - layout: code
        beat: practice
        section: Bayesian bandits (Thompson sampling)
        level: core
        title: Forgetting pays when the world moves
        recall: What does forgetting buy when two arms swap their rates halfway through?
        answer: "Mean reward per pull rises from 0.162 to 0.179, about 10% more. On a stationary problem it costs a little, because forgetting throws away evidence."
        lead: "Two arms swap rates 0.20 and 0.10 halfway through 4,000 pulls."
        lang: python
        code: |-
          for t in range(T):
              p = (np.array([0.20, 0.10]) if t < T // 2
                   else np.array([0.10, 0.20]))
              i = np.argmax(rng.beta(1 + w, 1 + n - w))
              r = rng.random() < p[i]
              w, n = rate * w, rate * n
              w[i] += r
              n[i] += 1
          # rate 1.0:  0.162
          # rate 0.99: 0.179
        bullets:
          - "No forgetting earns **0.162** a pull"
          - "A rate of **0.99** earns **0.179**, about **10%** more"
          - "On a stationary problem it would cost a little"
        takeaway: The non-stationary fix is one line, and it pays whenever the arms drift.
        source: notes/03b-bandits-and-thompson-sampling.md
        notes: >-
          Each rate is averaged over 100 runs. The two multiplications by rate are the only change from plain Thompson sampling.

      - layout: bullets
        beat: fundamentals
        section: Bayesian bandits (Thompson sampling)
        level: deep
        title: Sutton and Barto's testbed, and why exact is out of reach
        recall: What did a purely greedy learner score on the 10-armed testbed, and why is the exact Bayesian answer not used?
        answer: "Greedy levelled off near 1 per step against about 1.54 for the best arm, and found the best arm in only about a third of runs. The exact answer has 2^2000 leaves in a 1,000-step tree."
        bullets:
          - "10 arms, 2,000 bandits, 1,000 steps, values from Normal(0, 1)"
          - "Greedy levels off near **1** against about **1.54** for the best arm"
          - "Epsilon-greedy at 0.1 never chose the best arm more than **91%** of the time"
          - "Exact Bayes-optimal exploration needs **2^2000** leaves for two actions and two rewards"
          - "Thompson sampling and UCB are the feasible stand-ins"
        takeaway: The Bayesian bandit of the chapter is an approximation to an answer too large to compute.
        source: notes/03b-bandits-and-thompson-sampling.md
        notes: >-
          Greedy found the best arm in only about a third of the runs, because disappointing early draws sent it elsewhere for good.
          Epsilon 0.01 improves more slowly but is expected to end higher, which the authors state and the 1,000 plotted steps do
          not show. The authors also note that effectively non-stationary problems are the most common in reinforcement learning.

      - layout: cards
        beat: fundamentals
        section: Bayesian bandits (Thompson sampling)
        level: deep
        title: The Gittins index is exact, under strict assumptions
        recall: When is the Bayes-optimal bandit policy an index policy?
        answer: "For discounted infinite-horizon reward with geometric discounting and independent arms. It breaks with other discounting, multiple plays per round or a finite undiscounted horizon, and carries no regret guarantee."
        cards:
          - {title: One arm, accent: "1E3A5F", body: "Against a known payoff the optimal policy is a retirement rule by backwards induction. **O(n^2)** against **O(n)**"}
          - {title: Many arms, accent: "0F7490", body: "Geometric discounting and independent arms: play the arm with the highest index"}
          - {title: Outside the assumptions, accent: "D4621A", body: "The index is only a heuristic. Optimality is for the discounted objective, with no regret guarantee"}
        takeaway: Use the index only for the problem it was proved for, and Thompson sampling everywhere else.
        source: notes/03b-bandits-and-thompson-sampling.md
        notes: >-
          The index is the smallest per-round charge that makes you indifferent between retiring and playing the arm. In Experiment
          35.1 (n = 500) the regrets appear only in a figure, so the note gives no numbers.

      - layout: bullets
        beat: practice
        section: Bayesian bandits (Thompson sampling)
        title: Bandit or A/B test
        recall: When do you use a bandit, and when a fixed-horizon A/B test?
        answer: "A bandit when showing a loser is costly, arms change or there are many arms. An A/B test when you need an unbiased effect to report, a one-off ship decision or guardrail and long-term metrics."
        bullets:
          - "**Use a bandit when** showing a loser costs a lot, arms change over time, or there are many arms"
          - "**Use an A/B test when** you must report an unbiased effect, the decision is one ship or no-ship, or you need guardrail metrics"
        takeaway: Use a bandit when showing a loser is costly, and an A/B test when you must report an unbiased effect and read guardrails.
        source: notes/03b-bandits-and-thompson-sampling.md
        notes: >-
          Adaptive allocation is why the bandit column cannot report a clean effect. The arm that looked bad early stops getting
          traffic, so its estimate stays noisy and tends to stay low.

      - layout: table
        beat: pitfalls
        section: Pitfalls
        title: Three ways a bandit misleads
        recall: Which bandit pitfalls does the note list?
        answer: "Reporting a bandit's arm means as an effect, trusting a published regret ranking, and a prior that underrates an arm. The fixes are a fixed split or holdout, your own simulation, and checking arm counts."
        header: [Pitfall, What goes wrong, Fix]
        widths: [3.0, 3.4, 3.0]
        rows:
          - [Reporting arm means as an effect, Adaptive allocation biases them, Run a fixed split or a holdout]
          - [Trusting a regret ranking, The order depends on gaps and horizon, Simulate with your own rates]
          - [A prior that underrates an arm, The arm may never be played, "Check arm counts, not only means"]
        takeaway: A bandit decides what to show, and a fixed split should measure the effect you report.
        source: notes/03b-bandits-and-thompson-sampling.md
        notes: >-
          The first two rows are the note's Pitfalls table. The third restates the misspecified-prior point from the guarantees
          section.

  - title: Bayesian A/B testing
    divider: false
    summary: The question changes · Beta closed form · Larkspur · Expected loss · Peeking · Ranking
    notes: We now answer the checkout question with a probability and an expected loss, test the claim that Bayesian tests are immune to peeking, and rank items with few ratings.
    slides:
      - layout: statement
        beat: problem
        section: The question changes
        title: Two questions the p-value cannot answer
        recall: What two things did Larkspur's head of product want from the checkout test?
        answer: "How likely is it that the new checkout is better, and what do we lose if we ship it and we are wrong? A lift, an interval and a p-value answer neither."
        kicker: Larkspur's checkout test
        statement: "How likely is the new checkout to be better, and what do we lose if we ship it and we are wrong?"
        attribution: Neither is a p-value
        takeaway: A Bayesian test computes both answers, in a few lines, from the same counts.
        source: notes/04-bayesian-ab-testing.md
        notes: >-
          The chapter also tests the claim that Bayesian tests are immune to peeking, and uses the same lower-bound idea to rank
          items with few ratings, including prompts by eval pass rate.

      - layout: bullets
        beat: fundamentals
        section: The question changes
        title: The question changes from surprise to probability
        recall: How does the question differ between frequentist and Bayesian A/B tests?
        answer: "Frequentist: if A and B were equal, how surprising is this data? Bayesian: given the data, what is P(B > A)? Bayesian gives a probability and an expected loss, and any N is fine."
        bullets:
          - "**Frequentist:** how surprising is this data if A = B? Fixed N set in advance, then reject or fail to reject"
          - "**Bayesian:** given the data, what is P(B > A)? Any N, unequal arms are fine, and you get a probability and an expected loss"
        takeaway: A p-value asks how surprising the data are under no effect, and a posterior asks how probable the effect is.
        source: notes/04-bayesian-ab-testing.md
        notes: >-
          The AB notebook in the experimentation pillar is entirely frequentist despite its folder name, and a comment in it points
          to this chapter.

      - layout: code
        beat: practice
        section: The PyMC model
        title: Two sites, 5% against 4%, B with half the traffic
        recall: What does the PyMC model for two sites estimate, and how does it compare with the closed form?
        answer: "It samples p_A, p_B and delta = p_A - p_B. It gave P(A better than B) = 0.169, against 0.157 from the closed form."
        lead: "Observed A 0.0380 and B 0.0467."
        lang: python
        code: |-
          with pm.Model():
              p_A = pm.Uniform("p_A", 0, 1)
              p_B = pm.Uniform("p_B", 0, 1)
              pm.Deterministic("delta", p_A - p_B)
              pm.Bernoulli("obs_A", p_A, observed=obs_A)
              pm.Bernoulli("obs_B", p_B, observed=obs_B)
              trace = pm.sample(1000, tune=1000)
          # P(A better than B) = 0.169
          # closed form        = 0.157
        bullets:
          - "Posterior sd **0.0078** for B against **0.0049** for A"
          - "The two answers agree to within a point"
        takeaway: Name the quantity you care about, here delta, and the sampler gives its whole posterior.
        source: notes/04-bayesian-ab-testing.md
        notes: >-
          The simulation is BMH chapter 2, with true rates 5% and 4% and sample sizes 1,500 and 750.

      - layout: bullets
        beat: pitfalls
        section: The PyMC model
        title: "The draw reversed the truth, and the report held"
        recall: What are the three things worth reading off the PyMC result?
        answer: "B's posterior is wider because it had half the traffic. The draw reversed the truth, so P(A better) is only about 0.17 though A really is better. More data firms the probability up with no change in method."
        bullets:
          - "B's posterior is wider (**0.0078** against **0.0049**): half the traffic"
          - "The model needs **no correction** for unequal N"
          - "A really is better, yet B's observed rate is higher: P(A better) is about **0.17**"
          - "A correct report of the data, and a wrong guess about the world"
          - "More N narrows the posterior and firms up the probability"
        takeaway: Small samples at low rates reverse the truth, so the sample-size calculation still matters.
        source: notes/04-bayesian-ab-testing.md
        notes: >-
          This is why the sample-size calculation from the experimentation pillar still matters under a Bayesian analysis.

      - layout: code
        beat: practice
        section: "Skip the sampler: Beta closed form"
        title: "Skip the sampler: two Beta draws and a comparison"
        recall: How do you get P(B > A) and the expected loss with no sampler?
        answer: "Draw from each arm's Beta posterior and compare. With 120/1000 against 140/1000, P(B > A) is 0.908 and the loss if you choose B is 0.00064 against 0.02058 for A."
        lead: "A converts 120 of 1,000, B converts 140 of 1,000."
        lang: python
        code: |-
          post_A = rng.beta(a0 + conv_A, b0 + n_A - conv_A,
                            200_000)
          post_B = rng.beta(a0 + conv_B, b0 + n_B - conv_B,
                            200_000)
          lift = (post_B - post_A) / post_A
          print((post_B > post_A).mean())
          print(np.maximum(post_A - post_B, 0).mean())
          print(np.maximum(post_B - post_A, 0).mean())
          # 0.908   lift 95% [-0.07, 0.462]
          # loss if choose B 0.00064, if A 0.02058
        bullets:
          - "Conjugate, so fast enough for every dashboard refresh"
          - "The exact finite sum gives **0.9079**"
        takeaway: Monte Carlo generalises to any function of the rates, such as relative lift or revenue, and that is the habit to keep.
        source: notes/04-bayesian-ab-testing.md
        notes: >-
          The exact sum is Evan Miller's. The relative lift interval of -0.07 to 0.462 includes zero, even though P(B > A) is 0.91.

