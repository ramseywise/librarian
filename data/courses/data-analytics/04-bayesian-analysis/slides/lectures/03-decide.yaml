      - layout: bullets
        beat: fundamentals
        section: Is peeking safe?
        level: deep
        title: Efron and Hastie on stopping rules
        recall: Why does a frequentist stopping rule cost more than 5%, and what does it say about the Bayesian?
        answer: "A trial scheduled for 30 looks, with a peek at month 20, rejects a true null with probability 0.074, not 0.05. The posterior is untouched by the stopping rule, but that leniency holds only for a prior that reflects real experience."
        bullets:
          - "30 monthly looks, ended at Z = **1.66**, just over the **1.645** cutoff"
          - "A peek at month 20 (Z = 0.79) makes the real rejection rate **0.074**, not 0.05"
          - "The likelihood is the same, so the posterior is untouched: the likelihood principle"
          - "That holds only for a prior that reflects real experience"
          - "The prior is the price Bayes pays, and the stopping rule is the price the p-value pays"
        takeaway: Bayesians may peek, with a prior built from real experience, and a flat default does not qualify.
        source: notes/04-bayesian-ab-testing.md
        notes: >-
          From Computer Age Statistical Inference, chapter 3. The 0.074 is recomputed as one minus the joint normal cdf at 1.645
          with correlation the square root of 20 over 30. Their meter-reader fable makes the same point.

