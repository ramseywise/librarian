          - ["Beta(5, 95), weak", "0.943", "+1.60 pp", "+0.64 pp"]
          - ["Beta(500, 9500), strong", "0.689", "+0.15 pp", "+0.52 pp"]
        highlight: [2]
        takeaway: Use the same prior for both arms, and a historical prior if you will read the first day.
        source: notes/04-bayesian-ab-testing.md
        notes: >-
          Day one is hypothetical, with 42 against 58 conversions per 900 visitors. The strong prior still pulls the full-test lift
