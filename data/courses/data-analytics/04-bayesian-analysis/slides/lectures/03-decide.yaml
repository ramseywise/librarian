          not which arm you hope wins.

      - layout: statement
        beat: problem
        section: Is peeking safe?
        title: Bayesian tests are not free to peek
        recall: Is a Bayesian test immune to peeking?
        answer: "No. Checked daily, P(B > A) > 0.95 ships 23.8% of no-effect changes in the simulation, against 4.7% checked once."
        kicker: Simulation, 4,000 tests per row
        statement: "The posterior is a valid summary at any N. That does not make stopping on a good look free."
        attribution: 30 days, 500 visitors per arm per day, 5% base rate
        takeaway: Run the experiment before you tell a planning meeting a test is immune to peeking.
        source: notes/04-bayesian-ab-testing.md
        notes: >-
          The simulation uses a Normal approximation to both Beta posteriors so that thousands of runs are cheap.

      - layout: code
        beat: practice
        section: Is peeking safe?
        level: deep
        title: Two stopping rules, each a few lines
        recall: How are the two stopping rules written in the simulation?
        answer: "The probability rule ships when the Normal cdf of d over sd is above 0.95. The loss rule ships when the Normal-approximate expected loss is below epsilon, 0.0005."
        lang: python
        code: |-
          def prob_rule(d, sd):
              return stats.norm.cdf(d / sd) > 0.95

          def loss_rule(d, sd, eps=0.0005):
              u = d / sd
              loss = sd * (stats.norm.pdf(u)
                           - u * stats.norm.cdf(-u))
              return loss < eps

          # run on days 1..30, or on the last day only,
          # or only from day 14 on
        bullets:
          - "The probability rule is close to a one-sided p < 0.05"
          - "The loss rule is epsilon = **0.05 pp**"
        takeaway: A rule is only a function of the daily difference and its standard error, so you can rerun it on your setup.
        source: notes/04-bayesian-ab-testing.md
        notes: >-
          The expected loss of a Normal difference has the closed form shown, which is why the simulation needs no sampler.

