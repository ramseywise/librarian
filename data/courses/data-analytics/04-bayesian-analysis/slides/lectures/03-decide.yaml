        level: core
        title: What each row shows
        recall: What does each row of the peeking table show?
        answer: "Checked once, the probability rule ships a no-effect change 4.7% of the time, checked daily 23.8%. The daily loss rule ships a harmful change 14.3% of the time. Waiting until day 14 cuts that to 3.8%."
        cards:
          - {title: Rows 1 and 2, accent: "1E3A5F", body: "One look: **4.7%** of no-effect changes shipped. Daily looks: **23.8%**. Taking the first favourable look selects on noise"}
          - {title: Row 3, accent: "D4621A", body: "Daily expected loss ships **59%** of no-effect changes, which is harmless. It ships a harmful change **14.3%** of the time"}
          - {title: Row 4, accent: "0F7490", body: "A minimum sample of 14 days cuts harmful shipping to **3.8%** and still ships real wins"}
        takeaway: A minimum sample size is what protects you from an early lucky start.
        source: notes/04-bayesian-ab-testing.md
        notes: >-
          Row 1 is close to a one-sided p-value of 0.05. Row 2 is in line with the inflation of about 25% over twenty looks in the
          experimentation-at-scale chapter. The posterior is calibrated averaged over the prior, and a simulation fixing the effect
          at exactly zero is not that average. Running full weeks also handles day-of-week effects.

      - layout: steps
        beat: practice
        section: Is peeking safe?
        title: The stopping rule to use
        recall: What is the stopping rule the chapter recommends?
        answer: "An expected-loss threshold, a minimum sample size set in advance, and full weeks. Do not call the test immune to peeking."
        steps:
          - {title: Expected-loss threshold, text: "Ship when the loss is below epsilon, the smallest difference you care about"}
          - {title: Minimum sample set in advance, text: "For example wait until day 14 before the rule can fire"}
          - {title: Full weeks, text: "Handles day-of-week effects"}
          - {title: Never say immune to peeking, text: "The second row of the table says it is not", n: "★", accent: "D4621A"}
