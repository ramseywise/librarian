parts:
  - title: Partial pooling
    divider: false
    summary: Three estimates · The weight · What it buys · The ICC
    notes: We start with one number per group and the three ways to estimate it, then measure what borrowing strength buys on simulated data with a known truth.
    slides:
      - layout: statement
        beat: problem
        section: Three ways to estimate one number per group
        title: Is that market special, or small and lucky?
        recall: Why is one market with a lift three times the average hard to read?
        answer: "It may be special, or it may be small and lucky. Treating every market alone believes the luck, and averaging them all ignores any real difference."
        kicker: The problem
        statement: "Treating every market alone believes the luck. Averaging them all ignores any real difference."
        attribution: Larkspur's checkout test in 24 markets
        takeaway: A multilevel model estimates all the markets together, and each borrows strength in proportion to how little data it has.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          Larkspur runs its checkout test in 24 markets and the dashboard shows one with a lift three times the average. The chapter
          measures what borrowing strength buys on simulated data where the truth is known, and then measures where it buys nothing.

      - layout: cards
        beat: fundamentals
        section: Three ways to estimate one number per group
        title: Three ways to estimate revenue per user for a market
        recall: What are the three ways to estimate one number per group?
        answer: "No pooling uses the market's own mean, complete pooling gives every market the overall mean, and partial pooling takes a weighted average of the two."
        cards:
          - {title: No pooling, accent: fundamentals, body: "The market's own mean. **Unbiased**, and noisy when the market is small"}
          - {title: Complete pooling, accent: practice, body: "The overall mean for every market. **Stable**, and it erases every real difference"}
          - {title: Partial pooling, accent: pitfalls, body: "A **weighted average** of the two, with the weights learned from the data"}
        takeaway: Partial pooling sits between the two extremes, and the model decides how far.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          Each user belongs to one market. McElreath frames it as complete pooling underfitting and no pooling overfitting.

      - layout: bullets
        beat: fundamentals
        section: Three ways to estimate one number per group
        level: core
        title: The weight on a market's own mean
        recall: What weight does a market with n users put on its own mean?
        answer: "tau squared divided by tau squared plus sigma squared over n. Tau is the sd of true market means and sigma the sd of users within a market."
        bullets:
          - "**weight = tau^2 / (tau^2 + sigma^2 / n)**"
          - "tau is the sd of true market means, sigma the sd of users within a market"
          - "sigma^2 / n is how noisy the market's own mean is"
          - "Noisy markets get little weight, and precise ones keep nearly all of theirs"
          - "The model estimates tau and sigma, so you do not pick the shrinkage by hand"
        takeaway: More users, or more real spread between markets, means more weight on the market's own mean.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          MixedLM fits it with REML, restricted maximum likelihood, the usual way to estimate variances without the bias from also
          estimating the means. Its estimate for each market is called a BLUP, the best linear unbiased prediction.

      - layout: code
        beat: practice
        section: Three ways to estimate one number per group
        level: deep
        title: Simulate markets, then fit the three estimates
        recall: How does the chapter produce the three estimates?
        answer: "It simulates 40 markets of very different sizes, fits a random-intercept MixedLM with REML, and compares the group means, the overall mean and the fitted values."
        lead: "Users nested in markets of very different sizes."
        lang: python
        code: |-
          fit = smf.mixedlm("y ~ 1", df,
                            groups="market").fit(reml=True)
          partial = [fit.fe_params["Intercept"]
                     + fit.random_effects[g].iloc[0]
                     for g in groups]
          none = df.groupby("market")["y"].mean()
          complete = df["y"].mean()
          # 40 markets, 2221 users
          # between-market sd: true 6.0, estimated 5.77
          # within-market sd:  true 30.0, estimated 29.74
        bullets:
          - "**groups** names the grouping"
          - "The fit recovers both sds close to the truth"
          - "Market sizes run from 5 to 262 users"
        takeaway: The model recovers tau and sigma from the data, and those two numbers set every market's weight.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          The simulation draws market sizes from a log-normal clipped between 5 and 1,500. The true sds are 6.0 between markets
          and 30.0 within them.

      - layout: table
        beat: practice
        section: Three ways to estimate one number per group
        level: core
        title: Small markets move a lot, large ones barely move
        recall: How far did the five-user and the 262-user market move?
        answer: "The five-user market measured 54.26 against a true 45.39, with weight 0.16, so the model pulled it to 42.10. The 262-user market has weight 0.91 and barely moves."
        header: [Users, True, No pooling, Partial, Weight on own mean]
        widths: [1.4, 1.6, 2.0, 1.8, 2.8]
        rows:
          - ["5", "45.39", "54.26", "42.10", "0.16"]
          - ["11", "43.88", "36.16", "38.74", "0.29"]
          - ["44", "32.65", "26.39", "31.44", "0.62"]
          - ["128", "44.10", "42.03", "41.65", "0.83"]
          - ["262", "40.72", "36.91", "37.18", "0.91"]
        highlight: [0]
        takeaway: The model pulls a market toward the overall mean in proportion to how little data it has.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          The five-user market measured 54.26 dollars against a true 45.39. With weight 0.16 the model pulls it to 42.10 dollars.

      - layout: image
        beat: practice
        section: Three ways to estimate one number per group
        title: The smallest markets move up to about 12 dollars
        recall: What does the shrinkage plot show against market size?
        answer: "Each market's own mean and its partially pooled estimate. The smallest markets move up to about 12 dollars towards the overall mean, and the largest barely move."
        kicker: Shrinkage by size
        image: ../../assets/sources/images/bayes-multilevel-shrinkage.png
        caption: "Each market's own mean and its partially pooled estimate, against market size. The smallest markets move up to about 12 dollars and the largest barely move."
        takeaway: Shrinkage is largest where the data is thinnest.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          The figure is generated by the chapter's practice script from its simulated markets.

      - layout: table
        beat: practice
        section: Three ways to estimate one number per group
        level: core
        title: Partial pooling wins in every size band
        recall: Which method has the lowest RMSE in each size band?
        answer: "Partial pooling, in all of them: 3.54 overall against 5.69 and 5.47. For small markets complete pooling is close (4.61), and for large markets no pooling is (2.31)."
        header: [This dataset, No pooling, Complete, Partial]
        widths: [4.0, 1.8, 1.8, 1.8]
        rows:
          - ["All markets", "5.69", "5.47", "3.54"]
          - ["Small, under 30 users (13)", "8.21", "4.61", "4.17"]
          - ["Middle (24)", "4.11", "5.95", "3.32"]
          - ["Large, 150 or more (3)", "2.31", "4.82", "2.06"]
        highlight: [0]
        takeaway: Partial pooling behaves like the better of the two at each size without being told which that is.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          For small markets no pooling is the worst choice at 8.21. For large markets the order reverses, 2.31 against 4.82.

      - layout: bullets
        beat: practice
        section: Three ways to estimate one number per group
        title: The same result on 200 new datasets
        recall: How did partial pooling do over 200 new datasets?
        answer: "RMSE was 3.47 against 5.13 for no pooling and 5.98 for complete pooling. It beat no pooling in 96% of datasets and complete pooling in 100%."
        bullets:
          - "**One dataset:** no pooling 5.69, complete pooling 5.47, partial pooling **3.54**"
          - "**200 new datasets:** no pooling 5.13, complete pooling 5.98, partial pooling **3.47**"
          - "Partial pooling beat no pooling in **96%** of datasets and complete pooling in **100%**"
        takeaway: One dataset can flatter, and the replication says the win is not a fluke.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          Every example in the chapter is nested, each user in exactly one market. A user in several markets is a crossed design,
          and PyMC is the easier route for it.

      - layout: statement
        beat: problem
        section: Intraclass correlation is the design effect's input
        title: An ICC of 3.6% looks ignorable
        recall: Why does a small ICC still matter?
        answer: "It applies to every pair of users in a market, so it multiplies the variance of the overall mean by about five."
        kicker: The intraclass correlation
        statement: "An ICC of 0.036 sounds ignorable, but it multiplies the variance of the overall mean by about five."
        attribution: "ICC = tau^2 / (tau^2 + sigma^2)"
        takeaway: The 3.6% applies to every pair of users in a market, so the clustering cost grows with cluster size.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          The ICC is the share of total variance between groups, and also the correlation between two users in the same market.
          Probability foundations used it to build the design effect, 1 + (m - 1) rho. Here rho is a parameter the model estimates.

      - layout: bullets
        beat: practice
        section: Intraclass correlation is the design effect's input
        level: core
        title: Which market size goes into the design effect
        recall: How do the design effects from different market sizes compare?
        answer: "The mean size of 56 gives 2.98, the user-weighted size of 104 gives 4.74, close to the exact 4.95. The clustered SE from this one dataset implies 3.85."
        bullets:
          - "ICC: true **0.038**, estimated **0.036**"
          - "Mean market size (56): design effect **2.98**"
          - "User-weighted size (104): design effect **4.74**"
          - "Exact, from the true variances and these sizes: **4.95**"
          - "(Clustered SE / naive SE) squared, one dataset: **3.85**"
        takeaway: Weight by users, the size the average user sees, and expect one clustered SE to be noisy with 40 markets.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          The naive standard error of the mean is 0.642 and the clustered one 1.258. The textbook formula assumes equal groups.

  - title: Slopes, toolkits and the choice of tool
    divider: false
    summary: Random slopes · MixedLM and PyMC · Clustered SEs, fixed effects or multilevel
    notes: Next we let each group have its own trend, check two toolkits against each other, and choose between three tools.
    slides:
      - layout: bullets
        beat: fundamentals
        section: Random intercepts, then random slopes
        title: A random intercept and a random slope
        recall: What is the difference between a random intercept and a random slope?
        answer: "A random intercept gives each group its own level. A random slope also gives each group its own effect of a predictor."
        bullets:
          - "**Random intercept:** each group has its own level, `groups` names the grouping, and every user shares one trend"
          - "**Random slope:** each group has its own effect of a predictor, and `re_formula` names what varies by group"
          - "Example: 150 users, 6 weeks, each with a trend"
        takeaway: Name the grouping with groups, and name what varies by group with re_formula.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          The example is weekly revenue for 150 users over 6 weeks, where each user has their own level and their own trend.

      - layout: table
        beat: practice
        section: Random intercepts, then random slopes
        level: core
        title: Same estimate, different standard errors
        recall: "Why do the four fits share one estimate but not one standard error?"
        answer: "The panel is balanced, so the estimate is 1.300 in all four. Naive OLS gives 0.296 because week varies only within a user, random intercepts alone say 0.222, and random slopes (0.276) and clustered OLS (0.277) agree."
        lead: "The week effect is 1.300 in all four fits."
        header: [Fit, SE of the week effect]
        rows:
          - [Naive OLS, "0.296"]
          - [Random intercepts, "0.222"]
          - [Random intercepts and slopes, "0.276"]
          - ["OLS, clustered", "0.277"]
        highlight: [1]
        takeaway: Random intercepts alone say 0.222, about 20% below the 0.276 from the model that lets slopes vary.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          The point estimate is the same because the panel is balanced. Naive OLS is higher at 0.296, because week varies only
          within a user. In psychology, hierarchical regression often means adding blocks of predictors, which is a different thing.

      - layout: code
        beat: practice
        section: The same model in two toolkits
        level: deep
        title: The PyMC version uses the non-centred form
        recall: How does the PyMC model draw each user's level and trend?
        answer: "It draws a correlated pair from an LKJ prior on the covariance, in the non-centred form, then adds each user's level and trend to the fixed effects."
        lead: "MixedLM is linear only, so this compares on a continuous metric."
        lang: python
        code: |-
          chol, corr, sds = pm.LKJCholeskyCov(
              "chol", n=2, eta=2,
              sd_dist=pm.HalfNormal.dist(10),
              compute_corr=True)
          raw = pm.Normal("raw", 0, 1,
                          shape=(n_users, 2))
          u = pm.Deterministic(
              "u", pm.math.dot(chol, raw.T).T)
          pm.Normal("y",
              intercept + u[user, 0]
              + (trend + u[user, 1]) * week,
              sigma, observed=y)
        bullets:
          - "**raw** is standard normal, so the sampler avoids the funnel"
          - "The LKJ prior sets the correlation between level and trend"
          - "target_accept 0.95"
        takeaway: The non-centred form from chapter 2 is the default for a multilevel model in PyMC.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          Chapter 2's eight schools example showed why the sampler needs the non-centred form.

      - layout: table
        beat: practice
        section: The same model in two toolkits
        level: core
        title: MixedLM and PyMC agree when the data carries the signal
        recall: How close are MixedLM and PyMC on the first run?
        answer: "Every parameter matches within 0.03 and each user's trend correlates at 1.000. Pooling cuts the error on each user's trend from 2.27 to 1.30."
        header: [Parameter, Truth, MixedLM, PyMC]
        widths: [3.2, 1.8, 1.8, 1.8]
        rows:
          - ["intercept", "40.0", "40.12", "40.12"]
          - ["trend", "1.5", "1.30", "1.30"]
          - ["sd_intercept", "8.0", "6.87", "6.90"]
          - ["sd_slope", "2.5", "2.25", "2.28"]
          - ["rho", "0.3", "0.33", "0.33"]
        takeaway: With clean diagnostics, the two toolkits give the same answer to the cent.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          Diagnostics are clean, max r_hat 1.004, min ess_bulk 819 and no divergences. The largest gap for any user is 17 cents.

      - layout: table
        beat: pitfalls
        section: The same model in two toolkits
        title: Shrink the slope spread and they part ways
        recall: What happens when the true slope spread falls from 2.5 to 1.0?
        answer: "The fixed effects still agree, but MixedLM reports a slope sd of 0.46 and a correlation of 1.00 with no warning. PyMC gives 0.68 and 0.28 with a 90% interval of -0.27 to 0.79."
        header: [Parameter, Truth, MixedLM, PyMC]
        widths: [3.2, 1.8, 1.8, 1.8]
        rows:
          - ["trend", "1.5", "1.33", "1.33"]
          - ["sd_intercept", "8.0", "6.92", "7.49"]
          - ["sd_slope", "1.0", "0.46", "0.68"]
          - ["rho", "0.3", "1.00", "0.28"]
        highlight: [3]
        takeaway: A correlation of exactly 1 comes with no warning, and it is the optimiser stopping at the edge.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          PyMC's rho interval runs from -0.27 to 0.79, so the data has said little, and the LKJ prior pulls towards zero. Its minimum
          bulk ESS fell to 266 with r_hat 1.009.

      - layout: statement
        beat: pitfalls
        section: The same model in two toolkits
        title: Read a correlation of plus or minus 1 as a warning
        recall: What does a boundary estimate such as a correlation of exactly 1 mean?
        answer: "The data cannot separate the two random effects and the optimiser has stopped at the edge. The model is too rich for this data."
        kicker: Boundary estimates
        statement: "Read a correlation of exactly 1 as: this model is too rich for this data."
        attribution: The chapter's reading of the MixedLM result
        takeaway: Simplify the model, or use PyMC with a prior and report the interval.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          The same applies to a between-group sd of zero, which pools completely.

      - layout: table
        beat: fundamentals
        section: "Which tool: the decision table"
        level: core
        title: Clustered SEs, fixed effects or a multilevel model
        recall: Which tool answers which question?
        answer: "Clustered SEs for a population average with groups as a nuisance, fixed effects for a within-group effect that may correlate with the predictor, and a multilevel model when the group estimates themselves matter."
        header: [The question, Use, Watch for]
        widths: [3.4, 3.0, 3.0]
        rows:
          - ["A population-average effect, groups a nuisance", "Clustered standard errors", "Too few clusters"]
          - ["An effect within groups, group effect may correlate with the predictor", "Fixed effects, or a within-between random-effects model", "Cannot estimate anything constant within a group"]
          - ["The group-level estimates, or the spread between groups", "Multilevel model", "Needs exchangeable groups, and enough of them"]
        highlight: [2]
        takeaway: Pick the tool from the question you are asking, not from the shape of the data.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          Fixed effects compare each group only with itself, so a fixed difference between groups cannot bias them. They still need
          clustered SEs. The regression chapter has the clustered-SE mechanics.

      - layout: table
        beat: practice
        section: "Which tool: the decision table"
        level: core
        title: "A market effect that tracks the discount breaks random effects"
        recall: What did the four estimators give when the market effect was related to the discount?
        answer: "Pooled OLS gave 3.04 and random intercepts 2.83, both wrong for a true 2. Fixed effects and within-between stayed at 1.99. In the unrelated case all four were centred on 2."
        header: [Estimator, Unrelated, Related]
        widths: [4.6, 2.0, 2.0]
        rows:
          - ["Pooled OLS, clustered SE", "2.004", "3.042"]
          - ["Fixed effects, clustered SE", "1.988", "1.988"]
          - ["Random intercepts", "2.001", "2.826"]
          - ["Within-between random intercepts", "1.988", "1.988"]
        highlight: [0, 2]
        takeaway: Neither a larger sample nor the standard errors would warn you that plain random intercepts are biased.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          The true within-market effect is 2.0, over 400 datasets. Random intercepts are the most precise when unrelated, actual sd
          0.213 against 0.266. In 7 of the 400 runs the random-intercept fit returned a missing standard error without an error.

      - layout: cards
        beat: fundamentals
        section: "Which tool: the decision table"
        level: core
        title: Three papers, three rules for choosing
        recall: What does each of the three papers add to the choice of tool?
        answer: "Bell and Jones: split the predictor into a group mean and a deviation, and the within coefficient equals fixed effects. McNeish et al.: clustered SEs or GEE are simpler when you only need clustering. Cameron and Miller: cluster anyway."
        cards:
          - {title: Bell and Jones, accent: fundamentals, body: "Split the predictor into a **group mean** and a **deviation**. The within coefficient then equals fixed effects"}
          - {title: McNeish et al., accent: practice, body: "A multilevel model makes **10** assumptions and clustered SEs **3**. Use it when the clusters themselves matter"}
          - {title: Cameron and Miller, accent: pitfalls, body: "Fixed effects do not remove within-cluster correlation, so **cluster anyway**. There is no clear definition of few"}
        takeaway: Reach for the simpler tool unless the groups or their variability are the question.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          The within-between model can still estimate things that do not vary within a group, which fixed effects cannot. The 0.266
          in the table comes from 400 datasets, and 10,000 give 0.297, matching the theoretical 0.299.

  - title: Reading many segments
    divider: false
    summary: The winner's curse · Where pooling does not help · Few groups · Conversion
    notes: Now the case this pillar cares about, an experiment reporting a lift for each of 24 segments, and then the cases where pooling stops helping.
    slides:
      - layout: statement
        beat: problem
        section: "The A/B application: reading many segments"
        title: The raw winner measured +3.17 and was truly +1.25
        recall: What did the raw winner look like in the one dataset?
        answer: "Segment 6, with 672 users an arm, measured +3.17 with a true lift of +1.25. Pooling took it to +1.27."
        kicker: The winner's curse
        statement: "The raw winner measured +3.17 with a true lift of +1.25. Pooling took it to +1.27."
        attribution: 24 segments, true lifts around +1.0 with tau 0.5
        takeaway: Pooling instead picked segment 3, with 8,102 users an arm, which was truly best.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          An experiment reports a lift and a standard error for each of 24 segments. The pooled winner measured +2.42, was pooled to
          +1.69, and was truly +1.79.

      - layout: flow
        beat: fundamentals
        section: "The A/B application: reading many segments"
        level: core
        title: Check the fast shortcut against the sampler
        recall: How does the chapter make thousands of replications cheap and still trust them?
        answer: "Given tau the normal model has a closed form, so a grid over tau replaces sampling. PyMC checks one dataset, and the largest gap in a segment's mean is 0.014."
        steps:
          - {label: Closed form given tau, sub: "normal-normal model", accent: fundamentals}
          - {label: Integrate tau on a grid, sub: "cheap to replicate", accent: practice}
          - {label: Check against PyMC, sub: "gap at most 0.014", accent: pitfalls}
          - {label: Replicate 1,000 times, sub: "the evidence", accent: wrap}
        caption: "As in chapter 2, check the shortcut against the sampler before you trust it."
        takeaway: A shortcut earns trust by matching the sampler on one dataset before it runs a thousand.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          The PyMC model uses the non-centred form with a half-normal prior on tau, with max r_hat 1.002 and no divergences.

      - layout: cards
        beat: practice
        section: "The A/B application: reading many segments"
        level: core
        title: Over 1,000 datasets, pooling fixes how much you claim
        recall: What did 1,000 simulated experiments show?
        answer: "RMSE fell from 1.357 to 0.489. The winner's estimate minus its true lift was +2.93 per segment and +0.09 pooled. The segment picked had a true lift of 1.46 pooled against 1.26, and 1.98 for the truly best."
        cards:
          - {title: Error, accent: fundamentals, body: "RMSE **1.357** per segment, **0.489** pooled. Coverage **0.90** for both"}
          - {title: The claim, accent: pitfalls, body: "Winner's estimate minus its true lift: **+2.93** per segment, **+0.09** pooled"}
          - {title: The pick, accent: practice, body: "True lift of the segment chosen: **1.26** per segment, **1.46** pooled, **1.98** for the truly best"}
        takeaway: Pooling mostly fixes how much you claim, and only partly which segment you pick.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          The truly best segment has a true lift of 1.98. This is the exaggeration from the hypothesis-testing chapter, which a
          pooled estimate largely removes in this design. The narrower intervals are not bought by overconfidence.

      - layout: compare
        beat: fundamentals
        section: "The A/B application: reading many segments"
        level: core
        title: Bonferroni widens intervals, pooling moves estimates
        recall: How do Bonferroni and partial pooling differ, and what did Gelman, Hill and Yajima find?
        answer: "Bonferroni keeps estimates where they are and widens intervals, while pooling moves estimates towards each other, more for uncertain ones. In the eight-schools simulation the classical analysis called 7% significant with 63% in the right direction, the Bayesian 0.5% with 89%."
        emphasis: right
        left:
          title: Classical correction
          bullets: ["Estimates stay where they are", "Intervals widen", "Eight schools: **7%** called significant, **63%** right direction"]
        right:
          title: Partial pooling
          bullets: ["Estimates move towards each other", "More for the uncertain ones", "Eight schools: **0.5%** called, **89%** right direction"]
        takeaway: The price of more reliable comparisons is to claim confidence in fewer of them.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          Gelman, Hill and Yajima reframe the concern as Type S errors, the wrong sign, and Type M errors, the wrong magnitude. The
          eight-schools simulation used a group sd of 5.

      - layout: bullets
        beat: pitfalls
        section: "The A/B application: reading many segments"
        title: This simulation is close to a best case
        recall: Why is the segment simulation close to a best case?
        answer: "The segments are exchangeable by construction, meaning nothing known distinguishes them in advance, and the prior on tau suits the truth."
        bullets:
          - "The segments are **exchangeable** by construction"
          - "Nothing known distinguishes them in advance"
          - "The prior on tau suits the truth"
          - "The next sections take both supports away"
        takeaway: A result earned under convenient assumptions tells you little about the inconvenient cases.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          The next two sections break the assumptions, one with a true outlier and one with small segments that differ from large ones.

      - layout: table
        beat: practice
        section: Where partial pooling does not help
        level: core
        title: The same simulation under five settings
        recall: How much does pooling help under each setting?
        answer: "The ratio of pooled to raw RMSE is 0.36 at baseline, 0.16 with no real differences, 0.93 and 0.99 when well measured, and 0.55 with only 4 segments."
        header: [Setting, Raw, Pooled, Ratio, Pooled winner gap]
        widths: [4.2, 1.2, 1.4, 1.2, 2.2]
        rows:
          - ["Baseline, 24 noisy segments, tau 0.5", "1.36", "0.49", "0.36", "0.09"]
          - ["No real differences, tau 0", "1.36", "0.21", "0.16", "0.29"]
          - ["Well measured (100x users), tau 0.5", "0.14", "0.13", "0.93", "-0.01"]
          - ["Well measured (100x users), tau 2.0", "0.14", "0.13", "0.99", "-0.00"]
          - ["Only 4 segments, tau 0.5", "1.22", "0.67", "0.55", "0.32"]
        highlight: [2, 3]
        takeaway: Pooling pays when segments are noisy and similar, and buys almost nothing when they are well measured.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          With no real differences the 90% intervals cover 100% of the time, which means they are too wide. That is the safe
          direction, but it is a miss in calibration.

      - layout: image
        beat: practice
        section: Where partial pooling does not help
        title: Two scenarios where pooling is worse than raw
        recall: In which scenarios did pooled RMSE exceed per-segment RMSE?
        answer: "A true outlier and a too-tight prior on four segments, both at a ratio of 1.25. The ratio is 0.16 with no differences and 0.93 and 0.99 when well measured."
        kicker: Eight scenarios
        image: ../../assets/sources/images/bayes-multilevel-scenarios.png
        caption: "Pooled RMSE as a share of per-segment RMSE across eight scenarios: 0.16 with no differences, 0.36 at baseline, 0.93 and 0.99 well measured, 1.25 for a true outlier and a too-tight prior."
        takeaway: "Pooling is worse than the raw numbers with a true outlier or a too-tight prior on four segments, where the ratio reaches 1.25."
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          The outlier and wrong-centre rows score only the affected segments, and the too-tight prior row comes from the few-groups section.

      - layout: cards
        beat: pitfalls
        section: Where partial pooling does not help
        title: Three ways partial pooling lets you down
        recall: What are the three cases where pooling does not help?
        answer: "A real outlier is pulled down by 3.74, RMSE rising from 3.01 to 3.76. A wrong common centre biases small segments by -1.10, fixed by adding size as a predictor. Well-measured segments gain nothing."
        cards:
          - {title: A real outlier, accent: pitfalls, body: "A small segment truly at +5.0 is pulled down by **3.74**. Shrinkage works against the winner you wanted"}
          - {title: The wrong centre, accent: fundamentals, body: "One mean pulls small segments down by **1.10**. Add size as a predictor and RMSE falls to **0.49**"}
          - {title: Well measured, accent: practice, body: "With 100 times the users the ratio is **0.93**. Expensive machinery for no gain"}
        takeaway: Known structure belongs in the model, and a rare real winner needs a follow-up test.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          The other 23 segments improve from 1.25 to 0.49. If only the overall effect matters, group estimates are beside the point.
          GHY would not model a 2 by 3 by 4 by 5 structure as 120 exchangeable groups.

      - layout: image
        beat: pitfalls
        section: Where partial pooling does not help
        level: core
        title: Overlapping slopes do not mean no difference
        recall: Why compare the posterior of the difference, not the intervals?
        answer: "The two marginal posteriors of the ruggedness slope overlap, yet the probability that the African slope is the smaller is 0.0036."
        kicker: Statistical Rethinking, Fig. 7.5
        image: ../../assets/sources/images/statistical-rethinking-fig7-5.png
        caption: "Posterior of the ruggedness slope for African and non-African nations."
        bullets:
          - "The marginals overlap"
          - "P(African slope is smaller) is **0.0036**"
          - "Interaction model: **0.97** of the WAIC weight"
          - "Compare the posterior of the **difference**"
        takeaway: Fit one model with interactions rather than split data, and read the difference, not two intervals.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          McElreath argues for one model with interactions over split data, because the groups share a residual sigma. The WAIC
          comparison is 469.6 against 476.4, difference 6.8 with standard error 6.22, over 170 nations.

      - layout: statement
        beat: problem
        section: "Few groups: the spread itself is barely known"
        title: The number of groups is tau's sample size
        recall: Why is tau poorly known with few groups?
        answer: "Tau is estimated from the groups, so the number of groups is its sample size, however many users each has."
        kicker: Few groups
        statement: "Tau is estimated from the groups, so the number of groups is its sample size, however many users each has."
        attribution: "True tau is 6.0, REML over 300 simulated datasets"
        takeaway: With a handful of groups the spread is barely known, and the prior starts to decide the answer.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          Published rules of thumb run from at least 20 clusters (Snijders and Bosker) to 30 clusters of 30 (Kreft), and higher for
          variance components.

      - layout: table
        beat: practice
        section: "Few groups: the spread itself is barely known"
        level: core
        title: With 3 markets, a true tau of 6 comes back as 0 or 15
        recall: How wide is the REML estimate of tau by number of markets?
        answer: "With 3 markets the 5th to 95th percentile runs from 0 to 15.53 and 11% land at zero. With 50 markets it runs from 4.67 to 7.34."
        header: [Markets, Median tau, p5, p95, Share at zero]
        widths: [1.8, 2.0, 1.6, 1.6, 2.2]
