          - ["20", "5.64", "3.25", "8.02", "0.00"]
          - ["50", "5.99", "4.67", "7.34", "0.00"]
        highlight: [0, 1]
        takeaway: At zero the model pools completely, and that happened in 8% to 11% of datasets with 3 or 5 markets.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
