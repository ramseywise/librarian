        beat: practice
        section: "Few groups: the spread itself is barely known"
        title: The spread tightens only as the groups multiply
        recall: What does the few-groups plot show?
        answer: "The distribution of REML estimates of the between-market sd by number of markets. With 3 markets it runs from 0 to 15.5, with 50 markets from 4.7 to 7.3, against a true 6."
        kicker: 300 datasets at each size
        image: ../../assets/sources/images/bayes-multilevel-few-groups.png
        caption: "REML estimates of the between-market sd by number of markets: 3 markets run from 0 to 15.5, 50 markets from 4.7 to 7.3, against a true 6."
