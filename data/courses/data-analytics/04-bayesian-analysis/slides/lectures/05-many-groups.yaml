      - layout: table
        beat: practice
        section: "Few groups: the spread itself is barely known"
        level: core
        title: With 4 segments the prior does real work
        recall: How do three priors compare over many datasets with 4 segments?
        answer: "A half-normal(0.25) prior when tau is really 2 gives a ratio of 1.25 and 48% coverage. Half-normal(2) gives 0.55 and 0.85, so pooling still beats raw with a sensible prior."
        header: [True tau, Prior, Ratio, Pooled cover]
        widths: [1.8, 3.2, 1.8, 2.2]
        rows:
          - ["0.5", "half-normal(0.25)", "0.49", "0.82"]
          - ["0.5", "half-normal(2)", "0.55", "0.94"]
          - ["0.5", "half-Cauchy(5)", "0.60", "0.95"]
          - ["2.0", "half-normal(0.25)", "1.25", "0.48"]
          - ["2.0", "half-normal(2)", "0.85", "0.87"]
          - ["2.0", "half-Cauchy(5)", "0.86", "0.89"]
        highlight: [3]
        takeaway: Few groups does not make pooling lose by itself. It hands control to the prior, so report a range.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          You cannot detect a wrong prior from four segments, because the data barely informs tau. In one four-segment dataset the
          first segment's estimate ran from 1.00 to 1.39 depending on the prior, and its truth was 0.21.

      - layout: compare
        beat: practice
        section: "Few groups: the spread itself is barely known"
        level: core
        title: MixedLM gives one number for tau, PyMC gives a range
        recall: How do MixedLM and PyMC report tau for five markets?
        answer: "MixedLM gives 2.52 as a single number and treats it as known. PyMC gives a mean of 3.91 with a 90% interval from 0.37 to 9.74, and a posterior sd of 2.54 for the grand mean."
        emphasis: right
        left:
          title: MixedLM
          bullets: ["Tau **2.52**, no interval", "SE of the mean **1.72**", "Treats tau as known"]
        right:
          title: PyMC
          bullets: ["Tau mean **3.91**, 90% **0.37** to **9.74**", "Posterior sd of the mean **2.54**", "The honest amount of ignorance"]
        takeaway: The PyMC range depends on its half-normal(10) prior, and one divergence means check it on real data.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          Five markets with sizes 42, 71, 74, 264 and 281, and a sd of their true means of 5.69. The grand mean is 42.46 in MixedLM
          and 42.35 in PyMC. The run had one divergence at target_accept 0.95.

      - layout: image
        beat: practice
        section: "Few groups: the spread itself is barely known"
        level: core
        title: McElreath's ponds, partial pooling wins at every size
        recall: What did McElreath's 60 simulated ponds show?
        answer: "Partial pooling has the lower average error at every size of pond, and the gap is widest for the 5-tadpole ponds."
        kicker: Statistical Rethinking, Fig. 12.3
        image: ../../assets/sources/images/statistical-rethinking-fig12-3.png
        caption: "Absolute error across 60 simulated ponds of 5, 10, 25 and 35 tadpoles. Partial pooling has the lower average error at every size, and the gap is widest at 5."
        takeaway: "Partial pooling beats no pooling at every pond size, most for the 5-tadpole ponds, on one dataset."
        source: notes/07-multilevel-models-and-partial-pooling.md
