          This is one dataset, from chapter 12 of the book.

      - layout: bullets
        beat: pitfalls
        section: "Few groups: the spread itself is barely known"
        title: Gelman qualified his own multiple-comparisons paper
        recall: What caveat did Gelman add to the 2012 paper?
        answer: "Gelman and Loken wrote that with few comparisons or a highly structured problem, inference can be sensitive to model assumptions. Pooling also analyses only the comparisons you put in the model."
        bullets:
          - "With few comparisons or a structured problem, inference can be **sensitive to model assumptions**"
          - "Pooling analyses only the comparisons **you put in the model**"
          - "Segments chosen after seeing the data still need counting"
          - "Multilevel modelling gets harder for complicated structures"
          - "A better default than raw numbers or Bonferroni, not a licence to stop worrying"
        takeaway: Partial pooling is a better default, and it does not replace judgement about how the comparisons were chosen.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          Gelman and Loken, The garden of forking paths, is an unpublished working paper from 2013. Gelman's blog post about the irony
          is reproduced by Mayo.

      - layout: code
        beat: practice
        section: A conversion outcome, in PyMC only
        level: deep
        title: A yes-or-no outcome goes to PyMC with a logit link
        recall: How is the conversion model set up?
        answer: "Each of 30 markets has its own base rate and its own lift on the log-odds scale, in the non-centred form, with binomial counts for control and treated."
        lead: "30 markets, each with its own base rate and lift."
        lang: python
        code: |-
          a = pm.Deterministic("a",
                               alpha + sd_alpha * raw_a)
          b = pm.Deterministic("b",
                               beta + sd_beta * raw_b)
          pm.Binomial("c", users,
                      pm.math.invlogit(a),
                      observed=control)
          pm.Binomial("t", users,
                      pm.math.invlogit(a + b),
                      observed=treated)
        bullets:
          - "The random effect lives on the **log-odds** scale"
          - "MixedLM is linear, so it cannot fit this"
          - "Same non-centred form as before"
        takeaway: A conversion outcome needs a logit multilevel model, and PyMC is the tool for it here.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          Markets have 156 to 6,637 users an arm, and one has zero control conversions. Diagnostics: max r_hat 1.008, min ess_bulk 565,
          no divergences.

      - layout: bullets
        beat: practice
        section: A conversion outcome, in PyMC only
        level: core
        title: Pooling cuts the error on each market's lift
        recall: How much did pooling cut the conversion errors?
        answer: "The lift RMSE fell from 1.01 to 0.68 points and the control rate RMSE from 0.83 to 0.71. Both methods picked the same winner and understated it, +5.28 and +5.09 against a true +6.42."
        bullets:
          - "Control rate RMSE in points: raw **0.83**, pooled **0.71**"
          - "Lift RMSE in points: raw **1.01**, pooled **0.68**"
          - "Both methods pick the same winner, 3,146 users an arm"
          - "Measured lift: raw **+5.28**, pooled **+5.09**, against a true **+6.42**"
        takeaway: "Pooling cuts lift RMSE from 1.01 to 0.68 points."
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          This one dataset does not show the exaggeration, and it is too slow in PyMC to replicate. The replicated evidence is the
          1,000 runs earlier. A lift in points also grows with the base rate.

      - layout: compare
        beat: pitfalls
        section: A conversion outcome, in PyMC only
        level: core
        title: Within a market and across the population are different
        recall: What is the difference between the two kinds of logit coefficient?
        answer: "A multilevel coefficient is a change within a market, and a pooled logit with clustered SEs describes a change across the population. With a common outcome and a large market spread, 0.500 within a market became 0.306 across the population."
        emphasis: right
        left:
          title: Multilevel logit
          bullets: ["Cluster-specific", "A change **within a market**", "beta 0.164"]
        right:
          title: Pooled logit, clustered SEs
          bullets: ["Population-averaged", "A change **across the population**", "0.183, SE 0.036"]
        takeaway: Name the scale you report, and convert to probabilities.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          Common outcome (intercept -1, sd 2, effect 0.5): 0.500 within a market, 0.306 population-averaged. With a rare outcome and a
          fixed effect, 0.150 and 0.145. With the effect varying by market, the population-averaged value was slightly larger, 0.154.
          So population-averaged is smaller describes a fixed effect, not every model. The two fitted estimates are not in the order the
          rule predicts, and their uncertainty is larger than the gap.

      - layout: bullets
        beat: pitfalls
        section: A conversion outcome, in PyMC only
        title: Base rates have two answers as well
        recall: Why do the typical-market rate and the average rate differ?
        answer: "The rate for a typical market, invlogit(alpha), is 4.89%, but the average across markets is 6.71%, because high-rate markets pull up the mean on the probability scale."
        bullets:
          - "Typical market, **invlogit(alpha)**: **4.89%**"
          - "Average across the market population: **6.71%**"
          - "High-rate markets pull up the mean on the probability scale"
          - "Say which one you are reporting"
        takeaway: A rate on the log-odds scale and a rate on the probability scale are not the same number, so label them.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          The true-parameter lines show the gap between within-market and population-averaged coefficients can be small or large.

      - layout: table
        beat: pitfalls
        section: Pitfalls
        title: "Pitfalls in choosing and fitting the model"
        recall: "What are the pitfalls in choosing and fitting a multilevel model?"
        answer: "Shipping the raw winner, fitting a multilevel model only to handle clustering, plain random intercepts when the group effect correlates with the predictor, random intercepts when slopes vary, and trusting a boundary estimate."
        header: [Pitfall, What goes wrong, Fix]
        widths: [3.0, 3.4, 3.0]
        rows:
          - ["Shipping the raw winner", "Exaggerated by 2.93 here against a true average lift of 1.0", "Partially pool first, and report the pooled number"]
          - ["A multilevel model only to handle clustering", "Extra assumptions for an answer clustered SEs give directly", "Cluster when groups are a nuisance, model them when they are the question"]
          - ["Random intercepts, group effect correlates with the predictor", "Biased, 2.83 against a true 2, with no warning", "Fixed effects, or add the group mean of the predictor"]
          - ["Random intercepts when slopes vary", "Standard error about 20% too small here", "Add re_formula, or cluster"]
          - ["Trusting a correlation of 1 or a tau of 0", "Boundary estimates, reported without a warning", "Simplify, or use PyMC with a prior and report the interval"]
        takeaway: Match the tool to the question, and treat a boundary estimate as a sign the model is too rich.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          The remaining five pitfalls are on the next slide.

      - layout: table
        beat: pitfalls
        section: Pitfalls
        title: "Pitfalls with priors, scale and diagnostics"
        recall: "What are the pitfalls with priors, scale and diagnostics?"
        answer: "Pooling few groups with one prior, pooling groups known to differ, expecting pooling to find the rare winner, reading logit coefficients across model types, and skipping diagnostics."
        header: [Pitfall, What goes wrong, Fix]
        widths: [3.0, 3.4, 3.0]
        rows:
          - ["Few groups and one prior", "Tau is barely known, so the prior sets the answer", "Run several priors and report the range"]
          - ["Pooling groups known to differ", "Shrinks them to the wrong centre, -1.10 here", "Add a group-level predictor"]
          - ["Expecting pooling to find the rare winner", "A true outlier is pulled down by 3.74 here", "Follow up large raw effects with a new test"]
          - ["Logit coefficients across model types", "Within-market and population-averaged differ", "Name the scale, and convert to probabilities"]
          - ["Skipping diagnostics", "A posterior you cannot trust, as in chapter 2", "Check r_hat, ESS and divergences, use the non-centred form"]
        takeaway: Run several priors, name the scale, and check the sampler on every fit.
        source: notes/07-multilevel-models-and-partial-pooling.md
        notes: >-
          Every fit needs its diagnostics, however familiar the model.

  - title: Varying slopes
    divider: false
    summary: pWAIC · Correlated shrinkage · Non-centring
    notes: The second note follows four questions the first did not answer, starting with why a multilevel model has fewer effective parameters than it has intercepts.
    slides:
      - layout: statement
        beat: problem
        section: Fewer effective parameters than actual
        title: 48 intercepts, and fewer than 48 effective parameters
        recall: Why does a multilevel model use fewer effective parameters than it has?
        answer: "Its intercepts are not free, because sigma ties them together. WAIC's penalty pWAIC counts how flexible the fit really was."
        kicker: Effective parameters
        statement: "The intercepts are not free: sigma ties them together, and pWAIC counts how flexible the fit really was."
        attribution: McElreath's 48 tadpole tanks, pWAIC 49.4 against 38.0
        takeaway: Count a multilevel model's parameters by pWAIC, not by the number of intercepts it has.
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          McElreath's 48 tadpole tanks give pWAIC 49.4 for fixed intercepts and 38.0 for the multilevel model, a WAIC difference of
          13.1 with standard error 6.54, and a learned sigma of about 1.6.

      - layout: code
        beat: practice
        section: Fewer effective parameters than actual
        level: deep
        title: WAIC by hand from the pointwise log-likelihood
        recall: How is WAIC computed in the chapter?
        answer: "From the pointwise log-likelihood, using logsumexp for the lppd and the variance across draws for pWAIC, because ArviZ 1.x has no az.waic."
        lead: "One row per tadpole, because WAIC is pointwise."
        lang: python
        code: |-
          ll = i.log_likelihood["s"].stack(
              n=("chain", "draw")).transpose("n", ...).values
          lppd = (logsumexp(ll, axis=0)
                  - np.log(ll.shape[0])).sum()
          p_waic = ll.var(axis=0).sum()
          print(f"pWAIC {p_waic:5.1f}  "
                f"WAIC {-2 * (lppd - p_waic):7.1f}")
        bullets:
          - "**lppd** is the log pointwise predictive density"
          - "**pWAIC** is the variance of the log-likelihood"
          - "48 tanks of 10, 25 and 35 tadpoles"
        takeaway: WAIC is pointwise, so the row you define as a point changes the number.
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          ArviZ 1.x has no az.waic, so it is computed by hand. The simulated tanks are 16 each of 10, 25 and 35 tadpoles, with true
          intercepts Normal(1.3, 1.6).

      - layout: bullets
        beat: practice
        section: Fewer effective parameters than actual
        level: core
        title: Tying the intercepts together costs 11 fewer parameters
        recall: How did pWAIC change between the two models?
        answer: "48 free intercepts cost 48.3 effective parameters, and the multilevel model dropped that to 36.9 and improved WAIC by 9.6. The learned sigma was 1.39 against a true 1.6."
        bullets:
          - "**Fixed intercepts:** pWAIC **48.3**, WAIC **1115.2**"
          - "**Multilevel:** pWAIC **36.9**, WAIC **1105.6**"
          - "Learned sigma **1.39**, true **1.6**"
        takeaway: "Tying the intercepts together lowers pWAIC from 48.3 to 36.9 and WAIC from 1115.2 to 1105.6."
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          This is one simulated dataset against his real one.

      - layout: cards
        beat: pitfalls
        section: Fewer effective parameters than actual
        level: core
        title: Three details that change what pWAIC means
        recall: What three details matter when reading pWAIC for a multilevel model?
        answer: "The unit, since the aggregated binomial rows gave pWAIC 22.7 for the same model. The sigma prior, where Exponential(1) is suggested for around five clusters. And a new cluster is predicted with a fresh Normal(a, sigma) draw."
        cards:
          - {title: The unit, body: "Aggregated rows gave pWAIC 22.7 for the same model"}
          - {title: No WAIC, body: "Not on beta-binomial or gamma-Poisson models"}
          - {title: Few clusters, body: "McElreath suggests Exponential(1) on sigma over the half-Cauchy"}
          - {title: A new cluster, body: "A fresh draw from Normal(a, sigma)"}
        takeaway: A point in WAIC is whatever row you define, so say which rows you scored.
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          A new cluster is predicted by drawing from the fitted population, not by reusing any tank's estimate, so interval widths
          include the between-cluster spread. The beta-binomial's row-level latent parameter ties the likelihood to the aggregation.

      - layout: bullets
        beat: problem
        section: "Varying slopes: model the correlation too"
        title: Busy cafes have more to gain in the afternoon
        recall: What is McElreath's cafe example?
        answer: "Morning wait averages 3.5 minutes and the afternoon change averages -1, with sds of 1 and 0.5 and a correlation of -0.7. Busy cafes with long mornings have more to gain."
        bullets:
          - "Morning wait averages **3.5** minutes, the afternoon change **-1**"
          - "Standard deviations **1** and **0.5**, correlation **-0.7**"
          - "A cafe with a surprisingly large slope pulls its intercept as well"
          - "The prior on the correlation is **LKJ**, eta = 2, skeptical of extremes"
        takeaway: Model intercepts and slopes together, because a shrunk slope shifts its intercept.
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          The model underneath draws the pair from a two-dimensional population with a correlation. The re-run uses 20 cafes, 5
          morning and 5 afternoon visits each, noise sd 0.5.

      - layout: code
        beat: practice
        section: "Varying slopes: model the correlation too"
        level: deep
        title: Centred and non-centred versions of the cafe model
        recall: How do the centred and non-centred cafe models differ in code?
        answer: "The non-centred form draws a standard normal z and computes mu plus z times the Cholesky factor. The centred form draws the pair directly from MvNormal."
        lead: "Two forms of the same varying-slopes model."
        lang: python
        code: |-
          chol, corr, sds = pm.LKJCholeskyCov(
              "chol", n=2, eta=2,
              sd_dist=pm.Exponential.dist(1.0),
              compute_corr=True)
          if noncentered:
              z = pm.Normal("z", 0, 1, shape=(J, 2))
              v = pm.Deterministic("v", mu + z @ chol.T)
          else:
              v = pm.MvNormal("v", mu, chol=chol,
                              shape=(J, 2))
        bullets:
          - "**LKJCholeskyCov** gives the sds and the correlation"
          - "Non-centred: v = mu + L z"
          - "Centred: v drawn from the correlated population"
        takeaway: The two forms describe the same model, and they behave very differently in the sampler.
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          The wait is then Normal with mean the morning effect plus the afternoon effect times the afternoon indicator, and sigma
          Exponential(1).

      - layout: bullets
        beat: practice
        section: "Varying slopes: model the correlation too"
        level: core
        title: "Pooling cuts the error; the correlation is learned in sign"
        recall: What did the cafe re-run show?
        answer: "The correlation posterior mean was -0.42 for a true -0.7, with a 89% interval of -0.74 to -0.03. RMSE fell from 0.233 to 0.192 on intercepts and 0.316 to 0.253 on slopes."
        bullets:
          - "RMSE, intercepts: unpooled **0.233**, pooled **0.192**"
          - "RMSE, slopes: unpooled **0.316**, pooled **0.253**"
          - "Correlation, true -0.7: posterior mean **-0.42**, 89% interval -0.74 to -0.03"
        takeaway: Pooling cuts the error by 18% and 20%, and with 20 cafes the sign is learned and the size is not.
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          The LKJ prior pulls toward zero, and 20 cafes is a small sample for a correlation. This is one dataset, and McElreath uses
          one seed too.

      - layout: image
        beat: practice
        section: "Varying slopes: model the correlation too"
        level: core
        title: Shrinkage runs at an angle, not straight to the centre
        recall: What does McElreath's figure of two-dimensional shrinkage show?
        answer: "A cafe with an average intercept and an unusually high slope is pulled down on the slope, and because the two are negatively correlated that also moves its intercept, hence the angled lines."
        kicker: Statistical Rethinking, Fig. 13.5
        image: ../../assets/sources/images/statistical-rethinking-fig13-5.png
        caption: "Unpooled intercepts and slopes against their partially pooled estimates."
        bullets:
          - "Shrinkage does not run straight at the centre"
          - "A high slope is pulled down, and the intercept moves with it"
          - "On the outcome scale it shrinks predicted waits"
        takeaway: With a correlation, shrinking one parameter moves the other.
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          The left panels are the parameter scale and the right panels the outcome scale.

      - layout: bullets
        beat: practice
        section: "Varying slopes: model the correlation too"
        level: core
        title: The varying-slopes model wins on Berkeley admissions
        recall: Which model had the lowest WAIC for UC Berkeley admissions?
        answer: "The varying-slopes model, at WAIC 5191.4 with weight 0.99, against 5201.2 and 5201.9, even though the average gender slope is near zero."
        bullets:
          - "Varying slope for gender by department: WAIC **5191.4**, weight **0.99**"
          - "The models without or with a constant gender term: **5201.2** and **5201.9**"
          - "The average gender slope is near zero"
          - "Department B, with **25** female applications, is pooled hard"
          - "Department F, with hundreds of each, barely at all"
        takeaway: A near-zero average slope can hide slopes that vary a lot by group.
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          From Statistical Rethinking chapter 13. The sex-specific slope of each department is pooled in proportion to its data.

  - title: Noisy and missing data
    divider: false
    summary: When the funnel returns · Noisy inputs · Missing predictors
    notes: The last part is about the numbers going in, which are not clean, and the sampler trouble that thin data brings back.
    slides:
      - layout: statement
        beat: problem
        section: Non-centring
        title: With thin data the funnel returns
        recall: What happens when groups barely differ or data per group is thin?
        answer: "The funnel from chapter 2 returns, and the sampler cannot tell a small sigma from a large one."
        kicker: Non-centring
        statement: "When groups barely differ or data per group is thin, the sampler cannot tell a small sigma from a large one."
        attribution: The funnel from chapter 2
        takeaway: The cure is the same as before, move the scale out of the prior.
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          McElreath's chimpanzee model with three varying effects over actors and blocks has 54 nominal parameters and about 18
          effective, pWAIC 18.3, and the centred version raised 559 divergent iterations until he non-centred it.

      - layout: flow
        beat: fundamentals
        section: Non-centring
        level: core
        title: Draw z, then compute mu plus L z
        recall: What is non-centring?
        answer: "Draw standard-normal z and compute mu plus L z, where L is the Cholesky factor of the covariance, so the sampler explores z instead of a funnel."
        steps:
          - {label: Draw z, sub: "standard normal", accent: fundamentals}
          - {label: Scale by L, sub: "Cholesky factor of the covariance", accent: practice}
          - {label: Add mu, sub: "v = mu + L z", accent: pitfalls}
          - {label: Sampler explores z, sub: "not the funnel", accent: wrap}
        caption: "The scale moves out of the prior and into the transformation."
        takeaway: The same model is explored in a shape the sampler handles.
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          This is the non-centred form used in every PyMC model of the chapter.

      - layout: table
        beat: practice
        section: Non-centring
        level: core
        title: "With plenty of data the forms agree; with thin data they do not"
        recall: How did centred and non-centred forms compare?
        answer: "With 20 cafes of 10 visits both were fine, though non-centring had the lower ESS, 811 against 1,210. With 30 cafes seen twice, centred gave 203 divergences and ESS 25, and non-centred 8 divergences and ESS 270."
        header: [Cafes by visits, Form, Divergences, Min ESS, Max r_hat]
        widths: [2.6, 2.2, 1.8, 1.6, 1.8]
        rows:
          - ["20 x 10", "Centred", "1", "1210", "1.003"]
          - ["20 x 10", "Non-centred", "0", "811", "1.004"]
          - ["30 x 2", "Centred", "203", "25", "1.130"]
          - ["30 x 2", "Non-centred", "8", "270", "1.014"]
        highlight: [2, 3]
        takeaway: Non-centring improved thin data by a wide margin without fully curing it, and treat it as one lever among several.
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          The thin-data cafes barely differ, true sds 0.15 and 0.1, with no correlation. McElreath's non-centred chimp model had no
          divergences. Raise target_accept, tighten the sigma prior or simplify the model as well. Neither form is the default to
          apply blindly.

      - layout: bullets
        beat: problem
        section: Measurement error
        title: A noisy predictor attenuates the slope
        recall: What are the two costs of treating noisy segment rates as exact?
        answer: "A noisy outcome is handled by regression anyway, but a noisy predictor attenuates the slope toward zero. In McElreath's states data the slope is -0.55 with the divorce error modelled, roughly half the version that ignores it."
        bullets:
          - "Segment rates arrive with standard errors, **large for small segments**"
          - "A noisy predictor **attenuates** the slope toward zero"
          - "States data: slope **-0.55** (sd **0.21**) once divorce error is modelled"
          - "Each observation is a draw around an unknown true value with known sd"
          - "His rule: **do not average, model**"
        takeaway: Ignoring measurement error tends to exaggerate associations between outcomes and predictors.
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          The mechanism is the shrinkage of chapter 7. The true values become parameters, and the regression line and the estimates pull
          on each other.

      - layout: code
        beat: practice
        section: Measurement error
        level: deep
        title: The true values are parameters
        recall: How does the measurement-error model treat the true values?
        answer: "The true x and y are parameters, y comes from the regression line around the true x, and each observation is Normal around its true value with its known standard error."
        lead: "50 units, true slope 1.0, known standard errors on both variables."
        lang: python
        code: |-
          xt = pm.Normal("xt", 0, 1, shape=N)
          yt = pm.Normal("yt", a + b * xt,
                         pm.Exponential("s", 1), shape=N)
          pm.Normal("xo", xt, x_se, observed=x_obs)
          pm.Normal("yo", yt, y_se, observed=y_obs)
          # naive: pm.Normal("y", a + b * x_obs, s,
          #                  observed=y_obs)
        bullets:
          - "**xt** and **yt** are the unknown true values"
          - "The standard errors are data, not parameters"
          - "The naive model uses x_obs as if exact"
        takeaway: Give each observation a likelihood around its true value, with the error you know.
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          The simulation draws the standard errors uniformly, 0.1 to 1.5 on y and 0.1 to 1.0 on x.

      - layout: bullets
        beat: practice
        section: Measurement error
        level: core
        title: Modelling the error recovers the slope
        recall: What did the naive and measurement-error models give for a true slope of 1.0?
        answer: "Ignoring the error gave 0.81 (sd 0.14) with no divergences. Modelling it gave 0.94 (sd 0.10) with 9 divergences."
        bullets:
          - "**Ignores the error:** slope **0.81**, sd **0.14**, **0** divergences"
          - "**Models the error:** slope **0.94**, sd **0.10**, **9** divergences"
          - "True slope **1.0**"
        takeaway: "Modelling the error moves the slope toward the true 1.0, from 0.81 to 0.94, at the cost of 9 divergences."
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          McElreath's own example sets the predictor-error model against an outcome-error model and finds the coefficients essentially
          unchanged, so the benefit depends on which cases carry the error and how large it is against the variation.

      - layout: image
        beat: practice
        section: Measurement error
        level: core
        title: Larger standard errors move further
        recall: What do the two panels of McElreath's measurement-error figure show?
        answer: "The left panel is shrinkage again, with states of larger standard error moving further. The right panel shows the fitted line moving as well, gray without error and blue with it, with a wider band."
        kicker: Statistical Rethinking, Fig. 14.2
        image: ../../assets/sources/images/statistical-rethinking-fig14-2.png
        caption: "Shrinkage from modelling measurement error, and the regression lines with and without it."
        bullets:
          - "Left: states with larger standard errors **move further**"
          - "Right: the line moves, **gray** without error and **blue** with"
          - "A wider band with the error modelled"
        takeaway: Measurement error is shrinkage again, and it moves the line as well as the points.
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          The left panel plots the estimate minus observed divergence against its standard error.

      - layout: bullets
        beat: problem
        section: "Missing predictors: impute inside the model"
        title: Deleting rows throws away the other columns
        recall: What does deleting incomplete rows cost, and what is the Bayesian alternative?
        answer: "McElreath's primate data keeps 17 of 29 species and drops 12 good mass and energy values. The fix treats each missing value as a parameter with a prior, and a model for the predictor does the imputing."
        bullets:
          - "Primate milk data: **17 of 29** species kept, **12** dropped"
          - "Each missing value is a **parameter** with a prior"
          - "One common mean assumes the predictor is unrelated to everything else"
          - "Neocortex slope falls from **2.77** to **1.93**, and returns to **2.44** with mass in the model"
          - "Only missing-completely-at-random is worked, so everything here is MCAR too"
        takeaway: Give the imputation model the covariates that predict the variable, and say the missingness assumption.
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          The standard deviations are 0.87, 0.73 and 0.75, and the imputed values tighten from about 0.05 to 0.03-0.04. McElreath gives
          missing-not-at-random one paragraph.

      - layout: code
        beat: practice
        section: "Missing predictors: impute inside the model"
        level: deep
        title: PyMC imputes the missing values for you
        recall: How does the code impute a missing predictor?
        answer: "It passes the predictor as observed data with NaN where values are missing, models it on body mass, and PyMC imputes the NaNs."
        lead: "29 species, 12 values missing at random, true slope 0.5."
        lang: python
        code: |-
          nc_obs = np.where(miss, np.nan, nco)
          nc = pm.Normal("nc", an + g * m, sn,
                         observed=nc_obs)
          pm.Normal("k", a + bn * nc + bm * m,
                    pm.Exponential("s", 1), observed=k)
        bullets:
          - "**NaN** entries in observed data become parameters"
          - "The predictor depends on mass through **g**"
          - "The outcome then uses the completed predictor"
        takeaway: The model for the predictor does the imputing, so it must include what predicts the predictor.
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          The predictor depends on mass in the simulation, and the outcome depends on both.

      - layout: cards
        beat: practice
        section: "Missing predictors: impute inside the model"
        level: core
        title: A naive imputation model is more confident and more wrong
        recall: What did the three treatments of the missing predictor give?
        answer: "Complete cases gave 0.49 (sd 0.31), imputing with no link to mass gave 0.26 (sd 0.22), and letting the predictor depend on mass gave 0.41 (sd 0.26), against a true 0.50."
        lead: "Slope estimates against a true 0.50."
        cards:
          - {title: Complete cases (17), body: "0.49, sd 0.31"}
          - {title: "Imputed, no link to mass", accent: "D4621A", body: "0.26, sd 0.22"}
          - {title: "Imputed, linked to mass", body: "0.41, sd 0.26"}
        takeaway: "With no link to mass the imputed slope is narrower but further off, 0.26 with sd 0.22 against a true 0.50."
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          In this draw the complete cases happened to land on the truth. The sd falls from 0.31 to 0.26 when the imputation model is
          right, and the estimate goes wrong when it is not.

      - layout: table
        beat: pitfalls
        section: Pitfalls
        title: "Pitfalls of effective parameters, slopes and thin data"
        recall: "What are the pitfalls of counting parameters, slopes and thin data?"
        answer: "Counting parameters by model size, comparing WAIC across likelihoods, fitting slopes and intercepts as independent, reading the correlation posterior as a measurement, and the centred form with thin data."
        header: [Pitfall, Symptom, Fix]
        widths: [3.0, 3.4, 3.0]
        rows:
          - ["Counting parameters by model size", "50 reported when pWAIC says 37 here", "Report pWAIC, and say which rows WAIC treats as points"]
          - ["Comparing WAIC across likelihoods or aggregations", "pWAIC 22.7 and 48.3 for the same model", "Same likelihood and same data rows"]
          - ["Slopes and intercepts as independent", "Shrinkage ignores a -0.7 correlation", "Draw the pair from a multivariate population with an LKJ prior"]
          - ["Reading the correlation posterior as a measurement", "Mean -0.42 for a true -0.7, with 20 groups", "Report the interval, and expect the prior to pull"]
          - ["Centred form with thin data", "203 divergences and ESS 25 here", "Non-centre, raise target_accept, simplify, check again"]
        takeaway: Report effective parameters, keep slopes and intercepts together, and non-centre when data is thin.
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          The remaining four pitfalls are on the next slide.

      - layout: table
        beat: pitfalls
        section: Pitfalls
        title: "Pitfalls of non-centring, noise and missing data"
        recall: "What are the pitfalls of non-centring, noisy predictors and missing data?"
        answer: "Believing non-centring always cures divergences, treating a noisy predictor as exact, imputing with a mean-only model, and dropping incomplete rows silently."
        header: [Pitfall, Symptom, Fix]
        widths: [3.0, 3.4, 3.0]
        rows:
          - ["Believing non-centring always cures divergences", "8 divergences left after it", "Treat it as one lever among several"]
          - ["Treating a noisy predictor as exact", "Slope 0.81 against a true 1.0", "Model the measurement error, with its known sd"]
          - ["Imputing with a mean-only model", "Slope halved with a confident sd", "Give the imputation model the covariates that predict the variable"]
          - ["Dropping incomplete rows silently", "12 of 29 rows gone", "Impute inside the model, and say the missingness assumption"]
        takeaway: Model the error and the missingness inside the model, and say what you assumed.
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          Missing not at random needs a model of the missingness itself, which McElreath names without working it.

      - layout: cards
        beat: wrap
        section: Pitfalls
        title: What to carry away from many groups
        recall: What are the three habits this lecture builds?
        answer: "Partially pool many segment effects before reading a winner, run several priors and report the range when groups are few, and give measurement error and missingness a model rather than averaging or deleting."
        cards:
          - {title: Pool first, accent: fundamentals, body: "Partially pool segment effects. The raw winner overstated its lift by **2.93**, the pooled winner by **0.09**"}
          - {title: Few groups, accent: practice, body: "Tau is barely known, so run **several priors** and report the range"}
          - {title: Model the mess, accent: pitfalls, body: "Do not average or delete. Model the **error** and the **missing values**, and check the sampler"}
        takeaway: Cluster when groups are a nuisance, and model them when they are the question.
        source: notes/07b-varying-slopes-measurement-error-and-missing-data.md
        notes: >-
          This closes the Bayesian analysis pillar. The next pillar is visualisation and storytelling, which is how you present these
          answers to the people who decide.
