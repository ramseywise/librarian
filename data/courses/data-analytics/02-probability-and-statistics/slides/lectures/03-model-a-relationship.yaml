    step 3. By the end you should be able to read a regression summary, add pre-period covariates to an experiment, check
    residuals, leverage, collinearity and clustering, avoid the habits that manufacture false positives, and carry the
    same machinery to yes/no outcomes, counts with exposure and ordered ratings.

