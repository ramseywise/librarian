      - layout: cards
        beat: wrap
        title: Rules of thumb for regression
        recall: What are the rules of thumb for regression in an analysis?
        answer: "Add pre-period covariates to experiments, cluster at the level of randomisation, use robust SEs on money, report marginal effects rather than odds ratios, and check dispersion on every Poisson fit."
        cards:
          - {title: Experiments, accent: "1E3A5F", body: "Add pre-period covariates, which buy precision and no bias"}
          - {title: Standard errors, accent: "0F7490", body: "Cluster at the level of randomisation, and use robust SEs on money"}
          - {title: Binary outcomes, accent: "D4621A", body: "Report marginal effects rather than odds ratios"}
          - {title: Counts, accent: "5B21B6", body: "Check dispersion on every Poisson fit"}
        takeaway: The checks are about whether to believe the standard error.
        source: notes/06b-logistic-regression-and-poisson-glms.md
        notes: >-
          These are the pillar README's rules of thumb for this step. The next lecture steps back from fitting to ask what a
          model is a claim about.

