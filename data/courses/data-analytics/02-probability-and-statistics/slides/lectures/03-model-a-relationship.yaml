      - layout: flow
        beat: fundamentals
        level: core
        section: Poisson and other GLMs
        title: Deviance is the GLM's residual sum of squares
        recall: What is deviance and how do null and residual deviance differ?
        answer: "Twice the log-likelihood gap between the fitted model and a saturated model that fits every row exactly. Null is an intercept only, and the drop to residual is a likelihood-ratio statistic. Adding new_app drops 5482.5 to 5450.1, a drop of 32.4, p 1.2e-08."
        steps:
          - {label: Saturated, sub: "one parameter per row", accent: "94A3B8"}
          - {label: Null, sub: "5482.5, intercept only", accent: "1E3A5F"}
          - {label: Residual, sub: "5450.1, your model", accent: "0F7490"}
          - {label: The drop, sub: "32.4, p = 1.2e-08"}
        caption: "Only 0.6% of the null deviance goes, yet the effect is clear."
        takeaway: The drop from null to residual deviance is the likelihood-ratio test, and it agrees with the z-test.
        source: notes/06b-logistic-regression-and-poisson-glms.md
        notes: >-
          Residual deviance per degree of freedom is 1.09 where the Pearson dispersion is 1.00, on data that really are
          Poisson, because deviance is an unreliable variance check for small counts. Efron and Hastie's galaxy fit has 270
          cells and a sum of squared deviance residuals of 610 against about 270 if the model held. Their 57-predictor spam
          logistic regression on 4,601 emails has unstable coefficients, the problem ridge and the lasso address.

      - layout: compare
        beat: pitfalls
        section: Poisson and other GLMs
        title: Poisson understates the uncertainty by a factor of three
        recall: What happens when counts are overdispersed?
        answer: "With dispersion 8.3, the Poisson SE of 0.0155 is far below the robust SE of 0.0509. The negative binomial gives a coefficient of 0.079 with SE 0.0444."
        emphasis: right
        left:
          title: Poisson
          bullets: ["Coefficient 0.067, SE **0.0155**", "Dispersion **8.3**", "Z-values too large"]
        right:
          title: Robust or negative binomial
          bullets: ["Poisson robust SE **0.0509**", "Negative binomial SE **0.0444**", "Valid for the mean model"]
        takeaway: Check dispersion each time you fit a Poisson.
        source: notes/06b-logistic-regression-and-poisson-glms.md
        notes: >-
          Poisson forces variance to equal the mean, and real counts rarely comply since a few users order all the time. The
          negative binomial coefficient is 0.079.

      - layout: code
        beat: practice
        level: deep
        section: Poisson and other GLMs
        title: Three fits of the same overdispersed counts
        recall: How do you compare Poisson, robust and negative binomial fits?
        answer: "Fit Poisson, Poisson with cov_type HC1, and a negative binomial family. Dispersion is 8.3, and the SEs are 0.0155, 0.0509 and 0.0444."
        lang: python
        code: |-
          po2 = smf.glm("orders_od ~ new_app", d7,
                        family=sm.families.Poisson(),
                        offset=np.log(d7.days)).fit()
          rob = ... .fit(cov_type="HC1")
          nb = ... family=sm.families.NegativeBinomial(
              alpha=2.0) ...
          # dispersion 8.3 = pearson_chi2 / df_resid
          # SE: 0.0155 | robust 0.0509 | NB 0.0444
        takeaway: Dispersion is Pearson chi-squared over residual degrees of freedom.
        source: notes/06b-logistic-regression-and-poisson-glms.md
        notes: >-
          The data are generated with a mean-1 gamma frailty. Two fixes are close to each other: keep Poisson and use robust
          SEs, valid for the mean model, or fit a negative binomial that models the extra variance directly.

      - layout: flow
        beat: fundamentals
        level: core
        section: Poisson and other GLMs
        title: Each rating level gets its own cutpoint
        recall: How does the cumulative-logit model handle ordered outcomes?
        answer: "Each level k gets its own cutpoint and a shared linear predictor phi. Seven levels need only six cutpoints, since Pr(y <= 7) = 1 has an infinite logit, and a level's probability comes by subtraction."
        steps:
          - {label: Cutpoints, sub: "six for seven levels", accent: "94A3B8"}
          - {label: Shared phi, sub: "one linear predictor", accent: "1E3A5F"}
          - {label: Cumulative odds, sub: "Pr(y <= k)", accent: "0F7490"}
          - {label: Subtract, sub: "Pr(y = k)"}
        caption: "McElreath's trolley data: 9,930 ratings from 331 people give cutpoints -1.92, -1.27, -0.72, 0.25, 0.89 and 1.77."
        takeaway: An ordered rating is not a count and its steps are not equal, so each step gets its own cutpoint.
        source: notes/06b-logistic-regression-and-poisson-glms.md
        notes: >-
          phi is subtracted so that a positive coefficient raises the rating. The inverse logits of the cutpoints, 0.128,
          0.220, 0.328, 0.562, 0.709 and 0.854, are the empirical cumulative proportions. statsmodels fits this with
          OrderedModel, distr logit.

