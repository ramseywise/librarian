deck:
  title: How the Rows Got There
  subtitle: Simulate the process, then ask who is in the data
  tagline: "Data generating process · Validity · Panels and fixed effects"
  reference: "Notes: data-analytics/02-probability-and-statistics, notes 7 and 8"
  output: 04-how-the-rows-got-there.pptx
  notes: >-
    This is the fifth lecture of the probability and statistics series, after the lecture on modelling a relationship. It
    covers step 4. By the end you should be able to write the process you believe made the rows and simulate from it, judge
    an estimator by bias, spread and coverage, say whether you are explaining or predicting, ask whether a fit generalises to
    the people who are not in the data, and use fixed effects, difference-in-differences and an event study on a panel.

