      - layout: cards
        beat: wrap
        title: Rules of thumb for panels
        recall: What are the rules of thumb for panel data?
        answer: "Clustered errors fix the SE and not the estimate, fixed effects remove what is constant within a unit, and a flat pre-period is not a proof."
        cards:
          - {title: "Clusters and effects", accent: "1E3A5F", body: "Clustered errors fix the standard error and not the estimate. Fixed effects change the estimate, because they change the comparison"}
          - {title: "What moved?", accent: "0F7490", body: "Ask what moved at the same time as the treatment, and whether the treatment responded to the outcome"}
          - {title: "Parallel trends", accent: "D4621A", body: "A flat pre-period is not a proof, and on a staggered rollout do not trust the single coefficient"}
        takeaway: A panel's estimate is only as good as the comparison it is built on.
        source: notes/08-panel-data-and-fixed-effects.md
        notes: >-
          These are the README's rules of thumb for this chapter. The experimentation pillar picks up from here with the
          potential-outcomes view and A/B testing.

