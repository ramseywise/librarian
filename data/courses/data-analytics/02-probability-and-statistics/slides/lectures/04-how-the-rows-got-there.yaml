      - layout: bullets
        beat: fundamentals
        section: Difference-in-differences is two-way fixed effects
        title: Parallel trends cannot be proved
        recall: What does difference-in-differences assume, and can you test it?
        answer: "It assumes parallel trends, which cannot be proved. A flat pre-period is evidence, not a proof."
        bullets:
          - "With one start date, **two-way FE equals DiD**"
          - "The assumption is **parallel trends**, which cannot be proved"
          - "Plot the **event study**: weeks -8 to 12, reference week -1, tails binned"
          - "The Effect warns these pre-tests have **low power**"
        takeaway: Plot the event study, and treat a flat pre-period as evidence and not as proof.
        source: notes/08-panel-data-and-fixed-effects.md
        notes: >-
          The reference week is -1, and the far tails are binned into the end coefficients.

      - layout: code
        beat: practice
        level: deep
        section: Difference-in-differences is two-way fixed effects
        title: The event study, one coefficient per week
        recall: How is an event study built?
        answer: "One indicator per week relative to the start, from -8 to 12 with week -1 omitted and the tails binned, entered alongside store and week effects."
        lang: python
        code: |-
          def event_study(d, lo=-8, hi=12, omit=-1):
              for k in range(lo, hi + 1):
                  if k == omit:
                      continue
                  ends = ((d.k <= k) if k == lo
                          else (d.k >= k) if k == hi
                          else (d.k == k))  # bin the tails
                  # one dummy per k, fitted with
                  # store and week effects
        bullets:
          - "Weeks **-8 to 12**"
          - "Reference week **-1**"
          - "Tails are **binned**"
        takeaway: Each coefficient compares a week to the week before the start, so the pre-period should sit at zero.
        source: notes/08-panel-data-and-fixed-effects.md
        notes: >-
          The comment lines stand for the fitting code in the note.

