        section: Central Limit Theorem
        title: When can you lean on the CLT?
        recall: What conditions let you trust the CLT?
        answer: "Symmetric light tails are fine from n of 30, proportions work when np and n(1-p) are at least 10, heavy tails are slow so use a non-parametric test or the bootstrap, and with n under 30 and unknown sigma use the t distribution."
        cards:
          - {title: "Symmetric, light tails", accent: practice, body: "**N of 30** or more is good"}
          - {title: Proportions, accent: practice, body: "np and n(1-p) both at least **10**"}
          - {title: Heavy tails, accent: problem, body: "**Slow**: use a non-parametric test or the bootstrap"}
          - {title: "N under 30", accent: pitfalls, body: "With unknown sigma, use **t**"}
        takeaway: Check the tail before you check n.
        source: notes/03-distributions-and-sampling.md
        notes: >-
          The CLT also needs independent rows and a finite variance, so the earlier lesson about sessions inside users applies here too.

