      - layout: code
        beat: practice
        level: core
        section: The small-N trap
        title: Shrink a rate towards the prior
        recall: How do you shrink a rate with few trials?
        answer: "Add prior_n pseudo-trials at the prior mean: (hits + prior_mean x prior_n) over (trials + prior_n). With prior mean 0.9 and prior n 40, 2 of 2 becomes 0.905 and 905 of 1000 stays at 0.905."
        lead: A prior of 0.9 worth 40 trials
        lang: python
        code: |-
          prior_mean, prior_n = 0.9, 40
          shrunk = (hits + prior_mean * prior_n) / (
              trials + prior_n)

          # hits/trials   raw     shrunk
          # 2/2           1.000   0.905
          # 5/5           1.000   0.911
          # 92/100        0.920   0.914
          # 905/1000      0.905   0.905
        bullets:
          - "The fewer the trials, the **stronger** the pull"
          - "Large samples barely move"
        takeaway: Shrinkage stops a lucky 2 of 2 from outranking a proven 905 of 1000.
        source: notes/03-distributions-and-sampling.md
        notes: >-
          In the empirical Bayes version on 844 surgeries, 340 had a ratio of 0 and the fitted prior puts only 12% at 0.01 or below, so 3 of 6 has a posterior of 0.446.

