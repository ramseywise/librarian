      - layout: bullets
        beat: wrap
        title: Rules for looking and reasoning
        recall: Which rules of thumb come from step 1?
        answer: "Establish what one row is, look at the tail when mean and median disagree, show N next to every rate, P(A given B) is not P(B given A), expectations add but variances need covariance, standard errors need independent rows, N of 30 is not a law and more rows do not fix selection bias."
        bullets:
          - "**One row** is one what? Settle it first"
          - "Mean and median disagree: **look at the tail**"
          - "**P(A | B)** is not **P(B | A)**"
          - "Standard errors assume **independent rows**"
          - "**N of 30** is not a law, and more rows do not fix selection"
        takeaway: Look at the table, keep the conditional straight and ask who got into the sample.
        source: README.md
        notes: >-
          Step 2 takes these into estimation and testing: how far to trust a number.

