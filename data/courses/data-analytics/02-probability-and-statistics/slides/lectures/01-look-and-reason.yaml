      - layout: code
        beat: practice
        level: deep
        section: Central Limit Theorem
        title: Measure the coverage yourself
        recall: How do you measure the real coverage of an interval?
        answer: "Draw many samples of size n, build a 95% interval from each and count how often it contains the true mean."
        lead: A coverage simulation
        lang: python
        code: |-
          def spend(size):
              buy = rng.random(size) < 0.047
              return buy * rng.lognormal(3.6, 1.1, size)

          for n in (30, 300, 3_000, 30_000):
              hit = 0
              for _ in range(reps):
                  x = spend(n)
                  se = x.std(ddof=1) / np.sqrt(n)
                  hit += abs(x.mean() - mu) < 1.96 * se
              print(n, hit / reps)
        bullets:
          - "Coverage: **0.563, 0.832, 0.928, 0.948**"
        takeaway: When in doubt, measure the coverage by simulation instead of trusting the rule.
        source: notes/03-distributions-and-sampling.md
        notes: >-
          The CLT needs independence and finite variance. A sum of n values has the distribution N of n mu and n sigma squared.

      - layout: cards
        beat: fundamentals
