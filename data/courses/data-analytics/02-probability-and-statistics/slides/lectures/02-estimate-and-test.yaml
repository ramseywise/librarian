          A five-manager example: p-values 0.006, 0.918, 0.012, 0.601, 0.756. The Bonferroni cutoff 0.01 gives one rejection, Holm's second cutoff 0.0125 gives two, and BH's second cutoff 0.02 gives two.

      - layout: bullets
        beat: pitfalls
        level: core
        section: Multiple comparisons
        title: Where multiplicity hides
        recall: Where does multiplicity hide in everyday analysis?
        answer: "In many metrics, many segments, repeated looks, many genes, data dredging, forking paths and repeated measures. Five groups give 10 comparisons, with a threshold of 0.005."
        bullets:
          - "Many **metrics** and many **segments**"
          - "Repeated **looks** at a running test"
          - "Forking paths: choices made **after** seeing the data"
          - "Repeated measures: 10 patients × 100 measurements"
          - "Five groups mean **10** comparisons, threshold **0.005**"
        takeaway: Count every comparison you could have made, not only the ones you reported.
        source: notes/05-hypothesis-testing.md
        notes: >-
          A pair with p of 0.0349 (t) or 0.038 (paired) fails Tukey at 0.186. A Beatles song making listeners 1.5 years younger is a data-dredging example.

      - layout: image
        beat: pitfalls
        level: deep
        section: Multiple comparisons
        kicker: A famous gene, seen in context
        image: ../../assets/sources/images/computer-age-statistical-inference-fig1-5.png
        caption: Histogram of the t statistics for the leukemia genes
        bullets:
          - "**400** other genes above 3.01 out of **7,128**"
        recall: How does one significant gene look among thousands?
        answer: "Gene t of 3.01 has p of 0.0036, but 400 of 7,128 other genes also exceed 3.01 (about 5.6%). Only 47 genes pass an FDR threshold of t above 6.16."
        takeaway: A small p-value means little when thousands of genes are tested.
        source: notes/05-hypothesis-testing.md
        notes: >-
          The note prints this statistic as 3.01 in one place and 3.13 in another, and flags the discrepancy itself. A permutation test gave p of 0.0026 against 0.0025 from the t on 70 degrees of freedom, with 47 ALL and 25 AML patients.

      - layout: compare
        beat: fundamentals
        level: deep
        section: Multiple comparisons
        title: The same p-value on a Bayesian scale
        recall: How does a fixed p-value look as a Bayes factor?
        answer: "A z of 2.36 gives a Bayes factor of 5.49. At z of 3.29 (p of 0.001) the factor is 57.96 at n of 15 but only 2.24 at n of 10,000."
        emphasis: right
        left:
          title: Small sample
          bullets:
            - "z = **3.29**, p = **0.001**"
            - "Bayes factor **57.96** at n = 15"
        right:
          title: Huge sample
          bullets:
            - "Same z and p"
            - "Bayes factor **2.24** at n = 10,000"
        takeaway: The same p-value is weaker evidence as the sample grows.
        source: notes/05-hypothesis-testing.md
        notes: >-
          Fisher and Jeffreys each proposed a scale for reading such evidence.

      - layout: bullets
        beat: pitfalls
        section: Significant results exaggerate
        title: The winner's curse in a simulation
        recall: Why do significant results overstate the effect?
        answer: "With a true lift of 0.01 and se 0.01, power is 0.17. All estimates average 0.0100, but the significant ones average 0.0245, 2.5 times the truth, and 0.9% have the wrong sign."
        bullets:
          - "True lift **0.01**, power **0.17**"
          - "Mean of all estimates **0.0100**"
          - "Mean of significant estimates **0.0245**"
          - "Wrong sign **0.009**"
        takeaway: Only inflated estimates cross the threshold at low power.
        source: notes/05-hypothesis-testing.md
        notes: >-
          Reinhart reports a median neuroscience power of about 20%, and fewer than 3% of studies compute power. A true 0.3% sex-ratio shift is overstated at least twentyfold, with 40% wrong sign.

      - layout: statement
        beat: pitfalls
        level: deep
        section: Significant results exaggerate
        kicker: Correcting the exaggeration
        statement: "A gene at 5.29 shrinks to 4.11 by empirical Bayes and 4.03 by Tweedie"
        recall: How far does empirical Bayes shrink the top gene?
        answer: "From 5.29 to 4.11 by empirical Bayes and 4.03 by Tweedie."
        takeaway: Shrink the winners before you quote them.
        source: notes/05-hypothesis-testing.md
        notes: >-
          At z of 3.5 the expected effect is 1.96 and the fdr is 0.15.

      - layout: image
        beat: pitfalls
        section: Significant results exaggerate
        kicker: Stopping early
        image: ../../assets/sources/images/computer-age-statistical-inference-fig3-3.png
        caption: Monthly z over 30 months against the 1.645 cutoff
        bullets:
          - "A month-20 look pushes type I error to **0.074**"
        recall: What does peeking do to a test?
        answer: "Looking at month 20 as well as the end raises the type I error to 0.074, and the final z of 1.66 only just beats 1.645. Trials stopped early exaggerate by 29%."
        takeaway: Every extra look spends some of your alpha.
        source: notes/05-hypothesis-testing.md
        notes: >-
          More than half of psychologists admitted peeking. About one in four A/A tests is flagged at 20 looks. Neuroimaging circularity runs about 40%.

      - layout: bullets
        beat: pitfalls
        level: deep
        section: Significant results exaggerate
        title: What the published record looks like
        recall: What does the published record suggest about significant results?
        answer: "Amgen reproduced 6 of 53 landmark studies, about 38% of Nature p-values were wrong, and more than 40% of trials were registered after recruitment began."
        bullets:
          - "Amgen replicated **6 of 53**"
          - "Only **64 of 249** studies sent their data"
          - "More than **40%** of trials registered after recruitment began"
          - "Pfizer's reboxetine: **three times** the published volume"
        takeaway: The published record is a filtered sample of what was tested.
        source: notes/05-hypothesis-testing.md
        notes: >-
          Other figures: p-value errors about 38%, TP53 across 18 studies, Francis against Bem (9 of 10 experiments significant at 20% power against 90% significant), NEJM 2001 to 2010 with 146 of 363 (about 40%), and Schoenfeld and Ioannidis on 216 studies.

      - layout: cards
        beat: pitfalls
        section: Pitfalls
        title: Four ways to read too much into a p-value
        recall: Which testing mistakes read too much into a p-value?
        answer: "Reading p as the probability of the null, treating non-significance as proof of no effect, confusing significance with importance, and comparing p-values across groups."
        cards:
          - {title: "p as P(H0)", accent: pitfalls, body: "It assumes H0, so it cannot be its **probability**"}
          - {title: "Non-significant is not zero", accent: problem, body: "The test may be **underpowered**"}
          - {title: "Significant is not important", accent: fundamentals, body: "Report the **effect size** and interval"}
          - {title: "Comparing p-values", accent: practice, body: "The difference is not itself **significant**"}
        takeaway: Each of these reads more into a p-value than it holds.
        source: notes/05-hypothesis-testing.md
        notes: >-
          These are four of ten pitfalls in the note.

      - layout: table
        beat: pitfalls
        section: Pitfalls
        title: Pick the test and the stopping rule first
        recall: Which other testing mistakes should you avoid?
        answer: "Choosing the test after seeing the result, using a rank test for a revenue conclusion, forecasting from a low-power result, and judging by interval overlap."
        header: [Mistake, "Why it fails"]
        widths: [3.2, 5.8]
        rows:
          - ["Test chosen late", "Choose the test before the data"]
          - ["Rank test, revenue", "It answers about tendency"]
          - ["Low-power forecast", "The winner's curse inflates it"]
          - ["Interval overlap", "Rejects at 2.77 SE, not 3.92"]
        takeaway: Pick the test and the stopping rule before you see the data.
        source: notes/05-hypothesis-testing.md
        notes: >-
          The remaining two pitfalls are a stopping rule chosen after the data and an unpaired analysis of paired data.
