        recall: What do the corrections do on 2,000 fund managers?
        answer: "Benjamini-Hochberg at 10% rejects 146, about 15 of them false, while Bonferroni at a family-wise rate of 0.1 rejects none. At q of 0.3, BH rejects 279."
        takeaway: The right correction depends on whether a false positive is costly.
