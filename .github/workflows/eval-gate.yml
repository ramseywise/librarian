name: Nightly eval-gate

# Retrieval ranking against the four gated arms (sem, nofts, uniform, course). Not on every PR:
# it needs the embedding model and builds the whole index, ~10 min cold.
#
# CI has no data/wiki/private/, and the floors in evals/run_eval.py were measured with it. If this
# job fails with only small misses on a fresh runner, compare against a local run before touching
# a floor: see "Eval-gate on a clean checkout" in the PR notes.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: eval-gate
  cancel-in-progress: false

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # sentence-transformers is in the `api` extra.
      - run: uv sync --group dev --extra api
      # The embedding model (all-MiniLM-L6-v2, ~90 MB). Keyed on the model name: it changes only
      # when the code names another one.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      # The search index and the embedding cache. The embedding cache is content-addressed, so a
      # stale restore only costs the pages that changed; the index is rebuilt when its inputs differ.
      - uses: actions/cache@v4
        with:
          path: |
            .wiki_index.duckdb
            .embeddings_cache.duckdb
          key: eval-index-${{ hashFiles('data/wiki/**', 'data/courses/**', 'src/librarian/retrieval/**') }}
          restore-keys: |
            eval-index-
      - run: make eval-gate
