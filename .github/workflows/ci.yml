name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs on the same ref — three pushes to a PR should cost one
# lint+test set, not three.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Pinned to a commit: the repo has no release tags (its two tags are archive/preserve markers),
    # so main as of 2026-11-07. Move it deliberately; Dependabot does not bump reusable workflows.
    uses: ramseywise/ai-project-template/.github/workflows/python-ci.yml@86705a49b18d7e721b6fe729d7599203c49afbb2 # main as of 2026-11-07
    with:
      # Explicit, so scripts/check_versions.py can compare it with the Dockerfile and .python-version.
      python-version: "3.12"
      # Makefile's `lint:` runs ruff, import-linter and pyright; the
      # paths below are the real top-level Python dirs; raw/ data/wiki/ logs/
      # are artifacts (naming.md data-layer rule) and stay unlinted.
      lint-paths: "src tests"
      # Lint gates from day one — the single RUF059 error was fixed 2026-07-19
      # (src/librarian/tools/codemap/indexer.py), so `ruff check src tests` is clean.
      # The e2e tests need a live server on :5173 and live in tests/e2e/, so they
      # are ignored; the rest of tests stay blocking.
      test-command: "uv run pytest tests/ --ignore=tests/e2e -q"

  versions:
    # The image and CI must run the same Python and Node: scripts/check_versions.py compares the
    # Dockerfile, .python-version, requires-python and the setup steps in the workflows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv run --no-project python scripts/check_versions.py

  architecture:
    # Import contracts and the type check. The shared python-ci workflow only lints and tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      # All extras, not just the dev group: pyright resolves every import, and
      # sentence-transformers, umap, pptx and replicate live only in extras.
      - run: uv sync --group dev --all-extras
      - run: uv run lint-imports
      - run: uv run pyright

  frontend:
    # The React graph/courses/chat UI. Separate job: the shared python-ci workflow
    # knows nothing about Node, and the two suites have no shared setup.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings 0
      - run: npm run test:coverage
      - run: npm run build

  docker:
    # The deployable image: web build, API install, embedding model. Built on every run; pushed to
    # GHCR only on main (never on a PR), tagged sha-<short> and main, so a host can roll back to a
    # tag. The token and `packages: write` are scoped to this job.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name and release
        id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: ${{ env.PUSH == 'true' }}
          build-args: LIBRARIAN_RELEASE=${{ steps.img.outputs.short }}
          tags: |
            ${{ steps.img.outputs.name }}:sha-${{ steps.img.outputs.short }}
            ${{ steps.img.outputs.name }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-container:
    # The built image, from outside: 401 without the token, 200 with it, the UI at /, and two
    # Playwright smoke tests. Same script as `make e2e-container`. The first start builds the
    # search index (~150 s locally), so the readiness wait is generous.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Same cache scope as the `docker` job, so one of the two builds from cache.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: librarian:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run playwright install --with-deps chromium
      - run: tests/e2e/run_container.sh
        env:
          SKIP_BUILD: "1"
          READY_TIMEOUT: "1200"

  sbom:
    # CycloneDX bills of materials for what the image ships: Python from uv.lock, the app from
    # app/package-lock.json. Uploaded as one artifact; nothing is signed or published from it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Python SBOM (uv.lock, runtime dependencies only)
        run: |
          mkdir -p sbom
          uv export --frozen --no-dev --format cyclonedx1.5 -o sbom/python.cdx.json
      - name: App SBOM (package-lock.json, runtime dependencies only)
        working-directory: app
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON \
            --output-file ../sbom/app.cdx.json package.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error
