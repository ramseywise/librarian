name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs on the same ref — three pushes to a PR should cost one
# lint+test set, not three.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ramseywise/ai-project-template/.github/workflows/python-ci.yml@main
    with:
      # Makefile's `lint:` is a stub that defers to Claude, so it defines no
      # paths. These are the real top-level Python dirs; raw/ data/wiki/ logs/
      # are artifacts (naming.md data-layer rule) and stay unlinted.
      lint-paths: "src tools tests"
      # Lint gates from day one — the single RUF059 error was fixed 2026-07-19
      # (src/librarian/codemap/indexer.py), so `ruff check src tools tests` is clean.
      # The plan expected 14 failures here; the unit suite is in fact green
      # (92 passed, 2 skipped, verified 2026-07-19). The 9 known-failing e2e
      # tests need a live server on :5173 and live in tests/e2e/, so
      # tests stay blocking.
      test-command: "uv run pytest tests/ --ignore=tests/e2e -q"

  architecture:
    # Import contracts and the type check. The shared python-ci workflow only lints and tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # All extras, not just the dev group: pyright resolves every import, and
      # sentence-transformers, umap, pptx and replicate live only in extras.
      - run: uv sync --group dev --all-extras
      - run: uv run lint-imports
      - run: uv run pyright

  frontend:
    # The React graph/courses/chat UI. Separate job: the shared python-ci workflow
    # knows nothing about Node, and the two suites have no shared setup.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: npm run build

  docker:
    # The deployable image: web build, API install, embedding model. Built, not pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: librarian:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
