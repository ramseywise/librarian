name: 🐛 Bug
description: Something is broken or behaves incorrectly
title: "[Bug] "
labels: ["bug", "backlog"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues for this
          required: true

  - type: textarea
    id: symptom
    attributes:
      label: What happens
      description: The observed behavior, not the diagnosis.
      placeholder: "`/query` returns results but every hit is missing its wiki attribution."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should happen instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        Exact commands. `/workflow-scope` routes this to a plan with a repro-steps
        and root-cause section, so this field becomes that plan's starting point.
      placeholder: |
        1. uv run python -m tools.codemap.indexer --repo .
        2. curl localhost:5173/search?q=indexer
        3. results have empty `page` field
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >
        Error output, logs, or the file:line you suspect. Paste the failure verbatim —
        a summary of an error is not the error.
      render: shell
    validations:
      required: false

  - type: input
    id: scope
    attributes:
      label: Where
      description: Package or path, if known.
      placeholder: "core/retrieval.py"
    validations:
      required: false
